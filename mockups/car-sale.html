<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car sale</title>
<style>

/* Tokens copied from src/renderer/src/globals.css. The sale family is the one
   proposal, and says where its hue sits. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-foreground: oklch(0.985 0.01 155);
  --success-soft: oklch(0.93 0.05 155); --success-soft-fg: oklch(0.34 0.09 155);
  --destructive: oklch(0.58 0.22 27);
  --destructive-soft: oklch(0.94 0.04 27); --destructive-soft-fg: oklch(0.45 0.17 27);
  --base: oklch(0.93 0.05 155); --base-fg: oklch(0.36 0.09 155);
  --dlc: oklch(0.94 0.07 75); --dlc-fg: oklch(0.42 0.1 70);
  --owned: oklch(0.92 0.06 340); --owned-fg: oklch(0.4 0.13 340);
  --sponsor: oklch(0.93 0.05 350); --sponsor-fg: oklch(0.43 0.15 352);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
}
/* Proposed: a tag orange on 45 - the hue every price tag wears.
   Clear of can't-afford's red 27 by 18 degrees and of chroma: the chip is a
   pale orange, the refusal an outlined red, and the two sit on different rows
   of a card. Bronze 52 and Sell's amber 62 are near it, and neither shows on a
   car that is for sale. */
:root[data-hue="orange"] {
  --sale: oklch(0.93 0.06 45); --sale-fg: oklch(0.47 0.15 42);
  --sale-solid: oklch(0.66 0.17 45); --sale-solid-fg: oklch(0.99 0.01 45);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-foreground: oklch(0.18 0.03 158);
  --success-soft: oklch(0.32 0.06 155); --success-soft-fg: oklch(0.86 0.11 155);
  --destructive: oklch(0.66 0.2 25);
  --destructive-soft: oklch(0.32 0.07 27); --destructive-soft-fg: oklch(0.86 0.09 27);
  --base: oklch(0.32 0.06 155); --base-fg: oklch(0.86 0.11 155);
  --dlc: oklch(0.34 0.06 75); --dlc-fg: oklch(0.88 0.1 80);
  --owned: oklch(0.33 0.07 340); --owned-fg: oklch(0.86 0.09 340);
  --sponsor: oklch(0.33 0.07 350); --sponsor-fg: oklch(0.87 0.09 352);
}
:root[data-theme="dark"][data-hue="orange"] {
  --sale: oklch(0.34 0.07 45); --sale-fg: oklch(0.87 0.1 50);
  --sale-solid: oklch(0.7 0.16 48); --sale-solid-fg: oklch(0.18 0.03 45);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: oklch(0.9 0.008 255); color: var(--foreground); font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
:root[data-theme="dark"] body { background: oklch(0.12 0.01 265); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.caps { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.end { margin-left: auto; }
s.was { color: var(--muted-foreground); text-decoration-thickness: 1px; font-weight: 500; }
.new-outline { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 2px; }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; background: oklch(0.16 0.01 260); color: oklch(0.965 0.007 250); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid oklch(1 0 0 / 25%); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: oklch(0.965 0.007 250); color: oklch(0.16 0.01 260); }
.why { max-width: 1320px; margin: 16px auto 0; padding: 0 24px; font-size: 13.5px; }
.why .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
.why h2 { margin: 0 0 6px; font-size: 15px; }
.why h3 { margin: 12px 0 4px; font-size: 13.5px; }
.why ul { margin: 4px 0 0; padding-left: 18px; }
.why li { margin: 2px 0; }
.why .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.why .q { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
.why .q b { color: var(--primary); }
.why .vnote { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--muted); }
.stage { max-width: 1320px; margin: 14px auto 60px; padding: 0 24px; }

/* ---------- The app window ---------- */
.win { position: relative; height: 1080px; display: flex; flex-direction: column; overflow: hidden; background: var(--background); border-radius: 12px; box-shadow: 0 0 0 1px oklch(0 0 0 / .12), 0 18px 50px oklch(0 0 0 / .18); }
.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; font-size: 11px; color: var(--muted-foreground); background: var(--card); border-bottom: 1px solid var(--border); }
.titlebar span:first-child { margin-right: auto; }
.hd { flex: none; display: flex; align-items: center; gap: 22px; padding: 12px 28px; border-bottom: 1px solid var(--border); background: var(--background); position: relative; z-index: 5; }
.slotbtn { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); text-align: left; flex: none; }
.slotbtn b { display: block; font-size: 13.5px; line-height: 1.2; white-space: nowrap; }
.slotbtn small { display: block; font-size: 11.5px; color: var(--muted-foreground); white-space: nowrap; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav a { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.nav a.on { color: var(--primary); background: color-mix(in oklch, var(--primary) 10%, transparent); }
.nav .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--primary); color: var(--primary-foreground); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.nav .dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--sale-solid); box-shadow: 0 0 0 2px var(--background); }
.bal { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); font-weight: 600; font-size: 13.5px; }
.bal .i { color: var(--success); }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .12); }
.body { flex: 1; min-height: 0; overflow: auto; position: relative; }
.shdr { display: flex; align-items: center; gap: 12px; padding: 12px 28px; border-bottom: 1px solid var(--border); flex: none; background: var(--background); }
.shdr h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.backlink { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip .i { width: 12px; height: 12px; }
.c-base { background: var(--base); color: var(--base-fg); }
.c-dlc { background: var(--dlc); color: var(--dlc-fg); }
/* A spec name - a catalogue name, neutral on purpose. */
.c-plain { background: var(--muted); color: var(--foreground); }
.c-sale { background: var(--sale); color: var(--sale-fg); font-weight: 650; }
.c-dotw { background: var(--sale-solid); color: var(--sale-solid-fg); font-weight: 650; }
.c-sponsor { background: var(--sponsor); color: var(--sponsor-fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn.go { background: var(--success); color: var(--success-foreground); border-color: transparent; }
.btn.cant { background: var(--destructive-soft); color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 30%, transparent); cursor: not-allowed; }
/* TradeButton's Repaint and Sell, as TRADE_BUTTON fills them. */
.btn.paint { background: linear-gradient(90deg, oklch(0.58 0.2 345), oklch(0.54 0.2 295), oklch(0.56 0.14 225)); color: white; border-color: transparent; }
.btn.sellb { background: oklch(0.6 0.15 62); color: oklch(0.985 0.005 62); border-color: transparent; }
.c-owned { background: var(--owned); color: var(--owned-fg); }
.swatch { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, oklch(0.6 0.2 25), oklch(0.85 0.01 260)); box-shadow: 0 0 0 1px var(--border); }
.btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.placeholder { border: 1px dashed var(--border); border-radius: 12px; padding: 12px 14px; color: var(--muted-foreground); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.placeholder b { color: var(--foreground); font-weight: 600; font-size: 13px; }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--muted); position: relative; flex: none; box-shadow: inset 0 0 0 1px var(--border); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .3); }
.switch.on { background: var(--primary); box-shadow: none; }
.switch.on::after { left: 17px; }

/* ---------- The car browser, as CarBrowserBody lays it out ---------- */
.browser { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.rail { border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; }
.rsec { padding: 10px 0 8px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.rsec .caps { padding: 0 2px 2px; }
.rsw { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 3px 2px; cursor: pointer; }
.rsw > span:first-child { flex: 1; }
.rsw small { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.rfold { padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; display: flex; }
.rfold::after { content: '+'; margin-left: auto; color: var(--muted-foreground); }
.main { padding: 18px 24px 30px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ph h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.015em; }
.ph p { margin: 2px 0 0; color: var(--muted-foreground); font-size: 13.5px; }
.toolbar { display: flex; align-items: center; gap: 8px; }
.search { flex: 1; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--muted-foreground); font-size: 13px; }
.count { font-size: 12.5px; color: var(--muted-foreground); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

/* CarCard + PriceFoot */
.cc { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.cc .pic { position: relative; flex: none; aspect-ratio: 4 / 3; background: var(--scrim); overflow: hidden; }
.cc .pic img.p { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cc .pic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, oklch(0.14 0.012 265 / .85)); }
.cc .tl { position: absolute; top: 8px; left: 8px; right: 54px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 1; }
.cc .tr { position: absolute; top: 8px; right: 8px; z-index: 1; }
.cc .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 8px; font-size: 11.5px; font-weight: 500; background: oklch(0.14 0.012 265 / .6); color: var(--on-scrim); }
.cc .pill .i { width: 12px; height: 12px; }
.cc .cap { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 1; color: var(--on-scrim); }
.cc .cap .ov { display: flex; align-items: center; gap: 6px; font-size: 11.5px; opacity: .9; }
.cc .cap .nm { font-size: 15px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
.cc .bd { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.fig { display: flex; gap: 10px; font-size: 12px; color: var(--muted-foreground); }
.fig b { color: var(--foreground); font-weight: 600; }
.raced { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 5px; align-items: center; margin-top: auto; }
.raced .i { width: 13px; height: 13px; }
.pf { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--muted); min-height: 60px; }
.pf b { font-size: 17px; font-weight: 650; line-height: 1.15; }
.pf b.dim { color: var(--muted-foreground); }
.pf small { font-size: 12px; color: var(--muted-foreground); }
.pf .was { font-size: 12px; }
.pf.own { background: var(--owned); color: var(--owned-fg); }
.pf.own small { color: inherit; opacity: .75; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.pf.own b { font-size: 15px; }

/* Variant A: the Deal of the week as a banner over the grid */
.dotw { display: grid; grid-template-columns: 420px minmax(0, 1fr); background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 2px var(--sale-solid); }
.dotw .dpic { position: relative; background: var(--scrim); min-height: 236px; }
.dotw .dpic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dotw .dpic .tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; }
.dotw .db { padding: 18px 22px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.dotw h3 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.dotw .ov { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted-foreground); }
.dotw .buy { margin-top: auto; display: flex; align-items: flex-end; gap: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.dotw .buy b { font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
.dotw .buy small { font-size: 12.5px; color: var(--muted-foreground); }

/* ---------- Car page ---------- */
.cp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; padding: 18px 28px; align-items: start; }
.cp .hero { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--scrim); position: relative; }
.cp .hero img { width: 100%; height: 100%; object-fit: cover; }
.tp { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.tp .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }

/* ---------- Dialogs ---------- */
.scrim { position: absolute; inset: 0; background: oklch(0 0 0 / .45); display: grid; place-items: center; z-index: 30; }
.dlg { width: 520px; background: var(--card); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px oklch(0 0 0 / .35); border: 1px solid var(--border); }
.dlg.wide { width: 980px; max-height: 760px; }
.dlg h3 { margin: 0; font-size: 17px; font-weight: 650; }
.dlg p { margin: 0; font-size: 13.5px; color: var(--muted-foreground); }
.dlg .ppic { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--scrim); }
.dlg .ppic img { width: 100%; height: 100%; object-fit: cover; }
.dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 13.5px; }
.dl dt { color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.dl dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.dl .pos { color: var(--success); }
.swt { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.swt .grow { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.swt b { font-size: 13.5px; font-weight: 500; }
.swt small { font-size: 12px; color: var(--muted-foreground); }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }

/* ---------- Finances ---------- */
.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ledger th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted-foreground); padding: 8px 12px; border-bottom: 1px solid var(--border); }
.ledger td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.ledger td.amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.neg { color: var(--destructive); }
.posn { color: var(--success); }

</style>
</head>
<body>
<div class="picker" id="picker"></div>
<div class="why"><div class="box" id="why"></div></div>
<div class="stage" id="stage"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';

// ---------- Concept ----------
const WHY = `
<h2>Car sale - every career week, a Deal of the week and a share of the Store on sale</h2>
<div class="grid2">
<div>
<h3>The rules</h3>
<ul>
  <li><b>A sale runs Monday to Sunday on the career's own calendar.</b> It is drawn the first time the clock reaches a new week (in <code>settle</code>), and a new career draws one as it is made. Jumping the clock over several weeks draws only the week it lands in.</li>
  <li><b>One Deal of the week at 50-70% off, and 5-7% of the Store's cars at 20-50% off</b>, in whole percent - about 21-29 cars over a library of 412, and never fewer than one. The sale price is rounded to the nearest hundred.</li>
  <li><b>Drawn at random from the whole Store</b>: every car in the library, catalogued and added, priced, that the career does not own. Nothing remembers last week - a car may be on sale, or the Deal of the week, two weeks running.</li>
  <li><b>Seeded on the career and the week, and stored as drawn</b> (<code>CareerState.sale</code>: the week and each car with its discount), so a mod added mid-week does not reshuffle it and loading a save restores the sale that was running then.</li>
  <li><b>Only the purchase is discounted.</b> Rent stays at 2% of the listed price.</li>
  <li><b>Sell is what was paid; Repaint is the listed price.</b> An owned car keeps the price it was listed at when bought beside what was paid, so a repaint costs 1.5% of that whether or not the car came on sale, and a price of the user's changed since still never reaches it. A car bought on sale sells from its sale price.</li>
  <li><b>Sponsor backing pays half of the sale price</b> - half of what the car costs that day. A sponsor's car reward is still valued at the listed price.</li>
  <li><b>The ledger's Car bought line records the discount.</b> The clock moves only when the player acts, so a sale cannot end while a dialog is open.</li>
  <li><b>Not in a standalone championship</b>, which has no money. Nothing announces a new week.</li>
</ul>
</div>
<div>
<h3>Where it shows</h3>
<ul>
  <li><b>Store, with no filters and no search</b>: the Deal of the week is a banner over the grid, and its card leaves the grid. <b>Any filter or search</b> but the On sale switch drops the banner, and the Deal of the week is a card like the rest wherever the filters put it, its chip reading <i>Deal of the week · -38%</i>. A sort is not a filter, so the banner stays through one. Either way it is shown once.</li>
  <li><b>Every car on sale</b> wears its discount as a chip on the picture, beside the source. <b>Card price</b> above picks how its foot says the sale price and the listed price: <i>Now</i> is what is built, which runs out of room once a price reaches six or seven figures beside Can't afford - the F40, the R18 and the LaFerrari show it. <b>1</b> puts the struck listed price on the second line in place of the rent while the car is on sale; <b>2</b> shows the sale price alone, the chip saying it is reduced; <b>3</b> puts the struck price and the rent on the second line together; <b>4</b> writes a million and up as $2.74M on cards. The car page, the banner and the purchase dialog keep both prices in full whichever is picked.</li>
  <li><b>A new rail section <i>This week</i></b> has an <b>On sale</b> switch with the count and the end date. With the switch on the list sorts by the new <b>Discount</b> sort, which stays in the sort menu.</li>
  <li><b>Price sort, price filter and <i>Can afford to purchase</i></b> all use the sale price.</li>
  <li><b>Car page</b>: the listed price struck above the sale price, the discount and when the sale ends. An owned car's Repaint is on its listed price.</li>
  <li><b>Purchase dialog</b>: Price struck, then a discount line taking the amount off, before backing and the balance after.</li>
  <li><b>Enter panel's car picker</b>: no banner; the same cards and chips, and the livery step's <i>Purchase · $X</i> at the sale price.</li>
  <li><b>Garage</b>: unchanged, since an owned car is never on sale.</li>
</ul>
<div class="vnote"><b>Colour.</b> A new closed set of two on orange 45: <i>on sale</i>, a tinted chip, and <i>Deal of the week</i>, a solid fill. It sits 18° from can't-afford's red 27, kept apart by chroma and by place - the chip on the picture, the refusal in the foot. Bronze 52 and Sell's amber 62 never show on a car that is for sale.</div>
</div>
</div>`;

// ---------- Render ----------
const render = () => {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.hue = 'orange';
  document.getElementById('picker').innerHTML = OPTS.map((g) => `<div class="grp"><strong>${g.label}</strong>${g.opts.map(([v, l]) => `<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${S[g.k] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('why').innerHTML = WHY;
  document.getElementById('stage').innerHTML = SCREENS[S.screen]();
};
document.addEventListener('click', (e) => {
  const o = e.target.closest('.opt');
  if (o) { S[o.dataset.k] = o.dataset.v; render(); return; }
  const v = e.target.closest('[data-view]');
  if (v) { S.view = S.view === v.dataset.view ? 'none' : v.dataset.view; render(); return; }
  const a = e.target.closest('[data-act]');
  if (a) { S[a.dataset.act] = !S[a.dataset.act]; render(); }
});
// A state can be linked to: #screen=store&view=search
new URLSearchParams(location.hash.slice(1)).forEach((val, k) => { if (k in S) S[k] = val === 'true' ? true : val; });
render();
</script>
