const BALANCE = LEDGER.at(-1).b;
const SHORT_BAL = 121400;
const sum = (f) => LEDGER.filter(f).reduce((a, l) => a + l.n, 0);

// ---------- The window ----------
const titlebar = () => '<div class="titlebar"><span>Another Assetto Corsa Career</span><span>—</span><span>☐</span><span>✕</span></div>';
const win = (inner) => `<div class="win">${titlebar()}${inner}</div>`;
const NAV = [['home', 'Home', I.home], ['calendar', 'Calendar', I.cal], ['champs', 'Championships', I.trophy], ['store', 'Store', I.store], ['garage', 'Garage', I.garage], ['settings', 'Settings', I.gear]];
const hdr = (on, opts = {}) => `<header class="hd">
  <button class="slotbtn">${flag('GBR', 1)}<span><b>Sam Whitaker</b><small>Career · 2027 · Sun 6 Jul</small></span>${I.down}</button>
  <nav class="nav">${NAV.map(([id, l, ic]) => `<a class="${id === on ? 'on' : ''}">${ic}${l}</a>`).join('')}</nav>
  <span class="end row" style="gap:14px"><span class="status"><span class="dot"></span>Autosaved after Race 2 · 2 hours ago</span>
  <a class="bal" title="Finances">${I.wallet}<span class="num">${fmt(opts.balance ?? BALANCE)}</span></a></span></header>`;
const scrim = (html, w = 560) => `<div class="scrim"></div><div class="dlg" style="width:${w}px">${html}</div>`;
const bigScrim = (html) => `<div class="scrim"></div><div class="bigdlg">${html}</div>`;

// ---------- Cards ----------
// The price closing a card, four ways. Owned cars say what selling pays.
// The card's own Purchase: the price is right above it, so the button never
// repeats it.
const cardBtn = (c, bal = BALANCE) => (c.price <= bal
  ? `<button class="btn sm go blk buy">${I.store}Purchase</button>`
  : `<button class="btn sm blk buy cant">${I.lock}Can't afford</button>`);
const priceRow = (c, bal = BALANCE, buy = true) => {
  const o = owned(c.id);
  const short = !o && c.price > bal ? ' short-p' : '';
  const rent = fmt(c.price * RENT);
  const btn = buy ? cardBtn(c, bal) : '';
  if (o) {
    const v = fmt(value(o));
    return {
      a: `<div class="pa"><span class="chip c-own">${I.check}Owned</span><span class="r">Sells for <b class="num">${v}</b></span></div>`,
      b: `<div class="pb2"><div><span class="caps">Owned</span><b style="color:var(--own-fg)">${skinName(c, o.skin)}</b></div><div><span class="caps">Sells for</span><b class="num">${v}</b></div></div>`,
      c: `<div class="pc"><span class="own">${I.check}Owned</span><span>${I.tag}${v}<small>to sell</small></span></div>`,
      d: `<div class="pd own"><div class="l"><span class="caps">Owned</span><b>${skinName(c, o.skin)}</b></div><div class="r"><span class="caps">Sells for</span><b class="num">${v}</b></div></div>`,
    }[S.price];
  }
  return {
    a: `<div style="margin-top:auto"><div class="pa"><b class="num${short}">${fmt(c.price)}</b><span class="r">or <b class="num">${rent}</b> a round</span></div>${btn}</div>`,
    b: `<div style="margin-top:auto"><div class="pb2" style="margin:0 -12px"><div><span class="caps">Purchase</span><b class="num${short}">${fmt(c.price)}</b></div><div><span class="caps">Rent a round</span><b class="num">${rent}</b></div></div>${btn}</div>`,
    c: `<div style="margin-top:auto"><div class="pc"><span class="${short}">${I.store}${fmt(c.price)}</span><span class="rent">${I.key}${rent}<small>a round</small></span></div>${btn}</div>`,
    // The band carries the button itself, beside the two figures.
    d: buy
      ? `<div class="pd"><div class="l"><b class="num${short}">${fmt(c.price)}</b><span class="hint">or <span class="num" style="font-weight:600;color:var(--foreground)">${rent}</span> a round</span></div><span class="end">${cardBtn(c, bal).replace(' blk buy', '')}</span></div>`
      : `<div class="pd"><div class="l"><span class="caps">Purchase</span><b class="num${short}">${fmt(c.price)}</b></div><div class="r"><span class="caps">Rent a round</span><b class="num">${rent}</b></div></div>`,
  }[S.price];
};
const poster = (c, skin, chips = '') => `<div class="pic"><img class="p" src="${PREV(c.id, skin)}">
  <div class="tl"><span class="chip ${SRC[c.src][1]}">${SRC[c.src][0]}</span>${chips}</div>
  <div class="tr"><span class="pill">${I.palette}${c.skins.length}</span></div>
  <div class="cap"><div class="ov"><img class="b" src="${BADGE(c.id)}">${c.brand}${flag(c.nat)}<span class="end num">${c.year}</span></div><div class="nm">${c.name}</div></div></div>`;
const figs = (c) => `<div class="row" style="gap:4px"><span class="chip c-plain">${c.spec}</span></div>
  <div class="fig"><span><b class="num">${c.bhp}</b> bhp</span><span><b class="num">${c.kg.toLocaleString('en-US')}</b> kg</span><span><b class="num">${Math.round(c.bhp / c.kg * 1000)}</b> bhp/t</span></div>`;
const storeCard = (c, opts = {}) => {
  const o = owned(c.id);
  return `<div class="cc${opts.sel ? ' sel' : ''}">${poster(c, o ? o.skin : c.skins[0][0])}<div class="bd">${figs(c)}
    ${opts.raced === false ? '' : `<div class="raced">${I.trophy}${c.raced}</div>`}${priceRow(c, opts.bal, opts.buy !== false)}</div></div>`;
};
const garageCard = (o) => {
  const c = car(o.id);
  return `<div class="cc">${poster(c, o.skin)}<div class="bd">${figs(c)}
    <div class="kv"><span>Livery</span><b>${skinName(c, o.skin)}</b><span>Bought</span><b>${o.boughtText}</b><span>Racing in</span><b>${o.racing ?? '<span class="muted" style="font-weight:400">Nothing this season</span>'}</b></div>
    <div class="row" style="margin-top:auto;padding-top:4px"><button class="btn sm paint">${I.palette}Repaint · ${fmt(c.price * REPAINT)}</button><button class="btn sm sell end">${I.tag}Sell · ${fmt(value(o))}</button></div></div></div>`;
};

// ---------- Browser shell, shared by the Store and the Garage ----------
const ropt = (on, label, n) => `<div class="ropt"><span class="cbx${on ? ' on' : ''}">${on ? I.check : ''}</span>${label}<span class="n">${n}</span></div>`;
const toolbar = (title, count) => `<div class="row"><h2 style="margin:0;font-size:20px">${title}</h2><span class="muted" style="margin-left:6px">${count}</span>
  <span class="end row"><span class="input" style="width:260px">${I.search}<span class="muted">Search cars</span></span>
  <button class="btn">Sort: ${title === 'Store' ? 'Price, lowest first' : 'Bought, newest first'} ${I.down}</button>
  <span class="vt"><span class="${S.layout === 'cards' ? 'on' : ''}">${I.grid}</span><span class="${S.layout === 'table' ? 'on' : ''}">${I.list}</span></span></span></div>`;
const shell = (on, title, count, rail, content) => win(`${hdr(on)}<div class="body" style="display:flex;gap:22px;overflow:hidden">
  <aside class="rail">${rail}<div class="placeholder"><b>Source, class and spec, brand, country, year, bhp</b>As the Cars page has them today${on === 'garage' ? ', counted over the cars you own' : ''}.</div></aside>
  <div class="col grow" style="overflow:hidden">${toolbar(title, count)}${content}</div></div>`);

// ---------- Store ----------
// Every row keeps the same columns: the price and the rent, then Purchase - or
// Owned, in a button-wide slot, so nothing shifts between rows.
const storeTable = () => `<div class="tablewrap"><table class="ct"><thead><tr><th></th><th>Car</th><th>Spec</th><th class="n">bhp</th><th class="n">kg</th><th class="n">Price</th><th class="n">Rent a round</th><th></th></tr></thead><tbody>
  ${CARS.map((c) => { const o = owned(c.id); return `<tr><td style="width:84px"><img class="th" src="${PREV(c.id, o ? o.skin : c.skins[0][0])}"></td>
    <td><div class="nm">${c.name}</div><div class="sb">${flag(c.nat)}${c.brand} · ${c.year}<span class="chip ${SRC[c.src][1]}">${SRC[c.src][0]}</span></div></td>
    <td><span class="chip c-plain">${c.spec}</span></td><td class="n num">${c.bhp}</td><td class="n num">${c.kg.toLocaleString('en-US')}</td>
    <td class="n num"><b class="${!o && c.price > BALANCE ? 'short-p' : ''}">${fmt(c.price)}</b></td><td class="n num">${o ? '<span class="muted">-</span>' : fmt(c.price * RENT)}</td>
    <td class="act">${o ? `<span class="chip c-own" style="width:116px;justify-content:center;height:28px">${I.check}Owned</span>`
    : (c.price <= BALANCE ? `<button class="btn sm go fw">${I.store}Purchase</button>` : `<button class="btn sm cant fw">${I.lock}Can't afford</button>`)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
// Purchase, from a card, a row or the car page: the livery step, then confirming.
const purchaseFlow = (c, bal, step, from = 'Cancel') => ({
  livery: () => bigScrim(liveryStep(c, null, { back: from })),
  confirm: () => scrim(`<div class="dh"><h3>Purchase the ${c.name}?</h3><p>In ${skinName(c, c.skins[1][0])}.</p></div>
    <div class="db"><img src="${PREV(c.id, c.skins[1][0])}" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--scrim)">
      <div class="kv" style="font-size:13px"><span>Price</span><b class="num">${fmt(c.price)}</b><span>Your balance after</span><b class="num">${fmt(bal - c.price)}</b></div></div>
    <div class="df"><button class="btn ghost" style="margin-right:auto">${I.back}Another livery</button><button class="btn ghost">Cancel</button><button class="btn go">${I.store}Purchase</button></div>`, 520),
}[step]);
const store = () => {
  const flow = purchaseFlow(car('ks_maserati_gt_mc_gt4'), BALANCE, S.sCase);
  return shell('store', 'Store', '178 cars',
  `<div class="grp new"><span class="caps">Yours</span>${ropt(false, 'Owned', 2)}${ropt(false, 'Can afford to purchase', 141)}</div>
   <div class="grp new"><span class="caps">Price</span>
     <div class="slider" style="margin:0 4px 4px"><span class="track"></span><span class="fill" style="left:0;width:100%"></span><span class="knob" style="left:0"></span><span class="knob" style="left:100%"></span>
     <div class="stops"><span>$18k</span><span>$3.2M</span></div></div></div>`,
  S.layout === 'table' ? storeTable() : `<div class="grid" style="overflow:auto;padding-bottom:20px">${CARS.map((c) => storeCard(c)).join('')}</div>`)
    .replace(/<\/div>$/, `${flow ? flow() : ''}</div>`);
};

// ---------- Purchase buttons ----------
// Purchase, or the soft red Can't afford. The price goes on the button only
// where nothing beside it shows the price already.
const purchaseBtn = (price, bal, withPrice = false) => {
  const tail = withPrice ? ` · ${fmt(price)}` : '';
  return price <= bal
    ? `<button class="btn go lg blk">${I.store}Purchase${tail}</button>`
    : `<button class="btn lg blk cant">${I.lock}Can't afford${tail}</button>`;
};

// ---------- Car page ----------
const liveryStep = (c, sel, opts = {}) => `<div class="dh"><h3>${opts.title || 'Pick its livery'}</h3><p>${opts.hint || 'It is yours in the one you pick.'}</p></div>
  <div class="db"><div class="row"><button class="btn ghost sm">${I.back}${opts.back || 'Back'}</button><span class="input end" style="width:300px">${I.search}<span class="muted">Search liveries</span></span></div>
    <div class="carhead"><img src="${PREV(c.id, c.skins[0][0])}"><div><div style="font-weight:600;font-size:13.5px">${c.name}</div><div class="row hint" style="gap:6px">${c.brand}<span class="chip ${SRC[c.src][1]}">${SRC[c.src][0]}</span><span class="chip c-plain">${c.spec}</span></div></div><span class="end hint">${c.skins.length} liveries</span></div>
    <div class="liv">${c.skins.map(([k, n]) => `<div class="lv${k === sel ? ' on' : ''}${k === opts.cur ? ' cur' : ''}"><img src="${PREV(c.id, k)}"><span>${n}</span></div>`).join('')}</div></div>
  ${opts.foot ? `<div class="df">${opts.foot}</div>` : ''}`;
const carPage = () => {
  const c = car('ks_porsche_cayman_gt4_clubsport');
  const o = S.carCase === 'owned' ? owned(c.id) : null;
  const bal = S.carCase === 'short' ? SHORT_BAL : BALANCE;
  const pick = o ? o.skin : c.skins[1][0];
  const panel = o
    ? `<div class="panel"><div class="pb col" style="gap:12px;padding-top:14px">
        <div class="row"><span class="chip c-own">${I.check}Owned</span><span class="hint end">Bought for ${fmt(o.paid)} · ${o.boughtText}</span></div>
        <div class="row"><img class="swatch" src="${LIVERY(c.id, o.skin)}"><b style="font-size:14px">${skinName(c, o.skin)}</b></div>
        <div class="row"><button class="btn grow paint">${I.palette}Repaint · ${fmt(c.price * REPAINT)}</button><button class="btn grow sell">${I.tag}Sell · ${fmt(value(o))}</button></div></div></div>`
    : `<div class="panel"><div class="pb col" style="gap:12px;padding-top:14px">
        <div><span class="caps">Price</span><div class="big num">${fmt(c.price)}</div></div>
        ${purchaseBtn(c.price, bal)}</div></div>`;
  const overlay = purchaseFlow(c, bal, S.carCase);
  return win(`${hdr('store', { balance: bal })}<div class="shdr"><span class="backlink">${I.back}Store</span>
    <span class="row" style="margin-left:12px"><img src="${BADGE(c.id)}" style="width:26px;height:26px;object-fit:contain"><h2>${c.name}</h2>${flag(c.nat)}<span class="chip ${SRC[c.src][1]}">${SRC[c.src][0]}</span><span class="chip c-plain">${c.spec}</span></span></div>
  <div class="body" style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;overflow:auto">
    <div class="col">
      <div class="stage-img"><img src="${PREV(c.id, pick)}"><div class="nav-arrows"><span>${I.back}</span><span>${I.chev}</span></div><div class="lbl2">${skinName(c, pick)} · 2 of ${c.skins.length}</div></div>
      <div class="strip">${c.skins.map(([k]) => `<img class="${k === pick ? 'on' : ''}" src="${PREV(c.id, k)}">`).join('')}</div>
      <div class="placeholder"><b>Figures, description and curves</b>As the car page has them today.</div>
    </div>
    <div class="col">${panel}<div class="placeholder"><b>Championships racing it, its classification, where it comes from</b>As today.</div></div>
  </div>${overlay ? overlay() : ''}`);
};

// ---------- Garage ----------
// Two ways to keep a row's actions tidy: buttons of one width, the amount
// right-aligned inside, or a row menu with the amounts as a column of their own.
const garageTable = () => {
  const menu = S.gRow === 'menu';
  const actions = (o, c, i) => (menu
    ? `<td class="n num">${fmt(c.price * REPAINT)}</td><td class="n num">${fmt(value(o))}</td>
       <td class="act" style="position:relative"><span class="kebab${i === 1 ? ' on' : ''}" style="margin-left:auto">${I.dots}</span>
       ${i === 1 ? `<div class="menu" style="right:10px;top:40px;min-width:220px;text-align:left"><div class="mi hl"><span class="ic-paint">${I.palette}</span>Repaint<span class="end num muted">${fmt(c.price * REPAINT)}</span></div><div class="mi"><span class="ic-sell">${I.tag}</span>Sell<span class="end num muted">${fmt(value(o))}</span></div><div class="sep"></div><div class="mi">${I.chev}Open the car's page</div></div>` : ''}</td>`
    : `<td class="act"><span class="row" style="justify-content:flex-end"><button class="btn sm fw2">${I.palette}Repaint<b class="num">${fmt(c.price * REPAINT)}</b></button><button class="btn sm fw2">${I.tag}Sell<b class="num">${fmt(value(o))}</b></button></span></td>`);
  return `<div class="tablewrap" style="overflow:visible"><table class="ct"><thead><tr><th></th><th>Car</th><th>Livery</th><th>Bought</th><th>Racing in</th>${menu ? '<th class="n">Repaint</th><th class="n">Sells for</th>' : ''}<th></th></tr></thead><tbody>
  ${GARAGE.map((o, i) => { const c = car(o.id); return `<tr class="${menu && i === 1 ? 'hl' : ''}"><td style="width:84px"><img class="th" src="${PREV(c.id, o.skin)}"></td>
    <td><div class="nm">${c.name}</div><div class="sb">${flag(c.nat)}${c.brand} · ${c.year}<span class="chip c-plain">${c.spec}</span></div></td>
    <td style="white-space:nowrap"><span class="row" style="gap:8px"><img class="swatch" src="${LIVERY(c.id, o.skin)}">${skinName(c, o.skin)}</span></td><td style="white-space:nowrap">${o.boughtText}</td><td>${o.racing ?? '<span class="muted">-</span>'}</td>
    ${actions(o, c, i)}</tr>`; }).join('')}
  </tbody></table></div>`;
};
const garage = () => {
  const empty = S.gCase === 'empty';
  const cay = GARAGE[1]; const c = car(cay.id);
  const mx5 = GARAGE[0];
  const overlay = {
    repaint: () => bigScrim(liveryStep(c, '00_clubsport', { title: `Repaint the ${c.name}`, hint: 'It races in the new livery from now on.', back: 'Cancel', cur: cay.skin,
      foot: `<span class="row" style="gap:10px"><img class="swatch" src="${LIVERY(c.id, cay.skin)}">${skinName(c, cay.skin)} ${I.chev} <img class="swatch" src="${LIVERY(c.id, '00_clubsport')}"><b>Clubsport</b></span><span class="end row"><button class="btn ghost">Cancel</button><button class="btn paint">${I.palette}Repaint · ${fmt(c.price * REPAINT)}</button></span>` })),
    sell: () => scrim(`<div class="dh"><h3>Sell the ${car(mx5.id).name}?</h3><p>Bought for ${fmt(mx5.paid)} on ${mx5.boughtText}.</p></div>
      <div class="db"><div class="kv" style="font-size:13px"><span>It sells for</span><b class="num in">${fmt(value(mx5))}</b><span>Your balance after</span><b class="num">${fmt(BALANCE + value(mx5))}</b></div></div>
      <div class="df"><button class="btn ghost">Keep it</button><button class="btn sell">${I.tag}Sell</button></div>`, 480),
    sellEntered: () => scrim(`<div class="dh"><h3>Sell the ${c.name}?</h3><p>Bought for ${fmt(cay.paid)} on ${cay.boughtText}.</p></div>
      <div class="db"><div class="kv" style="font-size:13px"><span>It sells for</span><b class="num in">${fmt(value(cay))}</b><span>Your balance after</span><b class="num">${fmt(BALANCE + value(cay))}</b></div>
        <div class="note"><b>GT4 European Series 2027</b> has 3 rounds left in it. You race them in a rented one, ${fmt(c.price * RENT)} a round, in the livery it wears now.</div></div>
      <div class="df"><button class="btn ghost">Keep it</button><button class="btn sell">${I.tag}Sell</button></div>`, 480),
    blocked: () => scrim(`<div class="dh"><h3>Sell the ${c.name}?</h3><p>Bought for ${fmt(cay.paid)} on ${cay.boughtText}.</p></div>
      <div class="db"><div class="warnbox">${I.warn}<div class="txt"><b>R6 · Barcelona National is under way</b><span>Its qualifying has run in this car. Finish the round, then sell it.</span></div></div></div>
      <div class="df"><button class="btn ghost">Close</button><button class="btn sell dim">${I.tag}Sell</button></div>`, 480),
  }[S.gCase];
  const content = empty
    ? `<div class="panel" style="padding:48px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:8px"><span class="well" style="background:var(--own);color:var(--own-fg);width:44px;height:44px">${I.garage}</span><b style="font-size:15px">Nothing in your garage yet</b><button class="btn pri">${I.store}Go to the Store</button></div>`
    : S.layout === 'table' ? garageTable() : `<div class="grid" style="overflow:auto;padding-bottom:20px">${GARAGE.map(garageCard).join('')}</div>`;
  return shell('garage', 'Garage', empty ? '0 cars' : '2 cars', '', content).replace(/<\/div>$/, `${overlay ? overlay() : ''}</div>`);
};

// ---------- Entering ----------
// The championship page with its sidebar, where the Enter panel lives today.
const enter = () => {
  const own = S.eCase === 'owned';
  const series = own ? 'GT4 European Series 2027' : 'Porsche Carrera Cup Germany 2027';
  const fee = own ? 8000 : 6000;
  const bal = S.eCase === 'short' ? SHORT_BAL : BALANCE;
  const c = own ? car('ks_porsche_cayman_gt4_clubsport') : car('ks_porsche_911_gt3_cup_2017');
  const skin = own ? owned(c.id).skin : '02_racing_917';
  const rent = own ? 0 : c.price * RENT;
  const panel = `<div class="enter-card"><h4>Enter ${series}</h4><div class="desc">Pick the class you race in and the car you race it in, for the whole season.</div>
    ${own ? `<div class="field"><span class="lbl">Class</span><div class="select">GT4${I.down}</div></div>` : ''}
    <div class="carrow"><img src="${PREV(c.id, skin)}"><span class="grow" style="min-width:0"><div class="t">${c.name}</div>
      <div class="s">${own ? `<span class="chip c-own">${I.check}Owned</span>` : `<span class="chip c-rent">${I.key}Rented</span>`}${skinName(c, skin)}</div></span><button class="btn sm">Change</button></div>
    ${own ? '' : `<div class="costs"><span>Rent</span><b class="num">${fmt(rent)} a round</b><span style="grid-column:1/-1">Paid with the entry fee as each round launches.</span></div>`}
    <button class="btn pri">Enter</button>
    <p class="row" style="justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;margin:0;font-size:12px"><span class="muted">Starts at</span><span><b>R${own ? 6 : 3} · Barcelona</b><span class="muted"> · Sun 27 Jul</span></span></p></div>`;
  const picker = () => {
    const cars = own ? ['ks_porsche_cayman_gt4_clubsport', 'ks_maserati_gt_mc_gt4', 'gt4_bmw_m4'] : ['ks_porsche_cayman_gt4_clubsport', 'ks_maserati_gt_mc_gt4', 'gt4_bmw_m4'];
    return bigScrim(`<div class="dh"><h3>Pick a car</h3><p>The cars GT4 races. One you own races in its own livery; any other is rented, or purchased here.</p></div>
      <div class="db" style="flex-direction:row;gap:20px"><aside class="rail" style="width:210px"><div class="grp new"><span class="caps">Yours</span>${ropt(false, 'Owned', 1)}</div><div class="placeholder"><b>The car browser's rail</b>Over the class's cars.</div></aside>
      <div class="col grow"><div class="row"><span class="input" style="width:260px">${I.search}<span class="muted">Search cars</span></span><span class="hint end">Owned first</span></div>
      <div class="grid">${cars.map((id, i) => storeCard(car(id), { sel: i === 0, raced: false, buy: false })).join('')}</div></div></div>`);
  };
  const livery = (short) => {
    const m = car('ks_maserati_gt_mc_gt4');
    return bigScrim(liveryStep(m, '01_racing_12', { title: 'Pick a livery', hint: 'Rent it in any livery, or purchase it in the one you pick.', back: 'All cars',
      foot: `<span class="row" style="gap:10px"><img class="swatch" src="${LIVERY(m.id, '01_racing_12')}"><b>Racing #12</b></span>
        <span class="end row" style="gap:8px"><span style="width:260px">${purchaseBtn(m.price, short ? SHORT_BAL : BALANCE, true)}</span>
        <button class="btn pri lg">${I.key}Rent · ${fmt(m.price * RENT)} a round</button></span>` }));
  };
  const overlay = { picker, livery: () => livery(false), short: () => livery(true) }[S.eCase];
  // The championship's summary heads the left column, as DetailSummary does, and
  // the Enter panel sits under it.
  const summary = `<div class="sum"><div class="stripe"></div>
    <div class="row" style="align-items:flex-start"><h1 class="grow">${series}</h1><span class="kebab">${I.dots}</span></div>
    <div class="row" style="gap:4px"><span class="chip c-sports">Sportscar</span><span class="chip c-t3">Tier 3</span><span class="chip c-champ">Ours</span></div>
    <p class="hint" style="margin:0">${own ? 'GT4 machinery across Europe\'s classic circuits, two races a weekend.' : 'The one-make Porsche series, run beside the DTM.'}</p>
    <div class="col" style="gap:8px"><div class="fact"><span>Event</span><span class="row" style="gap:4px"><span class="chip c-practice">P</span><span class="chip c-qualify">Q</span><span class="chip c-race">R1</span>${own ? '<span class="chip c-race">R2</span>' : ''}</span></div>
      <div class="fact"><span>Grid</span><span>${own ? '24 cars · 14 teams' : '28 cars · 15 teams'}</span></div>
      <div class="fact"><span>Entry fee</span><span class="num">${fmt(fee)}</span></div></div></div>`;
  return win(`${hdr('champs', { balance: bal })}<div class="shdr"><span class="backlink">${I.back}Championships</span></div>
  <div class="body" style="display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;overflow:auto;align-items:start">
    <div class="col">${summary}${panel}</div>
    <div class="col"><div class="ctabs"><a class="on">Rounds</a><a>Standings</a><a>Classes</a><a>Points, prizes and rules</a></div>
      <div class="placeholder"><b>The rounds</b>As today.</div></div>
  </div>${overlay ? overlay() : ''}`);
};

// ---------- Round page ----------
const round = () => {
  const short = S.money === 'short';
  const bal = short ? 8200 : BALANCE;
  const fee = 6000; const rent = 5000;
  const box = `<div class="feebox"><span class="k">Entry fee</span><span class="v num">${fmt(fee)}</span>
      <span class="k">Rent · Porsche 911 GT3 Cup 2017</span><span class="v num">${fmt(rent)}</span>
      <span class="k tot">Paid when practice launches</span><span class="v num tot">${fmt(fee + rent)}</span>
      <span class="k">Your balance</span><span class="v num ${short ? 'out' : ''}">${fmt(bal)}</span></div>`;
  const launch = short
    ? `<div class="errbox">${I.warn}<div class="txt"><b>You can't pay for this round</b><span>The entry fee and the rental come to ${fmt(fee + rent)} and you have ${fmt(bal)}. Earn the rest first, or skip it, which costs nothing.</span></div></div>
       <div class="row"><button class="btn pri lg dim">${I.play}Launch practice</button><span class="hint">${fmt(fee + rent - bal)} short</span></div>`
    : `<div class="row"><button class="btn pri lg">${I.play}Launch practice</button><span class="hint">Pays the entry fee and the rental, ${fmt(fee + rent)}</span></div>`;
  return win(`${hdr('champs', { balance: bal })}<div class="shdr"><span class="backlink">${I.back}Porsche Carrera Cup Germany</span></div>
  <div class="body" style="display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;overflow:auto">
    <div class="col"><div class="ph" style="height:170px;border-radius:10px"><img class="bg" src="${PH.barca}"></div>
      <div class="panel"><h3>Your car</h3><div class="pb row"><img class="thumb" src="${PREV('ks_porsche_911_gt3_cup_2017', '02_racing_917')}"><div><div style="font-weight:600;font-size:13px">Porsche 911 GT3 Cup 2017</div><div class="row" style="gap:6px;margin-top:3px"><span class="chip c-rent">${I.key}Rented</span><span class="hint">Racing #917</span></div></div></div></div></div>
    <div class="col" style="gap:14px">
      <div><span class="caps">Porsche Carrera Cup Germany · Round 3 of 7</span><h2 style="margin:4px 0 0;font-size:22px">Barcelona GP</h2></div>
      <div class="panel"><h3>Practice · Qualifying · Race</h3><div class="pb col" style="gap:10px">${box}${launch}</div></div>
      <div class="placeholder"><b>The event list and each session's briefing</b>As today.</div>
    </div></div>`);
};

// ---------- Finances ----------
const finances = () => {
  const earned = sum((l) => l.n > 0);
  const spent = sum((l) => l.n < 0);
  const kinds = [['race', 'var(--s-race-fg)'], ['historic', 'var(--historic-fg)'], ['sale', 'var(--own-fg)'], ['fee', 'var(--l-fee-fg)'], ['rent', 'var(--l-rent-fg)'], ['purchase', 'var(--own-fg)'], ['repaint', 'var(--own-fg)']]
    .map(([k, c]) => [k, c, sum((l) => l.kind === k)]);
  const max = Math.max(...kinds.map(([, , n]) => Math.abs(n)));
  return win(`${hdr('home')}<div class="shdr"><span class="backlink">${I.back}Home</span><h2 style="margin-left:12px">Finances</h2></div>
  <div class="body col" style="gap:14px;overflow:hidden">
    <div class="row"><div class="seg"><span class="on">2027</span><span>2026</span><span>Every season</span></div>
      <div class="seg" style="margin-left:8px"><span class="on">Everything</span><span>Prizes</span><span>Fees and rentals</span><span class="new">Cars</span></div></div>
    <div class="tiles4">
      <div class="tile hero"><span class="caps">Balance</span><b class="num">${fmt(BALANCE)}</b><span class="hint">On Sun 6 Jul 2027</span></div>
      <div class="tile"><span class="caps">Earned this season</span><b class="in num">${fmt(earned, true)}</b><span class="hint">Prizes and a car sold</span></div>
      <div class="tile"><span class="caps">Spent this season</span><b class="out num">${fmt(spent, true)}</b><span class="hint">A car bought, fees, rentals and a repaint</span></div>
      <div class="tile"><span class="caps">Net this season</span><b class="num">${fmt(earned + spent, true)}</b><span class="hint">Opened the season on ${fmt(OPENED)}</span></div>
    </div>
    <div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start">
      <div class="panel ledger"><h3>Ledger <span class="muted" style="font-weight:400">${LEDGER.length} lines · 2027</span></h3><div class="pb"><table class="t led"><thead><tr><th style="width:96px">Date</th><th style="width:130px">Kind</th><th>What</th><th class="amt" style="width:110px">Amount</th><th class="amt" style="width:110px">Balance</th></tr></thead>
        <tbody>${[...LEDGER].reverse().map((l) => `<tr><td class="num">${l.d}</td><td><span class="chip ${KIND[l.kind][1]}">${KIND[l.kind][0]}</span></td><td><div class="w">${l.what}</div><div class="s">${l.sub}</div></td><td class="amt">${amt(l.n)}</td><td class="amt num muted">${fmt(l.b)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="col">
        <div class="panel"><h3>Where it came from</h3><div class="pb"><div class="bars">${kinds.map(([k, c, n]) => `<div class="bar"><span>${KIND[k][0]}</span><span class="tr"><i style="width:${Math.round(Math.abs(n) / max * 100)}%;background:${c}"></i></span><span class="amt">${amt(n)}</span></div>`).join('')}</div></div></div>
        <div class="panel"><h3>By championship</h3><div class="pb col" style="gap:8px;font-size:13px">
          <div class="row"><span class="chip c-sports">Sportscar</span><span class="grow">GT4 European Series</span>${amt(sum((l) => l.sub.startsWith('GT4') || l.sub.endsWith('in GT4')))}</div>
          <div class="row"><span class="chip c-sports">Sportscar</span><span class="grow">Porsche Carrera Cup Germany</span>${amt(sum((l) => l.sub.includes('Carrera')))}</div>
          <div class="row"><span class="chip c-historic">Historic</span><span class="grow">Spa 1000 km 1966</span>${amt(6000)}</div></div></div>
      </div></div></div>`);
};

// ---------- Explanations ----------
const PRICE = {
  a: '<b>A · One line</b>: the price, then the rent beside it in smaller type.',
  b: '<b>B · Two cells</b>: the card ends in two labelled figures, Purchase and Rent a round, split by a rule.',
  c: '<b>C · Chips</b>: two chips with icons, the purchase neutral and the rental in the rental\'s own teal.',
  d: '<b>D · Tinted foot</b>: a muted band closing the card, the price large on the left and the rent on the right. An owned car\'s band is the garage\'s magenta.',
};
const WHY = {
  store: () => ({
    browse: `<b>The Store replaces Cars</b>; <b>Tracks leaves the nav</b>. Every card shows what it costs to purchase and to rent a round, and ends in <b>Purchase</b> - or the soft red <b>Can't afford</b> - without opening the car's page. A car you own shows what selling pays instead. ${PRICE[S.price]} The table keeps the same columns on every row, with Purchase or Owned in a slot of one width.`,
    livery: '<b>Purchase from a card or a row</b> opens the same livery step as the car page.',
    confirm: '<b>Then the same confirmation</b>: the car in the livery picked, the price, and what you are left with.',
  })[S.sCase],
  car: () => ({
    buy: `<b>The sidebar is the price and Purchase</b>, nothing else.`,
    livery: '<b>Purchase opens the livery step</b> - the car picker\'s own - and picking one asks to confirm.',
    confirm: '<b>Confirming</b> shows the car in the livery picked, the price and what you are left with. Another livery goes back a step.',
    short: '<b>Can\'t afford</b> is the button itself, in the soft red. The price is right above it, so the button doesn\'t repeat it - nor does Purchase.',
    owned: '<b>Owned:</b> its livery, what you paid and when, and Repaint and Sell with what each costs or pays.',
  })[S.carCase],
  garage: () => ({
    cars: () => (S.layout === 'table'
      ? (S.gRow === 'menu' ? '<b>Row menu:</b> the repaint and the sale price become columns of their own, and Repaint and Sell move into the row\'s menu, which a right-click opens too.' : '<b>Fixed-width buttons:</b> Repaint and Sell are one width on every row, the label on the left and the amount right-aligned.')
      : '<b>The Garage is the car browser over the cars you own</b> - the same rail, search, sort and cards or table - each card in the livery it wears, with when it was bought, what it races, and Repaint and Sell priced on their buttons.'),
    repaint: '<b>Repaint is the livery step</b>, with the price on its button. It applies at once, to every round from now on; the AI field\'s liveries are drawn from every livery the car has and never depend on yours.',
    sell: '<b>Selling</b> says what it pays and leaves you with; the button doesn\'t repeat the amount.',
    sellEntered: '<b>Selling a car a championship still races</b> is allowed between rounds: its rounds left are raced in a rented one, at the rent a round.',
    blocked: '<b>A round under way</b> in the car stops it being sold until the round is over.',
    empty: '<b>An empty garage</b> points at the Store.',
  })[S.gCase],
  enter: () => ({
    owned: '<b>The Enter panel stays where it is</b>, under the summary in the championship page\'s left column, and keeps its shape: the class, the car row with Change, Enter. The car row now says <b>Owned</b> or <b>Rented</b>. The entry fee stays in the summary.',
    rented: '<b>A rented car</b> adds its rent a round above Enter.',
    picker: `<b>Change opens the car picker</b> over the class's cars, as today - owned first, each card priced. ${PRICE[S.price]}`,
    livery: '<b>Picking a car you don\'t own opens its livery step</b>, as today, now ending in <b>Rent</b> or <b>Purchase</b>. Purchasing confirms as the car page does, then the car is yours and enters owned. A car you own skips the step - it races in its own livery.',
    short: '<b>Can\'t afford</b> stays visible beside Rent, in the soft red. Nothing else here shows the price, so both buttons carry it.',
  })[S.eCase],
  round: () => (S.money === 'short'
    ? '<b>Can\'t pay:</b> the fee and the rental are one sum, and a launch short of it is refused.'
    : '<b>The rental is paid beside the fee</b>, as the round\'s first session launches. A round you skip or miss costs neither.'),
  finances: () => '<b>Four new kinds of line.</b> Bought, sold and repainted wear the garage\'s own colour; a rental is a line per round. The filter gains <b>Cars</b> (dashed).',
};
const DECIDED = [
  'Entering means <b>owning or renting</b>. A rental costs 2% of the price a round, at launch beside the fee, nothing for a round skipped.',
  'Selling pays the full price on the day you buy, then <b>7.5% a year</b> less, never below 70%.',
  '<b>Repaint any time</b>, at once; AI liveries are drawn on their own and never depend on yours.',
  '<b>Buying the car you rent</b> stops its rent from the next round and races your livery.',
  '<b>Selling</b> is refused while a round is under way in the car; between rounds, the rounds left are raced rented.',
  'Owned and the garage\'s ledger lines on magenta 320, rentals on teal 195.',
  '<b>Can\'t afford</b> is the soft red button; a button shows the price only where nothing beside it does.',
  'Cards close in the <b>tinted foot</b> (D); the Garage table puts Repaint and Sell in a <b>row menu</b>.',
  '<b>Purchase is green</b>, and Repaint and Sell each have a colour of their own, the same fill everywhere.',
];
const OPEN = [
  '<b>Repaint</b>: the gradient or a solid violet.',
  '<b>Sell</b>: amber or the garage\'s magenta.',
];

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.dataset.paint = S.paint;
  document.documentElement.dataset.sell = S.sell;
  document.getElementById('picker').innerHTML = GROUPS.filter((g) => !g.for || g.for.includes(S.view))
    .map((g) => `<div class="grp"><strong>${g.label}</strong>${g.opts.map(([v, l]) => `<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${S[g.k] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('why').innerHTML = `<div class="box">${(() => { const w = WHY[S.view](); return typeof w === 'function' ? w() : w; })()}<div class="q"><b>Decided</b><ul>${DECIDED.map((q) => `<li>${q}</li>`).join('')}</ul></div><div class="q"><b>To decide</b><ul>${OPEN.map((q) => `<li>${q}</li>`).join('')}</ul></div></div>`;
  document.getElementById('stage').innerHTML = {
    store, car: carPage, garage, enter, round, finances,
  }[S.view]();
};
document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  history.replaceState(null, '', `#${new URLSearchParams(S)}`);
  render();
});
// The hash holds the picker's state, so a view can be linked or reloaded.
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in S) S[k] = v; });
render();
</script>
</body>
</html>
