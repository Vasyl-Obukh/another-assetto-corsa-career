<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading skeletons</title>
<style>
/* Tokens copied from src/renderer/src/globals.css. */
:root {
  --background: oklch(0.965 0.007 250); --foreground: oklch(0.16 0.01 260); --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262); --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252); --muted-foreground: oklch(0.53 0.012 258); --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255); --input: oklch(0.885 0.01 255);
  --sk: oklch(0.925 0.018 255); --sk-hi: oklch(0.965 0.01 255); --sk-deep: oklch(0.88 0.02 255);
  --d-ss: oklch(0.925 0.06 212); --d-ss-fg: oklch(0.36 0.11 215);
  --d-sp: oklch(0.925 0.06 112); --d-sp-fg: oklch(0.36 0.1 118);
  --d-to: oklch(0.925 0.055 175); --d-to-fg: oklch(0.35 0.09 178);
  --d-ro: oklch(0.925 0.06 270); --d-ro-fg: oklch(0.37 0.12 270);
  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88); --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255); --t3-fg: oklch(0.42 0.015 260);
  --t4: oklch(0.89 0.07 52); --t4-fg: oklch(0.41 0.09 48);
  --t5: oklch(0.875 0.022 250); --t5-fg: oklch(0.36 0.035 255);
  --base: oklch(0.55 0.13 155); --dlc: oklch(0.5 0.12 75); --mod: oklch(0.5 0.15 295);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265); --foreground: oklch(0.94 0.005 260); --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258); --muted: oklch(0.27 0.014 265); --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265); --border: oklch(1 0 0 / 12%); --input: oklch(1 0 0 / 16%);
  --sk: oklch(0.3 0.016 265); --sk-hi: oklch(0.345 0.016 265); --sk-deep: oklch(0.27 0.016 265);
  --d-ss: oklch(0.32 0.07 212); --d-ss-fg: oklch(0.86 0.1 212);
  --d-sp: oklch(0.32 0.07 112); --d-sp-fg: oklch(0.86 0.1 112);
  --d-to: oklch(0.32 0.065 175); --d-to-fg: oklch(0.86 0.09 175);
  --d-ro: oklch(0.32 0.07 270); --d-ro-fg: oklch(0.86 0.1 270);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88); --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --t4: oklch(0.33 0.06 50); --t4-fg: oklch(0.85 0.09 55);
  --t5: oklch(0.315 0.028 250); --t5-fg: oklch(0.82 0.035 255);
  --base: oklch(0.7 0.15 158); --dlc: oklch(0.72 0.12 75); --mod: oklch(0.7 0.14 295);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted-foreground); } .xs { font-size: 11.5px; } .sm { font-size: 13px; }
.caps { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; } .end { margin-left: auto; }

/* The mockup's own controls. */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; background: var(--foreground); color: var(--background); font-size: 12.5px; }
.picker strong { margin-right: 6px; }
.picker button { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 3px 9px; }
.picker button.on { background: var(--background); color: var(--foreground); }
.picker .sep { width: 1px; height: 20px; background: color-mix(in oklch, var(--background) 30%, transparent); margin: 0 4px; }
.note { padding: 8px 32px; font-size: 12.5px; background: color-mix(in oklch, var(--primary) 10%, var(--background)); border-bottom: 1px solid var(--border); }
.note b { font-weight: 600; }

/* App chrome. */
.nav { height: 64px; display: flex; align-items: center; gap: 22px; padding: 0 32px; border-bottom: 1px solid var(--border); }
.nav .brand { font-size: 17px; font-weight: 500; margin-right: 6px; }
.nav span { font-size: 14px; padding: 6px 10px; border-radius: 8px; }
.nav span.on { background: color-mix(in oklch, var(--primary) 12%, transparent); color: var(--primary); }
.page { padding: 28px 32px 40px; max-width: 1600px; }
.shot { display: none; width: 100%; }
body.loaded .page, body.loaded .nav { display: none; } body.loaded .shot.on { display: block; }
.screen { display: none; } .screen.on { display: block; }

/* Real controls drawn as they render before the data arrives. */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px oklch(0 0 0 / 5%); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 14px; white-space: nowrap; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.dim { opacity: .5; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.input { height: 36px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted-foreground); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 99px; display: inline-block; }
.cb { width: 15px; height: 15px; border: 1px solid var(--input); border-radius: 4px; background: var(--card); flex: none; }
.back { color: var(--muted-foreground); font-size: 14px; display: flex; gap: 8px; align-items: center; padding: 6px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--card); }
.seg span { padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--muted-foreground); display: inline-flex; gap: 6px; align-items: center; }
.seg span.on { background: var(--primary); color: var(--primary-foreground); }
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--border); }
.tabs span { padding: 8px 0 10px; color: var(--muted-foreground); font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
.tabs span.on { color: var(--foreground); box-shadow: inset 0 -2px 0 var(--primary); font-weight: 500; }
.sw { width: 34px; height: 18px; border-radius: 99px; background: var(--input); flex: none; }
.th { font-size: 12px; color: var(--muted-foreground); }

/* Skeleton primitives: a block, a line the height of the text it stands for. */
.sk { background: var(--sk); border-radius: 6px; flex: none; }
.sk.round { border-radius: 99px; }
.sk.hi { background: var(--sk-hi); }
.sk.deep { background: var(--sk-deep); }
.l11 { height: 9px; margin: 3px 0; } .l13 { height: 10px; margin: 4px 0; } .l14 { height: 11px; margin: 4px 0; }
.l16 { height: 13px; margin: 5px 0; } .l20 { height: 16px; margin: 6px 0; } .l24 { height: 20px; margin: 6px 0; } .l40 { height: 32px; margin: 4px 0; }
body.pulse .sk { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
/* The sweep: one light band crossing the whole page, so every block shimmers in step. */
body.sweep .sk { background-image: linear-gradient(100deg, transparent 0 40%, var(--sk-hi) 50%, transparent 60% 100%); background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }
@keyframes sweep { from { background-position: 100vw 0; } to { background-position: -100vw 0; } }
body.still .sk { animation: none; }

/* Layout helpers shared by several screens. */
.browser { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { padding: 0; overflow: hidden; }
.rail h4 { margin: 0; padding: 14px 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--border); }
.rail .grp { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 9px; }
.rail .grp:last-child { border-bottom: 0; }
.rail .gt { font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; }
.rail .it { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.rail .it .n { margin-left: auto; }
.toolbar { display: flex; gap: 10px; align-items: center; }
.toolbar .input { flex: 1; }
.count { margin: 14px 4px 14px; }
.h1 { font-size: 24px; font-weight: 600; }
.sub { color: var(--muted-foreground); margin: 4px 0 18px; font-size: 14px; }
</style>
</head>
<body class="sweep">
<div class="picker" id="picker"></div>
<div class="note" id="note"></div>
<div id="shots"></div>
<div class="nav" id="nav"></div>
<div class="page" id="page"></div>

<script>
// ---------- Building blocks ----------
const sk = (w, h, cls = '') => `<div class="sk ${cls}" style="width:${typeof w === 'number' ? w + 'px' : w};height:${h}px"></div>`;
const ln = (w, size = 14, cls = '') => `<div class="sk l${size} ${cls}" style="width:${typeof w === 'number' ? w + 'px' : w}"></div>`;
const chip = (w = 56) => sk(w, 22);
const rep = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join('');
const pick = (i, list) => list[i % list.length];
const DISC = [['Single-seater', 'ss'], ['Sportscar', 'sp'], ['Touring', 'to'], ['Road', 'ro']];
const TIERS = [[5, 'Steel'], [4, 'Bronze'], [3, 'Silver'], [2, 'Gold'], [1, 'Platinum']];
const tierBadge = (n) => `<span class="chip" style="width:22px;height:22px;padding:0;justify-content:center;border-radius:99px;background:var(--t${n});color:var(--t${n}-fg)">${n}</span>`;
const icon = (d) => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  search: icon('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  sort: icon('<path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/>'),
  back: icon('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
  arrow: icon('<path d="M5 12h14M12 5l7 7-7 7"/>'),
  chevL: icon('<path d="m15 18-6-6 6-6"/>'), chevR: icon('<path d="m9 18 6-6-6-6"/>'), chevD: icon('<path d="m6 9 6 6 6-6"/>'),
  grid: icon('<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>'),
  list: icon('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  cal: icon('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
  plus: icon('<path d="M12 5v14M5 12h14"/>'), up: icon('<path d="M12 19V5M5 12l7-7 7 7"/>'),
};
const railItem = (label, dot) => `<div class="it"><span class="cb"></span>${dot ? `<span class="dot" style="background:${dot}"></span>` : ''}<span>${label}</span><span class="n">${ln(16, 11)}</span></div>`;
const railSk = (n, w = [96, 60, 80, 70, 110, 64]) => rep(n, (i) => `<div class="it"><span class="cb"></span>${ln(pick(i, w), 13)}<span class="n">${ln(16, 11)}</span></div>`);
const group = (title, body) => `<div class="grp"><div class="gt">${title}<span class="muted">${I.chevD}</span></div>${body}</div>`;
const discRail = () => group('Discipline', DISC.map(([n, k]) => railItem(n, `var(--d-${k}-fg)`)).join(''));
const tierRail = () => group('Tier', [1, 2, 3, 4, 5].map((n) => `<div class="it"><span class="cb"></span>${tierBadge(n)}<span>Tier ${n}</span><span class="n">${ln(16, 11)}</span></div>`).join(''));
const sourceRail = () => group('Content', railItem('Base game', 'var(--base)') + railItem('DLC', 'var(--dlc)') + railItem('Mod', 'var(--mod)'));
const switchRow = (label) => `<div class="grp"><div class="it" style="justify-content:space-between">${label}<span class="sw"></span></div></div>`;
const toolbar = (placeholder, extra = '') => `<div class="toolbar"><div class="input">${I.search}${placeholder}</div><span class="btn">${I.sort}Sort: Name ${I.up}</span>${extra}</div>`;
const viewToggle = (list) => `<span class="seg"><span class="${list ? '' : 'on'}">${I.grid}</span><span class="${list ? 'on' : ''}">${I.list}</span></span>`;
const header = (title, subtitle) => `<div class="h1">${title}</div><div class="sub">${subtitle}</div>`;
const back = (label) => `<div class="back">${I.back}${label}</div>`;
const sessions = (n) => `<span class="row" style="gap:3px">${rep(n, () => sk(18, 18))}</span>`;

// ---------- Screens ----------
const HOME = () => `
<div class="row" style="align-items:flex-end;margin-bottom:18px">
  <div class="col">${ln(56, 11)}${ln(170, 24)}</div>
  <span class="btn end">Open the calendar ${I.arrow}</span>
</div>
<div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px">
  <div class="card" style="display:grid;grid-template-columns:minmax(0,1fr) 240px;overflow:hidden;min-height:368px">
    <div class="col" style="padding:20px;gap:6px">
      <span class="caps" style="color:var(--primary)">Your next weekend</span>
      <div class="row" style="gap:12px;margin-top:6px">${sk(38, 34)}${ln(220, 16)}</div>
      ${ln(250, 20)}${ln(160, 16)}
      <div class="row" style="margin:6px 0">${chip(70)}${chip(52)}${chip(56)}${chip(130)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-top:2px">
        ${rep(3, (i) => `<div class="row">${ln(22, 11)}${chip(pick(i, [86, 72, 50]))}${ln(70, 11)}</div>`)}
      </div>
      <div class="row" style="margin-top:auto;padding-top:20px">${sk(122, 36)}${sk(168, 36)}</div>
    </div>
    <div style="background:var(--muted);display:flex;align-items:center;justify-content:center">${sk(130, 80, 'deep')}</div>
  </div>
  <div class="card col" style="padding:20px 20px 14px">
    <div class="row" style="margin-bottom:14px"><span class="caps">Your championships</span><span class="end">${ln(60, 11)}</span></div>
    ${rep(3, (i) => `
      <div class="row" style="gap:14px;align-items:stretch;margin-bottom:22px">
        ${sk(3, 62, 'round')}
        <div class="col grow" style="gap:6px">
          <div class="row">${ln(pick(i, [170, 160, 90]), 16)}${chip(48)}</div>
          <div class="row" style="gap:3px">${rep(pick(i, [5, 6, 8]), () => `<div class="sk grow" style="height:5px;flex:1"></div>`)}</div>
          ${ln(130, 13)}
        </div>
        <div class="col" style="align-items:flex-end;gap:6px;justify-content:center">${ln(30, 13)}${ln(34, 13)}</div>
      </div>`)}
    <div class="row xs muted" style="margin-top:auto;border-top:1px solid var(--border);padding-top:12px;gap:14px">
      <span class="row" style="gap:5px"><span class="dot" style="background:var(--base)"></span>Raced</span>
      <span class="row" style="gap:5px"><span class="dot" style="background:oklch(0.62 0.06 15)"></span>Missed</span>
      <span class="row" style="gap:5px"><span class="dot" style="background:var(--primary)"></span>Next</span>
      <span class="row" style="gap:5px"><span class="dot" style="background:var(--border)"></span>To come</span>
    </div>
  </div>
</div>`;

const calHead = (days) => `
<div class="row" style="margin-bottom:16px">
  ${ln(190, 24)}
  <span class="btn dim" style="width:34px;padding:0;justify-content:center;margin-left:8px">${I.chevL}</span>
  <span class="btn dim" style="width:34px;padding:0;justify-content:center">${I.chevR}</span>
  <span class="btn dim">Today</span>
  <div class="card end row" style="gap:0;overflow:hidden;height:48px;border-radius:10px">
    <div class="col" style="padding:4px 14px;border-right:1px solid var(--border)"><span class="caps">Today</span>${ln(84, 14)}</div>
    <div class="col" style="padding:4px 14px"><span class="caps">Next for you</span>${ln(260, 14)}</div>
    ${sk(150, 48)}
  </div>
</div>
<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-bottom:12px">
  ${rep(12, (i) => `<div class="card col" style="height:36px;align-items:center;justify-content:center;gap:5px;border-radius:8px">${ln(26, 11)}<div class="row" style="gap:2px">${rep(pick(i, [3, 2, 4, 3, 2]), () => sk(5, 4, 'round'))}</div></div>`)}
</div>
<div class="row" style="gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:16px">
  <span class="caps">Status</span>
  <span class="seg"><span class="on">All ${sk(14, 9, 'hi')}</span><span>Available ${ln(14, 11)}</span><span>Entered ${ln(14, 11)}</span><span>Locked ${ln(14, 11)}</span></span>
  <span class="caps" style="margin-left:14px">Discipline</span>
  ${DISC.map(([n, k]) => `<span class="btn" style="height:30px;font-size:13px"><span class="dot" style="background:var(--d-${k}-fg)"></span>${n}</span>`).join('')}
  <span class="seg end"><span class="${days ? 'on' : ''}">${I.list}Days</span><span class="${days ? '' : 'on'}">${I.cal}Month</span></span>
</div>`;

const eventCard = (i) => `
<div class="card col" style="padding:12px 14px;gap:4px;border-left:3px solid var(--sk);min-width:0">
  <div class="row" style="align-items:flex-start">
    <div class="col grow" style="gap:2px">
      <div class="row" style="gap:6px">${ln(14, 11)}${chip(pick(i, [64, 52, 44]))}${chip(42)}</div>
      ${ln(pick(i, [200, 230, 170]), 16)}${ln(pick(i, [240, 150, 200]), 13)}
    </div>
    ${sk(64, 40, 'deep')}
  </div>
  <div class="row" style="border-top:1px solid var(--border);padding-top:9px;margin-top:6px">${ln(64, 16)}${ln(70, 13)}<span class="end">${ln(42, 13)}</span></div>
</div>`;

const CAL_MONTH = () => {
  const cells = rep(42, (i) => {
    const bars = [0, 6, 13, 20, 27, 34].includes(i) ? (i % 3) + 1 : 0;
    return `<div style="border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:5px;min-height:0">${ln(14, 13)}${rep(bars, (b) => sk(`${pick(b, [92, 80, 70])}%`, 18))}</div>`;
  });
  return `${calHead(false)}
<div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;height:600px">
  <div class="card" style="display:grid;grid-template-rows:auto 1fr;overflow:hidden">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<span class="caps" style="padding:8px">${d}</span>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr)">${cells}</div>
  </div>
  <div class="col" style="gap:10px">
    <div class="row"><div class="col">${ln(110, 16)}${ln(56, 11)}</div><span class="end">${sk(170, 34)}</span></div>
    ${rep(3, eventCard)}
  </div>
</div>`;
};

const CAL_DAYS = () => `${calHead(true)}
<div class="row" style="padding:4px 0 14px;border-bottom:1px solid var(--border)"><span class="caps" style="color:var(--primary);width:96px;text-align:right;padding-right:16px">Today</span><div class="grow" style="height:2px;background:var(--primary)"></div>${ln(70, 13)}</div>
${[[3], [2, 'month'], [1], [1]].map(([n, m], d) => `
  ${m ? `<div class="row" style="padding:22px 0 12px;border-bottom:1px solid var(--border)">${ln(130, 20)}${ln(90, 13)}</div>` : ''}
  <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--border)">
    <div class="col" style="align-items:flex-end;gap:2px;padding-right:4px">${ln(26, 11)}${sk(28, 26)}${ln(26, 11)}${ln(44, 11)}</div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">${rep(n, (i) => eventCard(i + d))}</div>
  </div>`).join('')}`;

const CHAMPIONSHIPS = () => `${header('Championships', 'The championships you can race today.')}
<div class="browser">
  <div class="card rail"><h4>Filters</h4>${discRail()}${tierRail()}${sourceRail()}${group('Origin', `<div class="it"><span class="cb"></span>The app's own<span class="n">${ln(16, 11)}</span></div><div class="it"><span class="cb"></span>Custom<span class="n">${ln(16, 11)}</span></div>`)}</div>
  <div>
    ${toolbar('Search championships')}
    <div class="count">${ln(54, 11)}</div>

  ['cal-days', 'Calendar · Days', 'calendar', CAL_DAYS, 'calendar-days',
    '<b>Real:</b> the same head as Month, and the Today rule. <b>Waiting:</b> race days, as rows of event cards the size of the real ones.'],
  ['champs', 'Championships', 'championships', CHAMPIONSHIPS, 'championships',
    '<b>Real:</b> the title, search, sort, the filter groups (disciplines, tiers and sources are fixed sets) and the ladder\'s tier header and discipline bands, in their colours. <b>Waiting:</b> the counts and the championship cards.'],
  ['champ-in', 'Championship · entered', 'championships', CHAMP(true), 'champ-entered',
    '<b>Real:</b> Back, the round table\'s header, the summary labels and Classes. <b>Waiting:</b> everything the championship says.'],
  ['champ-out', 'Championship · not entered', 'championships', CHAMP(false), 'champ-open',
    'The same skeleton without the Date and You columns, and with the Enter card\'s shape below the summary. Which shape is right is known only once the career is read. Where the career is already in memory the skeleton picks the right one; otherwise it uses this one.'],
  ['event', 'Round page', 'calendar', EVENT, 'event',
    '<b>Real:</b> Back and "Weekend". <b>Waiting:</b> the round\'s header, the entry card, a row per session and the session detail with its four tiles.'],

    '<b>Real:</b> the title, search, sort, the view switch, the rail\'s group names and the fixed Source list. <b>Waiting:</b> the classes, the brands, the counts, and eight poster cards with their image, chips and stats. Today those are eight plain 320px bars.'],
  ['cars-list', 'Cars · list', 'cars', CARS(true), 'cars-list',
    'The list view keeps its table header real. Each row has a thumbnail, a name, a class chip and the figures.'],
  ['tracks', 'Tracks', 'tracks', TRACKS, 'tracks',
    'The same browser with the track rail: the two switches, Source, Country and the two range filters with their histograms. Cards add a row of layout thumbnails.'],
  ['car', 'Car detail', 'cars', CAR, 'car',
    '<b>Real:</b> Back, the six figure labels, About, "Raced in" and Classification. <b>Waiting:</b> the hero, with the name and chips where they will land, the livery strip, the values and the text.'],
  ['library', 'Settings · Championships', 'settings', LIBRARY, 'library',
    '<b>Real:</b> the tabs, the rail, search, sort, New and Import. <b>Waiting:</b> the counts and the season cards, each with its band, switch, description, needs row and round bar.'],

    '<b>Real:</b> the whole form, from its tabs and section names to its labels, hints and segmented controls. Only the values wait, so nothing moves when they arrive.'],

];
const NAV = ['Home', 'Race', 'Calendar', 'Championships', 'Results', 'Cars', 'Tracks', 'Settings'];

const state = { screen: 'home', loaded: false, theme: 'light', motion: 'sweep' };
const render = () => {
  const [id, , nav, build, shot, note] = SCREENS.find((s) => s[0] === state.screen);
  document.documentElement.dataset.theme = state.theme;
  document.body.className = `${state.motion}${state.loaded && shot ? ' loaded' : ''}`;
  document.getElementById('nav').innerHTML = `<span class="brand">Assetto Corsa Career</span>${NAV.map((n) => `<span class="${n.toLowerCase() === nav ? 'on' : ''}">${n}</span>`).join('')}`;
  document.getElementById('page').innerHTML = build();
  document.getElementById('note').innerHTML = note;
  document.querySelectorAll('.shot').forEach((img) => img.classList.toggle('on', img.dataset.id === id));
  const b = (label, on, act) => `<button class="${on ? 'on' : ''}" data-act="${act}">${label}</button>`;
  document.getElementById('picker').innerHTML = `<strong>Loading</strong>${SCREENS.map(([sid, label]) => b(label, sid === state.screen, `screen:${sid}`)).join('')}
    <span class="sep"></span>${b('Skeleton', !state.loaded, 'loaded:0')}${b('Loaded (screenshot)', state.loaded, 'loaded:1')}
    <span class="sep"></span>${b('Sweep', state.motion === 'sweep', 'motion:sweep')}${b('Pulse', state.motion === 'pulse', 'motion:pulse')}${b('Still', state.motion === 'still', 'motion:still')}
    <span class="sep"></span>${b('Light', state.theme === 'light', 'theme:light')}${b('Dark', state.theme === 'dark', 'theme:dark')}`;
};
document.getElementById('shots').innerHTML = SCREENS.filter((s) => s[4]).map(([id, , , , shot]) => `<img class="shot" data-id="${id}" src="loading-shots/${shot}.png" alt="">`).join('');
document.getElementById('picker').addEventListener('click', (e) => {
  const act = e.target.closest('button')?.dataset.act; if (!act) return;
  const [key, value] = act.split(':');
  state[key] = key === 'loaded' ? value === '1' : value;
  render();
});
const hash = location.hash.slice(1).split(',');
if (hash[0]) state.screen = hash[0];
if (hash.includes('dark')) state.theme = 'dark';
if (hash.includes('still')) state.motion = 'still';
render();
</script>
</body>
</html>
