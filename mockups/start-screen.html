<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start screen redesign mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --m-career: oklch(0.93 0.045 262); --m-career-fg: oklch(0.42 0.17 262); --m-career-solid: oklch(0.48 0.2 262);
  --m-champ: oklch(0.9 0.085 88); --m-champ-fg: oklch(0.42 0.1 75); --m-champ-solid: oklch(0.72 0.14 85);
  --m-quick: oklch(0.89 0.085 150); --m-quick-fg: oklch(0.33 0.1 152); --m-quick-solid: oklch(0.58 0.14 152);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
  --skeleton: oklch(0.925 0.018 255); --skeleton-shine: oklch(0.965 0.01 255);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --m-career: oklch(0.33 0.07 262); --m-career-fg: oklch(0.87 0.09 262); --m-career-solid: oklch(0.58 0.19 262);
  --m-champ: oklch(0.36 0.07 88); --m-champ-fg: oklch(0.89 0.12 92); --m-champ-solid: oklch(0.72 0.13 85);
  --m-quick: oklch(0.35 0.09 150); --m-quick-fg: oklch(0.88 0.13 150); --m-quick-solid: oklch(0.62 0.14 152);
  --skeleton: oklch(0.3 0.016 265); --skeleton-shine: oklch(0.345 0.016 265);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
/* The page behind the mock window, not an app colour. */
:root body { background: oklch(0.9 0.008 255); }
:root[data-theme="dark"] body { background: oklch(0.12 0.01 265); }
button { font: inherit; color: inherit; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.end { margin-left: auto; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: oklch(0.16 0.01 260); color: oklch(0.965 0.007 250); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid oklch(1 0 0 / 25%); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: oklch(0.965 0.007 250); color: oklch(0.16 0.01 260); }
.why { max-width: 1280px; margin: 16px auto 0; padding: 0 24px; font-size: 13.5px; }
.why .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 3px 0; }
.stage { max-width: 1280px; margin: 14px auto 60px; padding: 0 24px; }

/* ---------- The app window ---------- */
.win { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--background); border-radius: 12px; box-shadow: 0 0 0 1px oklch(0 0 0 / .12), 0 18px 50px oklch(0 0 0 / .18); }
.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; font-size: 11px; color: var(--muted-foreground); background: var(--card); border-bottom: 1px solid var(--border); }
.titlebar span:first-child { margin-right: auto; }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.c-career { background: var(--m-career); color: var(--m-career-fg); }
.c-champ { background: var(--m-champ); color: var(--m-champ-fg); }
.c-quick { background: var(--m-quick); color: var(--m-quick-fg); }
.flag { width: 27px; height: 18px; border-radius: 3px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .12); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted-foreground); }
.btn.dim { opacity: .5; }
.btn small.cnt { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
.btn.glass { background: oklch(1 0 0 / 13%); border-color: oklch(1 0 0 / 22%); color: var(--on-scrim); backdrop-filter: blur(6px); }
.well { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.well .i { width: 17px; height: 17px; }
.well.sm { width: 28px; height: 28px; border-radius: 7px; }
.well.sm .i { width: 15px; height: 15px; }
.well.career { background: var(--m-career); color: var(--m-career-fg); }
.well.champ { background: var(--m-champ); color: var(--m-champ-fg); }
.well.quick { background: var(--m-quick); color: var(--m-quick-fg); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
.ph { position: relative; overflow: hidden; background: var(--scrim); }
.ph > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph > .cap { position: relative; z-index: 1; color: var(--on-scrim); }
.shim { display: inline-block; flex: none; vertical-align: middle; background-color: var(--skeleton);
  background-image: linear-gradient(100deg, transparent 0 40%, var(--skeleton-shine) 50%, transparent 60% 100%);
  background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }
.shim.on-photo { background-color: oklch(1 0 0 / 14%); background-image: linear-gradient(100deg, transparent 0 40%, oklch(1 0 0 / 14%) 50%, transparent 60% 100%); }
@keyframes sweep { from { background-position: 100vw 0; } to { background-position: -100vw 0; } }

/* The start screen follows the theme. */
.screen { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column;
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--primary) 9%, var(--background)), var(--background) 55%); }
.screen h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
.foot { display: flex; align-items: center; gap: 8px; }

/* ---------- Today ---------- */
.v0 { padding: 32px 40px 26px; gap: 24px; }
.v0 .tiles { flex: 1; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 18px; min-height: 0; }
.v0 .tile { border-radius: 16px; box-shadow: 0 14px 34px oklch(0 0 0 / .2); border-top: 4px solid; }
.v0 .tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, oklch(0.14 0.012 265 / .25), oklch(0.14 0.012 265 / .55) 35%, oklch(0.14 0.012 265 / .93)); }
.v0 .tile > .cap { height: 100%; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.v0 .tile h2 { margin: 6px 0 0; font-size: 26px; font-weight: 650; }
.v0 .tile p { margin: 0; font-size: 13px; opacity: .82; }
.v0 .cont { background: oklch(1 0 0 / 10%); border: 1px solid oklch(1 0 0 / 16%); border-radius: 10px; padding: 10px 12px; }
.v0 .cont b { display: block; font-size: 14px; }
.v0 .cont small { display: block; font-size: 12px; opacity: .75; }
.career { border-top-color: var(--m-career-solid); }
.champ { border-top-color: var(--m-champ-solid); }
.quick { border-top-color: var(--m-quick-solid); }

/* ---------- A: compact cards ---------- */
.va { padding: 32px 40px; justify-content: center; }
.va .inner { width: 100%; max-width: var(--w); margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.va .cards { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; }
.va .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px oklch(0 0 0 / .07); }
.va .card > .ph { height: 132px; border-top: 3px solid; flex: none; }
.va .card > .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, oklch(0.14 0.012 265 / 0) 30%, oklch(0.14 0.012 265 / .78)); }
.va .card > .ph > .cap { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 10px; }
.va .card h2 { margin: 0; font-size: 20px; font-weight: 650; text-shadow: 0 1px 3px var(--scrim); }
.va .bd { flex: 1; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.va .desc { margin: 0; font-size: 13px; color: var(--muted-foreground); min-height: 38px; }
.cl { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--muted); min-width: 0; }
.cl b { display: block; font-size: 13px; font-weight: 600; }
.cl small { display: block; font-size: 12px; color: var(--muted-foreground); }
.va .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

/* ---------- B: mode rows ---------- */
.vb { padding: 32px 40px; justify-content: center; }
.vb .inner { width: 100%; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.vb .rows { display: flex; flex-direction: column; gap: 12px; }
.vb .mrow { display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; min-height: 118px; box-shadow: 0 6px 18px oklch(0 0 0 / .06); }
.vb .mrow > .ph { border-left: 4px solid; }
.vb .mrow > .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, color-mix(in srgb, var(--card) 35%, transparent)); }
.vb .mid { padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
.vb h2 { margin: 0; font-size: 18px; font-weight: 650; }
.vb .desc { margin: 0; font-size: 13px; color: var(--muted-foreground); }
.vb .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-width: 0; margin-top: 2px; }
.vb .meta .flag { width: 21px; height: 14px; border-radius: 2px; }
.vb .meta b { font-weight: 600; white-space: nowrap; }
.vb .meta span { color: var(--muted-foreground); }
.vb .acts { display: flex; align-items: center; gap: 8px; padding: 0 18px; }

/* ---------- C: photo panel ---------- */
.vc { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.vc .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, oklch(0.14 0.012 265 / .55), oklch(0.14 0.012 265 / .1) 35%, oklch(0.14 0.012 265 / .25) 55%, oklch(0.14 0.012 265 / .92)); }
.vc .hero > .cap { height: 100%; padding: 30px 32px; display: flex; flex-direction: column; gap: 8px; }
.vc .hero h1 { font-size: 28px; text-shadow: 0 1px 3px var(--scrim); }
.vc .last { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.vc .who { font-size: 22px; font-weight: 650; }
.vc .hero small { font-size: 13px; opacity: .82; }
.vc .menu { min-width: 0; padding: 28px 44px 22px; display: flex; flex-direction: column; overflow: auto; }
.vc .list { display: flex; flex-direction: column; margin: auto 0; max-width: 620px; }
.vc .blk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.vc .blk:last-child { border-bottom: 0; }
.vc .blk .well { grid-row: span 4; }
.vc .blk h2 { margin: 0; font-size: 18px; font-weight: 650; line-height: 34px; }
.vc .blk p { margin: 0; font-size: 13px; color: var(--muted-foreground); }
.vc .blk .meta { font-size: 12.5px; display: flex; align-items: center; gap: 8px; margin-top: 4px; min-width: 0; }
.vc .blk .meta .flag { width: 21px; height: 14px; border-radius: 2px; }
.vc .blk .meta b { font-weight: 600; white-space: nowrap; }
.vc .blk .meta span { color: var(--muted-foreground); }
.vc .blk .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="picker" id="picker"></div>
<div class="why" id="why"></div>
<div class="stage" id="stage"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const FLAG = (c) => `${AC}gui/NationFlags/${c}.png`;
const PH = {
  brands: `${AC}tracks/ks_brands_hatch/ui/gp/bgr00.jpg`,
  barca: `${AC}tracks/ks_barcelona/ui/layout_gp/bgr02.jpg`,
  silver: `${AC}tracks/ks_silverstone/ui/national_osrw/bgr01.jpg`,
};

const P = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const I = {
  career: P('<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>'),
  champ: P('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  quick: P('<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>'),
  plus: P('<path d="M12 5v14M5 12h14"/>'),
  play: P('<path d="M7 4v16l13-8z"/>'),
  load: P('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7.5a2 2 0 0 0-1.9 1.4L3 19z"/><path d="M3 19 5.6 11.4A2 2 0 0 1 7.5 10H22l-2.6 7.6a2 2 0 0 1-1.9 1.4H3z"/>'),
  gear: P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  exit: P('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>'),
};

// Each mode as the start screen shows it. `line` is what Continue carries on with.
const MODES = {
  career: {
    title: 'Career', photo: PH.brands, cls: 'c-career',
    desc: 'Start on a rung of the ladder and climb it, season after season, as many championships at once as the calendar allows.',
    mark: 'flag', who: 'Eterry · Season 2028', detail: 'Sat 14 Jun 2028 · next: Brands Hatch GP, Sat 21 Jun', count: 3,
    first: 'New career', go: ['play', 'Continue'], second: 'New', load: true,
  },
  champ: {
    title: 'Championship', photo: PH.barca, cls: 'c-champ',
    desc: 'One championship from the library, raced for one season with the car you pick. No ladder and no money - just the title.',
    mark: 'flag', who: 'GT3 Sprint Series 2027', detail: 'Round 3 of 6 · P4, 52 pts', count: 2,
    first: 'New championship', go: ['play', 'Continue'], second: 'New', load: true,
  },
  quick: {
    title: 'Quick race', photo: PH.silver, cls: 'c-quick',
    desc: 'Set an event up and drive it - a field of any cars, at any track, with whatever sessions you like.',
    mark: 'well', who: '4 races set up', detail: 'Last changed 2 days ago',
    first: 'New race', go: ['quick', 'Open races'], second: 'New race', load: false,
  },
};

const S = { v: 'a', modes: '3', first: 'no', data: 'loaded', theme: 'light', size: 'm' };
Object.assign(S, Object.fromEntries(new URLSearchParams(location.hash.slice(1))));

const sk = (w, h = 12, r = 5, onPhoto = false) => `<span class="shim${onPhoto ? ' on-photo' : ''}" style="width:${w};height:${h}px;border-radius:${r}px"></span>`;
const flag = (c) => `<img class="flag" src="${FLAG(c)}" alt="">`;
const modeList = () => (S.modes === '3' ? ['career', 'champ', 'quick'] : ['career', 'quick']);
const loading = () => S.data === 'loading';
const firstRun = () => S.first === 'yes' && !loading();
const mark = (m, small) => (MODES[m].mark === 'flag' ? flag('GBR')
  : `<span class="well quick${small ? ' sm' : ''}" style="${small ? 'width:21px;height:21px;border-radius:5px' : 'width:27px;height:27px;border-radius:7px'}">${I.quick}</span>`);

// The buttons are the same in every variant: Continue, New and Load for a slot mode, Open races and New race for quick races.
const buttons = (m, { glass = false, size = '' } = {}) => {
  const d = MODES[m];
  if (firstRun()) return `<button class="btn pri ${size}">${I.plus}${d.first}</button>`;
  const sec = `btn ${size}${glass ? ' glass' : ''}`;
  // Continue waits, disabled, until it knows what it continues.
  const go = `<button class="btn pri ${size}${loading() ? ' dim' : ''}">${I[d.go[0]]}${d.go[1]}</button>`;
  const count = loading() ? sk('12px', 10, 3, glass) : `<small class="cnt">${d.count}</small>`;
  return go + `<button class="${sec}">${I.plus}${d.second}</button>`
    + (d.load ? `<button class="${sec}">${I.load}Load ${count}</button>` : '');
};

const foot = () => `<div class="foot">
  <button class="btn lg">${I.gear}Settings</button><button class="btn lg">${I.exit}Exit</button>
  <span class="end status">${loading() ? sk('260px', 11) : '<span class="dot"></span>Assetto Corsa and Content Manager found'}</span>
</div>`;

const HEIGHT = { s: 640, m: 820, l: 1000 };
const win = (inner) => `<div class="win" style="height:${HEIGHT[S.size]}px">
  <div class="titlebar"><span>Another Assetto Corsa Career</span><span>—</span><span>☐</span><span>✕</span></div>${inner}</div>`;

// ---------- Today ----------
const today = () => {
  const tile = (m) => {
    const d = MODES[m];
    let cont = '';
    if (loading()) cont = `<div class="cont"><div class="row">${sk('27px', 18, 3, true)}<div class="grow" style="display:flex;flex-direction:column;gap:6px">${sk('68%', 13, 5, true)}${sk('48%', 10, 5, true)}</div></div></div>`;
    else if (!firstRun()) cont = `<div class="cont"><div class="row">${mark(m)}<div class="grow"><b>${d.who}</b><small>${d.detail}</small></div></div></div>`;
    return `<div class="tile ph ${m}"><img class="bg" src="${d.photo}"><div class="cap">
      <div class="row"><span class="well ${m}">${I[m]}</span><span class="chip ${d.cls}">${d.title}</span></div>
      <h2>${d.title}</h2><p>${d.desc}</p><div class="grow"></div>${cont}
      <div class="row" style="flex-wrap:wrap">${buttons(m, { glass: true, size: 'lg' })}</div></div></div>`;
  };
  return win(`<div class="screen v0" style="--n:${modeList().length}">
    <h1 style="font-size:30px">Another Assetto Corsa Career</h1>
    <div class="tiles">${modeList().map(tile).join('')}</div>${foot()}</div>`);
};

// The continue line on a card's own surface rather than over a photograph.
const plainLine = (m) => {
  if (loading()) return `<div class="cl">${sk('27px', 18, 3)}<div class="grow" style="display:flex;flex-direction:column;gap:6px">${sk('70%', 12)}${sk('50%', 10)}</div></div>`;
  if (firstRun()) return '';
  const d = MODES[m];
  return `<div class="cl">${mark(m)}<div class="grow"><b class="trunc">${d.who}</b><small class="trunc">${d.detail}</small></div></div>`;
};

// ---------- A: compact cards ----------
const variantA = () => {
  const card = (m) => {
    const d = MODES[m];
    return `<div class="card">
      <div class="ph ${m}"><img class="bg" src="${d.photo}"><div class="cap"><span class="well ${m}">${I[m]}</span><h2>${d.title}</h2></div></div>
      <div class="bd"><p class="desc">${d.desc}</p>${plainLine(m)}<div class="acts">${buttons(m)}</div></div>
    </div>`;
  };
  const n = modeList().length;
  return win(`<div class="screen va" style="--n:${n};--w:${n === 3 ? 1140 : 860}px"><div class="inner">
    <h1>Another Assetto Corsa Career</h1>
    <div class="cards">${modeList().map(card).join('')}</div>
    ${foot()}</div></div>`);
};

// One line of what Continue carries on with, for the variants that list modes as rows.
const metaLine = (m) => {
  if (loading()) return `<div class="meta">${sk('21px', 14, 2)}${sk('130px', 12)}${sk('210px', 11)}</div>`;
  if (firstRun()) return '';
  const d = MODES[m];
  return `<div class="meta">${mark(m, true)}<b>${d.who}</b><span class="trunc">${d.detail}</span></div>`;
};

// ---------- B: mode rows ----------
const variantB = () => {
  const row = (m) => {
    const d = MODES[m];
    return `<div class="mrow">
      <div class="ph ${m}"><img class="bg" src="${d.photo}"></div>
      <div class="mid"><div class="row" style="gap:10px"><span class="well sm ${m}">${I[m]}</span><h2>${d.title}</h2></div>
        <p class="desc">${d.desc}</p>${metaLine(m)}</div>
      <div class="acts">${buttons(m)}</div>
    </div>`;
  };
  return win(`<div class="screen vb"><div class="inner">
    <h1>Another Assetto Corsa Career</h1>
    <div class="rows">${modeList().map(row).join('')}</div>
    ${foot()}</div></div>`);
};

// ---------- C: photo panel ----------
const variantC = () => {
  const c = MODES.career;
  let caption = '';
  if (loading()) caption = `<span class="last">Last played</span>${sk('60%', 22, 6, true)}${sk('75%', 12, 5, true)}`;
  else if (!firstRun()) {
    caption = `<span class="last">Last played</span>
      <div class="row" style="gap:10px"><span class="chip c-career">Career</span></div>
      <div class="row" style="gap:10px">${flag('GBR')}<span class="who">${c.who}</span></div>
      <small>${c.detail}</small>`;
  }
  const blk = (m) => {
    const d = MODES[m];
    return `<div class="blk"><span class="well ${m}">${I[m]}</span><h2>${d.title}</h2><p>${d.desc}</p>${metaLine(m)}<div class="acts">${buttons(m)}</div></div>`;
  };
  return win(`<div class="screen vc">
    <div class="hero ph"><img class="bg" src="${c.photo}"><div class="cap"><h1>Another Assetto Corsa Career</h1><div class="grow"></div>${caption}</div></div>
    <div class="menu"><div class="list">${modeList().map(blk).join('')}</div>${foot()}</div>
  </div>`);
};

const VARIANTS = {
  today: ['Today', today, [
    '<b>For comparison.</b> Each tile is a whole-height photograph, so it grows with the window: at 1440 × 920 a tile is about 560 × 740 px for two lines of text and a row of buttons, and the mode\'s name is said twice (chip and heading).',
  ]],
  a: ['A · Compact cards', variantA, [
    '<b>Cards of their own height</b>, centred in the window rather than stretched to fill it. The photograph shrinks to a 132 px band that carries the mode\'s icon and name; everything else sits on the card in the theme\'s own colours.',
    'The continue line is a muted strip on the card instead of a frosted one over the photo, so it reads the same in both themes. The mode name is said once - the well carries its colour, and the duplicate chip is gone.',
    'Two modes centre in 860 px, three in 1140 px. A taller window only adds space around them.',
  ]],
  b: ['B · Mode rows', variantB, [
    '<b>One row per mode</b>, stacked down a 1040 px column like a game\'s main menu: the photograph on the left with the mode\'s stripe, its name, description and continue line in the middle, and its buttons on the right.',
    'The rows are about 120 px each, so a third mode costs one more row rather than narrowing the other two, and the buttons for every mode line up in one column.',
  ]],
  c: ['C · Photo panel', variantC, [
    '<b>One photograph instead of one per mode.</b> The left panel shows the track of whatever was played last, with the app\'s name over it and what Continue would carry on with along its foot. On a first run it is just the photograph and the name.',
    'The right side is the menu on the theme\'s background: each mode as a block with its coloured icon, description, continue line and buttons, then Settings, Exit and the install status at the foot.',
    'The most game-launcher-like of the three, at the cost of the per-mode pictures.',
  ]],
};

const GROUPS = [
  ['v', 'Variant', Object.entries(VARIANTS).map(([k, [label]]) => [k, label])],
  ['modes', 'Modes', [['2', 'Career + Quick race (today)'], ['3', '+ Championship (slice 4)']]],
  ['first', 'Player', [['no', 'Returning'], ['yes', 'First run']]],
  ['data', 'Data', [['loaded', 'Loaded'], ['loading', 'Loading']]],
  ['size', 'Window', [['s', 'Short'], ['m', 'Medium'], ['l', 'Tall']]],
  ['theme', 'Theme', [['light', 'Light'], ['dark', 'Dark']]],
];

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  location.replace(`#${new URLSearchParams(S)}`);
  document.getElementById('picker').innerHTML = GROUPS.map(([k, label, opts]) => `<div class="grp"><strong>${label}</strong>${opts.map(([v, l]) => `<button class="opt" data-k="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`).join('')}</div>`).join('');
  const [, draw, notes] = VARIANTS[S.v] ?? VARIANTS.a;
  const shared = '<b>Unchanged in every variant:</b> the same buttons (Continue, New, Load with its count; Open races, New race; New career / New race alone on a first run), Settings and Exit, the install status, and the screen following the theme. While loading, only the continue lines, Load counts and status shimmer, and Continue waits disabled.';
  document.getElementById('why').innerHTML = `<div class="box"><ul>${notes.map((n) => `<li>${n}</li>`).join('')}</ul><ul style="margin-top:8px;color:var(--muted-foreground)"><li>${shared}</li></ul></div>`;
  document.getElementById('stage').innerHTML = draw();
};

document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  render();
});
render();
</script>
</body>
</html>
