<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Description translations - mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --destructive: oklch(0.577 0.245 27);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118);
  --t2: oklch(0.9 0.085 88); --t2-fg: oklch(0.42 0.1 75);
  --cl-oceanic: oklch(0.93 0.025 232); --cl-oceanic-fg: oklch(0.42 0.05 235);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --popover: oklch(0.23 0.014 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --destructive: oklch(0.704 0.191 22);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112);
  --t2: oklch(0.36 0.07 88); --t2-fg: oklch(0.89 0.12 92);
  --cl-oceanic: oklch(0.33 0.025 232); --cl-oceanic-fg: oklch(0.86 0.04 232);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker .grp[hidden] { display: none; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px 40px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 3px 0; }
.why code, .why pre { font-size: 12.5px; }
.why pre { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--foreground); overflow-x: auto; }
.why h3 { color: var(--foreground); font-size: 14px; margin: 14px 0 4px; }
.newtag { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--primary); text-transform: uppercase; }
.newring { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 4px; border-radius: 8px; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 24px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.shead { padding: 12px 0 0; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }
.shead h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent); }
.btn.icon { width: 28px; padding: 0; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.input { height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: flex; align-items: center; font-size: 13.5px; }
textarea.area { width: 100%; min-height: 112px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--foreground); padding: 7px 10px; font: inherit; font-size: 13.5px; resize: vertical; }
textarea.area.short { min-height: 84px; }
textarea.area:focus { outline: 2px solid color-mix(in oklch, var(--primary) 40%, transparent); outline-offset: 0; }
.placeholder { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; color: var(--muted-foreground); font-size: 12.5px; text-align: center; }
.hint { font-size: 12px; color: var(--muted-foreground); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .lbl, .lblrow > .lbl { font-size: 13.5px; font-weight: 500; }
.lblrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.pane-h { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }

/* A compact Select trigger, as ui/select.tsx draws size="sm". */
.sel { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 12.5px; }
.sel .muted svg { width: 13px; height: 13px; }

/* Dropdown, as ui/dropdown-menu.tsx draws one - pinned open. */
.menuwrap { position: relative; display: inline-flex; }
.menu { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; min-width: 180px; background: var(--popover); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 6px 20px oklch(0 0 0 / .12); }
.menu.right { left: auto; right: 0; }
.menu .mi { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.menu .mi.hl { background: var(--accent); }
.menu .mi.off { color: var(--muted-foreground); }
.menu .ml { padding: 4px 8px 2px; font-size: 11.5px; font-weight: 600; color: var(--muted-foreground); }

.btn.danger:hover { color: var(--destructive); }

/* Language tabs, as ui/tabs.tsx draws its default TabsList - the editor's own tab style, one size down. */
.tabs { display: inline-flex; align-items: center; gap: 0; background: var(--muted); border-radius: 8px; padding: 3px; width: fit-content; }
.tabs button { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 10px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.panel { display: flex; flex-direction: column; gap: 8px; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.lblend { display: inline-flex; align-items: center; gap: 6px; }
.btn.addtr { gap: 2px; padding: 0 7px; color: var(--muted-foreground); }
.btn.addtr:hover { color: var(--foreground); }
.btn.addtr svg.i { width: 14px; height: 14px; }
/* Tooltip, as ui/tooltip.tsx draws one - shown on hover here. */
.tipwrap .tip { display: none; position: absolute; z-index: 30; right: 0; top: calc(100% + 6px); width: max-content;
  background: var(--foreground); color: var(--background); border-radius: 6px; padding: 5px 9px; font-size: 12px; }
.tipwrap:hover .tip { display: block; }

/* ---------- Editor ---------- */
.ed-tabs { display: flex; gap: 2px; border: 1px solid var(--border); background: var(--muted); padding: 3px; border-radius: 10px; width: fit-content; margin-bottom: 16px; }
.ed-tabs span { padding: 5px 12px; font-size: 13px; color: var(--muted-foreground); border-radius: 7px; }
.ed-tabs span.on { background: var(--card); color: var(--foreground); font-weight: 500; box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.details { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.details > div { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.details > div + div { border-left: 1px solid var(--border); }

/* ---------- Library card, as SeasonCard draws one ---------- */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.scard { overflow: hidden; display: flex; flex-direction: column; }
.band { height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--muted); border-bottom: 1px solid var(--border); }
.scard .body { padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.scard .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
.scard p { margin: 0; font-size: 13.5px; color: var(--muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scard .cap { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--primary); }
.scard .none { font-style: italic; opacity: .7; }

@media (max-width: 900px) {
  .details, .cards { grid-template-columns: 1fr; }
  .details > div + div { border-left: 0; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>
<div class="picker" id="picker"></div>
<div class="frame" id="app"></div>
<div class="why" id="why"></div>

<script>
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  langs: '<svg class="i" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>',
  more: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
};

// The app's languages, named in their own language as the settings' Language select names them.
const LANG = { en: 'English', uk: 'Українська' };

const TEXT = {
  series: {
    name: 'ADAC GT Masters',
    en: 'Germany\'s GT3 championship on LFM\'s GT3 cars: two 55-minute races a round at Zandvoort, the Nurburgring, the Sachsenring and the Red Bull Ring.',
    uk: 'Німецький чемпіонат GT3 на машинах GT3 від LFM: дві 55-хвилинні гонки за етап у Зандворті, на Нюрбургринґу, Заксенринґу та Ред Булл Рінґу.',
  },
  historic: {
    name: 'A1-Ring 1997',
    en: 'FIA GT\'s purpose-built GT1 cars in the Styrian hills.',
    uk: 'Спеціально збудовані машини GT1 чемпіонату FIA GT на пагорбах Штирії.',
  },
};

const state = { screen: 'editor', tr: 'en', kind: 'series', app: 'en', doc: 'both', theme: 'light' };

const PICKS = [
  { key: 'screen', label: 'Screen', opts: [['editor', 'Editor - Overview'], ['card', 'Where it is read']] },
  { key: 'tr', label: 'State', when: () => state.screen === 'editor', opts: [['none', 'No translation'], ['adding', 'Add translation open'], ['en', 'English tab'], ['uk', 'Українська tab'], ['future', 'If a third language existed']] },
  { key: 'kind', label: 'Library', when: () => state.screen === 'editor', opts: [['series', 'Championship'], ['historic', 'Historic event']] },
  { key: 'app', label: 'App language', when: () => state.screen === 'card', opts: [['en', 'English'], ['uk', 'Українська']] },
  { key: 'theme', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
];

const chip = (cls, text) => `<span class="chip ${cls}">${text}</span>`;
const nav = (on) => `<div class="app-nav"><span class="brand">Career</span>${['Home', 'Inbox', 'Calendar', 'Championships', 'Race', 'Store', 'Garage', 'Settings']
  .map((n) => `<span class="${n === on ? 'on' : ''}">${n}</span>`).join('')}</div>`;

// Add translation is an icon button - a plus and the languages icon - named by its tooltip.
// It opens a menu of the app's languages with no text yet, and is hidden once there are none.
const addButton = (open, langs = ['Українська']) => `<span class="menuwrap tipwrap">
  <button type="button" class="btn ghost sm addtr" aria-label="Add translation">${I.plus}${I.langs}</button>
  ${open ? `<div class="menu right">${langs.map((l, i) => `<div class="mi ${i ? '' : 'hl'}">${l}</div>`).join('')}</div>`
    : '<span class="tip">Add translation</span>'}
</span>`;

const description = (t) => {
  const tabbed = ['en', 'uk', 'future'].includes(state.tr);
  if (!tabbed) {
    // A plain string has no language, so it carries no tab.
    return `<div class="field newring">
      <div class="lblrow"><span class="lbl">Description</span>${addButton(state.tr === 'adding')}</div>
      <textarea class="area">${t.en}</textarea>
    </div>`;
  }
  const uk = state.tr === 'uk';
  return `<div class="field newring">
    <div class="lblrow">
      <span class="lbl">Description</span>
      <span class="lblend">
        <span class="tabs" role="tablist">
          <button type="button" role="tab" aria-selected="${!uk}">English</button>
          <button type="button" role="tab" aria-selected="${uk}">Українська</button>
        </span>
        ${state.tr === 'future' ? addButton(false, ['Polski']) : ''}
      </span>
    </div>
    <textarea class="area">${uk ? t.uk : t.en}</textarea>
    <div class="foot"><span></span><button type="button" class="btn ghost sm danger">${I.trash}Remove translation</button></div>
  </div>`;
};

const editor = () => {
  const historic = state.kind === 'historic';
  const t = TEXT[state.kind];
  return `${nav('Settings')}
  <div class="shead">
    <span class="back">${I.back}${t.name}</span>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1>${t.name}</h1><span class="btn primary">Save</span></div>
  </div>
  <div class="ed-tabs">${(historic ? ['Overview', 'Teams', 'Classes', 'Event', 'Prizes'] : ['Overview', 'Teams', 'Classes', 'Calendar', 'Formats', 'Points & money'])
    .map((n, i) => `<span class="${i === 0 ? 'on' : ''}">${n}</span>`).join('')}</div>
  <div class="card details">
    <div>
      <span class="pane-h">Identity</span>
      <div class="field"><span class="lbl">Name</span><span class="input">${t.name}</span></div>
      ${description(t)}
    </div>
    <div>
      <span class="pane-h">${historic ? 'Weather' : 'Season'}</span>
      <div class="placeholder" style="min-height:260px;display:grid;place-items:center">${historic ? 'Entry fee, generated weather, Allow rain' : 'Entry fee, season length, race day, generated weather, Allow rain'} - as today</div>
    </div>
  </div>`;
};

/* ---------- Where a description is read ---------- */
const DOCS = [
  ['A plain string', (l) => TEXT.series.en, '"description": "Germany\'s GT3…"'],
  ['English and Ukrainian', (l) => TEXT.series[l], '"description": { "en": "…", "uk": "…" }'],
  ['Ukrainian only', (l) => (l === 'uk' ? TEXT.series.uk : ''), '"description": { "uk": "…" }'],
];

const cards = () => `${nav('Settings')}
  <div class="shead"><h1>${state.app === 'uk' ? 'Бібліотека чемпіонатів' : 'Championship library'}</h1></div>
  <div class="cards">${DOCS.map(([cap, pick, json]) => {
    const text = pick(state.app);
    return `<div class="card scard">
      <div class="band">${chip('c-sports', state.app === 'uk' ? 'Спорткари' : 'Sportscar')}${chip('c-t2', state.app === 'uk' ? 'Рівень 2' : 'Tier 2')}</div>
      <div class="body">
        <span class="cap">${cap}</span>
        <span class="title">ADAC GT Masters</span>
        ${text ? `<p>${text}</p>` : '<p class="none">No description shown</p>'}
        <code class="hint">${json}</code>
      </div>
    </div>`;
  }).join('')}</div>
  <p class="hint" style="margin-top:12px">The captions, the JSON and "No description shown" are mockup annotations, not part of the card.</p>`;

/* ---------- Notes ---------- */
const WHY = {
  editor: () => `<h3>Editor - Overview, Identity pane</h3><ul>
    <li><b>By default it is the one text box it is today</b>, saved as a plain string. A plain string has no language, shows in every language and has no tab.</li>
    <li><b>Add translation is an icon button</b>, a plus and the languages icon, at the right of the label row and named by a tooltip. It opens a menu of the app's languages with no text yet, each named in its own language as the Language setting names them. It is hidden once every language has a text, so with English and Ukrainian today it is gone once both exist. <i>If a third language existed</i> shows where it sits beside the tabs.</li>
    <li><b>Adding the first translation gives the existing text the app's current language</b>, and the menu offers every other language. In a Ukrainian app, adding English makes the existing text the Українська tab.</li>
    <li><b>The language tabs share the label row</b>, between the label and the add button: one tab per language, the original first. A tab only switches which text the box shows.</li>
    <li><b>Remove translation is under the box on every tab</b>, the original's included. Removing a text that leaves only one saves that one as a plain string again, and the tabs go away. A text left empty is dropped on Save. A text written under the wrong language is fixed by adding the right one and removing the wrong one.</li>
    <li>The same for a historic event, whose Overview uses this Identity pane too. Locked while an event of it is under way, like every other field.</li>
    <li>The tabs are neutral on purpose: they choose which text you are editing and are not chips naming a value.</li>
  </ul>`,
  card: () => `<h3>Where it is read</h3><ul>
    <li>Every place that shows a description resolves it for the app's language: the library card and table row, the championship page, the historic event card, <i>About this event</i> and the invitation mail.</li>
    <li><b>The reader's language, then English, then nothing.</b> A plain string always shows. An object with no entry in the app's language and no <code>en</code> shows no description at all, which is why the third card is empty in English.</li>
    <li>An edition a career already entered keeps its own copy of the championship, translations included, so a translation added later reaches only editions entered after it.</li>
  </ul>`,
};

const render = () => {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('picker').innerHTML = PICKS.map((p) => `<div class="grp" ${p.when && !p.when() ? 'hidden' : ''}><strong>${p.label}</strong>${p.opts
    .map(([v, l]) => `<button type="button" class="opt" data-k="${p.key}" data-v="${v}" aria-pressed="${state[p.key] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('app').innerHTML = state.screen === 'editor' ? editor() : cards();
  document.getElementById('why').innerHTML = WHY[state.screen]() + `<h3>Format</h3>
    <pre>// Championship.description, and the same for a historic event
"description": "One text, in whatever language it was written"
"description": { "en": "English text", "uk": "Український текст" }</pre><ul>
    <li><code>LocalizedText = string | Partial&lt;Record&lt;Language, string&gt;&gt;</code> in <code>src/shared/types/</code>, and one resolver in <code>src/shared/utils/</code> that every screen reads it through.</li>
    <li>The file reader accepts a string, or an object whose keys are all app languages (<code>LANGUAGES</code>) and whose values are all strings. Anything else, an unknown code included, is a problem in the file, like any other bad value.</li>
    <li><b>Every shipped championship and historic event gets a Ukrainian translation</b>, written as <code>{ en, uk }</code> in its TypeScript file.</li>
    <li>The name stays a single string.</li>
  </ul>`;
};

document.addEventListener('click', (e) => {
  const opt = e.target.closest('[data-k]');
  if (opt) { state[opt.dataset.k] = opt.dataset.v; render(); }
});
// #tr=uk&theme=dark and the like open the mockup on a given state.
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in state) state[k] = v; });
render();
</script>
</body>
</html>
