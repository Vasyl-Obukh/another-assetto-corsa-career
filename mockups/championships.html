<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Championships mockup</title>
<style>
/* Tokens copied from src/renderer/src/globals.css so every option is drawn in
   the app's real palette - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);

  --provenance-base: oklch(0.93 0.05 155);
  --provenance-base-foreground: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75);
  --provenance-dlc-foreground: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295);
  --provenance-mod-foreground: oklch(0.38 0.13 295);
  --origin-modified: oklch(0.93 0.05 195);
  --origin-modified-foreground: oklch(0.36 0.09 200);
  --origin-custom: oklch(0.93 0.05 340);
  --origin-custom-foreground: oklch(0.38 0.12 340);

  --session-practice: oklch(0.93 0.045 250);
  --session-practice-foreground: oklch(0.4 0.13 258);
  --session-qualify: oklch(0.93 0.05 310);
  --session-qualify-foreground: oklch(0.4 0.15 310);
  --session-race: oklch(0.89 0.085 150);
  --session-race-foreground: oklch(0.33 0.1 152);

  --d-single-seater: oklch(0.925 0.06 212);
  --d-single-seater-fg: oklch(0.36 0.11 215);
  --d-sportscar: oklch(0.925 0.06 112);
  --d-sportscar-fg: oklch(0.36 0.1 118);
  --d-touring: oklch(0.925 0.055 175);
  --d-touring-fg: oklch(0.35 0.09 178);
  --d-road: oklch(0.925 0.06 270);
  --d-road-fg: oklch(0.37 0.12 270);

  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88);    --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255);  --t3-fg: oklch(0.42 0.015 260);
  --t4: oklch(0.89 0.07 52);    --t4-fg: oklch(0.41 0.09 48);
  --t5: oklch(0.875 0.022 250); --t5-fg: oklch(0.36 0.035 255);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; }
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);

  --provenance-base: oklch(0.32 0.06 155);
  --provenance-base-foreground: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70);
  --provenance-dlc-foreground: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295);
  --provenance-mod-foreground: oklch(0.86 0.1 295);
  --origin-modified: oklch(0.32 0.06 195);
  --origin-modified-foreground: oklch(0.86 0.09 200);
  --origin-custom: oklch(0.33 0.07 340);
  --origin-custom-foreground: oklch(0.86 0.1 340);

  --session-practice: oklch(0.32 0.06 250);
  --session-practice-foreground: oklch(0.86 0.09 255);
  --session-qualify: oklch(0.33 0.07 310);
  --session-qualify-foreground: oklch(0.87 0.1 310);
  --session-race: oklch(0.35 0.09 150);
  --session-race-foreground: oklch(0.88 0.13 150);

  --d-single-seater: oklch(0.32 0.07 212); --d-single-seater-fg: oklch(0.86 0.1 212);
  --d-sportscar: oklch(0.32 0.07 112);     --d-sportscar-fg: oklch(0.86 0.1 112);
  --d-touring: oklch(0.32 0.065 175);      --d-touring-fg: oklch(0.86 0.09 175);
  --d-road: oklch(0.32 0.07 270);          --d-road-fg: oklch(0.86 0.1 270);

  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88);   --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --t4: oklch(0.33 0.06 50);   --t4-fg: oklch(0.85 0.09 55);
  --t5: oklch(0.315 0.028 250);--t5-fg: oklch(0.82 0.035 255);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Mockup chrome (not part of the app) ---------- */
.picker {
  position: sticky; top: 0; z-index: 50;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--foreground); color: var(--background);
}
.picker strong { font-weight: 600; margin-right: 8px; }
.picker .opt {
  border: 1px solid color-mix(in oklch, var(--background) 30%, transparent);
  background: transparent; border-radius: 6px; padding: 5px 12px;
}
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .spacer { flex: 1; }
.rationale {
  max-width: 1280px; margin: 20px auto 0; padding: 0 16px;
  color: var(--muted-foreground); font-size: 13.5px; max-width: 80ch;
}
.rationale b { color: var(--foreground); font-weight: 600; }

.window {
  max-width: 1280px; margin: 16px auto 48px;
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  background: var(--background);
  box-shadow: 0 20px 50px -30px oklch(0.2 0.02 260 / 0.35);
}

/* ---------- App header (unchanged from today) ---------- */
.app-header {
  display: flex; align-items: center; gap: 24px;
  padding: 14px 32px; border-bottom: 1px solid var(--border);
}
.app-header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  padding: 5px 10px; border-radius: 6px; text-decoration: none; color: inherit; font-size: 13.5px; font-weight: 500;
}
.nav a.on { background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary); }

.screen { padding: 28px 32px 40px; }
.title-row { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title-row h2 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; }
.title-row p { margin: 2px 0 0; color: var(--muted-foreground); }

/* ---------- Shared chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 500; line-height: 1;
  padding: 4px 8px; border-radius: 6px; white-space: nowrap;
}
.chip.outline { border: 1px solid var(--border); color: var(--muted-foreground); padding: 3px 7px; }
.ladder { display: inline-flex; border-radius: 6px; overflow: hidden; font-size: 12px; font-weight: 500; line-height: 1; }
.ladder span { padding: 4px 8px; }
.d-single-seater { background: var(--d-single-seater); color: var(--d-single-seater-fg); }
.d-sportscar { background: var(--d-sportscar); color: var(--d-sportscar-fg); }
.d-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.d-road { background: var(--d-road); color: var(--d-road-fg); }
.t1 { background: var(--t1); color: var(--t1-fg); }
.t2 { background: var(--t2); color: var(--t2-fg); }
.t3 { background: var(--t3); color: var(--t3-fg); }
.t4 { background: var(--t4); color: var(--t4-fg); }
.t5 { background: var(--t5); color: var(--t5-fg); }
.p-base { background: var(--provenance-base); color: var(--provenance-base-foreground); }
.p-dlc { background: var(--provenance-dlc); color: var(--provenance-dlc-foreground); }
.p-mod { background: var(--provenance-mod); color: var(--provenance-mod-foreground); }
.o-adjusted { background: var(--origin-modified); color: var(--origin-modified-foreground); }
.o-user { background: var(--origin-custom); color: var(--origin-custom-foreground); }
.s-practice { background: var(--session-practice); color: var(--session-practice-foreground); }
.s-qualify { background: var(--session-qualify); color: var(--session-qualify-foreground); }
.s-race { background: var(--session-race); color: var(--session-race-foreground); }

/* Toolbar, shared by every option */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0 18px; }
.search {
  flex: 1 1 260px; max-width: 340px;
  border: 1px solid var(--border); background: var(--card); border-radius: 8px;
  padding: 7px 10px; color: var(--muted-foreground);
}
.facet {
  border: 1px dashed var(--border); background: transparent; border-radius: 8px;
  padding: 6px 10px; font-size: 13px; color: var(--foreground);
}
.facet.sort { border-style: solid; background: var(--card); }
.count { margin-left: auto; color: var(--muted-foreground); font-size: 13px; }

/* ================= Option A: the ladder ================= */
.ladder-board {
  display: grid;
  grid-template-columns: 76px repeat(4, minmax(0, 1fr));
  gap: 0;
  background: var(--card);
  border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden;
}
.lb-head {
  padding: 14px 14px 12px; font-weight: 600; font-size: 15px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.lb-head small { font-weight: 400; color: currentColor; opacity: .75; font-size: 12px; }
.lb-corner { border-bottom: 1px solid var(--border); }
.lb-tier {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 14px 0; gap: 6px;
  border-top: 1px solid var(--border);
}
.lb-tier:nth-child(6) { border-top: 0; }
.medal {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 16px;
}
.lb-tier .lbl { font-size: 11.5px; color: var(--muted-foreground); }
.lb-cell {
  padding: 10px; border-top: 1px solid var(--border); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 6px; min-height: 84px;
}
.lb-cell.empty { background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in oklch, var(--border) 45%, transparent) 8px 9px); }
.lb-cell.first { border-top: 0; }
.rung {
  display: block; text-align: left; width: 100%;
  border: 1px solid var(--border); background: var(--background);
  border-radius: 8px; padding: 8px 10px;
  border-left-width: 3px;
}
.rung:hover { border-color: var(--primary); }
.rung .n { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.rung .m { display: flex; gap: 6px; align-items: center; margin-top: 4px; color: var(--muted-foreground); font-size: 12px; flex-wrap: wrap; }
.rung.single-seater { border-left-color: var(--d-single-seater-fg); }
.rung.sportscar { border-left-color: var(--d-sportscar-fg); }
.rung.touring { border-left-color: var(--d-touring-fg); }
.rung.road { border-left-color: var(--d-road-fg); }
.more { font-size: 12.5px; color: var(--primary); background: none; border: 0; text-align: left; padding: 2px 4px; }

/* ================= Option B: timing board ================= */
.board { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.board-head, .brow {
  display: grid;
  grid-template-columns: 6px minmax(0, 2.4fr) minmax(0, 1.5fr) minmax(0, 1.3fr) 64px minmax(0, 0.9fr);
  gap: 0 18px; align-items: center;
}
.board-head { padding: 10px 18px 10px 0; color: var(--muted-foreground); font-size: 12.5px; border-bottom: 1px solid var(--border); }
.brow { padding: 14px 18px 14px 0; border-top: 1px solid var(--border); }
.brow:first-of-type { border-top: 0; }
.brow:hover { background: color-mix(in oklch, var(--accent) 55%, transparent); }
.stripe { align-self: stretch; margin: -14px 0; display: flex; flex-direction: column; }
.stripe i { flex: 1; }
.stripe .single-seater { background: var(--d-single-seater-fg); }
.stripe .sportscar { background: var(--d-sportscar-fg); }
.stripe .touring { background: var(--d-touring-fg); }
.stripe .road { background: var(--d-road-fg); }
.bname { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bname .n { font-weight: 600; font-size: 14.5px; display: flex; gap: 8px; align-items: center; }
.bname .d { color: var(--muted-foreground); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bclasses { display: flex; gap: 5px; flex-wrap: wrap; }
.fmt { display: flex; gap: 3px; align-items: center; }
.fmt span {
  min-width: 22px; height: 22px; padding: 0 5px; border-radius: 5px; display: grid; place-items: center;
  font-size: 11.5px; font-weight: 600;
}
.fmt .sep { min-width: 6px; background: none; color: var(--muted-foreground); font-weight: 400; }
.brounds { font-size: 22px; font-weight: 600; text-align: right; letter-spacing: -0.02em; }
.brounds small { display: block; font-size: 11px; font-weight: 400; color: var(--muted-foreground); letter-spacing: 0; margin-top: -3px; }
.bsrc { display: flex; gap: 5px; flex-wrap: wrap; }
.group-label {
  padding: 18px 0 8px; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px;
}
.group-label .dot { width: 10px; height: 10px; border-radius: 3px; }

/* ================= Option C: season cards ================= */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.scard {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
  display: flex; flex-direction: column;
}
.scard:hover { border-color: var(--primary); }
.scard .band {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; gap: 10px; font-size: 12.5px; font-weight: 600;
}
.scard .band.split { background: linear-gradient(90deg, var(--a) 0 50%, var(--b) 50% 100%); }
.scard .medals { display: flex; gap: 4px; }
.scard .medals .medal { width: 26px; height: 26px; font-size: 12.5px; box-shadow: 0 0 0 2px var(--card); }
.scard .body { padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.scard .n { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
.scard .d { color: var(--muted-foreground); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scard .cls { display: flex; gap: 5px; flex-wrap: wrap; }
.season { padding: 12px 16px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.season .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted-foreground); }
.ticks { display: flex; gap: 3px; }
.ticks i { flex: 1; height: 6px; border-radius: 3px; background: var(--session-race-foreground); opacity: .55; }
.season .row b { color: var(--foreground); font-weight: 600; }
.scard { position: relative; }
.scard .band .end { display: flex; align-items: center; gap: 6px; }
.kebab {
  width: 26px; height: 26px; border-radius: 6px; border: 0; background: transparent;
  display: grid; place-items: center; color: inherit;
}
.kebab:hover, .kebab[aria-expanded="true"] { background: color-mix(in oklch, currentColor 14%, transparent); }
.kebab svg, .menu svg { width: 15px; height: 15px; }

/* The context menu - shadcn's DropdownMenu, drawn by hand */
.menu {
  position: fixed; z-index: 100; min-width: 184px; padding: 4px;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 12px 32px -12px oklch(0.2 0.02 260 / 0.35);
  display: none;
}
.menu.open { display: block; }
.menu .who { padding: 6px 8px 4px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.menu button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 5px; font-size: 13.5px;
}
.menu button:hover, .menu button:focus-visible { background: var(--accent); outline: none; }
.menu button.danger { color: oklch(0.58 0.22 27); }
:root[data-theme="dark"] .menu button.danger { color: oklch(0.66 0.2 25); }
.menu button.danger:hover { background: color-mix(in oklch, oklch(0.58 0.22 27) 12%, transparent); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px -4px; }
.menu .hint { margin-left: auto; font-size: 11.5px; color: var(--muted-foreground); }

/* ================= Option A2: ladder, detailed rungs ================= */
.ladder-board.detailed { grid-template-columns: 76px repeat(4, minmax(0, 1fr)); }
.rung.rich { padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 7px; }
.rung.rich .n { font-size: 14px; }
.rung.rich .d {
  color: var(--muted-foreground); font-size: 12px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.rung.rich .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.rung.rich .foot .r { font-size: 12px; color: var(--muted-foreground); }
.rung.rich .foot .r b { color: var(--foreground); font-weight: 600; font-size: 13px; }
.rung.rich .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.rung.rich .fmt span { min-width: 18px; height: 18px; font-size: 10.5px; padding: 0 4px; border-radius: 4px; }

@media (max-width: 900px) {
  .ladder-board { grid-template-columns: 56px repeat(4, minmax(160px, 1fr)); overflow-x: auto; }
  .board-head { display: none; }
  .brow { grid-template-columns: 6px 1fr auto; row-gap: 8px; }
  .brow > :nth-child(3), .brow > :nth-child(4), .brow > :nth-child(6) { grid-column: 2 / 4; }
  .screen, .app-header { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 700px) {
  .window { overflow-x: auto; }
}
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>

<div class="picker" role="toolbar" aria-label="Mockup options">
  <strong>Championships</strong>
  <button class="opt" data-opt="a" aria-pressed="true">A - The ladder</button>
  <button class="opt" data-opt="a2" aria-pressed="false">A2 - Ladder, detailed</button>
  <button class="opt" data-opt="b" aria-pressed="false">B - Timing board</button>
  <button class="opt" data-opt="c" aria-pressed="false">C - Season cards</button>
  <span class="spacer"></span>
  <button class="opt" id="theme" aria-pressed="false">Toggle dark</button>
</div>

<p class="rationale" id="why"></p>

<div class="window">
  <header class="app-header">
    <h1>AC Career</h1>
    <nav class="nav">
      <a>Race</a><a>Calendar</a><a class="on">Championships</a><a>Results</a><a>Cars</a><a>Tracks</a><a>Settings</a>
    </nav>
  </header>

  <div class="screen">
    <div class="title-row">
      <div>
        <h2>Championships</h2>
        <p>Every championship your installed content can race.</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="search">Search championships</div>
      <button class="facet sort">Sort: Ladder</button>
      <button class="facet">Discipline</button>
      <button class="facet">Tier</button>
      <button class="facet">Origin</button>
      <button class="facet">Source</button>
      <button class="facet">Pack</button>
      <button class="facet">Maker</button>
      <span class="count num" id="count"></span>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
const DISC = {
  'single-seater': 'Single-seater',
  sportscar: 'Sportscar',
  touring: 'Touring',
  road: 'Road',
};
const TIER_NAME = ['', 'Platinum', 'Gold', 'Silver', 'Bronze', 'Steel'];
const SRC = { base: 'Base game', dlc: 'DLC', mod: 'Mod' };

// Real shipped championships, abridged. fmt: the weekend's sessions in order.
const DATA = [
  { name: 'Formula 1 2024', desc: 'The 2024 world championship on RSS\'s Formula Hybrid cars: three practices, knockout qualifying and a full Grand Prix distance.', entries: [['F1', 'single-seater', 1]], rounds: 22, fmt: 'PPPQQQR', src: [['mod', 'RSS']] },
  { name: 'Formula 1 1988', desc: 'The McLaren year, on VRC\'s turbo-era cars.', entries: [['F1', 'single-seater', 1]], rounds: 16, fmt: 'PPQR', src: [['mod', 'VRC']] },
  { name: 'Formula 2 2024', desc: 'The F1 feeder series on VRC\'s F2 car: a sprint race and a feature race each weekend, the sprint on a reversed top ten.', entries: [['F2', 'single-seater', 2]], rounds: 14, fmt: 'PQRR', src: [['mod', 'VRC']] },
  { name: 'Formula 3 2024', desc: 'The rung below F2, sprint and feature, on the Formula RSS 3.', entries: [['F3', 'single-seater', 3]], rounds: 10, fmt: 'PQRR', src: [['mod', 'RSS']] },
  { name: 'Italian F4 Championship', desc: 'The Italian Formula 4 championship on RSS\'s Formula RSS 4: three races a weekend, one of them on a reversed grid.', entries: [['Formula 4', 'single-seater', 5]], rounds: 7, fmt: 'PQQRRR', src: [['mod', 'RSS']], origin: 'adjusted' },
  { name: 'Formula Abarth', desc: 'The 2010 season of the Italian single-chassis junior formula: two 28-minute races a weekend.', entries: [['Formula Abarth', 'single-seater', 5]], rounds: 7, fmt: 'PQRR', src: [['base', 'Kunos']] },
  { name: 'IMSA SportsCar Championship 2025', desc: 'America\'s sports car championship of 2025 on LFM\'s GTP cars and GT3s and the Oreca 07.', entries: [['GTP', 'sportscar', 1], ['LMP2', 'sportscar', 2], ['GTD Pro', 'sportscar', 3]], rounds: 11, fmt: 'PQR', src: [['mod', 'LFM'], ['mod', 'RSS']] },
  { name: 'European Le Mans Series 2025', desc: 'Europe\'s endurance series of 2025 on the Oreca 07 in LMP2 and LMP2 Pro/Am, and LFM\'s GT3s.', entries: [['LMP2', 'sportscar', 2], ['LMP2 Pro/Am', 'sportscar', 2], ['LMGT3', 'sportscar', 3]], rounds: 6, fmt: 'PQR', src: [['mod', 'LFM']] },
  { name: 'GT3 Sprint Series', desc: 'Hour-long sprint races for 2010s GT3 machinery, the Blancpain Sprint way: a qualifying race sets the main race grid.', entries: [['GT3', 'sportscar', 3]], rounds: 10, fmt: 'PQRR', src: [['base', 'Kunos'], ['dlc', 'Dream Pack 3']] },
  { name: 'DTM 2021', desc: 'The DTM\'s first GT3 season on RSS\'s GT-M cars: two qualifyings and two races a weekend.', entries: [['DTM', 'touring', 2]], rounds: 8, fmt: 'PQRQR', src: [['mod', 'RSS']] },
  { name: 'British Touring Car Championship 1998', desc: 'The BTCC of 1998 on VRC\'s Super Tourers: a sprint and a feature race, each with its own qualifying.', entries: [['BTCC', 'touring', 3]], rounds: 13, fmt: 'PQQRR', src: [['mod', 'VRC']] },
  { name: 'Mazda MX-5 Cup 2024', desc: 'America\'s one-make MX-5 series in 2024: double headers of forty-five-minute races at five of its seven IMSA circuits.', entries: [['MX-5 Cup', 'touring', 4]], rounds: 5, fmt: 'PQRR', src: [['dlc', 'Japanese Pack']] },
  { name: 'Lotus Cup', desc: 'Lotus Cup Europe\'s three classes on one grid, scored separately: V6, Open and Production.', entries: [['V6', 'road', 4], ['Open', 'road', 4], ['Production', 'road', 5]], rounds: 6, fmt: 'PQRR', src: [['base', 'Kunos']] },
  { name: 'GT86 Cup', desc: 'A one-make cup for the Toyota GT86, in the shape of the car\'s real 86 series.', entries: [['Cup', 'road', 5]], rounds: 6, fmt: 'PQRR', src: [['dlc', 'Japanese Pack']] },
  { name: 'Hot Hatch Trophy', desc: 'The base game\'s hot hatches balanced into one grid for short club weekends.', entries: [['Hot Hatch', 'road', 5]], rounds: 8, fmt: 'PQRR', src: [['base', 'Kunos']] },
  { name: 'Sunday Club Cup', desc: 'Three club rounds on the Nordschleife tourist layout, two races each.', entries: [['Club', 'road', 5]], rounds: 3, fmt: 'QRR', src: [['base', 'Kunos']], origin: 'user' },
];

const SESS = { P: ['practice', 'P'], Q: ['qualify', 'Q'], R: ['race', 'R'] };

const ladderChip = ([, d, t]) => `<span class="ladder"><span class="d-${d}">${DISC[d]}</span><span class="t${Math.min(t, 5)}">Tier ${t}</span></span>`;
const originChip = (o) => (o === 'adjusted' ? '<span class="chip o-adjusted">Modified</span>' : o === 'user' ? '<span class="chip o-user">Custom</span>' : '');
const srcChips = (s) => s.map(([k, n]) => `<span class="chip p-${k}" title="${SRC[k]}">${n}</span>`).join('');
const fmtStrip = (f) => `<span class="fmt" title="Weekend format">${[...f].map((c) => `<span class="s-${SESS[c][0]}">${SESS[c][1]}</span>`).join('')}</span>`;
const medal = (t) => `<span class="medal t${Math.min(t, 5)}" title="Tier ${t} - ${TIER_NAME[Math.min(t, 5)]}">${t}</span>`;

// ---------- A ----------
const renderA = () => {
  const discs = Object.keys(DISC);
  let html = '<div class="ladder-board"><div class="lb-corner"></div>';
  discs.forEach((d) => {
    const n = DATA.filter((c) => c.entries.some((e) => e[1] === d)).length;
    html += `<div class="lb-head d-${d}">${DISC[d]}<small class="num">${n} championships</small></div>`;
  });
  for (let t = 1; t <= 5; t += 1) {
    html += `<div class="lb-tier">${medal(t)}<span class="lbl">${TIER_NAME[t]}</span></div>`;
    discs.forEach((d) => {
      const here = [];
      DATA.forEach((c) => c.entries.filter((e) => e[1] === d && e[2] === t).forEach((e) => here.push([c, e])));
      html += `<div class="lb-cell ${here.length ? '' : 'empty'} ${t === 1 ? '' : ''}">`;
      here.slice(0, 3).forEach(([c, e]) => {
        const cls = c.entries.length > 1 ? `<span>${e[0]} class</span>` : '';
        html += `<button class="rung ${d}"><div class="n">${c.name}</div><div class="m"><span class="num">${c.rounds} rounds</span>${cls}${originChip(c.origin)}</div></button>`;
      });
      if (here.length > 3) html += `<button class="more">${here.length - 3} more</button>`;
      if (d === 'single-seater' && t === 1) html += '<button class="more">24 more Formula 1 seasons</button>';
      html += '</div>';
    });
  }
  return `${html}</div>`;
};

// ---------- A2 ----------
// Same board, richer rungs: description, weekend format, content and which
// class of a multi-class grid this rung is.
const renderA2 = () => {
  const discs = Object.keys(DISC);
  let html = '<div class="ladder-board detailed"><div class="lb-corner"></div>';
  discs.forEach((d) => {
    const n = DATA.filter((c) => c.entries.some((e) => e[1] === d)).length;
    html += `<div class="lb-head d-${d}">${DISC[d]}<small class="num">${n} championships</small></div>`;
  });
  for (let t = 1; t <= 5; t += 1) {
    html += `<div class="lb-tier">${medal(t)}<span class="lbl">${TIER_NAME[t]}</span></div>`;
    discs.forEach((d) => {
      const here = [];
      DATA.forEach((c) => c.entries.filter((e) => e[1] === d && e[2] === t).forEach((e) => here.push([c, e])));
      html += `<div class="lb-cell ${here.length ? '' : 'empty'}">`;
      here.slice(0, 3).forEach(([c, e]) => {
        // Every class on the grid, in the order the championship lists them.
        // This rung's wears its tier metal; the rest are outlined on purpose -
        // they are context for this slot, and their own rungs colour them.
        const cls = c.entries.length > 1
          ? `<div class="tags">${c.entries.map((x) => (x === e
            ? `<span class="chip t${Math.min(x[2], 5)}" title="This slot enters you in ${x[0]}">${x[0]}</span>`
            : `<span class="chip outline" title="Also on the grid, at Tier ${x[2]}">${x[0]}</span>`)).join('')}</div>`
          : '';
        html += `
          <button class="rung rich ${d}">
            <div class="n">${c.name}</div>
            ${cls}
            <div class="tags">${originChip(c.origin)}${srcChips(c.src)}</div>
            <div class="foot"><span class="r"><b class="num">${c.rounds}</b> rounds</span>${fmtStrip(c.fmt)}</div>
          </button>`;
      });
      if (here.length > 3) html += `<button class="more">${here.length - 3} more</button>`;
      if (d === 'single-seater' && t === 1) html += '<button class="more">24 more Formula 1 seasons</button>';
      html += '</div>';
    });
  }
  return `${html}</div>`;
};

// ---------- B ----------
const renderB = () => {
  const head = '<div class="board-head"><span></span><span>Championship</span><span>Classes</span><span>Weekend</span><span style="text-align:right">Rounds</span><span>Content</span></div>';
  const rows = DATA.map((c) => `
    <div class="brow">
      <span class="stripe">${c.entries.map((e) => `<i class="${e[1]}"></i>`).join('')}</span>
      <div class="bname"><span class="n">${c.name}${originChip(c.origin)}</span><span class="d">${c.desc}</span></div>
      <div class="bclasses">${c.entries.map(ladderChip).join('')}</div>
      <div>${fmtStrip(c.fmt)}</div>
      <div class="brounds num">${c.rounds}<small>rounds</small></div>
      <div class="bsrc">${srcChips(c.src)}</div>
    </div>`).join('');
  return `<div class="board">${head}${rows}</div>`;
};

// ---------- C ----------
const renderC = () => `<div class="cards">${DATA.map((c, i) => {
  const discs = [...new Set(c.entries.map((e) => e[1]))];
  const tiers = [...new Set(c.entries.map((e) => e[2]))].sort();
  const band = discs.length > 1
    ? `band split" style="--a:var(--d-${discs[0]});--b:var(--d-${discs[1]})`
    : `band d-${discs[0]}`;
  const classes = c.entries.length > 1
    ? `<div class="cls">${c.entries.map((e) => `<span class="chip t${Math.min(e[2], 5)}">${e[0]}</span>`).join('')}</div>`
    : '';
  return `
    <article class="scard" tabindex="0" data-i="${i}">
      <div class="${band}"><span>${discs.map((d) => DISC[d]).join(' and ')}</span>
        <span class="end"><span class="medals">${tiers.map(medal).join('')}</span>
        <button class="kebab" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${c.name}">${ICON.more}</button></span></div>
      <div class="body">
        <div class="n">${c.name}</div>
        <div class="d">${c.desc}</div>
        ${classes}
        <div class="cls">${originChip(c.origin)}${srcChips(c.src)}</div>
      </div>
      <div class="season">
        <div class="row"><span><b class="num">${c.rounds}</b> rounds</span>${fmtStrip(c.fmt)}</div>
        <div class="ticks">${'<i></i>'.repeat(c.rounds)}</div>
      </div>
    </article>`;
}).join('')}</div>`;

// ---------- Context menu (option C) ----------
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  more: svg('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'),
  open: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
  edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  copy: svg('<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),
  export: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>'),
  off: svg('<path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/><path d="M12 2v10"/>'),
  revert: svg('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
  trash: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'),
};

// The settings tab's menu as ChampionshipMenu has it today - Edit, Duplicate,
// Export, then Revert for a modified one and Delete for a custom one - with
// Open and the on/off switch added, since a right-click is where both are
// looked for first.
const menuFor = (c) => {
  let html = `<div class="who">${c.name}</div>`;
  html += `<button role="menuitem">${ICON.open}Open</button>`;
  html += `<button role="menuitem">${ICON.edit}Edit</button>`;
  html += `<button role="menuitem">${ICON.copy}Duplicate</button>`;
  html += `<button role="menuitem">${ICON.export}Export</button>`;
  html += '<hr>';
  html += `<button role="menuitem">${ICON.off}Switch off<span class="hint">Hides it from Championships</span></button>`;
  if (c.origin === 'adjusted') html += `<hr><button role="menuitem" class="danger">${ICON.revert}Revert</button>`;
  if (c.origin === 'user') html += `<hr><button role="menuitem" class="danger">${ICON.trash}Delete</button>`;
  return html;
};

const menu = document.createElement('div');
menu.className = 'menu';
menu.setAttribute('role', 'menu');
document.body.append(menu);
let opener = null;

const closeMenu = () => {
  menu.classList.remove('open');
  opener?.setAttribute('aria-expanded', 'false');
  opener = null;
};
const openMenu = (card, x, y, button) => {
  closeMenu();
  menu.innerHTML = menuFor(DATA[Number(card.dataset.i)]);
  menu.classList.add('open');
  const r = menu.getBoundingClientRect();
  menu.style.left = `${Math.min(x, innerWidth - r.width - 8)}px`;
  menu.style.top = `${Math.min(y, innerHeight - r.height - 8)}px`;
  if (button) { opener = button; button.setAttribute('aria-expanded', 'true'); }
  menu.querySelector('button').focus();
};

document.addEventListener('click', (ev) => {
  const kebab = ev.target.closest('.kebab');
  if (kebab) {
    const b = kebab.getBoundingClientRect();
    if (opener === kebab) { closeMenu(); return; }
    openMenu(kebab.closest('.scard'), b.right - 184, b.bottom + 4, kebab);
    return;
  }
  if (!menu.contains(ev.target)) closeMenu();
  else if (ev.target.closest('button')) closeMenu();
});
document.addEventListener('contextmenu', (ev) => {
  const card = ev.target.closest('.scard');
  if (!card) return;
  ev.preventDefault();
  openMenu(card, ev.clientX, ev.clientY);
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeMenu();
  if (!menu.classList.contains('open')) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    const items = [...menu.querySelectorAll('button')];
    const at = items.indexOf(document.activeElement);
    items[(at + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
  }
});
addEventListener('scroll', closeMenu, true);

const WHY = {
  a: '<b>The ladder.</b> The page is the career ladder itself: four disciplines across, five tiers down, each rung a metal. A championship sits where it enters you, so a multi-class one like IMSA appears on every rung it offers. Answers "what can I race next from here" at a glance. Crowded rungs (Formula 1 has 26 seasons at Tier 1) collapse behind a count. Search and filters still narrow the board.',
  a2: '<b>The ladder, detailed.</b> The same board with fuller rungs: the content it needs, the weekend format strip and, for a multi-class grid, every class on it with the one this rung enters you in filled in its tier metal. Rungs grow to about twice the height, so a busy tier scrolls further - the fold after three stays.',
  b: '<b>Timing board.</b> A dense, sortable table that scans like a timing screen. A coloured stripe on the left carries the discipline (split for mixed grids); the weekend format is a strip of practice, qualifying and race blocks, so a sprint-and-feature weekend reads differently from a Grand Prix without reading a word. Fits about twice as many championships per screen as today.',
  c: '<b>Season cards.</b> A grid of cards, each headed by a band in its discipline\'s colour with tier medals in the corner. The foot of every card is the season: a tick per round and the weekend format, so length and shape are visible before opening it. The menu opens from the ⋮ in the band or by right-clicking anywhere on a card; Italian F4 (Modified) offers Revert and Sunday Club Cup (Custom) offers Delete.',
};

const render = (opt) => {
  closeMenu();
  document.getElementById('view').innerHTML = {
    a: renderA, a2: renderA2, b: renderB, c: renderC,
  }[opt]();
  document.getElementById('why').innerHTML = WHY[opt];
  document.getElementById('count').textContent = `${DATA.length} of ${DATA.length}`;
  document.querySelectorAll('.opt[data-opt]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.opt === opt)));
};
document.querySelectorAll('.opt[data-opt]').forEach((b) => b.addEventListener('click', () => render(b.dataset.opt)));

const root = document.documentElement;
if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
const themeBtn = document.getElementById('theme');
const syncTheme = () => { themeBtn.textContent = root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; };
themeBtn.addEventListener('click', () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; syncTheme(); });
syncTheme();
render('a');
</script>
</body>
</html>
