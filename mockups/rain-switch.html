<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rain switch - mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour.
   The rain chips spend no hue: Rain allowed wears --weather-wet and Rain not allowed --weather-dry,
   the weather picker's own kinds, so a rain chip and a weather chip agree. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --s-practice: oklch(0.93 0.045 250); --s-practice-fg: oklch(0.4 0.13 258);
  --s-qualify: oklch(0.93 0.05 310); --s-qualify-fg: oklch(0.4 0.15 310);
  --s-race: oklch(0.89 0.085 150); --s-race-fg: oklch(0.33 0.1 152);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118);
  --t2: oklch(0.9 0.085 88); --t2-fg: oklch(0.42 0.1 75);
  --cl-oceanic: oklch(0.93 0.025 232); --cl-oceanic-fg: oklch(0.42 0.05 235);
  --cl-temperate: oklch(0.93 0.03 150); --cl-temperate-fg: oklch(0.4 0.05 150);
  --weather-dry: oklch(0.92 0.07 88); --weather-dry-fg: oklch(0.42 0.1 75);
  --weather-wet: oklch(0.86 0.06 240); --weather-wet-fg: oklch(0.36 0.1 250);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --popover: oklch(0.23 0.014 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112);
  --t2: oklch(0.36 0.07 88); --t2-fg: oklch(0.89 0.12 92);
  --cl-oceanic: oklch(0.33 0.025 232); --cl-oceanic-fg: oklch(0.86 0.04 232);
  --cl-temperate: oklch(0.33 0.03 150); --cl-temperate-fg: oklch(0.86 0.05 150);
  --weather-dry: oklch(0.38 0.07 88); --weather-dry-fg: oklch(0.9 0.1 92);
  --weather-wet: oklch(0.36 0.07 245); --weather-wet-fg: oklch(0.88 0.07 240);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.lg { width: 20px; height: 20px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker .grp[hidden] { display: none; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 3px 0; }
.why code { font-size: 12.5px; }
.why h3 { color: var(--foreground); font-size: 14px; margin: 14px 0 4px; }
.newtag { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--primary); text-transform: uppercase; }
.newring { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 4px; border-radius: 8px; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 24px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.shead { padding: 12px 0 0; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }
.shead h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
.shead .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted-foreground); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs span { padding: 8px 12px; font-size: 13.5px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs span.on { color: var(--foreground); font-weight: 600; border-color: var(--primary); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip.outline { border: 1px solid var(--border); }
.chip svg.i { width: 13px; height: 13px; }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-oceanic { background: var(--cl-oceanic); color: var(--cl-oceanic-fg); }
.c-wet { background: var(--weather-wet); color: var(--weather-wet-fg); }
.c-dry { background: var(--weather-dry); color: var(--weather-dry-fg); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.input { height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: flex; align-items: center; font-size: 13.5px; }
.input.area { height: 112px; align-items: flex-start; padding-top: 7px; color: var(--muted-foreground); }
.select { justify-content: space-between; gap: 8px; }
.placeholder { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; color: var(--muted-foreground); font-size: 12.5px; text-align: center; }
.hint { font-size: 12px; color: var(--muted-foreground); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .lbl { font-size: 13.5px; font-weight: 500; }
.pane-h { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }

/* Switch, as ui/switch.tsx draws one. */
.switch { width: 32px; height: 18px; border-radius: 99px; background: var(--border); position: relative; flex: none; border: 0; padding: 0; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); transition: left .12s; box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { left: 16px; }
.switchline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.switchline > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.switchline label { font-size: 13.5px; font-weight: 500; }

/* ChoiceChips, as the editor draws them. */
.choices { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; width: fit-content; }
.choices button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; }
.choices button:not(:disabled):not([aria-checked="true"]):hover { background: var(--accent); color: var(--foreground); }
.choices button[aria-checked="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / .08), 0 0 0 1px var(--border); }
.choices button[aria-checked="true"].c-oceanic { background: var(--cl-oceanic); color: var(--cl-oceanic-fg); box-shadow: none; }
.choices button[aria-checked="true"].c-wet { background: var(--weather-wet); color: var(--weather-wet-fg); box-shadow: none; }
.choices button[aria-checked="true"].c-dry { background: var(--weather-dry); color: var(--weather-dry-fg); box-shadow: none; }
.choices.full { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.choices.full button { justify-content: center; }

/* ---------- Side cards, as RoundStrength / SeasonStrength draw them ---------- */
.side { display: flex; flex-direction: column; gap: 16px; }
.scard { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.scard-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; }
.scard-h .t { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; }
.lead { display: flex; flex-direction: column; gap: 1px; }
.lead b { font-size: 13.5px; font-weight: 500; }
.lead small { font-size: 12px; color: var(--muted-foreground); }
.note { font-size: 12px; color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 10px; }
.note a { color: var(--primary); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; }
.note a svg { width: 13px; height: 13px; }
.own-h { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.own { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--border); padding-top: 10px; }
.own a { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13.5px; color: inherit; text-decoration: none; }
.own a:hover { background: var(--accent); }
.own a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Page layouts ---------- */
.rlayout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.clayout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.ses-card { padding: 0; overflow: hidden; }
.ses-card .scard-h { padding: 12px 12px 6px; }
.ses { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
.ses.cur { background: var(--accent); }
.ses .nm { display: flex; flex-direction: column; min-width: 0; }
.ses .nm b { font-size: 13.5px; font-weight: 500; }
.ses .nm small { font-size: 12px; color: var(--muted-foreground); }
.ses .end { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); }
.sdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; }
.sdot.done { background: var(--success); border-color: var(--success); color: var(--card); }
.sdot.done svg { width: 10px; height: 10px; stroke-width: 3; }
.sdot.next { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 8px var(--primary); }
.wx { display: inline-flex; align-items: center; gap: 2px; }
.wx .arr { width: 11px; height: 11px; opacity: .7; }
.brief { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 84px; }
.tile .lab { font-size: 12px; color: var(--muted-foreground); }
.tile .val { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tile small { font-size: 12px; color: var(--muted-foreground); }
.tile .swap { display: inline-flex; align-items: center; gap: 4px; }
.main-card { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.main-card h2 { margin: 0; font-size: 18px; font-weight: 600; }

/* Tooltip, as ui/tooltip.tsx draws one - pinned open here so the copy is readable. */
.tipwrap { position: relative; display: inline-flex; }
.tip { position: absolute; z-index: 30; left: 0; top: calc(100% + 8px); width: max-content; max-width: 260px;
  background: var(--foreground); color: var(--background); border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 400; line-height: 1.4; }
.tip::after { content: ''; position: absolute; left: 14px; bottom: 100%; border: 5px solid transparent; border-bottom-color: var(--foreground); }

/* ---------- Editor ---------- */
.ed-tabs { display: flex; gap: 2px; border: 1px solid var(--border); background: var(--muted); padding: 3px; border-radius: 10px; width: fit-content; margin-bottom: 16px; }
.ed-tabs span { padding: 5px 12px; font-size: 13px; color: var(--muted-foreground); border-radius: 7px; }
.ed-tabs span.on { background: var(--card); color: var(--foreground); font-weight: 500; box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.details { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.details > div { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.details > div + div { border-left: 1px solid var(--border); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

@media (max-width: 900px) {
  .rlayout, .clayout, .details, .two { grid-template-columns: 1fr; }
  .details > div + div { border-left: 0; border-top: 1px solid var(--border); }
  .brief { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="picker" id="picker"></div>
<div class="frame" id="app"></div>
<div class="why" id="why" style="padding-bottom: 40px"></div>

<script>
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  lock: '<svg class="i" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  reset: '<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
  rain: '<svg class="i" viewBox="0 0 24 24"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>',
  cloud: '<svg class="i" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
  sunCloud: '<svg class="i" viewBox="0 0 24 24"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
  arrow: '<svg class="i arr" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
};

const state = { screen: 'round', theme: 'light', editor: 'on', kind: 'series', champ: 'follow', round: 'follow' };

const PICKS = [
  { key: 'screen', label: 'Screen', opts: [['editor', 'Editor - Overview'], ['champ', 'Championship page'], ['round', 'Round page']] },
  { key: 'kind', label: 'Library', when: () => state.screen === 'editor', opts: [['series', 'Championship'], ['historic', 'Historic event']] },
  { key: 'editor', label: 'Allow rain', when: () => state.screen === 'editor', opts: [['on', 'On'], ['off', 'Off']] },
  { key: 'champ', label: 'Season', when: () => state.screen === 'champ', opts: [['follow', 'Follows the championship'], ['off', 'Not allowed this season'], ['mixed', 'Not allowed, one round allows it']] },
  { key: 'round', label: 'Round', when: () => state.screen === 'round', opts: [['follow', 'Follows the season'], ['off', 'Not allowed this round'], ['raced', 'Part-way, locked']] },
  { key: 'theme', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
];

const chip = (cls, text, icon = '') => `<span class="chip ${cls}">${icon}${text}</span>`;
const nav = (on) => `<div class="app-nav"><span class="brand">Career</span>${['Home', 'Inbox', 'Calendar', 'Championships', 'Race', 'Store', 'Garage', 'Settings']
  .map((n) => `<span class="${n === on ? 'on' : ''}">${n}</span>`).join('')}</div>`;

// Whether rain is allowed: a switch, since it is a permission rather than a
// choice of weather - the forecast still decides whether it actually rains.
const allowRain = (id, on) => `<div class="switchline">
  <div><label for="${id}">Allow rain</label></div>
  <button type="button" role="switch" id="${id}" class="switch" aria-checked="${on}"></button>
</div>`;
const allowedChip = (on) => (on ? chip('c-wet', 'Rain allowed', I.rain) : chip('c-dry', 'Rain not allowed', I.sun));
const resetBtn = `<button type="button" class="btn ghost sm" style="margin:-4px 0;height:26px">${I.reset}Reset</button>`;

/* ================= Editor ================= */
const editor = () => {
  const historic = state.kind === 'historic';
  const on = state.editor === 'on';
  const sw = `<div class="switchline newring">
    <div><label for="rain">Allow rain <span class="newtag">new</span></label>
    <span class="hint">${on ? 'Turn off if a car you race here cannot handle a wet track' : 'Every session runs dry, whatever the weather would have been'}</span></div>
    <button type="button" role="switch" id="rain" class="switch" aria-checked="${on}" data-toggle="editor"></button>
  </div>`;
  const generated = `<div class="switchline"><div><label>Generated weather</label><span class="hint">Drawn from a climate; a round or a session may still set its own</span></div><button type="button" role="switch" class="switch" aria-checked="true"></button></div>
    <div class="field"><span class="lbl">Climate</span><div class="choices">${['Arid', 'Mediterranean', 'Temperate', 'Oceanic'].map((c) => `<button type="button" role="radio" class="c-oceanic" aria-checked="${c === 'Oceanic'}">${c}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Hemisphere</span><div class="choices"><button type="button" role="radio" aria-checked="true">North</button><button type="button" role="radio" aria-checked="false">South</button></div></div>`;

  return `${nav('Settings')}
  <div class="shead">
    <span class="back">${I.back}${historic ? 'Historic event' : 'GT World Challenge Europe'}</span>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1>${historic ? 'Spa 24 Hours 1993' : 'GT World Challenge Europe'}</h1><span class="btn primary">Save</span></div>
  </div>
  <div class="ed-tabs">${(historic ? ['Overview', 'Teams', 'Classes', 'Event', 'Prizes'] : ['Overview', 'Teams', 'Classes', 'Calendar', 'Formats', 'Points & money'])
    .map((t, i) => `<span class="${i === 0 ? 'on' : ''}">${t}</span>`).join('')}</div>
  <div class="card details">
    <div>
      <span class="pane-h">Identity</span>
      <div class="field"><span class="lbl">Name</span><span class="input">${historic ? 'Spa 24 Hours 1993' : 'GT World Challenge Europe'}</span></div>
      <div class="field"><span class="lbl">Description</span><span class="input area">${historic ? 'The year the Porsche 911 RSR...' : 'Europe\'s GT3 championship, sprint and endurance...'}</span></div>
    </div>
    <div>
      <span class="pane-h">${historic ? 'Weather' : 'Season'}</span>
      ${historic
        ? `<div class="field"><span class="lbl">Entry fee</span><span class="input" style="justify-content:flex-end">€ 18,000</span><span class="hint">What entering costs without an invitation</span></div>`
        : `<div class="two">
            <div class="field"><span class="lbl">Entry fee</span><span class="input" style="justify-content:flex-end">€ 12,000</span><span class="hint">Per round, unless a round says otherwise. Zero is free to enter.</span></div>
            <div class="field"><span class="lbl">Season length</span><span class="input select">A year <span class="muted">${I.chev}</span></span><span class="hint">How much of a career's year it fills</span></div>
            <div class="field"><span class="lbl">Race day</span><span class="input select">By tier <span class="muted">${I.chev}</span></span><span class="hint">By tier, the top tier races on Sunday...</span></div>
          </div>`}
      ${generated}
      ${sw}
    </div>
  </div>`;
};

/* ================= Championship page ================= */
const champ = () => {
  const season = state.champ === 'follow' ? null : false;
  const on = season ?? true;
  const own = state.champ === 'mixed' ? [['Round 3 - Monza', true]] : [];
  if (state.champ === 'off') own.push(['Round 5 - Spa 24 Hours', false]);
  // A round set on its own is listed only where it differs from the season.
  const listed = own.filter(([, r]) => r !== on);

  const rainCard = `<section class="card scard newring">
    <div class="scard-h"><span class="t">Wet weather <span class="newtag">new</span></span>${season === null ? '' : resetBtn}</div>
    ${allowRain('season-rain', on)}
    ${season === null ? '<span class="hint">As the championship sets it</span>' : ''}
    ${listed.length ? `<div class="own"><span class="own-h">Rounds set on their own</span>${listed.map(([n, r]) => `<a href="#"><span>${n}</span>${allowedChip(r)}</a>`).join('')}</div>` : ''}
  </section>`;

  return `${nav('Championships')}
  <div class="shead">
    <span class="back">${I.back}Championships</span>
    <h1>GT World Challenge Europe</h1>
    <div class="sub">${chip('c-sports', 'Sportscar')}${chip('c-t2', 'Tier 2')}<span>2027 · 10 rounds</span></div>
    <div class="tabs"><span class="on">Rounds</span><span>Standings</span><span>Classes</span><span>Points, prizes and rules</span></div>
  </div>
  <div class="clayout">
    <div class="placeholder" style="min-height:420px;display:grid;place-items:center">Rounds tab - as today. Each round's weather icons show what it races in, so a season with no rain shows no rain icons.</div>
    <aside class="side">
      <div class="placeholder">Next round - as today</div>
      <div class="placeholder">Your entry and contract - as today</div>
      <div class="placeholder">AI strength - as today (SeasonStrength)</div>
      ${rainCard}
    </aside>
  </div>`;
};

/* ================= Round page ================= */
const ROUND = {
  wet: [
    { n: 'Practice', when: 'Day 1 · 10:00 · 60 min', icons: [I.rain], words: 'Light rain', t: 14 },
    { n: 'Qualifying', when: 'Day 2 · 14:00 · 15 min', icons: [I.sunCloud], words: 'Scattered clouds', t: 17 },
    { n: 'Race', when: 'Day 3 · 13:00 · 26 laps', icons: [I.rain, I.rain], words: 'Rain, then heavy rain', t: 15 },
  ],
  dry: [
    { n: 'Practice', when: 'Day 1 · 10:00 · 60 min', icons: [I.cloud], words: 'Overcast', t: 14, was: 'Light rain' },
    { n: 'Qualifying', when: 'Day 2 · 14:00 · 15 min', icons: [I.sunCloud], words: 'Scattered clouds', t: 17 },
    { n: 'Race', when: 'Day 3 · 13:00 · 26 laps', icons: [I.cloud], words: 'Overcast', t: 15, was: 'Rain, then heavy rain' },
  ],
};
const icons = (list) => `<span class="wx">${list.map((ic, i) => (i ? I.arrow : '') + ic).join('')}</span>`;

const round = () => {
  const raced = state.round === 'raced';
  const off = state.round !== 'follow';
  const sessions = off ? ROUND.dry : ROUND.wet;
  const race = sessions[2];

  const list = `<section class="card ses-card">
    <div class="scard-h"><span class="t">Event</span></div>
    ${sessions.map((s, i) => {
      let dot = '<span class="sdot"></span>';
      if (raced && i === 0) dot = `<span class="sdot done">${I.check}</span>`;
      if ((raced && i === 1) || (!raced && i === 0)) dot = '<span class="sdot next"></span>';
      return `<div class="ses ${i === 2 ? 'cur' : ''}">${dot}<span class="nm"><b>${s.n}</b><small>${s.when}</small></span>
        <span class="end">${icons(s.icons)}${(raced ? i === 1 : i === 0) ? '<span class="chip outline">Next</span>' : ''}</span></div>`;
    }).join('')}
  </section>`;

  let rainCard;
  if (raced) {
    rainCard = `<section class="card scard newring">
      <div class="scard-h"><span class="t">Wet weather <span class="newtag">new</span></span><span class="muted" style="font-size:12px;display:inline-flex;gap:4px;align-items:center">${I.lock}Raced</span></div>
      <div>${allowedChip(false)}</div>
      <span class="hint">Fixed for the whole event once Practice ran.</span>
    </section>`;
  } else {
    rainCard = `<section class="card scard newring">
      <div class="scard-h"><span class="t">Wet weather <span class="newtag">new</span></span>${off ? resetBtn : ''}</div>
      ${allowRain('round-rain', !off)}
      ${off ? '' : '<span class="hint">As the season sets it</span>'}
      <div class="note">Rain is allowed this season. <a href="#">Change it${I.chev}</a></div>
    </section>`;
  }

  const weatherTile = `<div class="tile ${off ? 'newring' : ''}">
    <span class="lab">Weather</span>
    <span class="val">${icons(race.icons)}<span class="num">${race.t}°C</span></span>
    ${off
      ? `<span class="tipwrap"><small class="swap">${race.words} · no rain allowed ${I.info}</small><span class="tip">Rain is not allowed, so this runs ${race.words} rather than ${race.was}</span></span>`
      : `<small>${race.words}</small>`}
  </div>`;

  return `${nav('Championships')}
  <div class="shead">
    <span class="back">${I.back}GT World Challenge Europe</span>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h1>Round 5 - Spa 24 Hours</h1><span class="btn primary">Launch ${raced ? 'Qualifying' : 'Practice'}</span>
    </div>
    <div class="sub">${chip('c-oceanic', 'Oceanic')}<span>Spa-Francorchamps · Sunday 27 June 2027</span></div>
  </div>
  <div class="rlayout">
    <aside class="side">
      <div class="placeholder">Your entry - as today (EntryPanel)</div>
      ${list}
      <div class="placeholder">AI strength - as today (RoundStrength)</div>
      ${rainCard}
    </aside>
    <section class="card main-card">
      <h2>Race</h2>
      <div class="brief">
        <div class="tile"><span class="lab">Length</span><span class="val num">26 laps</span><small>180 km</small></div>
        ${weatherTile}
        <div class="tile"><span class="lab">Wind</span><span class="val num">8-16 km/h</span></div>
        <div class="tile"><span class="lab">Start</span><span class="val">From qualifying</span></div>
      </div>
      <p class="hint" style="font-size:13.5px;margin:0">Lines up on Qualifying</p>
      <div class="placeholder" style="min-height:160px;display:grid;place-items:center">Rest of the session page - as today</div>
    </section>
  </div>`;
};

/* ================= Notes ================= */
const WHY = {
  editor: `<h3>Editor - Overview</h3><ul>
    <li><b>One switch, Allow rain, in the Season pane</b> (the Weather pane for a historic event), under Generated weather and shown whether or not weather is generated, since authored rain is made dry too.</li> It is a permission and not a weather: with it on, the forecast still decides whether it rains.
    <li>Stored on the document as <code>Championship.rain</code>, <code>false</code> for off and left out for on, so no shipped championship changes. Switching off a shipped championship's rain means Customise first, as with any other field.</li>
    <li>It travels with an export. An edition a career already entered keeps its own frozen copy, so a change here reaches only editions entered after it. The season override is how you change one already entered.</li>
    <li>Read back on the championship's <i>Points, prizes and rules</i> tab as a <code>RulesSheet</code> line. No chip on the library card or table row.</li>
  </ul>`,
  champ: `<h3>Championship page - an edition the career is in</h3><ul>
    <li><b>A Wet weather card in the sidebar under AI strength</b>, the same shape as <code>SeasonStrength</code>: the season's Allow rain switch, Reset once it is set, and the rounds set on their own, each linking to its round.</li>
    <li>A switch rather than two chips, so it reads as allowing rain rather than choosing it. Following the championship shows "As the championship sets it"; once switched, Reset puts it back. The rounds set on their own wear <span class="chip c-wet">Rain allowed</span> or <span class="chip c-dry">Rain not allowed</span>, in the weather picker's wet and dry colours.</li>
    <li>Stored on <code>SeasonEntry.rain</code>, left out to follow. Only shown for an edition still to finish: a season gone by reads back without it.</li>
    <li>A round is listed under "Rounds set on their own" only where its choice differs from the season's.</li>
  </ul>`,
  round: `<h3>Round page - a round the career is in</h3><ul>
    <li><b>A Wet weather card under AI strength</b>, shaped like <code>RoundStrength</code>, with a note pointing to the season's switch on the championship page. Stored on <code>SeasonEvent.rain</code>, left out to follow.</li>
    <li><b>The switch takes no part in generating weather.</b> The forecast is drawn a week out, under the app's weather settings, and stored exactly as today. Not allowing rain is a higher-priority layer read over it every time: each wet type becomes the nearest dry one (overcast for all of them), in the forecast, the tile, the icons and the race. Allow rain again before the event and the stored forecast shows and races as drawn.</li>
    <li>The Weather tile, the session list's icons and the calendar strip all show what will race. The tile adds <i>no rain allowed</i>, and its tooltip says what was forecast.</li>
    <li><b>Locked once the first session has run</b>: the race store keeps the event's weather from then on, so a change could not apply.</li>
    <li>A historic event's page has the same card without the season note, since it has no season. A standalone championship is a career, so it gets both levels.</li>
    <li>What becomes dry: a generated forecast, the weather a round or format session authors, and every wet step of a weather plan, with its rain, wetness and puddles set to zero. A named preset that declares a wet type races as the nearest dry type instead.</li>
  </ul>
  <h3>Agreed</h3><ul>
    <li>Weather a session writes itself follows the same rule: when rain is not allowed it shows and races the nearest dry weather.</li>
    <li>Race tab events are left out: the player picks their weather directly.</li>
  </ul>`,
};

const render = () => {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('picker').innerHTML = PICKS.map((p) => `<div class="grp" ${p.when && !p.when() ? 'hidden' : ''}><strong>${p.label}</strong>${p.opts
    .map(([v, l]) => `<button type="button" class="opt" data-k="${p.key}" data-v="${v}" aria-pressed="${state[p.key] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('app').innerHTML = { editor, champ, round }[state.screen]();
  document.getElementById('why').innerHTML = WHY[state.screen] + `<h3>Resolution</h3><ul>
    <li><b>Round, else season, else championship, else allowed.</b> The championship level is read from the season's own copy of the championship.</li>
    <li>Applied in <code>roundRace</code> by taking every type in <code>WET_WEATHER_TYPES</code> out of the <code>WeatherOffer</code> for that round, so <code>nearestOffered</code> switches to dry the same way the Allowed weather setting does. AI simulation, rating and money are unchanged.</li>
  </ul>`;
};

document.addEventListener('click', (e) => {
  const opt = e.target.closest('[data-k]');
  if (opt) { state[opt.dataset.k] = opt.dataset.v; render(); return; }
  const tog = e.target.closest('[data-toggle]');
  if (tog) { state[tog.dataset.toggle] = state[tog.dataset.toggle] === 'on' ? 'off' : 'on'; render(); }
});
render();
</script>
</body>
</html>
