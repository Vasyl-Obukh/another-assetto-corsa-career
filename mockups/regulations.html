<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulations, read-only - mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - the only new family is
   --historic, the leather chip. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-soft: oklch(0.93 0.05 155); --success-soft-fg: oklch(0.34 0.09 155);
  --destructive: oklch(0.58 0.22 27);
  --warning: oklch(0.79 0.15 80); --warning-fg: oklch(0.28 0.06 70);
  --missed: oklch(0.925 0.035 8); --missed-fg: oklch(0.42 0.09 12);
  --s-practice: oklch(0.93 0.045 250); --s-practice-fg: oklch(0.4 0.13 258);
  --s-qualify: oklch(0.93 0.05 310); --s-qualify-fg: oklch(0.4 0.15 310);
  --s-race: oklch(0.89 0.085 150); --s-race-fg: oklch(0.33 0.1 152);
  --d-single: oklch(0.925 0.06 212); --d-single-fg: oklch(0.36 0.11 215); --d-single-dot: oklch(0.62 0.13 215);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118); --d-sports-dot: oklch(0.65 0.13 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178); --d-touring-dot: oklch(0.62 0.1 178);
  --t-platinum: oklch(0.945 0.022 210); --t-platinum-fg: oklch(0.4 0.05 215);
  --t-gold: oklch(0.9 0.085 88); --t-gold-fg: oklch(0.42 0.1 75);
  --t-bronze: oklch(0.89 0.07 52); --t-bronze-fg: oklch(0.41 0.09 48);
  --t-steel: oklch(0.875 0.022 250); --t-steel-fg: oklch(0.36 0.035 255);
  --silver: oklch(0.91 0.008 255); --silver-fg: oklch(0.42 0.015 260);
  --climate-oceanic: oklch(0.925 0.03 232); --climate-oceanic-fg: oklch(0.4 0.05 235);
  --origin-modified: oklch(0.93 0.05 195); --origin-modified-fg: oklch(0.36 0.09 200);
  --origin-custom: oklch(0.93 0.05 340); --origin-custom-fg: oklch(0.38 0.12 340);
  /* Leather: bronze's neighbourhood at about two thirds its chroma, the
     technique the climate chips use. */
  --historic: oklch(0.915 0.04 40); --historic-fg: oklch(0.42 0.075 38);
  --calendar-well: oklch(0.93 0.05 250); --calendar-well-fg: oklch(0.42 0.13 258);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
  --sk: oklch(0.925 0.018 255); --sk-hi: oklch(0.965 0.01 255); --sk-deep: oklch(0.885 0.02 255);
  --map-filter: none;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-soft: oklch(0.32 0.06 155); --success-soft-fg: oklch(0.86 0.11 155);
  --destructive: oklch(0.66 0.2 25);
  --warning: oklch(0.8 0.14 82); --warning-fg: oklch(0.2 0.04 70);
  --missed: oklch(0.32 0.04 8); --missed-fg: oklch(0.86 0.06 12);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --d-single: oklch(0.32 0.07 212); --d-single-fg: oklch(0.86 0.09 212); --d-single-dot: oklch(0.68 0.12 212);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112); --d-sports-dot: oklch(0.7 0.13 115);
  --d-touring: oklch(0.32 0.06 175); --d-touring-fg: oklch(0.86 0.08 175); --d-touring-dot: oklch(0.68 0.1 178);
  --t-platinum: oklch(0.34 0.025 210); --t-platinum-fg: oklch(0.9 0.03 210);
  --t-gold: oklch(0.36 0.07 88); --t-gold-fg: oklch(0.89 0.12 92);
  --t-bronze: oklch(0.35 0.06 52); --t-bronze-fg: oklch(0.86 0.08 55);
  --t-steel: oklch(0.32 0.02 250); --t-steel-fg: oklch(0.85 0.03 250);
  --silver: oklch(0.34 0.01 255); --silver-fg: oklch(0.88 0.01 255);
  --climate-oceanic: oklch(0.32 0.03 232); --climate-oceanic-fg: oklch(0.86 0.04 232);
  --origin-modified: oklch(0.33 0.06 195); --origin-modified-fg: oklch(0.86 0.08 195);
  --origin-custom: oklch(0.33 0.06 340); --origin-custom-fg: oklch(0.86 0.08 340);
  --historic: oklch(0.33 0.04 40); --historic-fg: oklch(0.86 0.06 45);
  --calendar-well: oklch(0.32 0.06 250); --calendar-well-fg: oklch(0.86 0.09 255);
  --sk: oklch(0.3 0.016 265); --sk-hi: oklch(0.345 0.016 265); --sk-deep: oklch(0.27 0.016 265);
  --map-filter: invert(1);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.caps { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker .grp[hidden] { display: none; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why code { font-size: 12.5px; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.shead { padding: 0 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head-row h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
.over { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 13.5px; color: var(--muted-foreground); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); border-radius: 99px; padding: 2px 8px 2px 10px; color: var(--foreground); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.map { width: 144px; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--muted); display: grid; place-items: center; overflow: hidden; flex: none; }
.map img, .thumb img { width: 88%; height: 88%; object-fit: contain; filter: var(--map-filter); }
.thumb { width: 64px; aspect-ratio: 16 / 10; border-radius: 6px; background: var(--muted); display: grid; place-items: center; overflow: hidden; flex: none; }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip.xs { font-size: 10.5px; padding: 3px 6px; }
.chip.outline { border: 1px solid var(--border); color: var(--foreground); }
.chip.ghost { border: 1px solid var(--border); color: var(--muted-foreground); }
.chip svg { width: 12px; height: 12px; }
.c-single { background: var(--d-single); color: var(--d-single-fg); }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.c-t1 { background: var(--t-platinum); color: var(--t-platinum-fg); }
.c-t2 { background: var(--t-gold); color: var(--t-gold-fg); }
.c-t3 { background: var(--silver); color: var(--silver-fg); }
.c-t4 { background: var(--t-bronze); color: var(--t-bronze-fg); }
.c-raced { background: var(--success-soft); color: var(--success-soft-fg); }
.c-missed { background: var(--missed); color: var(--missed-fg); }
.c-clash { background: var(--warning); color: var(--warning-fg); }
.c-practice { background: var(--s-practice); color: var(--s-practice-fg); }
.c-qualify { background: var(--s-qualify); color: var(--s-qualify-fg); }
.c-race { background: var(--s-race); color: var(--s-race-fg); }
.c-oceanic { background: var(--climate-oceanic); color: var(--climate-oceanic-fg); }
.c-adjusted { background: var(--origin-modified); color: var(--origin-modified-fg); }
.c-custom { background: var(--origin-custom); color: var(--origin-custom-fg); }
.c-historic { background: var(--historic); color: var(--historic-fg); }
.c-gold { background: var(--t-gold); color: var(--t-gold-fg); }
.c-silver { background: var(--silver); color: var(--silver-fg); }
.c-bronze { background: var(--t-bronze); color: var(--t-bronze-fg); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel-h { padding: 12px 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel .pb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted-foreground); }
.btn.danger { background: var(--destructive); color: oklch(0.985 0.005 60); border-color: transparent; }
.btn.lg { height: 38px; padding: 0 16px; }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12.5px; }
.btn.icon { width: 28px; padding: 0; }
.link { color: var(--primary); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.well { aspect-ratio: 16 / 9; border-radius: 8px; background: var(--muted); display: grid; place-items: center; overflow: hidden; }
.well img { width: 100%; height: 100%; object-fit: cover; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted-foreground); background: var(--muted); border-radius: 8px; padding: 8px 10px; }
.note svg { margin-top: 2px; }
.note b { color: var(--foreground); font-weight: 600; }
.note.amber { background: color-mix(in oklch, var(--warning) 22%, transparent); color: var(--foreground); }
.new-outline { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 3px; border-radius: 10px; }
.newtag { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--primary); text-transform: uppercase; }
.switch { display: inline-block; vertical-align: middle; width: 32px; height: 18px; border-radius: 99px; background: var(--border); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 16px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--muted); gap: 2px; }
.seg span { padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted-foreground); }
.seg span.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.search { width: 288px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13px; }
.select { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; }
.field small { font-size: 12px; color: var(--muted-foreground); }
.input { height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: flex; align-items: center; font-size: 13.5px; }
.textarea { min-height: 84px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 8px 10px; font-size: 13.5px; }

/* ---------- Home ---------- */
.next { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .05); }
.next .body { display: flex; flex-direction: column; gap: 12px; padding: 20px; min-width: 0; }
.next .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--primary); }
.next .count { display: flex; align-items: baseline; gap: 10px; }
.next .count b { font-size: 36px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.next h2 { margin: 0; font-size: 20px; font-weight: 600; }
.next .aside { background: var(--muted); display: grid; place-items: center; }
.next .aside img { width: 70%; filter: var(--map-filter); }
.seat { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.seat .pic { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--muted); overflow: hidden; }
.seat .pic img { width: 100%; height: 100%; object-fit: cover; }
.seat b { font-size: 13.5px; font-weight: 600; display: block; }
.seat small { font-size: 12px; color: var(--muted-foreground); display: block; }
.sesstrip { display: flex; gap: 6px; flex-wrap: wrap; }
.sesstrip span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 10px; }
.section-title h3 { margin: 0; font-size: 15px; font-weight: 600; }
.strip-scroll { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.mini { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 10px 12px; position: relative; overflow: hidden; }
.mini::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--stripe, var(--border)); }
.mini .when { font-size: 11.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.mini b { font-size: 13px; font-weight: 600; line-height: 1.3; }
.mini small { font-size: 11.5px; color: var(--muted-foreground); }
.mini.past { background: transparent; }
.placeholder { border: 1px dashed var(--border); border-radius: 12px; padding: 14px; color: var(--muted-foreground); font-size: 12.5px; text-align: center; }

/* ---------- Calendar ---------- */
.agenda { display: flex; flex-direction: column; gap: 16px; }
.day { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; }
.day .dl { display: flex; flex-direction: column; padding-top: 6px; }
.day .dl b { font-size: 22px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.day .dl span { font-size: 12px; color: var(--muted-foreground); }
.day .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ecard { position: relative; display: flex; flex-direction: column; gap: 8px; overflow: hidden; border-radius: 8px; border: 1px solid var(--border); background: var(--card); padding: 10px 12px 10px 16px; text-align: left; }
.ecard.yours { border-color: color-mix(in oklch, var(--primary) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 60%, transparent); }
.ecard .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.ecard .top { display: flex; gap: 12px; align-items: flex-start; }
.ecard .meta { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.ecard .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ecard h4 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ecard p { margin: 0; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ecard .foot { display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--border); padding-top: 8px; flex-wrap: wrap; }
.ecard .foot .go { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.month .h { font-size: 11px; font-weight: 600; color: var(--muted-foreground); padding: 6px 8px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .04em; }
.month .c { min-height: 92px; padding: 6px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; }
.month .c:nth-child(7n + 1) { border-left: 0; }
.month .c .n { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.month .c.out .n { color: var(--muted-foreground); opacity: .5; }
.month .c.today .n { color: var(--primary); }
.evline { display: flex; align-items: center; gap: 5px; font-size: 11.5px; border-radius: 5px; padding: 2px 5px; white-space: nowrap; overflow: hidden; }
.evline .d { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.evline.yours { background: color-mix(in oklch, var(--primary) 12%, transparent); font-weight: 600; }
.evline.clash { box-shadow: inset 0 0 0 1.5px var(--warning); }
.evline span { overflow: hidden; text-overflow: ellipsis; }
.clock { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.clock .well-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--calendar-well); color: var(--calendar-well-fg); }

/* ---------- Event page ---------- */
.ses { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); text-align: left; width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; }
.ses[aria-current="true"] { background: var(--accent); }
.ses .nm { display: flex; flex-direction: column; min-width: 0; }
.ses .nm b { font-size: 13.5px; font-weight: 600; }
.ses .nm small { font-size: 12px; color: var(--muted-foreground); }
.sdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; }
.sdot.done { background: var(--success); border-color: var(--success); color: var(--card); }
.sdot.done svg { width: 10px; height: 10px; stroke-width: 3; }

.sval { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.launch { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }

.pos { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- Dialogs ---------- */

/* ---------- Results ---------- */

.rses { margin: 0 8px 8px; display: flex; flex-direction: column; }

.hero { position: relative; height: 172px; border-radius: 14px; overflow: hidden; background: var(--scrim); color: var(--on-scrim); }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, oklch(0.14 0.012 265 / .85), transparent 70%); }
.hero img { position: absolute; right: 20px; top: 20px; height: 110px; width: 190px; object-fit: contain; filter: brightness(0) invert(1); z-index: 1; }
.hero .txt { position: absolute; left: 20px; bottom: 16px; z-index: 1; display: flex; flex-direction: column; gap: 8px; }
.hero .crumbs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }

/* ---------- Settings ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }

.pool { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 18px; font-size: 13px; }

.box { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); flex: none; display: grid; place-items: center; }

.ptable { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

.menu { position: absolute; z-index: 5; right: 8px; top: 34px; width: 180px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px oklch(0 0 0 / .14); padding: 4px; display: flex; flex-direction: column; font-size: 13px; }

/* ---------- Editor ---------- */

/* ---------- Skeleton primitives, as mockups/loading.html draws them ---------- */

  background-image: linear-gradient(100deg, transparent 0 40%, var(--sk-hi) 50%, transparent 60% 100%);
  background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }

/* ---------- Browser pieces: FilterRail, toolbar, ViewToggle ---------- */

.frail .sh2 svg { margin-left: auto; width: 14px; height: 14px; color: var(--muted-foreground); }

.sfield { flex: 1; min-width: 200px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13.5px; }

/* ---------- SeasonCard pieces ---------- */

.mstrip span.m { display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); padding: 6px 4px 4px; font-size: 12px; }
.mstrip span.m.past { color: var(--muted-foreground); }
.mstrip span.m.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); color: var(--primary); font-weight: 600; }
.mstrip .ticks { display: flex; gap: 2px; height: 4px; }
.mstrip .ticks i { width: 6px; border-radius: 99px; }
.t-yours { background: var(--primary); }
.t-clash { background: var(--warning); }
.t-other { background: color-mix(in oklch, var(--muted-foreground) 25%, transparent); }
.cfilters { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.cfilters .l { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.cfilters .grp2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.cfilters .lab { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); margin-right: 2px; }
.segs { display: flex; gap: 2px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); padding: 2px; }
.segs span { display: flex; align-items: center; gap: 6px; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.segs span.on { background: var(--primary); color: var(--primary-foreground); }
.segs span i { font-style: normal; opacity: .7; font-variant-numeric: tabular-nums; }
.segs svg { width: 14px; height: 14px; }
.fbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 12px; font-weight: 500; }
.fbtn .dot { opacity: .5; }
.fbtn.on { border-color: color-mix(in oklch, var(--foreground) 50%, transparent); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 50%, transparent); }
.fbtn.on .dot { opacity: 1; }

/* ---------- Rules, read-only ---------- */
.rcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.rcard h3 { margin: 0; font-size: 16px; font-weight: 600; }
.rcard .sub { margin: -8px 0 0; font-size: 12.5px; color: var(--muted-foreground); }
.rgroup { display: flex; flex-direction: column; gap: 2px; }
.rgroup > .caps { margin-bottom: 4px; }
/* Variant A: a rule sheet - one row per rule, its scale drawn read-only. */
.rrow { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 7.5rem; gap: 14px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.rgroup .rrow:first-of-type { border-top: 0; }
.rrow .lbl { font-weight: 500; }
.rrow .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rrow .val.def { font-weight: 400; color: var(--muted-foreground); }
.scale { position: relative; height: 26px; }
.scale .track { position: absolute; left: 4px; right: 4px; top: 6px; height: 4px; border-radius: 99px; background: var(--muted); }
.scale .fill { position: absolute; left: 4px; top: 6px; height: 4px; border-radius: 99px; background: color-mix(in oklch, var(--primary) 70%, transparent); }
.scale .stop { position: absolute; top: 14px; transform: translateX(-50%); font-size: 10.5px; color: var(--muted-foreground); white-space: nowrap; }
.scale .stop.on { color: var(--primary); font-weight: 600; }
.scale .tick { position: absolute; top: 5px; width: 6px; height: 6px; border-radius: 50%; transform: translateX(-50%); background: color-mix(in oklch, var(--muted-foreground) 45%, transparent); }
.scale .mark { position: absolute; top: 2px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); background: var(--card); border: 2px solid var(--primary); }
.scale .mark.def { border-style: dashed; border-color: var(--muted-foreground); }
.steps { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--muted); }
.steps span { padding: 2px 9px; border-radius: 6px; font-size: 12px; color: var(--muted-foreground); }
.steps span.on { background: var(--card); color: var(--foreground); font-weight: 600; box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.steps span.on.def { font-weight: 400; color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--border); background: transparent; }
/* Variant B: tiles, the briefing's own shape. */
.rtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rtile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.rtile .k { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.rtile b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rtile b.def { font-weight: 500; color: var(--muted-foreground); }
.rtile small { font-size: 12px; color: var(--muted-foreground); }
.minibar { display: flex; gap: 2px; margin-top: 2px; width: 100%; align-self: stretch; }
.minibar i { display: block; flex: 1; min-width: 8px; height: 4px; border-radius: 99px; background: var(--muted); }
.minibar i.on { background: color-mix(in oklch, var(--primary) 70%, transparent); }
.minibar i.def { background: color-mix(in oklch, var(--muted-foreground) 35%, transparent); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.pcard h3 { margin: 0; font-size: 16px; font-weight: 600; }
.prow { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
</style>
</head>
<body>
<div class="picker">
  <div class="grp"><strong>Page</strong>
    <button class="opt" data-k="page" data-v="champ">Championship · Points, prizes and formats</button>
    <button class="opt" data-k="page" data-v="historic">Historic event · Event</button>
  </div>
  <div class="grp"><strong>Layout</strong>
    <button class="opt" data-k="v" data-v="a">A · Rule sheet</button>
    <button class="opt" data-k="v" data-v="b">B · Tiles</button>
  </div>
  <div class="grp"><strong>Rules</strong>
    <button class="opt" data-k="set" data-v="full">Set by the championship</button>
    <button class="opt" data-k="set" data-v="bare">Mostly Assetto Corsa's defaults</button>
  </div>
  <div class="grp"><strong>Theme</strong>
    <button class="opt" data-k="th" data-v="light">Light</button>
    <button class="opt" data-k="th" data-v="dark">Dark</button>
  </div>
</div>
<div class="why" id="why"></div>
<div class="frame" id="app"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
};
const img = (src) => `<img src="${src}" alt="" onerror="this.remove()">`;
const state = { page: 'champ', v: 'a', set: 'full', th: 'light' };
const chip = (cls, text, xs) => `<span class="chip ${xs ? 'xs ' : ''}${cls}">${text}</span>`;

// The rules as a championship states them. A key left out is Assetto Corsa's
// own default, which the editor's sliders say as "Default · 100 %".
const SETS = {
  full: {
    damage: 100, fuelRate: 1, tyreWear: 2, slipstream: 1, tyreBlankets: false,
    penalties: true, jumpStartPenalty: 10, allowedTyresOut: 2,
  },
  bare: { damage: 50 },
};
const DEFAULTS = { damage: 100, fuelRate: 1, tyreWear: 1, slipstream: 1 };
// The editor's own stops, so the sheet draws the same scale the slider does.
const SCALES = {
  damage: { label: 'Damage', min: 0, max: 100, stops: [[0, 'Off'], [50, 'Half'], [100, 'Real']], text: (v) => `${v} %` },
  fuelRate: { label: 'Fuel use', min: 0, max: 3, stops: [[0, 'Off'], [1, 'Real'], [2, '×2'], [3, '×3']], text: (v) => (v === 1 ? 'Real' : `×${v}`) },
  tyreWear: { label: 'Tyre wear', min: 0, max: 3, stops: [[0, 'Off'], [1, 'Real'], [2, '×2'], [3, '×3']], text: (v) => (v === 1 ? 'Real' : `×${v}`) },
  slipstream: { label: 'Slipstream', min: 0, max: 3, stops: [[0, 'Off'], [1, 'Real'], [2, '×2'], [3, '×3']], text: (v) => (v === 1 ? 'Real' : `×${v}`) },
};

const scaleRow = (key, rules) => {
  const s = SCALES[key];
  const set = rules[key] !== undefined;
  const v = set ? rules[key] : DEFAULTS[key];
  const at = (x) => `calc(4px + (100% - 8px) * ${(x - s.min) / (s.max - s.min)})`;
  return `<div class="rrow"><span class="lbl">${s.label}</span>
    <div class="scale"><span class="track"></span>${set ? `<span class="fill" style="width:calc((100% - 8px) * ${(v - s.min) / (s.max - s.min)})"></span>` : ''}
      ${s.stops.map(([x, n]) => `<span class="tick" style="left:${at(x)}"></span><span class="stop ${set && x === v ? 'on' : ''}" style="left:${at(x)}">${n}</span>`).join('')}
      <span class="mark ${set ? '' : 'def'}" style="left:${at(v)}"></span></div>
    <span class="val ${set ? '' : 'def'}">${set ? s.text(v) : `Default · ${s.text(v)}`}</span></div>`;
};
const stepsRow = (label, options, value, def) => `<div class="rrow"><span class="lbl">${label}</span>
  <span><span class="steps">${options.map(([v, n]) => `<span class="${v === value ? `on ${def ? 'def' : ''}` : ''}">${n}</span>`).join('')}</span></span><span></span></div>`;
// Neutral on purpose where a rule is simply off: absence is not a state worth
// a colour. On is the success green the rest of the app uses for "in force".
const flagRow = (label, value, onText, offText) => `<div class="rrow"><span class="lbl">${label}</span><span>${value === undefined ? '<span class="chip ghost">Assetto Corsa decides</span>' : value ? chip('c-raced', onText) : chip('outline', offText)}</span><span></span></div>`;

const sheet = (rules) => `
  <div class="rgroup"><span class="caps">What the cars carry</span>
    ${scaleRow('damage', rules)}${scaleRow('fuelRate', rules)}${scaleRow('tyreWear', rules)}${scaleRow('slipstream', rules)}
    ${flagRow('Tyre blankets', rules.tyreBlankets, 'Allowed', 'Not allowed')}
  </div>
  <div class="rgroup"><span class="caps">Race control</span>
    ${flagRow('Penalties', rules.penalties, 'Enforced', 'Off')}
    ${stepsRow('Jump start penalty', [[0, 'None'], [5, '5 s'], [10, '10 s'], [15, '15 s'], [30, '30 s']], rules.jumpStartPenalty ?? 0, rules.jumpStartPenalty === undefined)}
    ${stepsRow('Wheels allowed off', [[-1, "Track's own"], [1, '1'], [2, '2'], [3, '3']], rules.allowedTyresOut ?? -1, rules.allowedTyresOut === undefined)}
  </div>`;

const minibar = (key, rules) => {
  const s = SCALES[key];
  const set = rules[key] !== undefined;
  const v = set ? rules[key] : DEFAULTS[key];
  return `<span class="minibar">${s.stops.map(([x]) => `<i class="${x <= v && x > s.min ? (set ? 'on' : 'def') : ''}"></i>`).join('')}</span>`;
};
const tiles = (rules) => `
  <div class="rtiles">
    ${['damage', 'fuelRate', 'tyreWear', 'slipstream'].map((k) => {
      const set = rules[k] !== undefined; const s = SCALES[k]; const v = set ? rules[k] : DEFAULTS[k];
      return `<div class="rtile"><span class="k">${s.label}</span><b class="${set ? '' : 'def'}">${s.text(v)}</b>${minibar(k, rules)}<small>${set ? 'Set by the championship' : "Assetto Corsa's default"}</small></div>`;
    }).join('')}
    <div class="rtile"><span class="k">Tyre blankets</span><span>${rules.tyreBlankets === undefined ? '<span class="chip ghost">Assetto Corsa decides</span>' : rules.tyreBlankets ? chip('c-raced', 'Allowed') : chip('outline', 'Not allowed')}</span><small>Tyres start ${rules.tyreBlankets ? 'warm' : 'cold'}</small></div>
    <div class="rtile"><span class="k">Penalties</span><span>${rules.penalties === undefined ? '<span class="chip ghost">Assetto Corsa decides</span>' : rules.penalties ? chip('c-raced', 'Enforced') : chip('outline', 'Off')}</span><small>Track limits and the pit lane</small></div>
    <div class="rtile"><span class="k">Jump start</span><b class="${rules.jumpStartPenalty === undefined ? 'def' : ''}">${rules.jumpStartPenalty ? `${rules.jumpStartPenalty} s` : 'None'}</b><small>Drive-through for leaving early</small></div>
    <div class="rtile"><span class="k">Wheels allowed off</span><b class="${rules.allowedTyresOut === undefined ? 'def' : ''}">${rules.allowedTyresOut === undefined ? "Track's own" : rules.allowedTyresOut}</b><small>Before a cut counts</small></div>
  </div>`;

const rulesCard = (owner) => {
  const rules = SETS[state.set];
  return `<div class="rcard new-outline">
    <h3>Rules</h3>
    <p class="sub">What ${owner} allows and how it is policed. Your own aids are in Settings and are not shown here.</p>
    ${state.v === 'a' ? sheet(rules) : tiles(rules)}
  </div>`;
};

const nav = (on) => `<div class="app-nav"><span class="brand">Another Assetto Corsa Career</span>${['Home', 'Calendar', 'Championships', 'Race', 'Cars', 'Tracks', 'Settings']
  .map((one) => `<span class="${one === on ? 'on' : ''}">${one}</span>`).join('')}</div>`;
const tabs = (items, on) => `<div class="utabs">${items.map((one) => `<span class="${one === on ? 'on' : ''}">${one}</span>`).join('')}</div>`;

const prizes = `<div class="pcard"><h3>What a race pays</h3>${[['P1', '$45,000'], ['P2', '$29,000'], ['P3', '$19,000'], ['P4', '$13,500'], ['P5', '$10,000'], ['P6', '$7,000']].map(([p, m], i) => `<div class="prow"><span class="pos ${i < 3 ? `p${i + 1}` : 'quiet'}">${p}</span><span class="num">${m}</span></div>`).join('')}</div>`;
const formats = `<div class="pcard"><h3>Event formats</h3><div style="display:flex;gap:10px"><span class="fstrip"><span class="c-practice">P</span><span class="c-qualify">Q</span><span class="c-race">R</span></span><div style="font-size:12.5px"><b>Grand Prix</b><div class="muted">Day 1 Friday practice - 120 minutes</div><div class="muted">Day 2 Timed practice - 120 minutes</div><div class="muted">Day 3 Grand Prix - 387 km</div></div></div></div>`;

const champ = () => `${nav('Championships')}
  <div class="shead"><a class="back">${I.back}All championships</a>
    <div class="head-row"><div style="display:flex;flex-direction:column;gap:6px"><div class="over">${chip('c-single', 'Single-seater')}${chip('c-t1', 'Tier 1')}</div><h1>Formula 1 1967</h1></div></div></div>
  ${tabs(['Rounds', 'Standings', 'Classes', 'Points, prizes and rules'], 'Points, prizes and rules')}
  <div class="twocol">
    <div style="display:flex;flex-direction:column;gap:16px">${prizes}${formats}</div>
    ${rulesCard('the championship')}
  </div>`;

const historic = () => `${nav('Settings')}
  <div class="shead"><a class="back">${I.back}Settings · Historic events</a>
    <div class="head-row"><div style="display:flex;flex-direction:column;gap:6px"><div class="over">${chip('c-historic', 'Historic')}${chip('c-single', 'Single-seater')}${chip('c-t1', 'Tier 1')}</div><h1>British Grand Prix 1967</h1><div class="facts"><span>18 cars</span><span>Prize $45,000</span></div></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="muted" style="font-size:13px">Can be drawn</span><span class="gswitch on"></span><button class="btn icon">${I.dots}</button></div></div></div>
  ${tabs(['Event', 'Classes', 'Prizes'], 'Event')}
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="placeholder">About this event - description, track, format, race and weather tiles, unchanged</div>
    <div class="twocol">${formats}${rulesCard('the event')}</div>
  </div>`;

const WHY = {
  champ: `<b>A championship's page.</b> The rules join the fourth tab, which is renamed <i>Points, prizes and rules</i>, as a card beside prizes and formats. <b>Read-only</b>, worded as the editor words them, so a rule reads the same where it is set and where it is read. A rule left unset is Assetto Corsa's own and says so in muted type with a dashed marker, rather than vanishing.`,
  historic: `<b>A historic event's page.</b> The same card, under the Event tab beside the format. The career's event page could carry it too, from the same component, under <i>About this event</i> - say if you want that.`,
};
const VWHY = {
  a: `<b>A · Rule sheet</b>: a row per rule, its scale drawn as the editor's slider is - the same stops (Off, Half, Real; Off, Real, ×2, ×3) with the value marked - and the choices of race control as the editor's own segments, the chosen one lit. Reads like the editor, so moving between them is easy.`,
  b: `<b>B · Tiles</b>: the round briefing's tile shape, a figure each with a four-step bar under the measured ones. More compact; the scale is only hinted.`,
};

const render = () => {
  document.documentElement.dataset.theme = state.th;
  document.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', String(state[b.dataset.k] === b.dataset.v)));
  document.getElementById('why').innerHTML = `${WHY[state.page]}<ul><li>${VWHY[state.v]}</li><li><b>Colour:</b> a rule in force (<i>Enforced</i>, <i>Allowed</i>) wears the success green the app uses for "in force"; a rule switched off stays neutral on purpose, since absence is not a state worth a colour; the scales use primary for what is set and grey for Assetto Corsa's default.</li></ul>`;
  document.getElementById('app').innerHTML = state.page === 'champ' ? champ() : historic();
};
document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => { state[b.dataset.k] = b.dataset.v; render(); }));
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in state) state[k] = v; });
render();
</script>
</body>
</html>
