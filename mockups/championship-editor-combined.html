<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Championship editor</title>
<style>

/* Tokens copied from src/renderer/src/globals.css. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-foreground: oklch(0.985 0.005 155);
  --warning: oklch(0.79 0.15 80);
  --warning-foreground: oklch(0.28 0.06 70);
  --destructive: oklch(0.58 0.22 27);
  --destructive-foreground: oklch(0.985 0.005 60);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75);   --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295);  --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);
  --session-practice: oklch(0.93 0.045 250); --session-practice-fg: oklch(0.4 0.13 258);
  --session-qualify: oklch(0.93 0.05 310);   --session-qualify-fg: oklch(0.4 0.15 310);
  --session-race: oklch(0.89 0.085 150);     --session-race-fg: oklch(0.33 0.1 152);
  --gold: oklch(0.9 0.085 88);     --gold-fg: oklch(0.42 0.1 75);
  --silver: oklch(0.91 0.008 255); --silver-fg: oklch(0.42 0.015 260);
  --bronze: oklch(0.89 0.07 52);   --bronze-fg: oklch(0.41 0.09 48);
  --sportscar: oklch(0.925 0.06 112); --sportscar-fg: oklch(0.36 0.1 118);
  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88);    --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255);  --t3-fg: oklch(0.42 0.015 260);
  --works: oklch(0.91 0.075 320); --works-fg: oklch(0.38 0.15 320);
  --independent: oklch(0.92 0.06 18); --independent-fg: oklch(0.42 0.13 22);
  --privateer: oklch(0.93 0.055 132); --privateer-fg: oklch(0.4 0.09 135);
  --temperate: oklch(0.925 0.03 150); --temperate-fg: oklch(0.4 0.05 150);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-foreground: oklch(0.17 0.03 158);
  --warning: oklch(0.8 0.14 82);
  --warning-foreground: oklch(0.2 0.04 70);
  --destructive: oklch(0.66 0.2 25);
  --destructive-foreground: oklch(0.16 0.02 30);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70);   --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295);  --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);
  --session-practice: oklch(0.32 0.06 250); --session-practice-fg: oklch(0.86 0.09 255);
  --session-qualify: oklch(0.33 0.07 310);  --session-qualify-fg: oklch(0.87 0.1 310);
  --session-race: oklch(0.35 0.09 150);     --session-race-fg: oklch(0.88 0.13 150);
  --gold: oklch(0.36 0.07 88);     --gold-fg: oklch(0.89 0.12 92);
  --silver: oklch(0.33 0.006 260); --silver-fg: oklch(0.86 0.008 260);
  --bronze: oklch(0.33 0.06 50);   --bronze-fg: oklch(0.85 0.09 55);
  --sportscar: oklch(0.32 0.07 112); --sportscar-fg: oklch(0.86 0.1 112);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88);   --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --works: oklch(0.34 0.085 320); --works-fg: oklch(0.87 0.11 320);
  --independent: oklch(0.33 0.07 18); --independent-fg: oklch(0.86 0.09 22);
  --privateer: oklch(0.32 0.06 132); --privateer-fg: oklch(0.86 0.08 135);
  --temperate: oklch(0.32 0.03 150); --temperate-fg: oklch(0.85 0.05 150);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.small { font-size: 12px; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }

/* Mockup chrome */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker strong { font-weight: 600; margin-right: 8px; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 5px 12px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .sep { width: 1px; align-self: stretch; background: color-mix(in oklch, var(--background) 30%, transparent); margin: 0 6px; }
.picker .spacer { flex: 1; }
.rationale { max-width: 84ch; margin: 20px auto 0; padding: 0 16px; color: var(--muted-foreground); font-size: 13.5px; }
.rationale b { color: var(--foreground); font-weight: 600; }
.window { max-width: 1440px; margin: 16px auto 48px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--background); box-shadow: 0 20px 50px -30px oklch(0.2 0.02 260 / 0.35); }
.app-header { display: flex; align-items: center; gap: 24px; padding: 14px 32px; border-bottom: 1px solid var(--border); }
.app-header h1 { font-size: 17px; font-weight: 600; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { padding: 5px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500; }
.nav a.on { background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary); }
.screen { padding: 20px 32px 40px; }
.back { color: var(--muted-foreground); font-size: 13px; margin-bottom: 14px; display: inline-block; }

/* Shared pieces */
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.chip.outline { border: 1px solid var(--border); padding: 3px 7px; }
.chip.filled { background: var(--primary); color: var(--primary-foreground); }
.c-sportscar { background: var(--sportscar); color: var(--sportscar-fg); }
.c-t1 { background: var(--t1); color: var(--t1-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-t3 { background: var(--t3); color: var(--t3-fg); }
.c-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.c-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.c-works { background: var(--works); color: var(--works-fg); }
.c-independent { background: var(--independent); color: var(--independent-fg); }
.c-privateer { background: var(--privateer); color: var(--privateer-fg); }
.c-temperate { background: var(--temperate); color: var(--temperate-fg); }
.c-success { background: var(--success); color: var(--success-foreground); }
.c-warning { background: var(--warning); color: var(--warning-foreground); }
.c-destructive { background: var(--destructive); color: var(--destructive-foreground); }
.p1 { background: var(--gold); color: var(--gold-fg); }
.p2 { background: var(--silver); color: var(--silver-fg); }
.p3 { background: var(--bronze); color: var(--bronze-fg); }
.fmt { display: inline-flex; gap: 2px; }
.fmt span { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.s-practice { background: var(--session-practice); color: var(--session-practice-fg); }
.s-qualify { background: var(--session-qualify); color: var(--session-qualify-fg); }
.s-race { background: var(--session-race); color: var(--session-race-fg); }
.medal { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.medal.sm { width: 24px; height: 24px; font-size: 12px; box-shadow: 0 0 0 2px var(--card); }
.medals { display: flex; }
.medals .medal + .medal { margin-left: -4px; }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 6px 12px; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.kebab { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; line-height: 1; color: inherit; }
.switch { width: 36px; height: 20px; border-radius: 10px; background: var(--success); position: relative; flex-shrink: 0; border: 0; }
.switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.card-h { padding: 14px 18px 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 600; }
.card-b { padding: 0 18px 16px; }
.map { width: 64px; height: 40px; border-radius: 6px; background: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
.map svg { width: 50px; height: 30px; }
.map path, .big-map path { fill: none; stroke: var(--foreground); stroke-width: 2.4; stroke-linejoin: round; opacity: .75; }
.shot { border-radius: 8px; overflow: hidden; background: var(--muted); display: flex; flex-direction: column; }
.shot .img { aspect-ratio: 16 / 9; display: grid; place-items: center; background: linear-gradient(180deg, color-mix(in oklch, var(--muted) 60%, var(--card)), var(--muted)); }
.shot .img svg { width: 62%; }
.shot .img path { fill: color-mix(in oklch, var(--foreground) 55%, transparent); }
.shot .cap { font-size: 11.5px; padding: 5px 7px; background: var(--card); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 8px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 6px 8px; font-weight: 400; }
th { color: var(--muted-foreground); font-size: 12px; }
tbody tr { border-top: 1px solid var(--border); }
.you { background: color-mix(in oklch, var(--primary) 8%, transparent); }
.cell-res { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 4px; border-radius: 5px; font-weight: 600; font-size: 12px; }
.r { text-align: right; }
details > summary { color: var(--primary); font-size: 13px; padding: 8px 0 0; list-style: none; }
details[open] > summary { margin-bottom: 8px; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.team { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; background: var(--card); }
.team .th { display: flex; align-items: center; gap: 8px; }
.team .th b { flex: 1; min-width: 0; font-size: 13.5px; }
.team .drv { display: flex; justify-content: space-between; font-size: 13px; }
.team .drv.me span:first-child { font-weight: 600; color: var(--primary); }
.needs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }


:root {
  --single: oklch(0.925 0.06 212); --single-fg: oklch(0.36 0.11 215);
  --custom: oklch(0.93 0.05 340); --custom-fg: oklch(0.38 0.12 340);
  --mediterranean: oklch(0.93 0.035 108); --mediterranean-fg: oklch(0.41 0.055 110);
  --arid: oklch(0.93 0.04 70); --arid-fg: oklch(0.42 0.06 65);
  --oceanic: oklch(0.925 0.03 232); --oceanic-fg: oklch(0.4 0.05 235);
  --steel: oklch(0.875 0.022 250); --steel-fg: oklch(0.36 0.035 255);
  --input: oklch(0.885 0.01 255);
}
:root[data-theme="dark"] {
  --single: oklch(0.32 0.07 212); --single-fg: oklch(0.86 0.1 212);
  --custom: oklch(0.33 0.07 340); --custom-fg: oklch(0.86 0.1 340);
  --mediterranean: oklch(0.32 0.03 108); --mediterranean-fg: oklch(0.86 0.055 110);
  --arid: oklch(0.33 0.035 70); --arid-fg: oklch(0.86 0.06 75);
  --oceanic: oklch(0.32 0.03 232); --oceanic-fg: oklch(0.85 0.045 235);
  --steel: oklch(0.315 0.028 250); --steel-fg: oklch(0.82 0.035 255);
  --input: oklch(1 0 0 / 15%);
}
.c-single { background: var(--single); color: var(--single-fg); }
.c-custom { background: var(--custom); color: var(--custom-fg); }
.c-mediterranean { background: var(--mediterranean); color: var(--mediterranean-fg); }
.c-arid { background: var(--arid); color: var(--arid-fg); }
.c-oceanic { background: var(--oceanic); color: var(--oceanic-fg); }
.c-t4 { background: var(--bronze); color: var(--bronze-fg); }
.c-t5 { background: var(--steel); color: var(--steel-fg); }
.c-warning { background: var(--warning); color: var(--warning-foreground); }

/* Form bits */
.in { border: 1px solid var(--input); background: transparent; border-radius: 7px; height: 34px; padding: 0 10px; font: inherit; color: inherit; width: 100%; min-width: 0; display: flex; align-items: center; }
.in.sm { height: 28px; padding: 0 8px; font-size: 13px; border-radius: 6px; }
.in.sel { justify-content: space-between; }
.in.sel::after { content: "⌄"; opacity: .5; margin-left: 6px; transform: translateY(-3px); }
.in.num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
textarea.in { height: auto; padding: 8px 10px; resize: none; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted-foreground); }
.fields { display: grid; gap: 14px 16px; }
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
:where(.seg) button { border: 0; background: none; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; }
.seg:not(.chips) button.on { background: var(--card); box-shadow: 0 0 0 1px var(--border), 0 1px 2px oklch(0 0 0 / .08); }
.seg.chips button.on { box-shadow: none; }
.sw { width: 34px; height: 19px; border-radius: 10px; background: var(--input); position: relative; flex-shrink: 0; border: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
.sw.on { background: var(--success); }
.sw.on::after { left: auto; right: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.toggle-row:first-child { border-top: 0; }
.stepper { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; border: 1px solid var(--input); border-radius: 7px; height: 34px; overflow: hidden; }
.stepper button { border: 0; background: none; height: 100%; color: var(--muted-foreground); }
.stepper span { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.stepper span.pos { color: var(--success); }
.stepper span.neg { color: var(--destructive); }
.ghost { border: 0; background: none; border-radius: 6px; padding: 5px 8px; color: var(--muted-foreground); font-size: 13px; }
.ghost:hover { background: var(--accent); color: var(--foreground); }
.add { border: 1px dashed var(--border); border-radius: 8px; background: transparent; color: var(--muted-foreground); padding: 7px 12px; font-size: 13px; font-weight: 500; text-align: left; }
.add:hover { border-color: var(--primary); color: var(--primary); }
.grip { color: var(--muted-foreground); opacity: .5; cursor: grab; width: 14px; flex-shrink: 0; font-size: 13px; letter-spacing: -2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.err { background: var(--destructive); }
.dot.dirty { background: var(--warning); }
.pencil { opacity: 0; color: var(--muted-foreground); font-size: 13px; }
.editable:hover .pencil { opacity: 1; }
.editable { cursor: pointer; }
.editable:hover { background: color-mix(in oklch, var(--accent) 55%, transparent); }

/* Editor header */
.ed-head { position: sticky; top: 49px; z-index: 30; background: var(--background); padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ed-head h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.ed-head .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.problems { border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border)); background: color-mix(in oklch, var(--destructive) 6%, var(--card)); border-radius: 10px; padding: 9px 14px; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; font-size: 13px; flex-wrap: wrap; }
.problems b { color: var(--destructive); }
.problems a { color: var(--primary); }

/* ===== A: section rail ===== */
.a-shell { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 125px; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); }
.rail a .n { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.rail a.on { background: var(--card); color: var(--foreground); box-shadow: 0 0 0 1px var(--border); }
.rail a.on::before { content: ""; width: 3px; height: 16px; border-radius: 2px; background: var(--primary); margin-left: -6px; }
.rail .sub { padding: 2px 10px 2px 26px; font-size: 12.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.rail hr { border: 0; border-top: 1px solid var(--border); margin: 8px 4px; }
.sec { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 130px; }
.sec + .sec { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h h3 { font-size: 17px; font-weight: 650; }
.sec-h .hint { color: var(--muted-foreground); font-size: 13px; }
.sec-h .end { margin-left: auto; }
.two-pane { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.two-pane > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.two-pane > div + div { border-left: 1px solid var(--border); }
.pane-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); }
.three-pane { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.three-pane > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.three-pane > div + div { border-left: 1px solid var(--border); }
.assists { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px 9px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.tile .t { display: flex; align-items: center; gap: 8px; }
.tile .t b { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.tile.add-tile { border-style: dashed; background: transparent; color: var(--muted-foreground); justify-content: center; align-items: center; font-weight: 500; min-height: 58px; }

<div class="picker">

  <span class="spacer"></span>
  <button class="opt" id="theme">Dark mode</button>
</div>
<div class="window" style="max-width:1500px">
  <div class="app-header" style="position:sticky;top:0;z-index:35;background:var(--background)">
    <h1>Another Assetto Corsa Career</h1>
    <nav class="nav"><a>Race</a><a>Calendar</a><a>Championships</a><a>Results</a><a>Cars</a><a>Tracks</a><a class="on">Settings</a></nav>

<div id="dlg"></div>

<script>
// ================= shared =================
const CAR = '<svg viewBox="0 0 120 40" aria-hidden="true"><path d="M6 30 C6 24 12 22 22 21 L40 12 C46 9 56 8 66 9 L84 11 C94 13 102 18 108 22 C114 23 116 26 116 30 L106 30 A8 8 0 0 0 90 30 L36 30 A8 8 0 0 0 20 30 Z M28 36 A6 6 0 1 1 28.1 36 Z M98 36 A6 6 0 1 1 98.1 36 Z"/></svg>';
const MAP = 'M6 14 C6 7 12 4 20 5 L44 7 C51 8 52 14 48 18 L36 28 C32 31 26 30 24 26 L20 20 C18 17 14 18 12 21 C10 25 6 22 6 18 Z';
const F = (label, control, hint) => `<div class="field"><label>${label}</label>${control}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const I = (v, cls = '', st = '') => `<div class="in ${cls}" style="${st}">${v}</div>`;
const Sel = (v, cls = '', st = '') => `<div class="in sel ${cls}" style="${st}">${v}</div>`;
const sw = (on) => `<span class="sw ${on ? 'on' : ''}"></span>`;
const seg = (opts, on, cls = {}) => `<div class="seg ${Object.keys(cls).length ? 'chips' : ''}">${opts.map((o) => `<button class="${o === on ? `on ${cls[o] ?? ''}` : ''}">${o}</button>`).join('')}</div>`;

// ================= prize money (generator) =================
const SHAPES = {
  steep: ['Steep', (i) => 0.72 ** i, [10, 7, 5, 3.5, 2.5]],
  gentle: ['Gentle', (i) => 0.87 ** i, [10, 8.7, 7.6, 6.6, 5.7]],
  linear: ['Straight line', (i, n) => n - i, [10, 8, 6, 4, 2]],
  winner: ['Winner takes most', (i) => (i === 0 ? 3.2 : 0.8 ** i), [10, 2.5, 2, 1.6, 1.3]],
};
const ROUNDS_TO = [1, 50, 100, 500, 1000];
const generate = (p) => {
  const w = Array.from({ length: p.places }, (_, i) => SHAPES[p.shape][1](i, p.places));
  const sum = w.reduce((a, b) => a + b, 0);
  const vals = w.map((x) => Math.max(p.round, Math.round((p.pot * x) / sum / p.round) * p.round));
  vals[0] += p.pot - vals.reduce((a, b) => a + b, 0);
  return vals;
};
const PURSES = {
  champRace: { title: 'Each race', hint: 'Paid for a finishing place at every round', pot: 66000, places: 10, shape: 'steep', round: 50 },
  champSeason: { title: 'The season', hint: 'Paid once, for the final standings', pot: 370000, places: 5, shape: 'steep', round: 500 },
  cls0Race: { title: 'Each race', hint: 'Paid to GTP finishers at every round', pot: 99000, places: 10, shape: 'steep', round: 100 },
  cls0Season: { title: 'The season', hint: 'Paid to the GTP standings', pot: 555000, places: 5, shape: 'steep', round: 500 },
  cls3Race: { title: 'Each race', hint: 'Paid to GTD finishers at every round', pot: 42000, places: 10, shape: 'gentle', round: 50 },
  cls3Season: { title: 'The season', hint: 'Paid to the GTD standings', pot: 230000, places: 5, shape: 'steep', round: 500 },
};
Object.values(PURSES).forEach((p) => { p.vals = generate(p); p.hand = new Set(); });
const total = (id) => PURSES[id].vals.reduce((a, b) => a + b, 0);
const shapeIcon = (k) => `<svg viewBox="0 0 26 18">${SHAPES[k][2].map((h, i) => `<rect x="${i * 5.2}" y="${18 - h * 1.7}" width="4" height="${h * 1.7}" rx="1"/>`).join('')}</svg>`;
const purse = (id) => {
  const p = PURSES[id];
  const max = Math.max(...p.vals);
  const cols = `grid-template-columns:repeat(${p.vals.length},minmax(0,1fr))`;
  return `<div class="purse" data-purse="${id}">
    <div class="ph"><b>${p.title}</b><span class="small muted">${p.hint}</span><span style="margin-left:auto" class="row">${p.hand.size ? `<span class="chip c-warning">${p.hand.size} adjusted by hand</span>` : '<span class="chip c-success">Generated</span>'}<span class="small">Total <b class="num">${money(total(id))}</b></span></span></div>
    <div class="pb">
      <div class="gen">
        <div class="field"><label>Pays in all</label><input class="in num" data-k="pot" value="${p.pot}"></div>
        <div class="field"><label>Places paid</label><div class="stepper"><button data-step="-1">−</button><span>${p.places}</span><button data-step="1">+</button></div></div>
        <div class="field"><label>Round to</label><select class="in" data-k="round">${ROUNDS_TO.map((r) => `<option value="${r}" ${r === p.round ? 'selected' : ''}>${money(r)}</option>`).join('')}</select></div>
        <div class="field shapes"><label>Shape</label><div class="shape-chips">${Object.keys(SHAPES).map((k) => `<button class="shape ${p.shape === k ? 'on' : ''}" data-shape="${k}">${shapeIcon(k)}${SHAPES[k][0]}</button>`).join('')}</div></div>
      </div>
      ${p.hand.size ? '<div class="note">Changing the pot, the places or the shape generates the table again and replaces the places you adjusted.<button class="btn sm" data-regen style="margin-left:auto">Regenerate now</button></div>' : ''}
      <div class="pbars" style="${cols}">${p.vals.map((v, i) => `<div class="${pod(i)} ${p.hand.has(i) ? 'hand' : ''}" style="height:${(v / max) * 100}%"></div>`).join('')}</div>
      <div class="pcells" style="${cols}">${p.vals.map((v, i) => `<div class="cell"><span class="cell-res ${pod(i)}">P${i + 1}</span><input class="in ${p.hand.has(i) ? 'hand' : ''}" data-cell="${i}" value="${v.toLocaleString('en-US')}"></div>`).join('')}</div>
    </div></div>`;
};
const classPrizes = (c) => {

const who = () => `<div class="card" style="padding:12px 16px"><div class="row" style="margin-bottom:6px"><b>Who pays what</b></div>
  <table class="tb who"><thead><tr><th>Class</th><th>Paid from</th><th class="r">Each race</th><th class="r">P1 a race</th><th class="r">The season</th><th></th></tr></thead><tbody>
  ${S.classes.map((c, i) => `<tr><td><span class="row">${medal(c.tier, 'sm')}<b style="font-weight:600">${c.name}</b></span></td><td>${c.own ? '<span class="chip c-custom">Its own purse</span>' : '<span class="muted">The championship\'s</span>'}</td><td class="r num">${money(total(c.own ? `cls${i}Race` : 'champRace'))}</td><td class="r num">${money(PURSES[c.own ? `cls${i}Race` : 'champRace'].vals[0])}</td><td class="r num">${money(total(c.own ? `cls${i}Season` : 'champSeason'))}</td><td class="r"><span class="link" data-pick="${i}" data-gosub="prizes">Edit on its tab →</span></td></tr>`).join('')}</tbody></table></div>`;
const scoring = () => `<div class="stack" style="gap:18px">
  <div><div class="sect-h"><h3>Points systems</h3><span class="small muted">Every way this championship scores a race.</span></div>${points()}</div>
  <div><div class="sect-h"><h3>Prize money</h3><span class="small muted">What the championship pays. A class may pay its own instead, on its own tab.</span></div>
    <div class="stack" style="gap:12px"><div class="g2" style="gap:12px;align-items:start">${purse('champRace')}${purse('champSeason')}</div>${who()}</div></div></div>`;

// ================= render =================
const render = () => {
  document.getElementById('screen').innerHTML = `${header()}<div style="margin-top:16px">${{ overview, teams, classes, calendar, weekends, scoring }[TAB]()}</div>`;
  document.getElementById('dlg').innerHTML = DIALOG ? `<div class="veil" data-veil>${{ team: teamDialog, class: classDialog, round: roundDialog }[DIALOG]()}</div>` : '';
};
document.addEventListener('click', (e) => {
  const pb = e.target.closest('[data-shape],[data-step],[data-regen]');
  if (pb) {
    const p = PURSES[pb.closest('[data-purse]').dataset.purse];
    if (pb.dataset.shape) p.shape = pb.dataset.shape;
    if (pb.dataset.step) p.places = Math.max(1, Math.min(30, p.places + Number(pb.dataset.step)));
    p.vals = generate(p); p.hand = new Set(); render(); return;
  }
  if (e.target.matches('[data-veil]')) { DIALOG = null; render(); return; }
  const t = e.target.closest('[data-tab],[data-sub],[data-pick],[data-dialog],[data-close],[data-rtab],[data-wmode],[data-session],[data-fmt]');
  if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; window.scrollTo(0, 0); }
  if (t.dataset.pick) { PICK = Number(t.dataset.pick); if (t.dataset.gosub) { TAB = 'classes'; SUB = t.dataset.gosub; } }
  if (t.dataset.sub) SUB = t.dataset.sub;
  if (t.dataset.dialog) { DIALOG = t.dataset.dialog; RTAB = 'basics'; }
  if ('close' in t.dataset) DIALOG = null;
  if (t.dataset.rtab) RTAB = t.dataset.rtab;
  if (t.dataset.wmode) WMODE = t.dataset.wmode;
  if (t.dataset.session) SESSION = Number(t.dataset.session);
  if (t.dataset.fmt) FMT = Number(t.dataset.fmt);
  render();
});
document.addEventListener('change', (e) => {
  const box = e.target.closest('[data-purse]');
  if (!box) return;
  const p = PURSES[box.dataset.purse];
  const n = Number(String(e.target.value).replace(/[^0-9]/g, ''));
  if (e.target.dataset.cell !== undefined) { const i = Number(e.target.dataset.cell); p.vals[i] = n; p.hand.add(i); p.pot = p.vals.reduce((a, b) => a + b, 0); } else { p[e.target.dataset.k] = n; p.vals = generate(p); p.hand = new Set(); }
  render();
});
const root = document.documentElement;
const params = new URLSearchParams(location.search);
if (params.get('tab')) TAB = params.get('tab');
if (params.get('sub')) SUB = params.get('sub');
if (params.get('pick')) PICK = Number(params.get('pick'));
if (params.get('dialog')) DIALOG = params.get('dialog');
if (params.get('rtab')) RTAB = params.get('rtab');
if (params.get('wmode')) WMODE = params.get('wmode');
if (params.get('theme')) root.dataset.theme = params.get('theme');
else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
const themeBtn = document.getElementById('theme');
const syncTheme = () => { themeBtn.textContent = root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; };
themeBtn.addEventListener('click', () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; syncTheme(); });
syncTheme();
render();
</script>
</body>
</html>
