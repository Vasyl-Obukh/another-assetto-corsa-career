<style>

}
:root[data-theme="dark"] {
  color-scheme: dark;

  --card: oklch(0.225 0.015 265);

  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);

  --m-champ: oklch(0.36 0.07 88); --m-champ-fg: oklch(0.89 0.12 92); --m-champ-solid: oklch(0.72 0.13 85);
  --m-quick: oklch(0.35 0.09 150); --m-quick-fg: oklch(0.88 0.13 150); --m-quick-solid: oklch(0.62 0.14 152);

:root body { background: oklch(0.9 0.008 255); }

button { font: inherit; color: inherit; cursor: pointer; }

.why { max-width: 1400px; margin: 16px auto 0; padding: 0 24px; font-size: 13.5px; }

.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; font-size: 11px; color: var(--muted-foreground); background: var(--card); border-bottom: 1px solid var(--border); }
.titlebar span:first-child { margin-right: auto; }
.host { flex: 1; min-height: 0; container-type: size; }

/* The screen's own unit: one pixel of the 1080p design, growing with the
   window's shorter side - 1 at 1080 tall, 2 at 2160, never under 0.75. Today's
   screen ignores it and stays in fixed pixels, which is the problem. */
.screen { --u: clamp(0.75px, calc(100cqmin / 1050), 2.2px); height: 100%; overflow: hidden; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--primary) 9%, var(--background)), var(--background) 55%); }
.fixed { --u: 1px; }

.grow { flex: 1; min-width: 0; }
.end { margin-left: auto; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 6); height: calc(var(--u) * 36); padding: 0 calc(var(--u) * 14); border-radius: calc(var(--u) * 8); border: 1px solid var(--border); background: var(--card); font-size: calc(var(--u) * 13.5); font-weight: 500; white-space: nowrap; }

/* ---------- Today / A: cards ---------- */

.vb .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, oklch(0.14 0.012 265 / .92), oklch(0.14 0.012 265 / .6) 45%, oklch(0.14 0.012 265 / .05)); }

.vc .tiles { flex: 1; min-height: 0; width: 100%; max-width: calc(var(--u) * 1720); margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 20); }
.vc .tile { min-height: 0; max-height: calc(var(--u) * 860); align-self: center; height: 100%; background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--u) * 20); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 calc(var(--u) * 12) calc(var(--u) * 32) oklch(0 0 0 / .1); }
.vc .tile > .ph { flex: 1 1 0; min-height: calc(var(--u) * 120); border-top: calc(var(--u) * 4) solid; }
.vc .tile > .ph > .cap { position: absolute; left: calc(var(--u) * 22); right: calc(var(--u) * 22); bottom: calc(var(--u) * 18); display: flex; align-items: center; gap: calc(var(--u) * 12); }

.vd .panel { position: relative; z-index: 1; width: calc(var(--u) * 600); max-width: 48%; height: 100%; background: color-mix(in srgb, var(--background) 94%, transparent); backdrop-filter: blur(calc(var(--u) * 14)); border-right: 1px solid var(--border); padding: calc(var(--u) * 48) calc(var(--u) * 48) calc(var(--u) * 32); display: flex; flex-direction: column; gap: calc(var(--u) * 10); }

<div class="picker" id="picker"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const FLAG = (c) => `${AC}gui/NationFlags/${c}.png`;
const PH = {
  brands: `${AC}tracks/ks_brands_hatch/ui/gp/bgr00.jpg`,
  barca: `${AC}tracks/ks_barcelona/ui/layout_gp/bgr02.jpg`,
  silver: `${AC}tracks/ks_silverstone/ui/national_osrw/bgr01.jpg`,
  nords: `${AC}tracks/ks_nordschleife/ui/nordschleife/bgr00.jpg`,
  monza: `${AC}tracks/monza/ui/preview.png`,

const P = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const I = {
  career: P('<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>'),
  champ: P('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  quick: P('<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>'),
  plus: P('<path d="M12 5v14M5 12h14"/>'),
  play: P('<path d="M7 4v16l13-8z"/>'),
  chev: P('<path d="m9 18 6-6-6-6"/>'),
  load: P('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7.5a2 2 0 0 0-1.9 1.4L3 19z"/><path d="M3 19 5.6 11.4A2 2 0 0 1 7.5 10H22l-2.6 7.6a2 2 0 0 1-1.9 1.4H3z"/>'),
  gear: P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  exit: P('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>'),
};

// Each mode as the start screen shows it, in the order the app lists them.
const MODES = {
  career: {
    title: 'Career', photo: PH.brands,
    desc: 'Start on a rung of the ladder and climb it, season after season, as many championships at once as the calendar allows.',
    mark: 'GBR', who: 'Eterry · Season 2028', detail: 'Sat 14 Jun 2028 · next: Brands Hatch GP, Sat 21 Jun', count: 3,
    first: 'New career', go: ['play', 'Continue'], second: 'New', load: true, played: '6 min ago',
    recent: [['Eterry · Season 2028', 'Sat 14 Jun 2028 · GT3 Sprint Series', PH.brands, 'GBR'], ['Eterry · Season 2026', 'Tue 3 Mar 2026 · Mazda MX-5 Cup', PH.barca, 'GBR'], ['Oksana Melnyk · Season 2031', 'Sun 9 Nov 2031 · 2 championships', PH.nords, 'UKR']],
  },
  quick: {
    title: 'Quick race', photo: PH.silver,
    desc: 'Set an event up and drive it - a field of any cars, at any track, with whatever sessions you like.',
    mark: null, who: '4 races set up', detail: 'Last changed 2 days ago',
    first: 'New race', go: ['quick', 'Open races'], second: 'New race', load: false, played: '2 days ago',
    recent: [['Monza GP', 'GT3 field · 16 cars · race next', PH.monza], ['Nordschleife', '3 classes · 30 cars · finished', PH.nords], ['Silverstone National', 'Mazda MX-5 Cup · not started', PH.silver]],
  },
  champ: {
    title: 'Championship', photo: PH.barca,
    desc: 'One championship from the library, raced for one season with the car you pick. No ladder and no money - just the title.',
    mark: 'GBR', who: 'GT3 Sprint Series 2027', detail: 'Round 3 of 6 · P4, 52 pts', count: 2,
    first: 'New championship', go: ['play', 'Continue'], second: 'New', load: true, played: 'yesterday',
    recent: [['GT3 Sprint Series 2027', 'Round 3 of 6 · P4, 52 pts', PH.silver, 'GBR'], ['Formula RSS 4 Championship 2026', 'Finished · Champion', PH.barca, 'GBR']],
  },
};
const ORDER = ['career', 'quick', 'champ'];

const SCREENS = {
  hd: { w: 1366, h: 768, label: '1366 × 768 laptop' },
  fhd: { w: 1920, h: 1080, label: '1920 × 1080' },
  qhd: { w: 2560, h: 1440, label: '2560 × 1440 - or 4K at 150%' },
  uhd: { w: 3840, h: 2160, label: '3840 × 2160 - 4K at 100%' },
  wide: { w: 3440, h: 1440, label: '3440 × 1440 ultrawide' },
};

const S = { v: 'a', screen: 'uhd', first: 'no', data: 'loaded', theme: 'light' };
Object.assign(S, Object.fromEntries(new URLSearchParams(location.hash.slice(1))));

const sk = (w, h = 12, r = 5, onPhoto = false) => `<span class="shim${onPhoto ? ' on-photo' : ''}" style="width:${w};height:calc(var(--u) * ${h});border-radius:calc(var(--u) * ${r})"></span>`;
const flag = (c) => `<img class="flag" src="${FLAG(c)}" alt="">`;
const loading = () => S.data === 'loading';
const firstRun = () => S.first === 'yes' && !loading();
const mark = (m) => (MODES[m].mark ? flag(MODES[m].mark)
  : `<span class="well quick" style="width:calc(var(--u) * 27);height:calc(var(--u) * 27);border-radius:calc(var(--u) * 7)">${I.quick}</span>`);

// The buttons are the same in every variant: Continue, New and Load for a slot mode, Open races and New race for quick races.
const buttons = (m, { glass = false, size = '' } = {}) => {
  const d = MODES[m];
  if (firstRun()) {
    return `<button class="btn pri ${size}">${I.plus}${d.first}</button>${d.load ? `<button class="btn ${size}${glass ? ' glass' : ''}">${I.load}Load</button>` : ''}`;
  }
  const sec = `btn ${size}${glass ? ' glass' : ''}`;
  // Continue waits, disabled, until it knows what it continues.
  const go = `<button class="btn pri ${size}${loading() ? ' dim' : ''}">${I[d.go[0]]}${d.go[1]}</button>`;
  const count = loading() ? sk('calc(var(--u) * 12)', 10, 3, glass) : `<small class="cnt">${d.count}</small>`;
  return go + `<button class="${sec}">${I.plus}${d.second}</button>`
    + (d.load ? `<button class="${sec}">${I.load}Load ${count}</button>` : '');
};

const line = (m) => {
  if (loading()) return `<div class="cl">${sk('calc(var(--u) * 27)', 18, 3)}<div class="grow col" style="gap:calc(var(--u) * 6)">${sk('70%', 12)}${sk('50%', 10)}</div></div>`;
  if (firstRun()) return '';
  const d = MODES[m];
  return `<div class="cl">${mark(m)}<div class="grow"><b class="trunc">${d.who}</b><small class="trunc">${d.detail}</small></div></div>`;
};

const meta = (m) => {
  if (loading()) return `<div class="meta">${sk('calc(var(--u) * 27)', 18, 3)}${sk('35%', 12)}${sk('30%', 11)}</div>`;
  if (firstRun()) return '';
  const d = MODES[m];
  return `<div class="meta">${mark(m)}<b>${d.who}</b><span class="trunc">${d.detail}</span></div>`;
};

const foot = (onPhoto) => `<div class="foot">
  <button class="btn lg${onPhoto ? ' glass' : ''}">${I.gear}Settings</button><button class="btn lg${onPhoto ? ' glass' : ''}">${I.exit}Exit</button>
  <span class="end status">${loading() ? sk('calc(var(--u) * 260)', 11) : '<span class="dot"></span>Assetto Corsa and Content Manager found'}</span>
</div>`;

// ---------- Today, and A ----------
const cards = (fluid) => {
  const card = (m) => {
    const d = MODES[m];
    return `<div class="card">
      <div class="ph shade-b stripe-${m}"><img class="bg" src="${d.photo}"><div class="cap"><span class="well ${m}">${I[m]}</span><h2>${d.title}</h2></div></div>
      <div class="bd"><p class="desc">${d.desc}</p>${line(m)}<div class="acts">${buttons(m)}</div></div>
    </div>`;
  };
  // Today: 81rem and a 132px band, fixed. A: the same composition on the
  // screen's unit, a wider column and a taller band.
  const style = fluid ? '--w:calc(var(--u) * 1560);--band:calc(var(--u) * 210)' : '--w:1296px;--band:132px';
  return `<div class="screen va${fluid ? '' : ' fixed'}" style="${style}"><div class="inner">
    <h1 class="h1">Assetto Corsa Career</h1>
    <div class="cards">${ORDER.map(card).join('')}</div>
    ${foot()}</div></div>`;
};

// ---------- B: continue hero ----------
const variantB = () => {
  const last = MODES.career;
  let cap;
  if (loading()) {
    cap = `<span class="kicker">Continue</span>${sk('55%', 40, 8, true)}${sk('70%', 15, 5, true)}<div class="row" style="margin-top:calc(var(--u) * 10)">${sk('calc(var(--u) * 170)', 52, 8, true)}</div>`;
  } else if (firstRun()) {
    cap = `<span class="kicker">Welcome</span><h2>Start at the bottom of the ladder</h2><p>${last.desc}</p>
      <div class="row" style="margin-top:calc(var(--u) * 10)"><button class="btn pri xl">${I.plus}New career</button></div>`;
  } else {
    cap = `<span class="kicker">Continue · played ${last.played}</span>
      <div class="row" style="gap:calc(var(--u) * 10)"><span class="chip c-career">Career</span></div>
      <div class="row" style="gap:calc(var(--u) * 12)">${flag('GBR')}<h2>${last.who}</h2></div>
      <p>${last.detail}</p>
      <div class="row" style="margin-top:calc(var(--u) * 10)"><button class="btn pri xl">${I.play}Continue</button><button class="btn lg glass">${I.load}Load another</button></div>`;
  }
  const mode = (m) => {
    const d = MODES[m];
    const lastLine = loading() ? sk('60%', 11) : firstRun() ? '' : `<span class="last trunc">${d.who} · ${d.detail}</span>`;
    // The mode already in the hero offers only its other ways in here.
    const acts = m === 'career' && !firstRun() && !loading()
      ? `<button class="btn">${I.plus}New career</button><button class="btn">${I.load}Load <small class="cnt">${d.count}</small></button>`
      : buttons(m);
    return `<div class="mode stripe-${m}"><span class="well ${m}">${I[m]}</span><h3>${d.title}</h3>
      <div class="col" style="gap:calc(var(--u) * 4)">${lastLine}<p class="desc">${d.desc}</p><div class="acts">${acts}</div></div></div>`;
  };
  return `<div class="screen vb"><div class="inner">
    <h1 class="h1">Assetto Corsa Career</h1>
    <div class="hero ph stripe-career"><img class="bg" src="${last.photo}"><div class="cap">${cap}</div></div>
    <div class="modes">${ORDER.map(mode).join('')}</div>
    ${foot()}</div></div>`;
};

// ---------- C: poster tiles ----------
const variantC = () => {
  const tile = (m) => {
    const d = MODES[m];
    return `<div class="tile">
      <div class="ph shade-b stripe-${m}"><img class="bg" src="${d.photo}"><div class="cap"><span class="well lg ${m}">${I[m]}</span><h2>${d.title}</h2></div></div>
      <div class="bd"><p class="desc">${d.desc}</p>${line(m)}<div class="acts">${buttons(m, { size: 'lg' })}</div></div>
    </div>`;
  };
  return `<div class="screen vc">
    <h1 class="h1" style="width:100%;max-width:calc(var(--u) * 1720);margin:0 auto">Assetto Corsa Career</h1>
    <div class="tiles">${ORDER.map(tile).join('')}</div>
    <div style="width:100%;max-width:calc(var(--u) * 1720);margin:0 auto">${foot()}</div></div>`;
};

// ---------- D: side menu over one photograph ----------
const variantD = () => {
  const last = MODES.career;
  const blk = (m) => {
    const d = MODES[m];
    return `<div class="blk"><span class="well lg ${m}">${I[m]}</span><h2>${d.title}</h2><p class="desc">${d.desc}</p>${meta(m)}<div class="acts">${buttons(m)}</div></div>`;
  };
  let caption = '';
  if (loading()) caption = `<div class="caption col" style="align-items:flex-end;gap:calc(var(--u) * 8)">${sk('calc(var(--u) * 90)', 12, 4, true)}${sk('calc(var(--u) * 280)', 26, 6, true)}</div>`;
  else if (!firstRun()) caption = `<div class="caption"><span class="k">Last played · Career</span><b>Brands Hatch GP</b><small>${last.who} · next race Sat 21 Jun</small></div>`;
  return `<div class="screen vd">
    <div class="bgph ph"><img class="bg" src="${last.photo}"></div>
    <div class="panel"><h1 class="h1" style="font-size:calc(var(--u) * 32);margin-bottom:calc(var(--u) * 8)">Assetto Corsa Career</h1>
      ${ORDER.map(blk).join('')}<div class="grow"></div>${foot()}</div>
    ${caption}</div>`;
};

// ---------- E: menu and preview ----------
const variantE = () => {
  const sel = S.sel ?? 'career';
  const accent = { career: 'var(--m-career-solid)', champ: 'var(--m-champ-solid)', quick: 'var(--m-quick-solid)' }[sel];
  const item = (m) => {
    const d = MODES[m];
    const sub = loading() ? sk('70%', 11) : firstRun() ? `<small>${d.first}</small>` : `<small class="trunc">${d.who}</small>`;
    return `<div class="item${m === sel ? ' on' : ''}" data-sel="${m}" style="--sel:${accent}"><span class="well lg ${m}">${I[m]}</span>
      <div class="grow"><b>${d.title}</b>${sub}</div>${m === sel ? I.chev : ''}</div>`;
  };
  const d = MODES[sel];
  let cap;
  if (loading()) cap = `${sk('30%', 12, 4, true)}${sk('55%', 38, 8, true)}${sk('70%', 15, 5, true)}<div class="row">${sk('calc(var(--u) * 170)', 52, 8, true)}</div>`;
  else if (firstRun()) cap = `<span class="chip c-${sel}">${d.title}</span><h2>${d.title}</h2><p>${d.desc}</p><div class="row" style="margin-top:calc(var(--u) * 10)">${buttons(sel, { glass: true, size: 'xl' })}</div>`;
  else cap = `<span class="chip c-${sel}">${d.title} · played ${d.played}</span><div class="row" style="gap:calc(var(--u) * 12)">${d.mark ? flag(d.mark) : ''}<h2>${d.who}</h2></div><p>${d.detail}</p><p style="font-size:calc(var(--u) * 13.5);opacity:.7">${d.desc}</p>
      <div class="row" style="margin-top:calc(var(--u) * 10);flex-wrap:wrap">${buttons(sel, { glass: true, size: 'xl' })}</div>`;
  const recent = loading() || firstRun() ? '' : `<span class="cap-k">Recent</span><div class="recent">${d.recent.map(([n, s, ph, nat]) => `<div class="slot"><div class="ph"><img class="bg" src="${ph}"></div><div><b class="trunc">${nat ? `${flag(nat)} ` : ''}${n}</b><small class="trunc">${s}</small></div></div>`).join('')}</div>`;
  return `<div class="screen ve">
    <div class="menu"><h1 class="h1" style="font-size:calc(var(--u) * 32);margin-bottom:calc(var(--u) * 20)">Assetto Corsa Career</h1>
      ${ORDER.map(item).join('')}<div class="grow"></div>${foot()}</div>
    <div class="preview"><div class="big ph"><img class="bg" src="${d.photo}"><div class="cap">${cap}</div></div>${recent}</div>
  </div>`;
};

const VARIANTS = {
  today: ['Today', () => cards(false), [
    '<b>For comparison: what ships now.</b> Fixed pixels - an 81rem column of three cards with a 132 px photo band, centred. At 1920 × 1080 it is fine; at 3840 × 2160 it is a small island in the middle of the screen with most of the window empty around it, and the text is as small as it is at 1080p.',
  ]],
  a: ['A · Same cards, scaled', () => cards(true), [
    '<b>Today\'s layout, on a unit that grows with the window.</b> Every size on the screen is a multiple of one unit: a pixel at 1080 tall, two pixels at 2160, held between 0.75 and 2.2. So the screen is the same picture at 1080p, 1440p and 4K - only sharper - and a laptop gets a slightly smaller one.',
    'Wider column (about 80% of a 1080p window) and a taller photo band than today, so it fills 1080p properly too.',
    'The smallest change: the components stay as they are, the start screen just stops being a fixed size. The cost is a little empty space above and below on a tall window - the composition does not use the height.',
  ]],
  b: ['B · Continue hero', variantB, [
    '<b>One big hero for whatever was played last</b> - any mode - with Continue as the largest button on the screen and Load another beside it. The hero takes whatever height the window has (within limits), so a tall window gets a bigger photograph rather than empty space.',
    'Below it, the three modes as compact cards with their own ways in. The mode the hero already shows offers only New and Load there, so nothing is offered twice.',
    'First run: the hero becomes a welcome that pitches the career, with New career as the big button.',
    'Scales on the same unit as A, so 1080p and 4K look alike.',
  ]],
  c: ['C · Poster tiles', variantC, [
    '<b>Three tall tiles that fill the window\'s height</b>, each a photograph on top with the mode\'s icon and name, and the description, continue line and buttons below on the card\'s own colours.',
    'The photograph takes the slack: a taller window makes it taller, the text block keeps its size. Capped so an ultrawide or a very tall window centres them rather than stretching them into posters.',
    'Close to the very first design, but on the theme\'s card colours below the photo and scaled with the window, which is what made the original tiles look empty.',
  ]],
  d: ['D · Menu over a photograph', variantD, [
    '<b>A game\'s main menu.</b> One photograph fills the whole window - the track of whatever was played last - and the modes sit in a panel docked on the left, in the theme\'s colours, each with its icon, description, continue line and buttons. The bottom right names what the photograph is.',
    'Any window size is simply more photograph; the panel keeps its width on the screen\'s unit. Works on an ultrawide too.',
    '<b>Departs from an earlier decision</b>: "the start screen follows the theme, only its tiles are photographs". The panel still follows the theme; the photograph is the background rather than a tile.',
  ]],
  e: ['E · Menu and preview', variantE, [
    '<b>Modes as a list on the left, the one picked previewed on the right</b>: a large photograph with where it stands and its buttons, and under it the three most recent careers, championships or races of that mode - each one click from being loaded. Click a mode in the mockup to switch.',
    'The list opens on the mode played last. The preview grows with the window and the recent row keeps its size, so 4K gets a larger picture and nothing stretched.',
    'The one variant that shows more than one slot per mode, which a large screen has room for. One more click than the others to reach a mode that is not picked.',
  ]],
};

const GROUPS = [
  ['v', 'Variant', Object.entries(VARIANTS).map(([k, [label]]) => [k, label])],
  ['screen', 'Screen', Object.entries(SCREENS).map(([k, s]) => [k, s.label])],
  ['first', 'Player', [['no', 'Returning'], ['yes', 'First run']]],
  ['data', 'Data', [['loaded', 'Loaded'], ['loading', 'Loading']]],
  ['theme', 'Theme', [['light', 'Light'], ['dark', 'Dark']]],
];

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  location.replace(`#${new URLSearchParams(S)}`);
  document.getElementById('picker').innerHTML = GROUPS.map(([k, label, opts]) => `<div class="grp"><strong>${label}</strong>${opts.map(([v, l]) => `<button class="opt" data-k="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`).join('')}</div>`).join('');
  const [, draw, notes] = VARIANTS[S.v] ?? VARIANTS.a;
  const shared = '<b>The same in every variant:</b> the buttons (Continue, New, Load with its count; Open races, New race; New and Load on a first run), Settings and Exit, the install status, and the screen following the theme. While loading only the continue lines, Load counts and status shimmer, and Continue waits disabled. <b>Every variant but Today scales on one unit</b> - in the app, the start screen\'s root font size off the window\'s shorter side, with everything in rem.';
  document.getElementById('why').innerHTML = `<div class="box"><ul>${notes.map((n) => `<li>${n}</li>`).join('')}</ul><ul style="margin-top:8px;color:var(--muted-foreground)"><li>${shared}</li></ul></div>`;
  const scr = SCREENS[S.screen] ?? SCREENS.uhd;
  const stage = document.getElementById('stage');
  const width = stage.clientWidth - 48;
  const scale = Math.min(1, width / scr.w);
  stage.innerHTML = `<div class="scalebox" style="width:${scr.w * scale}px;height:${scr.h * scale}px">
    <span class="note">${scr.label} · shown at ${Math.round(scale * 100)}%</span>
    <div class="win" style="width:${scr.w}px;height:${scr.h}px;transform:scale(${scale})">
      <div class="titlebar"><span>Assetto Corsa Career</span><span>—</span><span>☐</span><span>✕</span></div>
      <div class="host">${draw()}</div></div></div>`;
};

document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  render();
});
document.getElementById('stage').addEventListener('click', (e) => {
  const item = e.target.closest('[data-sel]');
  if (!item) return;
  S.sel = item.dataset.sel;
  render();
});
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
