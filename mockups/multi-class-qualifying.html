<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-class qualifying and grids - mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-soft: oklch(0.93 0.05 155); --success-soft-fg: oklch(0.34 0.09 155);
  --destructive: oklch(0.58 0.22 27);
  --s-practice: oklch(0.93 0.045 250); --s-practice-fg: oklch(0.4 0.13 258);
  --s-qualify: oklch(0.93 0.05 310); --s-qualify-fg: oklch(0.4 0.15 310);
  --s-race: oklch(0.89 0.085 150); --s-race-fg: oklch(0.33 0.1 152);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118);
  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88); --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255); --t3-fg: oklch(0.42 0.015 260);
  --rc1: oklch(0.92 0.055 195); --rc1-fg: oklch(0.38 0.09 200);
  --rc2: oklch(0.92 0.06 18); --rc2-fg: oklch(0.42 0.13 22);
  --rc3: oklch(0.92 0.06 340); --rc3-fg: oklch(0.4 0.13 340);
  --gold: oklch(0.9 0.085 88); --gold-fg: oklch(0.42 0.1 75);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --popover: oklch(0.23 0.014 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-soft: oklch(0.32 0.06 155); --success-soft-fg: oklch(0.86 0.11 155);
  --destructive: oklch(0.66 0.2 25);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88); --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --rc1: oklch(0.33 0.06 195); --rc1-fg: oklch(0.86 0.09 195);
  --rc2: oklch(0.33 0.07 18); --rc2-fg: oklch(0.86 0.09 22);
  --rc3: oklch(0.33 0.07 340); --rc3-fg: oklch(0.86 0.1 340);
  --gold: oklch(0.36 0.07 88); --gold-fg: oklch(0.89 0.12 92);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker .grp[hidden] { display: none; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 3px 0; }
.why code { font-size: 12.5px; }
.why h3 { color: var(--foreground); font-size: 14px; margin: 14px 0 4px; }
.newtag { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--primary); text-transform: uppercase; }
.newring { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 4px; border-radius: 8px; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 24px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.shead { padding: 12px 0 0; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }
.shead h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs span { padding: 8px 12px; font-size: 13.5px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs span.on { color: var(--foreground); font-weight: 600; border-color: var(--primary); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip.solid { background: var(--primary); color: var(--primary-foreground); }
.chip.outline { border: 1px solid var(--border); }
.chip.ok { background: var(--success-soft); color: var(--success-soft-fg); }
.c-practice { background: var(--s-practice); color: var(--s-practice-fg); }
.c-qualify { background: var(--s-qualify); color: var(--s-qualify-fg); }
.c-race { background: var(--s-race); color: var(--s-race-fg); }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-t1 { background: var(--t1); color: var(--t1-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-t3 { background: var(--t3); color: var(--t3-fg); }
.c-rc1 { background: var(--rc1); color: var(--rc1-fg); }
.c-rc2 { background: var(--rc2); color: var(--rc2-fg); }
.c-rc3 { background: var(--rc3); color: var(--rc3-fg); }
.m-rc1 { background: var(--rc1-fg); } .m-rc2 { background: var(--rc2-fg); } .m-rc3 { background: var(--rc3-fg); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost.red { color: var(--destructive); }
.btn.icon { width: 28px; padding: 0; }
.btn.dashed { border-style: dashed; color: var(--muted-foreground); }
.input { height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: inline-flex; align-items: center; font-size: 13.5px; }
.input.ph { color: var(--muted-foreground); }
.input.r { justify-content: flex-end; font-variant-numeric: tabular-nums; }
.select { justify-content: space-between; gap: 8px; }
.placeholder { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; color: var(--muted-foreground); font-size: 12.5px; text-align: center; }
.hint { font-size: 12px; color: var(--muted-foreground); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > .lbl { font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.rule { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.rule::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ChoiceChips, as the editor draws them. */
.choices { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; width: fit-content; }
.choices button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); }
.choices button:not(:disabled):not([aria-checked="true"]):hover { background: var(--accent); color: var(--foreground); }
.choices button[aria-checked="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / .08), 0 0 0 1px var(--border); }
.choices button[aria-checked="true"].c-qualify { background: var(--s-qualify); color: var(--s-qualify-fg); box-shadow: none; }
.choices button[aria-checked="true"].c-practice { background: var(--s-practice); color: var(--s-practice-fg); box-shadow: none; }
.choices button[aria-checked="true"].c-race { background: var(--s-race); color: var(--s-race-fg); box-shadow: none; }
.choices button:disabled { opacity: .5; }

/* An info mark with its tooltip, drawn as ui/tooltip.tsx draws one. */
.info { position: relative; display: inline-grid; place-items: center; color: var(--muted-foreground); }
.info svg { width: 14px; height: 14px; }
.tip { position: absolute; z-index: 30; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: 260px;
  background: var(--foreground); color: var(--background); border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 400; line-height: 1.4;
  text-transform: none; letter-spacing: 0; white-space: normal; text-align: left; opacity: 0; pointer-events: none; transition: opacity .1s; }
.tip::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--foreground); }
.info:hover .tip, .info.open .tip { opacity: 1; }
.mark-tip { color: inherit; opacity: .85; }
.mark-tip.newring { outline-offset: 2px; }
.tip.below { bottom: auto; top: calc(100% + 8px); left: -12px; transform: none; }
.tip.below::after { top: auto; bottom: 100%; left: 19px; border-top-color: transparent; border-bottom-color: var(--foreground); }

/* ---------- Format card and session split ---------- */
.fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.fstrip { display: flex; gap: 2px; }
.fstrip i { display: block; width: 14px; height: 6px; border-radius: 2px; }
.fstrip .p { background: var(--s-practice-fg); } .fstrip .q { background: var(--s-qualify-fg); } .fstrip .r { background: var(--s-race-fg); }
.split { display: grid; grid-template-columns: 19rem minmax(0, 1fr); }
.slist { background: color-mix(in oklch, var(--muted) 30%, transparent); border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.slist .day { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); margin-top: 6px; display: flex; justify-content: space-between; }
.slist .day:first-child { margin-top: 0; }
.sblock { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: start; border-radius: 8px; padding: 8px; text-align: left; border: 0; width: 100%; }
.sblock.on { box-shadow: 0 0 0 2px var(--primary); }
.sblock b { font-size: 13.5px; display: block; }
.sblock small { display: flex; align-items: center; gap: 4px; font-size: 12px; opacity: .85; }
.sblock .len { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sblock .grip { opacity: .5; margin-top: 2px; }
.sblock small.new { opacity: 1; font-weight: 600; }
.spage { padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.spage h3 { margin: 0; font-size: 15px; font-weight: 600; }
.two { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; }

/* ---------- The grid diagram - ReverseDiagram's kin ---------- */
.gd { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.gd .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gd .lab { width: 118px; flex: none; }
.gd .slots { display: flex; flex-wrap: wrap; gap: 2px; }
.gd .slot { display: grid; place-items: center; height: 20px; min-width: 18px; padding: 0 3px; border-radius: 3px; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gd .slot.none { outline: 1px dashed currentColor; outline-offset: -1px; }
.gd .gap { width: 6px; }
.gd .legend { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }

/* ---------- Class lists ---------- */
.ctab { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 16px; align-items: start; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.clist-h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); padding: 0 2px; }
.clist-h .arrow { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
.citem { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 10px; }
.citem.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.medal { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.citem .t { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 1px; }
.citem .t b { font-weight: 600; }
.citem .t small { font-size: 12px; color: var(--muted-foreground); }
.qitem { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 10px 10px 10px 16px; overflow: hidden; }
.qitem .mark { position: absolute; inset: 0 auto 0 0; width: 4px; }
.qitem.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; height: 28px; }
.stepper span { width: 26px; text-align: center; color: var(--muted-foreground); }
.stepper b { width: 40px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }
.bar { display: flex; gap: 2px; height: 10px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--popover); border: 1px solid var(--border); border-radius: 8px; padding: 4px; min-width: 180px; box-shadow: 0 8px 24px oklch(0 0 0 / .14); }
.menu div { padding: 6px 8px; border-radius: 5px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.menu div.hl { background: var(--accent); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

/* ---------- Round page ---------- */
.rlayout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.ses { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
.ses:first-of-type { border-top: 0; }
.ses.cur { background: var(--accent); }
.ses .nm { display: flex; flex-direction: column; min-width: 0; }
.ses .nm b { font-size: 13.5px; font-weight: 600; }
.ses .nm small { font-size: 12px; color: var(--muted-foreground); }
.sdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; }
.sdot.done { background: var(--success); border-color: var(--success); color: var(--card); }
.sdot.done svg { width: 10px; height: 10px; stroke-width: 3; }
.sdot.next { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 8px var(--primary); }
table.cls { width: 100%; border-collapse: collapse; font-size: 13px; }
table.cls th { text-align: left; font-weight: 400; color: var(--muted-foreground); font-size: 12px; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); }
table.cls td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.cls td:first-child, table.cls th:first-child { padding-left: 12px; }
table.cls tr.you td { background: color-mix(in oklch, var(--primary) 8%, transparent); font-weight: 600; }
table.cls tr.sim td { color: var(--muted-foreground); }
table.cls tr.sim td.drv { color: var(--foreground); }
table.cls .cp { display: inline-flex; gap: 6px; align-items: center; }
.foot { display: flex; gap: 6px; align-items: center; padding: 10px 12px; font-size: 12px; color: var(--muted-foreground); }
.brief { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--muted); }
.brief b { font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 16px; }

@media (max-width: 900px) {
  .split, .ctab, .rlayout { grid-template-columns: 1fr; }
  .slist { border-right: 0; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="picker">
  <div class="grp" id="g-view"><strong>Screen</strong>
    <button class="opt" data-view="quali" aria-pressed="true">Formats - qualifying</button>
    <button class="opt" data-view="race">Formats - race</button>
    <button class="opt" data-view="classes">Classes tab</button>
    <button class="opt" data-view="quick">Race tab</button>
    <button class="opt" data-view="round">Round page</button>
  </div>
  <div class="grp"><strong>Theme</strong>
    <button class="opt" data-theme-set="light" aria-pressed="true">Light</button>
    <button class="opt" data-theme-set="dark">Dark</button>
  </div>
  <div class="grp"><strong>Classes</strong>
    <button class="opt" data-classes="1">1</button>
    <button class="opt" data-classes="3" aria-pressed="true">3</button>
  </div>
  <div class="grp"><strong>Tooltips</strong>
    <button class="opt" data-tips="hover" aria-pressed="true">On hover</button>
    <button class="opt" data-tips="open">All open</button>
  </div>
</div>

<div class="why" id="why"></div>

<div class="frame">
  <nav class="app-nav">
    <span class="brand">Another Assetto Corsa Career</span><span>Home</span><span>Inbox</span><span>Calendar</span><span>Championships</span>
    <span id="nav-race">Race</span><span id="nav-settings" class="on">Settings</span>
  </nav>
  <div id="screen"></div>
</div>

<div class="why" id="notes" style="padding-bottom:60px"></div>

<script>
// ---------- Icons ----------
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  grip: '<svg class="i grip" viewBox="0 0 24 24" style="width:14px;height:14px"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>',
  corner: '<svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m15 10 5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  copy: '<svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;opacity:.5"><path d="m6 9 6 6 6-6"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>',

// ---------- State ----------
const S = { view: 'quali', qualify: 'together', grid: 'class', knockout: false, classes: 3 };

// The example championship: three classes, fastest first, slot colours as a
// result draws them.
const CLASSES = [
  { id: 'proto', name: 'Prototype', tier: 1, seats: 6, spec: 'LMP 2020s', rc: 1 },
  { id: 'gt3', name: 'GT3', tier: 2, seats: 10, spec: 'GT3 2020s', rc: 2 },
  { id: 'gt4', name: 'GT4', tier: 3, seats: 8, spec: 'GT4 2020s', rc: 3 },

const rcOf = (id) => CLASSES.find((one) => one.id === id).rc;
const shown = () => CLASSES.slice(0, S.classes);
const multi = () => S.classes > 1;

const tip = (text, below = false) => `<span class="info${document.body.dataset.tips === 'open' ? ' open' : ''}" tabindex="0">${I.info}<span class="tip${below ? ' below' : ''}">${text}</span></span>`;
// An icon whose meaning is a tooltip.
const iconTip = (icon, text) => `<span class="info mark-tip newring${document.body.dataset.tips === 'open' ? ' open' : ''}" tabindex="0" aria-label="${text}">${icon}<span class="tip">${text}</span></span>`;
const choices = (label, options, value, key, disabledOf = () => false) => `
  <div class="choices" role="radiogroup" aria-label="${label}">
    ${options.map(([v, text, accent]) => `<button role="radio" data-set="${key}" data-value="${v}" aria-checked="${v === value}" class="${v === value && accent ? accent : ''}" ${disabledOf(v) ? 'disabled' : ''}>${text}</button>`).join('')}
  </div>`;

// ---------- Shared pieces ----------
const editorHead = (tab) => `

  </div>`;

const sblock = (type, name, len, line, on, isNew, mark = '') => `
  <button class="sblock c-${type}${on ? ' on' : ''}">

    <span style="min-width:0">
      <b>${name}</b>
      ${line ? `<small class="${isNew ? 'new' : ''}">${I.corner}${line}</small>` : ''}

    <span class="len row" style="gap:6px;flex-wrap:nowrap">${mark}${len}</span>

// An apart qualifying is marked by an icon alone, its words on hover.
const qualiMark = () => (multi() && S.qualify === 'apart' ? iconTip(I.rows, 'Each class apart') : '');

const formatCard = (selected, page) => `

const typeRow = (type, name) => `

// The new Classes section of a qualifying session.
const qualiClasses = () => (!multi() ? '' : `

// ---------- The grid diagram ----------
// A qualifying result, overall on times: class and whether it set a time.
// P4 is a slow prototype a GT3 beat, and the last GT3 set no time at all.
const QUALI = [
  ['proto', true], ['proto', true], ['gt3', true], ['proto', true], ['gt3', true],
  ['gt4', true], ['gt3', true], ['gt4', true], ['gt3', false],
];

const slot = ([cls, timed], label) => `<span class="slot c-rc${rcOf(cls)}${timed ? '' : ' none'}" title="${timed ? '' : 'No time set'}">${label}</span>`;

const gridDiagram = () => {
  if (S.qualify === 'apart') {
    // Each class's own session, then the classes in order.
    const byClass = CLASSES.map((one) => QUALI.map((car, at) => [car, at]).filter(([car]) => car[0] === one.id));
    const own = byClass.map((cars) => cars.map(([car], at) => slot(car, at + 1)).join('')).join('<span class="gap"></span>');

    return `
      <div class="gd">
        <div class="line"><span class="lab">Qualifying, by class</span><span class="slots">${own}</span></div>
        <div class="line"><span class="lab">${I.arrow} grid</span><span class="slots">${byClass.flat().map(([car], at) => slot(car, at + 1)).join('')}</span></div>
        <div class="legend">${CLASSES.map((one) => `<span class="chip c-rc${one.rc}">${one.name}</span>`).join('')}<span>· dashed: no time set</span></div>
      </div>`;
  }

  const finish = QUALI.map((car, at) => slot(car, at + 1)).join('');
  const order = S.grid === 'mixed'
    ? QUALI.map((car, at) => [car, at])
    : CLASSES.flatMap((one) => QUALI.map((car, at) => [car, at]).filter(([car]) => car[0] === one.id));

  return `
    <div class="gd">
      <div class="line"><span class="lab">Qualifying finish</span><span class="slots">${finish}</span></div>
      <div class="line"><span class="lab">${I.arrow} grid</span><span class="slots">${order.map(([car, at]) => slot(car, at + 1)).join('')}</span></div>
      <div class="legend">${CLASSES.map((one) => `<span class="chip c-rc${one.rc}">${one.name}</span>`).join('')}<span>· dashed: no time set</span></div>
    </div>`;
};

// The new Classes section of a race.
const raceClasses = () => {
  if (!multi()) return '';
  const apart = S.qualify === 'apart';
  const value = apart ? 'class' : S.grid;

  return `

    <div class="field newring">
      <span class="lbl">On the grid ${tip('A faster class is one listed higher on the Classes tab.')}</span>

      ${gridDiagram()}
    </div>`;
};

  <ul>
    <li><b>Where the two settings live.</b> On the sessions themselves, as <code>inherit</code> and <code>start</code> do: a qualifying says how classes qualify, a race says how they line up. Shown only with more than one class, and so is the class list's <i>Fastest first</i>, since one class has no order.</li>
    <li><b>Defaults.</b> <i>All together</i> and <i>Faster classes first</i>. The second changes today's behaviour for multi-class grids, which mix on times; the shipped NLS-style championships are set to <i>Mixed on times</i> explicitly.</li>
    <li><b>Reverse grid with classes apart.</b> The top N of <i>each class</i> reversed, the same way a knockout's carried-over count reads per class.</li>
  </ul>
  <h3>How it works underneath (sketch)</h3>
  <ul>
    <li><code>SessionDefinition.classes?: 'apart'</code> on a qualifying, <code>SessionDefinition.grid?: 'mixed'</code> on a race - unset is the default, so nothing written today changes shape.</li>
    <li>Class speed is the class's place in the event's class list - <code>Championship.entries</code>, <code>QuickRace.classes</code> - carried onto the plan, since <code>plan.grid</code> leads with the player and loses that order.</li>
    <li><code>startingGrid</code> sorts the composed order by class, stably, unless the race mixes. A car with no time is already last in its qualifying order, so it stays last of its class.</li>
    <li>An apart qualifying launches the player's class alone (as a knockout narrows a field); on landing, the other classes are invented off their AI level with seeded jitter and joined class by class, recorded on the launch as simulated classes.</li>
    <li><code>simulateRound</code>'s qualifying and <code>simulateSegment</code> rank within each class and stand the classes in order, whatever either setting says.</li>
    <li><code>validateSeries</code> refuses a race that mixes behind an apart qualifying - the editor disables that choice.</li>
  </ul>`;

// ---------- Rendering ----------
const render = () => {
  const view = VIEWS[S.view];
  document.getElementById('screen').innerHTML = view.render();
  document.getElementById('why').innerHTML = view.why;
  document.getElementById('notes').innerHTML = NOTES;
  document.getElementById('nav-settings').className = view.nav === 'settings' ? 'on' : '';
  document.getElementById('nav-race').className = view.nav === 'race' ? 'on' : '';
  document.querySelectorAll('[data-view]').forEach((one) => one.setAttribute('aria-pressed', String(one.dataset.view === S.view)));
  document.querySelectorAll('.picker .extra').forEach((one) => one.remove());
  if (view.extra) {
    const holder = document.createElement('div');
    holder.className = 'grp extra';
    holder.style.gap = '16px';
    holder.innerHTML = view.extra();
    document.querySelector('.picker').appendChild(holder);
  }
};

document.addEventListener('click', (event) => {
  const target = event.target.closest('button');
  if (!target) return;
  const { dataset } = target;
  if (dataset.view) S.view = dataset.view;
  else if (dataset.themeSet) {
    document.documentElement.dataset.theme = dataset.themeSet;
    document.querySelectorAll('[data-theme-set]').forEach((one) => one.setAttribute('aria-pressed', String(one === target)));
    return;
  } else if (dataset.tips) {
    document.body.dataset.tips = dataset.tips;
    document.querySelectorAll('[data-tips]').forEach((one) => one.setAttribute('aria-pressed', String(one === target)));
  } else if (dataset.set === 'qualify') S.qualify = dataset.value;
  else if (dataset.set === 'grid') S.grid = dataset.value;
  else if (dataset.q) S.qualify = dataset.q;
  else if (dataset.g) S.grid = dataset.g;
  else if (dataset.knock) S.knockout = dataset.knock === '1';
  else if (dataset.classes) {
    S.classes = Number(dataset.classes);
    document.querySelectorAll('[data-classes]').forEach((one) => one.setAttribute('aria-pressed', String(one === target)));
  }
  else return;
  render();
});

// #view,dark,apart,mixed,open - for linking straight to a state.
location.hash.slice(1).split(',').forEach((part) => {
  if (VIEWS[part]) S.view = part;
  if (part === 'dark') document.documentElement.dataset.theme = 'dark';
  if (part === 'apart') S.qualify = 'apart';
  if (part === 'mixed') S.grid = 'mixed';
  if (part === 'knockout') S.knockout = true;
  if (part === 'one') S.classes = 1;
  if (part === 'open') document.body.dataset.tips = 'open';
});

render();
</script>
</body>
