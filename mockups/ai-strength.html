<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI strength per round mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --input: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-soft: oklch(0.93 0.05 155); --success-soft-fg: oklch(0.34 0.09 155);
  --destructive: oklch(0.58 0.22 27);
  --s-practice: oklch(0.93 0.045 250); --s-practice-fg: oklch(0.4 0.13 258);
  --s-qualify: oklch(0.93 0.05 310); --s-qualify-fg: oklch(0.4 0.15 310);
  --s-race: oklch(0.89 0.085 150); --s-race-fg: oklch(0.33 0.1 152);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270);
  --t-platinum: oklch(0.945 0.022 210); --t-platinum-fg: oklch(0.4 0.05 215);
  --t-gold: oklch(0.9 0.085 88); --t-gold-fg: oklch(0.42 0.1 75);
  --oceanic: oklch(0.925 0.03 232); --oceanic-fg: oklch(0.4 0.05 235);
  --rc1: oklch(0.93 0.05 195); --rc1-fg: oklch(0.36 0.09 200);
  --rc2: oklch(0.92 0.06 18); --rc2-fg: oklch(0.42 0.13 22);
  --rc3: oklch(0.93 0.05 340); --rc3-fg: oklch(0.38 0.12 340);
  --sk: oklch(0.925 0.018 255); --sk-hi: oklch(0.965 0.01 255); --sk-deep: oklch(0.885 0.02 255);
  --map-filter: none;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --input: oklch(1 0 0 / 16%);
  --success: oklch(0.7 0.15 158);
  --success-soft: oklch(0.32 0.06 155); --success-soft-fg: oklch(0.86 0.11 155);
  --destructive: oklch(0.66 0.2 25);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);
  --t-platinum: oklch(0.34 0.025 210); --t-platinum-fg: oklch(0.9 0.03 210);
  --t-gold: oklch(0.36 0.07 88); --t-gold-fg: oklch(0.89 0.12 92);
  --oceanic: oklch(0.32 0.03 232); --oceanic-fg: oklch(0.85 0.045 235);
  --rc1: oklch(0.32 0.06 195); --rc1-fg: oklch(0.86 0.09 200);
  --rc2: oklch(0.33 0.07 18); --rc2-fg: oklch(0.86 0.09 22);
  --rc3: oklch(0.33 0.07 340); --rc3-fg: oklch(0.86 0.1 340);
  --sk: oklch(0.3 0.016 265); --sk-hi: oklch(0.345 0.016 265); --sk-deep: oklch(0.27 0.016 265);
  --map-filter: invert(1);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.caps { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker .grp[hidden] { display: none; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why code { font-size: 12.5px; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.shead { padding: 12px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head-row h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2; }
.over { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted-foreground); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 13.5px; color: var(--muted-foreground); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); border-radius: 99px; padding: 2px 8px 2px 10px; color: var(--foreground); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.map { width: 144px; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--muted); display: grid; place-items: center; overflow: hidden; flex: none; }
.map img { width: 88%; height: 88%; object-fit: contain; filter: var(--map-filter); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-road { background: var(--d-road); color: var(--d-road-fg); }
.c-t1 { background: var(--t-platinum); color: var(--t-platinum-fg); }
.c-t2 { background: var(--t-gold); color: var(--t-gold-fg); }
.c-oceanic { background: var(--oceanic); color: var(--oceanic-fg); }
.c-done { background: var(--success-soft); color: var(--success-soft-fg); }
.c-practice { background: var(--s-practice); color: var(--s-practice-fg); }
.c-qualify { background: var(--s-qualify); color: var(--s-qualify-fg); }
.c-race { background: var(--s-race); color: var(--s-race-fg); }
.c-rc1 { background: var(--rc1); color: var(--rc1-fg); }
.c-rc2 { background: var(--rc2); color: var(--rc2-fg); }
.c-rc3 { background: var(--rc3); color: var(--rc3-fg); }
.c-entered { background: color-mix(in oklch, var(--primary) 14%, var(--card)); color: var(--primary); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel-h { padding: 12px 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel .pb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.lg { height: 38px; padding: 0 16px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted-foreground); height: 26px; padding: 0 6px; font-size: 12.5px; }
.btn.ghost:hover { color: var(--foreground); background: var(--accent); }
.link { color: var(--primary); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.placeholder { border: 1px dashed var(--border); border-radius: 12px; padding: 14px; color: var(--muted-foreground); font-size: 12.5px; text-align: center; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.layout.wide { grid-template-columns: 320px minmax(0, 1fr); }
.side { display: flex; flex-direction: column; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* The car picture well, with the component's own fallback icon. */
.well { aspect-ratio: 16 / 9; border-radius: 8px; background: var(--muted); display: grid; place-items: center; color: color-mix(in oklch, var(--muted-foreground) 45%, transparent); }
.well svg { width: 32px; height: 32px; }

/* ---------- The AI strength card - AiResult, as the race page and the editor draw it ---------- */
.ai-row { display: flex; align-items: center; gap: 8px; }
.ai-row label { flex: 1; font-size: 13.5px; font-weight: 500; display: flex; flex-direction: column; line-height: 1.25; }
.ai-row label small { font-size: 11.5px; font-weight: 400; color: var(--muted-foreground); }
.stepper { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; width: 112px; height: 36px; border: 1px solid var(--input); border-radius: 8px; align-items: stretch; overflow: hidden; flex: none; }
.stepper button { border: 0; background: transparent; color: var(--muted-foreground); display: grid; place-items: center; padding: 0; }
.stepper button:hover { background: var(--accent); color: var(--foreground); }
.stepper button:disabled { opacity: .5; cursor: not-allowed; }
.stepper b { display: grid; place-items: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* Signed in colour, as OffsetStepper is: a plain number would not say which way it leans. */
.stepper b.up { color: var(--success); }
.stepper b.down { color: var(--destructive); }
.stepper b.zero { color: var(--muted-foreground); font-weight: 400; }
.figline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.figure { font-size: 26px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.chain { display: flex; flex-wrap: wrap; gap: 0 6px; font-size: 12px; color: var(--muted-foreground); }
.chain span + span::before { content: '·'; margin-right: 6px; }
.chain b { color: var(--foreground); font-weight: 600; font-variant-numeric: tabular-nums; }
.chain .mine b { color: var(--primary); }
.bar { position: relative; height: 24px; }
.bar .track { position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 99px; background: var(--muted); }
.bar .band { position: absolute; top: 8px; height: 10px; border-radius: 99px; background: color-mix(in oklch, var(--primary) 35%, transparent); }
.bar .was { position: absolute; top: 6px; height: 14px; width: 2px; transform: translateX(-50%); background: color-mix(in oklch, var(--muted-foreground) 60%, transparent); }
.bar .at { position: absolute; top: 4px; height: 18px; width: 3px; transform: translateX(-50%); border-radius: 2px; background: var(--primary); }
.ends { display: flex; font-size: 12px; color: var(--muted-foreground); }
.ends span:first-child, .ends span:last-child { flex: 1; }
.ends span:last-child { text-align: right; }
.classes { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 8px; }
.classes .cl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.classes .cl .nm { flex: 1; display: flex; align-items: center; gap: 6px; }
.classes .cl b { font-variant-numeric: tabular-nums; font-weight: 600; }
.note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted-foreground); background: var(--muted); border-radius: 8px; padding: 8px 10px; }
.note svg { margin-top: 2px; }
.note b { color: var(--foreground); font-weight: 600; }
.raced { display: flex; flex-direction: column; }
.raced .rr { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.raced .rr:first-child { border-top: 0; }
.raced .rr b { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 650; }
.raced .rr small { font-size: 11.5px; color: var(--muted-foreground); }
.subrounds { display: flex; flex-direction: column; border-top: 1px solid var(--border); padding-top: 8px; gap: 2px; }
.subrounds a { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 5px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; }
.subrounds a:hover { background: var(--accent); }
.subrounds a b { font-variant-numeric: tabular-nums; }
.subrounds .off-up { color: var(--success); font-weight: 600; font-variant-numeric: tabular-nums; }
.subrounds .off-down { color: var(--destructive); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Event list and briefing, as the round page draws them ---------- */
.ses { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); text-align: left; width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; }
.ses:hover { background: color-mix(in oklch, var(--accent) 50%, transparent); }
.ses[aria-current="true"] { background: var(--accent); }
.ses .nm { display: flex; flex-direction: column; min-width: 0; }
.ses .nm b { font-size: 13.5px; font-weight: 600; }
.ses .nm small { font-size: 12px; color: var(--muted-foreground); }
.sdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; }
.sdot.done { background: var(--success); border-color: var(--success); color: var(--card); }
.sdot.done svg { width: 10px; height: 10px; stroke-width: 3; }
.sdot.next { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 8px var(--primary); }
.sval { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tile .k { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.tile b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile small { font-size: 12px; color: var(--muted-foreground); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border); border-radius: 10px; }
.strip > div { padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; }
.strip > div:not(:first-child) { border-left: 1px solid var(--border); }
.strip .k { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.strip b { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; min-height: 30px; display: flex; align-items: center; }
.strip small { font-size: 12px; color: var(--muted-foreground); }
.strip .new { box-shadow: inset 0 0 0 2px color-mix(in oklch, var(--primary) 45%, transparent); border-radius: 0 10px 10px 0; }
.rc { display: inline-grid; place-items: center; min-width: 40px; height: 30px; padding: 0 5px; border-radius: 6px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rc.pts { background: var(--success-soft); color: var(--success-soft-fg); }
.launch { display: flex; justify-content: flex-end; }
.newtag { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--primary); text-transform: uppercase; }

/* ---------- Skeleton primitives, as mockups/loading.html draws them ---------- */
.sk { display: block; background: var(--sk); border-radius: 6px; flex: none;
  background-image: linear-gradient(100deg, transparent 0 40%, var(--sk-hi) 50%, transparent 60% 100%);
  background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }
.sk.round { border-radius: 99px; }
.sk.deep { background-color: var(--sk-deep); }
@keyframes sweep { from { background-position: 100vw 0; } to { background-position: -100vw 0; } }
</style>
</head>
<body>
<div class="picker">
  <div class="grp"><strong>Page</strong>
    <button class="opt" data-k="page" data-v="round">Round page</button>
    <button class="opt" data-k="page" data-v="champ">Championship page</button>
    <button class="opt" data-k="page" data-v="quick">Race event (Race tab)</button>
  </div>
  <div class="grp" data-for="round champ"><strong>Season adjustment</strong>
    <button class="opt" data-k="where" data-v="A">A - on the round page</button>
    <button class="opt" data-k="where" data-v="B">B - on the championship page</button>
  </div>
  <div class="grp" data-for="round quick"><strong>Moment</strong>
    <button class="opt" data-k="moment" data-v="before" data-only="round">Before the event</button>
    <button class="opt" data-k="moment" data-v="between">Between sessions</button>
    <button class="opt" data-k="moment" data-v="over">Event over</button>
  </div>
  <div class="grp" data-for="round"><strong>Field</strong>
    <button class="opt" data-k="field" data-v="one">One class</button>
    <button class="opt" data-k="field" data-v="multi">Multi-class</button>
  </div>
  <div class="grp"><strong>State</strong>
    <button class="opt" data-k="load" data-v="loaded">Loaded</button>
    <button class="opt" data-k="load" data-v="loading">Loading</button>
  </div>
  <div class="grp"><strong>Theme</strong>
    <button class="opt" data-k="th" data-v="light">Light</button>
    <button class="opt" data-k="th" data-v="dark">Dark</button>
  </div>
</div>
<div class="why" id="why"></div>
<div class="frame" id="app"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="m9 18 6-6-6-6"/></svg>',
  minus: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M5 12h14"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  lock: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  reset: '<svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>',
  car: '<svg class="i" viewBox="0 0 24 24"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-5a2 2 0 0 1 2-1h8a2 2 0 0 1 2 1l2 5v4H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg>',

// ---------- The arithmetic, as aiFigure does it ----------
const YOURS = 88;
const SPREAD = 2;
const fig = (...terms) => Math.max(0, Math.min(100, Math.round(terms.reduce((a, b) => a + b, 0))));
const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
const along = (f) => `${f}%`;

// ---------- Two rounds a career has entered ----------
const ONE = {
  series: 'GT3 Sprint Series', disc: ['sports', 'Sportscar'], tier: 2, champ: 2, climate: 'Oceanic',
  round: 'Spa-Francorchamps', number: 4, rounds: 8, date: 'Saturday 16 May 2026', grid: 24, track: 'spa',
  car: 'Ferrari 488 GT3', team: 'Kessel Racing', entry: 'GT3',
  classes: [{ name: 'GT3', off: 0, me: true }],
};
const MULTI = {
  series: 'WEC 2023', disc: ['sports', 'Sportscar'], tier: 1, champ: 0, climate: 'Oceanic',
  round: '6 Hours of Spa-Francorchamps', number: 3, rounds: 7, date: 'Saturday 29 April 2026', grid: 36, track: 'spa',
  car: 'Porsche 911 RSR', team: 'Dempsey-Proton Racing', entry: 'GTE Am',
  classes: [{ name: 'Hypercar', off: 4 }, { name: 'LMP2', off: 1 }, { name: 'GTE Am', off: -1, me: true }],
};
const SESSIONS = [
  { type: 'practice', name: 'Practice', when: 'Day 1 · 10:00', len: '60 min' },
  { type: 'qualify', name: 'Qualifying', when: 'Day 1 · 15:00', len: '15 min' },
  { type: 'race', name: 'Race', when: 'Day 2 · 14:00', len: '25 laps' },
];
// What each launch recorded: the season and the round at the moment it went out.
// Practice ran before the round was turned down, so it ran 3 higher.
const RECORDED = { practice: { season: -2, round: 0 }, qualify: { season: -2, round: -3 }, race: { season: -2, round: -3 } };
const OTHER_ROUNDS = [['Monza', 2], ['Spa-Francorchamps', null], ['Zandvoort', -1]];

const state = {
  page: 'round', where: 'A', moment: 'between', field: 'one', load: 'loaded', th: 'light',
  season: -2, round: -3, quick: -2, picked: null,
};
const champ = () => (state.field === 'multi' ? MULTI : ONE);
const mine = (c) => c.classes.find((one) => one.me);

// ---------- Pieces ----------
const sk = (w, h, cls = '') => `<span class="sk ${cls}" style="width:${typeof w === 'number' ? `${w}px` : w};height:${h}px"></span>`;
const chip = (cls, text) => `<span class="chip ${cls}">${text}</span>`;
const sessionChip = (type) => chip(`c-${type}`, { practice: 'Practice', qualify: 'Qualifying', race: 'Race' }[type]);
const stepper = (key, value, disabled = false) => `<div class="stepper">
  <button type="button" data-step="${key}:-1" ${disabled ? 'disabled' : ''} aria-label="Less">${I.minus}</button>
  <b class="${value > 0 ? 'up' : value < 0 ? 'down' : 'zero'}">${value === 0 ? '0' : signed(value)}</b>
  <button type="button" data-step="${key}:1" ${disabled ? 'disabled' : ''} aria-label="More">${I.plus}</button>
</div>`;
const bar = (figure, without) => `<div class="bar" aria-hidden="true"><div class="track"></div>
  <div class="band" style="left:${along(fig(figure, -SPREAD))};width:${fig(figure, SPREAD) - fig(figure, -SPREAD)}%"></div>
  ${without === figure ? '' : `<div class="was" style="left:${along(without)}" title="Without your adjustments"></div>`}
  <div class="at" style="left:${along(figure)}"></div></div>`;
const ends = (figure) => `<div class="ends"><span>0</span><span class="num">drivers ${fig(figure, -SPREAD)}-${fig(figure, SPREAD)}</span><span>100</span></div>`;
const chainOf = (terms) => `<span class="chain">${terms.map(([label, value, own]) => `<span class="${own ? 'mine' : ''}">${label} <b>${label === 'yours' ? value : signed(value)}</b></span>`).join('')}</span>`;
const panelTitle = (text, end = '') => `<div class="panel-h"><span class="caps">${text}</span>${end}</div>`;

// The card under Your entry: the season and the round, or the round alone in B.
const roundCard = () => {
  const c = champ();
  const me = mine(c);
  const over = state.moment === 'over';
  if (over) return racedCard(c);
  const figure = fig(YOURS, c.champ, me.off, state.season, state.round);
  const without = fig(YOURS, c.champ, me.off);
  const terms = [['yours', YOURS], ['championship', c.champ], ['class', me.off], ['season', state.season, true], ['round', state.round, true]];
  const touched = state.season !== 0 || state.round !== 0;
  return `<section class="panel">
    ${panelTitle('AI strength', touched && state.where === 'A' ? `<button class="btn ghost" data-reset="career">${I.reset} Reset</button>` : '')}
    <div class="pb">
      ${state.where === 'A' ? `<div class="ai-row"><label>Whole season<small>Every round of ${c.series}</small></label>${stepper('season', state.season)}</div>` : ''}
      <div class="ai-row"><label>This round<small>${c.round}</small></label>${stepper('round', state.round)}</div>
      <div class="figline"><span class="figure">${figure}</span>${chainOf(terms)}</div>
      ${bar(figure, without)}
      ${ends(figure)}
      ${c.classes.length > 1 ? `<div class="classes">
        <span class="caps" style="font-size:10px">Every class moves together</span>
        ${c.classes.map((one, i) => `<div class="cl"><span class="nm">${chip(`c-rc${i + 1}`, one.name)}${one.me ? '<span class="muted" style="font-size:11.5px">yours</span>' : ''}</span><b>${fig(YOURS, c.champ, one.off, state.season, state.round)}</b></div>`).join('')}
      </div>` : ''}
      ${state.where === 'B' ? `<div class="note">${I.info}<span>The season's <b>${signed(state.season)}</b> is set on the championship's page. <a class="link" data-set="page=champ">Change it ${I.chev}</a></span></div>` : ''}
      ${state.moment === 'between' ? `<div class="note">${I.info}<span>Practice ran at <b>${fig(YOURS, c.champ, me.off, RECORDED.practice.season, RECORDED.practice.round)}</b>. A change applies from <b>Qualifying</b> on.</span></div>` : ''}
    </div>
  </section>`;
};

// Once the event is over the card says what each session ran at, and nothing changes it.
const racedCard = (c) => {
  const me = mine(c);
  return `<section class="panel">
    ${panelTitle('AI strength', `<span class="muted" style="font-size:12px;display:inline-flex;gap:4px;align-items:center">${I.lock} Raced</span>`)}
    <div class="pb">
      <div class="raced">${SESSIONS.map((s) => {
    const r = RECORDED[s.type];
    const f = fig(YOURS, c.champ, me.off, r.season, r.round);
    return `<div class="rr">${sessionChip(s.type)}<small class="num">season ${signed(r.season)} · round ${signed(r.round)}</small><b>${f}</b></div>`;
  }).join('')}</div>
      <span class="muted" style="font-size:12px">What each session ran at${c.classes.length > 1 ? ', in your class' : ''}. Changing your strength in settings no longer reaches this event.</span>
    </div>
  </section>`;
};

const entryCard = () => {
  const c = champ();
  return `<section class="panel">${panelTitle('Your entry')}<div class="pb">
    <div class="well">${I.car}</div>
    <div style="display:flex;flex-direction:column;gap:1px"><span style="font-weight:500">${c.car}</span>
    <span class="muted" style="font-size:12px">${c.team} · ${c.entry}</span>
    <span class="muted" style="font-size:12px">Car and livery are set for the season</span></div>
  </div></section>`;
};

const statusOf = (i) => {
  if (state.moment === 'over') return 'done';
  if (state.moment === 'between') return i === 0 ? 'done' : i === 1 ? 'next' : 'later';
  return i === 0 ? 'next' : 'later';
};
const sessionList = (title = 'Event') => {
  const selected = selectedSession();
  return `<section class="panel" style="padding:0;overflow:hidden">${panelTitle(title)}<div style="height:8px"></div>
    ${SESSIONS.map((s, i) => {
    const st = statusOf(i);
    return `<button type="button" class="ses" data-pick="${i}" aria-current="${selected === i}">
      <span class="sdot ${st}">${st === 'done' ? I.check : ''}</span>
      <span class="nm"><b>${s.name}</b><small>${s.when}</small></span>
      <span class="sval">${st === 'done' ? (s.type === 'race' ? 'P5' : 'P7') : st === 'next' ? 'Next' : ''}</span>
    </button>`;
  }).join('')}</section>`;
};
const selectedSession = () => {
  if (state.picked !== null) return state.picked;
  if (state.moment === 'between') return 1;
  if (state.moment === 'over') return 2;
  return 0;
};

const briefing = (s, launchName) => `<div class="tiles">
    <div class="tile"><span class="k">Length</span><b>${s.len}</b></div>
    <div class="tile"><span class="k">Weather</span><b>☁ 17°C</b><small>Light clouds</small></div>
    <div class="tile"><span class="k">Wind</span><b>6-11 km/h</b></div>
    <div class="tile"><span class="k">You start</span><b>${s.type === 'race' ? 'Set by qualifying' : 'Pit lane'}</b></div>
  </div>
  <p class="muted" style="margin:0;font-size:13.5px">${s.type === 'race' ? 'The grid comes from Qualifying.' : 'Everyone starts from the pit lane.'}</p>
  ${launchName ? `<div class="launch"><button class="btn pri lg">Launch ${launchName}</button></div>` : ''}`;

// A run session's strip gains one figure: the strength it ran at.
const resultStrip = (s, c, me) => {
  const r = RECORDED[s.type];
  const f = fig(YOURS, c.champ, me.off, r.season, r.round);
  const others = c.classes.filter((one) => !one.me).map((one) => `${one.name} ${fig(YOURS, c.champ, one.off, r.season, r.round)}`).join(' · ');
  return `<div class="strip">
    <div><span class="k">You</span><b><span class="rc ${s.type === 'race' ? 'pts' : ''}">P${s.type === 'race' ? 5 : 7}</span></b><small>${c.classes.length > 1 ? `in ${me.name} · 21 of 36 overall` : 'of 24'}</small></div>
    <div><span class="k">Best lap</span><b>2:18.412</b><small>+0.734 to fastest</small></div>
    ${s.type === 'race' ? '<div><span class="k">Points</span><b style="color:var(--success-soft-fg)">+10</b><small></small></div>' : ''}
    <div class="new"><span class="k">AI strength <span class="newtag">new</span></span><b>${f}</b><small>${others || `drivers ${fig(f, -SPREAD)}-${fig(f, SPREAD)}`}</small></div>
  </div>
  <div class="placeholder">The classification, as it is today</div>`;
};

const sessionDetail = () => {
  const c = champ();
  const me = mine(c);
  const i = selectedSession();
  const s = SESSIONS[i];
  const st = statusOf(i);
  return `<section class="panel"><div class="pb" style="padding:16px;gap:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div style="display:flex;gap:8px;align-items:center">${sessionChip(s.type)}<span style="font-size:18px;font-weight:600">${s.name}</span>${st === 'done' ? chip('c-done', 'Done') : ''}</div>
      <span class="muted" style="font-size:13.5px">${s.when}</span>
    </div>
    ${st === 'done' ? resultStrip(s, c, me) : briefing(s, st === 'next' ? s.name : null)}
    ${st === 'later' ? `<p class="muted" style="margin:0;display:flex;gap:8px;align-items:center;font-size:13.5px">${I.lock} Runs once ${SESSIONS[i - 1].name} has been run</p>` : ''}
  </div></section>`;
};

const nav = (on) => `<nav class="app-nav"><span class="brand">Another Assetto Corsa Career</span>${['Home', 'Calendar', 'Championships', 'Race', 'Cars', 'Tracks', 'Settings'].map((n) => `<span class="${n === on ? 'on' : ''}">${n}</span>`).join('')}</nav>`;

const roundHead = () => {
  const c = champ();
  return `<div class="shead"><a class="back">${I.back} Calendar</a>
    <div class="head-row"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <div class="over"><span class="mono">ROUND ${c.number} OF ${c.rounds}</span>${chip('c-sports', 'Sportscar')}${chip(`c-t${c.tier}`, `Tier ${c.tier}`)}${chip('c-oceanic', c.climate)}</div>
      <h1>${c.round}</h1>
      <div class="facts"><a class="pill" data-set="page=champ"><span class="dot" style="background:var(--d-sports-fg)"></span>${c.series} ${I.chev}</a><span>${c.date}</span><span>${c.grid} cars</span></div>
    </div><div class="map"><img src="${AC}tracks/${c.track}/ui/outline.png" alt=""></div></div></div>`;
};

// ---------- Round page ----------
const roundPage = () => `${nav('Calendar')}${roundHead()}
  <div class="layout"><aside class="side">${entryCard()}${sessionList()}${roundCard()}</aside>
  <main class="col">${sessionDetail()}</main></div>`;

const roundSkeleton = () => {
  const twoRows = state.where === 'A';
  return `${nav('Calendar')}
  <div class="shead"><a class="back">${I.back} Calendar</a>
    <div class="head-row"><div style="display:flex;flex-direction:column;gap:8px">${sk(260, 14)}${sk(320, 24)}${sk(380, 16)}</div>${sk(144, 81, 'deep')}</div></div>
  <div class="layout"><aside class="side">
    <section class="panel"><div class="panel-h">${sk(80, 10)}</div><div class="pb">${sk('100%', 150, 'deep')}${sk(130, 14)}${sk(160, 11)}${sk(180, 11)}</div></section>
    <section class="panel" style="padding:0;overflow:hidden">${panelTitle('Event')}<div style="height:8px"></div>
      ${[0, 1, 2].map(() => `<div class="ses" style="cursor:default">${sk(16, 16, 'round')}<span class="nm" style="gap:6px">${sk(80, 12)}${sk(120, 10)}</span>${sk(16, 16, 'round')}</div>`).join('')}</section>
    <section class="panel">${panelTitle('AI strength')}<div class="pb">
      ${twoRows ? `<div class="ai-row"><label>Whole season<small>${sk(120, 10)}</small></label>${sk(112, 36)}</div>` : ''}
      <div class="ai-row"><label>This round<small>${sk(110, 10)}</small></label>${sk(112, 36)}</div>
      <div class="figline">${sk(38, 26)}${sk(170, 12)}</div>
      ${sk('100%', 10, 'round')}
      <div class="ends"><span>0</span>${sk(90, 11)}<span>100</span></div>
    </div></section>
  </aside>
  <main class="col"><section class="panel"><div class="pb" style="padding:16px;gap:16px">
    <div style="display:flex;justify-content:space-between">${sk(150, 22)}${sk(90, 14)}</div>
    <div class="tiles">${['Length', 'Weather', 'Wind', 'You start'].map((k) => `<div class="tile"><span class="k">${k}</span>${sk(90, 18)}</div>`).join('')}</div>
    ${sk(220, 14)}
  </div></section></main></div>`;
};

// ---------- Championship page ----------
const champCard = () => {
  const c = ONE;
  const figure = fig(YOURS, c.champ, 0, state.season);
  const without = fig(YOURS, c.champ, 0);
  return `<section class="panel">
    ${panelTitle('AI strength', state.season !== 0 ? `<button class="btn ghost" data-reset="season">${I.reset} Reset</button>` : '')}
    <div class="pb">
      <div class="ai-row"><label>This season<small>Every round of GT3 Sprint Series 2026</small></label>${stepper('season', state.season)}</div>
      <div class="figline"><span class="figure">${figure}</span>${chainOf([['yours', YOURS], ['championship', c.champ], ['class', 0], ['season', state.season, true]])}</div>
      ${bar(figure, without)}
      ${ends(figure)}
      <div class="subrounds"><span class="caps" style="font-size:10px">Rounds set on their own</span>
        ${OTHER_ROUNDS.map(([name, off]) => {
    const value = off ?? state.round;
    if (value === 0) return '';
    return `<a data-set="page=round"><span>${name}</span><span class="${value > 0 ? 'off-up' : 'off-down'}">${signed(value)}</span><b>${fig(YOURS, c.champ, 0, state.season, value)}</b></a>`;
  }).join('')}
      </div>
    </div>
  </section>`;
};
const champSummary = () => `<section class="panel"><div class="pb" style="gap:8px">
    <div class="over">${chip('c-sports', 'Sportscar')}${chip('c-t2', 'Tier 2')}${chip('c-entered', 'Entered')}</div>
    <span style="font-size:20px;font-weight:600">GT3 Sprint Series</span>
    <span class="muted" style="font-size:13px">8 rounds · March to October · 24 cars</span>
    <div style="border:1px solid color-mix(in oklch, var(--primary) 40%, transparent);background:color-mix(in oklch, var(--primary) 5%, transparent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between"><span class="caps" style="color:var(--primary);font-size:10px">Next round</span><span class="muted" style="font-size:12px">in 5 days</span></div>
      <span style="font-weight:600">Spa-Francorchamps</span>
      <button class="btn pri" data-set="page=round">Open round ${I.chev}</button>
    </div>
  </div></section>`;
const champPage = () => `${nav('Championships')}
  <div class="shead"><a class="back">${I.back} Calendar</a></div>
  <div class="layout wide"><aside class="side">${champSummary()}
    ${state.where === 'B' ? champCard() : '<div class="placeholder">In A the season is adjusted on any of its round pages, so this page gains nothing</div>'}
    <div class="placeholder">Your season so far, as it is today</div>
  </aside>
  <main class="col"><nav style="display:flex;gap:2px;border-bottom:1px solid var(--border)">${['Rounds', 'Standings', 'Classes', 'Points, prizes and formats'].map((t, i) => `<a style="padding:9px 12px;font-size:13.5px;font-weight:500;${i === 0 ? 'border-bottom:2px solid var(--primary);margin-bottom:-1px' : 'color:var(--muted-foreground)'}">${t}</a>`).join('')}</nav>
    <div class="placeholder" style="padding:60px">The championship's tabs, as they are today</div></main></div>`;
const champSkeleton = () => `${nav('Championships')}
  <div class="shead"><a class="back">${I.back} Calendar</a></div>
  <div class="layout wide"><aside class="side">
    <section class="panel"><div class="pb" style="gap:8px"><div class="over">${chip('c-sports', 'Sportscar')}${chip('c-t2', 'Tier 2')}</div>${sk(200, 20)}${sk(220, 13)}${sk('100%', 96)}</div></section>
    ${state.where === 'B' ? `<section class="panel">${panelTitle('AI strength')}<div class="pb">
      <div class="ai-row"><label>This season<small>${sk(150, 10)}</small></label>${sk(112, 36)}</div>
      <div class="figline">${sk(38, 26)}${sk(170, 12)}</div>${sk('100%', 10, 'round')}
      <div class="ends"><span>0</span>${sk(90, 11)}<span>100</span></div>
      <div class="subrounds"><span class="caps" style="font-size:10px">Rounds set on their own</span>${sk('100%', 14)}${sk('100%', 14)}</div>
    </div></section>` : ''}
  </aside><main class="col"><nav style="display:flex;gap:2px;border-bottom:1px solid var(--border)">${['Rounds', 'Standings', 'Classes', 'Points, prizes and formats'].map((t, i) => `<a style="padding:9px 12px;font-size:13.5px;font-weight:500;${i === 0 ? 'border-bottom:2px solid var(--primary);margin-bottom:-1px' : 'color:var(--muted-foreground)'}">${t}</a>`).join('')}</nav>
    <div class="placeholder" style="padding:60px">The championship page's own skeleton, as it is today</div></main></div>`;

// ---------- Race event (Race tab), under way ----------
const QUICK = { title: 'Brands Hatch club race', car: 'Lotus Exige S', track: 'ks_brands_hatch', layout: 'GP', race: -2, cls: 0 };
const quickCard = () => {
  if (state.moment === 'over') {
    return `<section class="panel">${panelTitle('AI strength', `<span class="muted" style="font-size:12px;display:inline-flex;gap:4px;align-items:center">${I.lock} Raced</span>`)}<div class="pb">
      <div class="raced">${SESSIONS.map((s, i) => {
    const r = i === 0 ? -2 : -4;
    return `<div class="rr">${sessionChip(s.type)}<small class="num">race ${signed(r)}</small><b>${fig(YOURS, r, QUICK.cls)}</b></div>`;
  }).join('')}</div>
      <span class="muted" style="font-size:12px">What each session ran at. Restarting the race event opens its whole setup again.</span>
    </div></section>`;
  }
  const figure = fig(YOURS, state.quick, QUICK.cls);
  return `<section class="panel">${panelTitle('AI strength')}<div class="pb">
    <div class="ai-row"><label>Race<small>The race's own, set before the start</small></label>${stepper('quick', state.quick)}</div>
    <div class="figline"><span class="figure">${figure}</span>${chainOf([['yours', YOURS], ['race', state.quick, true], ['class', QUICK.cls]])}</div>
    ${bar(figure, fig(YOURS, QUICK.race, QUICK.cls))}
    ${ends(figure)}
    <div class="note">${I.info}<span>Practice ran at <b>${fig(YOURS, QUICK.race, QUICK.cls)}</b>. A change applies from <b>Qualifying</b> on. Aggression and each class's own strength stay as they were set.</span></div>
  </div></section>`;
};
const quickHead = () => `<div class="shead"><a class="back">${I.back} Race</a>
  <div class="head-row"><div style="display:flex;flex-direction:column;gap:6px">
    <div class="over"><span class="mono">RACE EVENT</span>${chip('c-road', 'Road')}</div>
    <h1>${QUICK.title}</h1>
    <div class="facts"><span>Brands Hatch · GP</span><span>${QUICK.car}</span><span>16 cars</span></div>
  </div>
  ${state.moment === 'over' ? '<button class="btn">Restart</button>' : '<div style="display:flex;gap:8px"><button class="btn">Restart</button><button class="btn pri lg">Launch Qualifying</button></div>'}
  </div></div>`;
const quickPage = () => `${nav('Race')}${quickHead()}
  <div class="layout wide"><aside class="side">
    <section class="panel">${panelTitle('Track', `<span class="muted" style="font-size:12px;display:inline-flex;gap:4px;align-items:center">${I.lock}</span>`)}<div class="pb"><div class="well" style="background:var(--muted)"><img src="${AC}tracks/${QUICK.track}/ui/gp/outline.png" alt="" style="width:80%;height:80%;object-fit:contain;filter:var(--map-filter)"></div><span style="font-weight:500">Brands Hatch · GP</span></div></section>
    <section class="panel">${panelTitle('Your car', `<span class="muted" style="font-size:12px;display:inline-flex;gap:4px;align-items:center">${I.lock}</span>`)}<div class="pb"><div class="well">${I.car}</div><span style="font-weight:500">${QUICK.car}</span></div></section>
    ${sessionList('Event')}
    ${quickCard()}
  </aside><main class="col">${quickDetail()}</main></div>`;
const quickDetail = () => {
  const i = selectedSession();
  const s = SESSIONS[i];
  const st = statusOf(i);
  const r = i === 0 ? -2 : -4;
  const f = fig(YOURS, r, QUICK.cls);
  return `<section class="panel"><div class="pb" style="padding:16px;gap:16px">
    <div style="display:flex;gap:8px;align-items:center">${sessionChip(s.type)}<span style="font-size:18px;font-weight:600">${s.name}</span>${st === 'done' ? chip('c-done', 'Done') : ''}</div>
    ${st === 'done' ? `<div class="strip">
      <div><span class="k">You</span><b><span class="rc ${s.type === 'race' ? 'pts' : ''}">P${s.type === 'race' ? 3 : 6}</span></b><small>of 16</small></div>
      <div><span class="k">Best lap</span><b>1:31.207</b><small>+0.402 to fastest</small></div>
      <div class="new"><span class="k">AI strength <span class="newtag">new</span></span><b>${f}</b><small>drivers ${fig(f, -SPREAD)}-${fig(f, SPREAD)}</small></div>
    </div><div class="placeholder">The classification, as it is today</div>` : briefing(s, null)}
  </div></section>`;
};
const quickSkeleton = () => `${nav('Race')}
  <div class="shead"><a class="back">${I.back} Race</a><div class="head-row"><div style="display:flex;flex-direction:column;gap:8px">${sk(140, 14)}${sk(280, 24)}${sk(300, 16)}</div>${sk(150, 38)}</div></div>
  <div class="layout wide"><aside class="side">
    <section class="panel">${panelTitle('Track')}<div class="pb">${sk('100%', 160, 'deep')}${sk(140, 14)}</div></section>
    <section class="panel">${panelTitle('Your car')}<div class="pb">${sk('100%', 160, 'deep')}${sk(120, 14)}</div></section>
    <section class="panel">${panelTitle('AI strength')}<div class="pb">
      <div class="ai-row"><label>Race<small>The race's own, set before the start</small></label>${sk(112, 36)}</div>
      <div class="figline">${sk(38, 26)}${sk(150, 12)}</div>${sk('100%', 10, 'round')}
      <div class="ends"><span>0</span>${sk(90, 11)}<span>100</span></div>
    </div></section>
  </aside><main class="col"><div class="placeholder" style="padding:60px">The race page's under-way skeleton, as it is today</div></main></div>`;

// ---------- Notes ----------
const WHY = {
  round: `<b>Round page</b> (<code>/calendar/:series/:round</code>). An <b>AI strength</b> card under the event's sessions, shown once you are entered - under rather than above them, since the list is how the page is moved around. It is
    the same box the race page and the editor already draw: the step, the figure it comes to, the sum that makes it and the band the drivers spread across.
    Your adjustments are offsets on top of your strength in settings, after the championship's, the class's and the round's own, so changing settings
    still moves every round and a multi-class field keeps its gaps. <b>Strength only</b>: aggression stays the championship's.
    <ul>
      <li><b>A</b> puts the whole season's adjustment here too, above the round's. <b>B</b> keeps only the round's here and moves the season's to the
        championship page.</li>
      <li><b>Between sessions</b> the card stays open: a change applies from the next session on. Each launch records what it ran at, which a run session's
        result shows as a new figure in its strip - pick <i>Practice</i> in the list.</li>
      <li><b>Event over</b>: the card lists what each session ran at and nothing changes it any more, settings included. A round of a closed season reads the
        same way.</li>
      <li>A round you are not entered in, a simulated one and the championship editor are untouched: a simulated round races on the field's own offsets, which
        a step shared by every car cannot reorder.</li>
    </ul>`,
  champ: `<b>Championship page</b>, entered. In <b>B</b> the season's adjustment lives in the sidebar, with the rounds that carry one of their own listed under it,
    each opening its round. In <b>A</b> this page gains nothing. Either way it is stored on the career's entry - the championship document is never touched,
    which is why the editor knows nothing of it.`,
  quick: `<b>Race event</b> on the Race tab, once a session has run. Before the start nothing changes - strength and aggression sit in the Rules card as today.
    Once the event is under way the Rules card goes, and this card keeps the race's own strength open between sessions: it is the same value the Rules card
    set, so nothing new is stored. Aggression and each class's own strength stay locked. <b>Before the event</b> is the setup page as it is today, so it is
    not drawn here.`,
};
const NOTES = `<ul>
  <li><b>Loading</b> (switch <i>State</i>): the card's title, its row labels and the scale's ends are drawn for real; the step, the figure, the sum and the band
    are shimmer blocks in their places. The round page's skeleton draws the card the way it already draws <i>Your entry</i>, whether or not the round
    turns out to be entered.</li>
  <li><b>Colour</b>: a step is signed in colour as every offset stepper is - green up, red down - and the figure and the band wear primary, as on the race page.
    The figure is a number, not one of a closed set, so it is not otherwise coloured. Session, class, discipline, tier and climate chips are as everywhere
    else; <i>Done</i> is success.</li>
  <li>The steppers work, so the sum, the band and the class figures follow; <i>Reset</i> clears your adjustments.</li>
</ul>`;

const PAGES = { round: [roundPage, roundSkeleton], champ: [champPage, champSkeleton], quick: [quickPage, quickSkeleton] };
const render = () => {
  if (state.page === 'quick' && state.moment === 'before') state.moment = 'between';
  document.documentElement.dataset.theme = state.th;
  document.querySelectorAll('.opt').forEach((b) => {
    b.setAttribute('aria-pressed', String(state[b.dataset.k] === b.dataset.v));
    b.hidden = b.dataset.only !== undefined && b.dataset.only !== state.page;
  });
  document.querySelectorAll('.grp[data-for]').forEach((g) => { g.hidden = !g.dataset.for.split(' ').includes(state.page); });
  document.getElementById('why').innerHTML = WHY[state.page] + NOTES;
  document.getElementById('app').innerHTML = PAGES[state.page][state.load === 'loading' ? 1 : 0]();
};
document.addEventListener('click', (e) => {
  const opt = e.target.closest('.opt');
  if (opt) { state[opt.dataset.k] = opt.dataset.v; if (opt.dataset.k !== 'th' && opt.dataset.k !== 'load') state.picked = null; render(); return; }
  const step = e.target.closest('[data-step]');
  if (step) { const [k, by] = step.dataset.step.split(':'); state[k] = Math.max(-30, Math.min(30, state[k] + Number(by))); render(); return; }
  const reset = e.target.closest('[data-reset]');
  if (reset) { if (reset.dataset.reset === 'career') { state.season = 0; state.round = 0; } else state.season = 0; render(); return; }
  const pick = e.target.closest('[data-pick]');
  if (pick) { state.picked = Number(pick.dataset.pick); render(); return; }
  const set = e.target.closest('[data-set]');
  if (set) { const [k, v] = set.dataset.set.split('='); state[k] = v; state.picked = null; render(); window.scrollTo(0, 0); }
});
// A hash such as #page=round&moment=over opens the mockup on that state.
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in state) state[k] = v; });
render();
</script>
</body>
</html>
