<html lang="en">
<head>
<meta charset="utf-8">

<title>Content cards mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --secondary: oklch(0.935 0.012 252);
  --secondary-foreground: oklch(0.28 0.03 258);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75); --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295); --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);

  --d-single-seater: oklch(0.925 0.06 212); --d-single-seater-fg: oklch(0.36 0.11 215);
  --d-sportscar: oklch(0.925 0.06 112); --d-sportscar-fg: oklch(0.36 0.1 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --secondary: oklch(0.27 0.014 265);
  --secondary-foreground: oklch(0.94 0.005 260);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70); --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295); --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);

  --d-single-seater: oklch(0.32 0.07 212); --d-single-seater-fg: oklch(0.86 0.1 212);
  --d-sportscar: oklch(0.32 0.07 112); --d-sportscar-fg: oklch(0.86 0.1 112);
  --d-touring: oklch(0.32 0.065 175); --d-touring-fg: oklch(0.86 0.09 175);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }



/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .spacer { flex: 1; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
.why { color: var(--muted-foreground); font-size: 13.5px; max-width: 90ch; margin: 0 0 18px; }
.why b { color: var(--foreground); }
.label { font-weight: 600; margin: 26px 0 10px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
.label small { font-weight: 400; color: var(--muted-foreground); font-size: 13px; }

/* ---------- Shared ---------- */
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip.sm { font-size: 11px; padding: 3px 6px; }
.chip.neutral { background: var(--secondary); color: var(--secondary-foreground); }
.p-base { background: var(--provenance-base); color: var(--provenance-base-fg); }
.p-dlc { background: var(--provenance-dlc); color: var(--provenance-dlc-fg); }
.p-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.p-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.d-single-seater { background: var(--d-single-seater); color: var(--d-single-seater-fg); }
.d-sportscar { background: var(--d-sportscar); color: var(--d-sportscar-fg); }
.d-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.d-road { background: var(--d-road); color: var(--d-road-fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.d-single-seater { background: var(--d-single-seater-fg); } .dot.d-sportscar { background: var(--d-sportscar-fg); }
.dot.d-touring { background: var(--d-touring-fg); } .dot.d-road { background: var(--d-road-fg); }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--border); }
.logo { width: 18px; height: 18px; object-fit: contain; flex: none; }
.muted { color: var(--muted-foreground); }
.num { font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; position: relative; }
.card:hover { border-color: var(--primary); box-shadow: 0 0 20px 2px color-mix(in oklch, var(--primary) 28%, transparent); }
.shot { position: relative; background: var(--muted); overflow: hidden; }
.shot img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tl { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; }
.tl .chip { box-shadow: 0 1px 3px oklch(0 0 0 / .25); }
.glass { position: absolute; display: inline-flex; align-items: center; gap: 5px; background: oklch(0.15 0.01 260 / .62); color: #fff; backdrop-filter: blur(6px); border-radius: 999px; padding: 3px 8px; font-size: 11.5px; font-weight: 500; }
.outline-img { filter: brightness(0) invert(1); }
.outline-ink { filter: brightness(0); opacity: .72; }
:root[data-theme="dark"] .outline-ink { filter: brightness(0) invert(1); opacity: .85; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.grid.tight { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.name { font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.raced { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }
.raced b { color: var(--foreground); }

/* A - current */
.a .shot { aspect-ratio: 16/9; }
.a .body { padding: 13px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.a .maker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.a .maker .yr { margin-left: auto; }
.a .name { font-size: 15px; min-height: 2.5em; }
.a .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 8px; }
.a .stats div { padding: 5px 8px; display: flex; flex-direction: column; }
.a .stats div + div { border-left: 1px solid var(--border); }
.a .stats b { font-size: 14px; } .a .stats small { font-size: 11px; color: var(--muted-foreground); }
.a .foot { margin-top: auto; padding-top: 9px; border-top: 1px solid var(--border); }

/* B - poster */
.b .shot { aspect-ratio: 4/3; }
.b .shot::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(to top, oklch(0.12 0.01 260 / .92), transparent); }
.b .cap { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; color: #fff; display: flex; flex-direction: column; gap: 3px; }
.b .cap .maker { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; }
.b .cap .maker .yr { margin-left: auto; }
.b .cap .name { font-size: 16px; text-shadow: 0 1px 2px oklch(0 0 0 / .5); }
.b .logo-w { width: 18px; height: 18px; border-radius: 4px; background: oklch(1 0 0 / .85); padding: 1px; }
.b .tr { top: 8px; right: 8px; }
.b .body { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.b .figs { font-size: 12.5px; color: var(--muted-foreground); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.b .figs b { color: var(--foreground); font-size: 13.5px; font-weight: 600; }
.b .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 6px; }

/* C - side by side */
.c { flex-direction: row; }
.c .shot { width: 44%; flex: none; min-height: 150px; }
.c .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0; }
.c .maker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.c .maker .yr { margin-left: auto; }
.c .name { font-size: 15px; }
.c dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; }
.c dt { color: var(--muted-foreground); } .c dd { margin: 0; font-weight: 600; text-align: right; }
.c .foot { margin-top: auto; padding-top: 7px; border-top: 1px solid var(--border); }

/* D - numbers first, discipline edge */
.d { border-top-width: 0; }
.d .edge { height: 4px; display: flex; }
.d .edge i { flex: 1; }
.d .edge .d-single-seater { background: var(--d-single-seater-fg); } .d .edge .d-sportscar { background: var(--d-sportscar-fg); }
.d .edge .d-touring { background: var(--d-touring-fg); } .d .edge .d-road { background: var(--d-road-fg); }
.d .edge .none { background: var(--border); }
.d .shot { aspect-ratio: 16/9; }
.d .body { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.d .maker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.d .maker .yr { margin-left: auto; }
.d .name { font-size: 15.5px; }
.d .big { display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 0 2px; }
.d .big div { display: flex; flex-direction: column; padding-left: 10px; border-left: 2px solid var(--border); }
.d .big div:first-child { padding-left: 0; border-left: 0; }
.d .big b { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
.d .big small { font-size: 11px; color: var(--muted-foreground); }
.d .foot { margin-top: auto; }

/* E - compact */
.e .shot { aspect-ratio: 2/1; }
.e .tr { top: 7px; right: 7px; }
.e .body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 5px; }
.e .name { font-size: 14px; -webkit-line-clamp: 1; }
.e .maker { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted-foreground); }
.e .maker .yr { margin-left: auto; }
.e .figs { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 10px; }
.e .figs b { color: var(--foreground); }

/* Track-specific */
.layouts { display: flex; gap: 5px; }
.layouts span { width: 40px; height: 30px; border-radius: 6px; background: var(--muted); display: grid; place-items: center; padding: 3px; font-size: 11px; color: var(--muted-foreground); font-weight: 600; }
.layouts img { max-width: 100%; max-height: 100%; }
.ov { position: absolute; right: 8px; bottom: 8px; width: 32%; aspect-ratio: 4/3; border-radius: 8px; background: oklch(0.15 0.01 260 / .55); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 6px; }
.ov img { max-width: 100%; max-height: 100%; }
.b .ov { top: 8px; bottom: auto; width: 28%; }
.map { aspect-ratio: 16/10; position: relative; background: radial-gradient(circle at 30% 20%, color-mix(in oklch, var(--primary) 9%, var(--muted)), var(--muted)); display: grid; place-items: center; }
.map > img.big-ol { max-width: 70%; max-height: 72%; }
.map .thumb { position: absolute; right: 8px; bottom: 8px; width: 30%; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px oklch(0 0 0 / .35); border: 2px solid var(--card); }
.map .thumb img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- List at narrow widths ---------- */
.window { width: 940px; max-width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--background); overflow: hidden; margin-bottom: 8px; }
.window .bar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.window .in { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; padding: 16px 24px; height: 470px; }
.window .in.norail { grid-template-columns: minmax(0, 1fr); }
.rail { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--muted-foreground); }
.rail b { color: var(--foreground); display: block; margin: 8px 0 4px; font-size: 12px; }
.tb { display: flex; gap: 6px; margin-bottom: 10px; }
.tb .s { flex: 1; border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted-foreground); }
.tb .btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.tb .btn.on { border-color: var(--primary); color: var(--primary); }
.res { overflow: auto; min-width: 0; height: 410px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th { text-align: left; font-weight: 500; color: var(--muted-foreground); font-size: 11.5px; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:first-child td { border-top: 0; }
th.r, td.r { text-align: right; }
.th { width: 64px; height: 36px; border-radius: 5px; overflow: hidden; background: var(--muted); }
.th img { width: 100%; height: 100%; object-fit: cover; }
.nm b { font-weight: 600; display: block; }
.nm span { display: flex; gap: 5px; align-items: center; color: var(--muted-foreground); font-size: 11.5px; margin-top: 1px; }
.pbar { display: inline-flex; align-items: center; gap: 6px; }
.pbar i { width: 36px; height: 4px; border-radius: 2px; background: var(--muted); overflow: hidden; display: block; }
.pbar i::before { content: ""; display: block; height: 100%; width: var(--w); background: var(--primary); opacity: .7; }
.row2 { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--border); }
.row2:first-child { border-top: 0; }
.row2 .figs2 { display: grid; grid-template-columns: repeat(4, auto); gap: 0 14px; text-align: right; font-size: 12.5px; }
.row2 .figs2 small { display: block; font-size: 10.5px; color: var(--muted-foreground); }
.row2 .sub { grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="picker">
  <div class="grp"><strong>Show</strong>
    <button class="opt" data-v="cars">Car cards</button>
    <button class="opt" data-v="tracks">Track cards</button>
    <button class="opt" data-v="list">List at minimum width</button>
  </div>
  <span class="spacer"></span>
  <button class="opt" id="theme">Dark</button>
</div>
<div class="wrap" id="root"></div>

};
const racedBadge = (x) => (x.series ? `<span class="glass tr" style="gap:4px">${discs(x).map((d) => `<i class="dot d-${d}"></i>`).join('')} ${icon('trophy', 12)} ${x.series}</span>` : '');
const maker = (c, white) => `<div class="maker">${c.badge ? `<img class="logo${white ? ' logo-w' : ''}" src="${c.badge}" alt="">` : ''}<span>${esc(c.brand)}</span>${flag(c.flag)}${c.year ? `<span class="yr num">${c.year}</span>` : ''}</div>`;

const CARS = DATA.cars.slice(0, 8);
const TRACKS = DATA.tracks.slice(0, 8);

const carA = (c) => `<article class="card a"><div class="shot"><img class="photo" src="${c.img}"><div class="tl">${prov(c.prov)}</div><span class="glass" style="right:8px;bottom:8px">${icon('palette', 12)} ${c.skins}</span></div>
  <div class="body">${maker(c)}<div class="name">${esc(c.name)}</div><div class="tags">${specs(c)}</div>
  <div class="stats"><div><b class="num">${fmt(c.bhp)}</b><small>bhp</small></div><div><b class="num">${fmt(c.kg)}</b><small>kg</small></div><div><b class="num">${fmt(c.pw)}</b><small>bhp/t</small></div></div>
  <div class="foot">${raced(c)}</div></div></article>`;
const carB = (c) => `<article class="card b"><div class="shot"><img class="photo" src="${c.img}"><div class="tl">${prov(c.prov, 1)}</div><span class="glass tr">${icon('palette', 12)} ${c.skins}</span>
  <div class="cap">${maker(c, 1)}<div class="name">${esc(c.name)}</div></div></div>
  <div class="body"><div class="tags">${specs(c)}</div>
  <div class="figs num"><span><b>${fmt(c.bhp)}</b> bhp</span><span><b>${fmt(c.kg)}</b> kg</span><span><b>${fmt(c.pw)}</b> bhp/t</span></div>
  <div class="foot">${raced(c)}</div></div></article>`;
const carC = (c) => `<article class="card c"><div class="shot"><img class="photo" src="${c.img}"><div class="tl">${prov(c.prov, 1)}</div></div>
  <div class="body">${maker(c)}<div class="name">${esc(c.name)}</div><div class="tags">${specs(c)}</div>
  <dl class="num"><dt>Power</dt><dd>${fmt(c.bhp)} bhp</dd><dt>Weight</dt><dd>${fmt(c.kg)} kg</dd><dt>Power to weight</dt><dd>${fmt(c.pw)} bhp/t</dd><dt>Liveries</dt><dd>${c.skins}</dd></dl>
  <div class="foot">${raced(c)}</div></div></article>`;
const edge = (x) => `<div class="edge">${discs(x).length ? discs(x).map((d) => `<i class="d-${d}"></i>`).join('') : '<i class="none"></i>'}</div>`;
const carD = (c) => `<article class="card d">${edge(c)}<div class="shot"><img class="photo" src="${c.img}"><div class="tl">${prov(c.prov, 1)}</div><span class="glass" style="right:8px;bottom:8px">${icon('palette', 12)} ${c.skins}</span></div>
  <div class="body">${maker(c)}<div class="name">${esc(c.name)}</div><div class="tags">${specs(c)}</div>
  <div class="big num"><div><b>${fmt(c.bhp)}</b><small>bhp</small></div><div><b>${fmt(c.kg)}</b><small>kg</small></div><div><b>${fmt(c.pw)}</b><small>bhp/t</small></div></div>
  <div class="foot">${raced(c)}</div></div></article>`;
const carE = (c) => `<article class="card e"><div class="shot"><img class="photo" src="${c.img}"><div class="tl">${prov(c.prov, 1)}</div>${racedBadge(c)}</div>
  <div class="body"><div class="name" title="${esc(c.name)}">${esc(c.name)}</div>${maker(c)}
  <div class="figs num"><span><b>${fmt(c.bhp)}</b> bhp</span><span><b>${fmt(c.kg)}</b> kg</span><span><b>${fmt(c.pw)}</b> bhp/t</span></div></div></article>`;

const span = (r, f) => (r ? (f(r[0]) === f(r[1]) ? f(r[0]) : `${f(r[0])}-${f(r[1])}`) : '-');
const outs = (t) => {
  if (t.layouts.length < 2) return '';
  const shown = t.layouts.slice(0, t.layouts.length > 5 ? 4 : 5);
  return `<div class="layouts">${shown.map((l) => `<span title="${esc(l.name)}">${l.outline ? `<img class="outline-ink" src="${l.outline}">` : ''}</span>`).join('')}${t.layouts.length > shown.length ? `<span>+${t.layouts.length - shown.length}</span>` : ''}</div>`;
};
const country = (t) => `<div class="maker">${flag(t.flag)}<span>${esc(t.country ?? 'Unknown')}</span>${t.located ? `<span class="yr" title="Located">${icon('pin', 13)}</span>` : ''}</div>`;
const trA = (t) => { const l = t.layouts[0]; return `<article class="card a"><div class="shot"><img class="photo" src="${l.preview}"><div class="tl">${prov(t.prov)}</div>${l.outline ? `<div class="ov"><img class="outline-img" src="${l.outline}"></div>` : ''}</div>
  <div class="body">${country(t)}<div class="name">${esc(t.name)}</div>
  <div class="stats"><div><b class="num">${span(t.len, km)}</b><small>km</small></div><div><b class="num">${span(t.pits, fmt)}</b><small>pit boxes</small></div><div><b class="num">${t.layouts.length}</b><small>layouts</small></div></div>
  ${outs(t)}<div class="foot">${raced(t)}</div></div></article>`; };
const trB = (t) => { const l = t.layouts[0]; return `<article class="card b"><div class="shot"><img class="photo" src="${l.preview}"><div class="tl">${prov(t.prov, 1)}</div>${l.outline ? `<div class="ov" style="right:8px"><img class="outline-img" src="${l.outline}"></div>` : ''}
  <div class="cap"><div class="maker">${flag(t.flag)}<span>${esc(t.country ?? 'Unknown')}</span>${t.located ? `<span class="yr">${icon('pin', 13)}</span>` : ''}</div><div class="name">${esc(t.name)}</div></div></div>
  <div class="body"><div class="figs num"><span><b>${span(t.len, km)}</b> km</span><span><b>${span(t.pits, fmt)}</b> pit boxes</span><span><b>${t.layouts.length}</b> layout${t.layouts.length === 1 ? '' : 's'}</span></div>
  ${outs(t)}<div class="foot">${raced(t)}</div></div></article>`; };
const trC = (t) => { const l = t.layouts[0]; return `<article class="card a"><div class="map">${l.outline ? `<img class="big-ol outline-ink" src="${l.outline}">` : ''}<div class="tl">${prov(t.prov, 1)}</div><div class="thumb"><img src="${l.preview}"></div></div>
  <div class="body">${country(t)}<div class="name">${esc(t.name)}</div>
  <div class="stats"><div><b class="num">${span(t.len, km)}</b><small>km</small></div><div><b class="num">${span(t.pits, fmt)}</b><small>pit boxes</small></div><div><b class="num">${t.layouts.length}</b><small>layouts</small></div></div>
  ${outs(t)}<div class="foot">${raced(t)}</div></div></article>`; };
const trD = (t) => { const l = t.layouts[0]; return `<article class="card d">${edge(t)}<div class="shot"><img class="photo" src="${l.preview}"><div class="tl">${prov(t.prov, 1)}</div>${l.outline ? `<div class="ov"><img class="outline-img" src="${l.outline}"></div>` : ''}</div>
  <div class="body">${country(t)}<div class="name">${esc(t.name)}</div>
  <div class="big num"><div><b>${span(t.len, km)}</b><small>km</small></div><div><b>${span(t.pits, fmt)}</b><small>pit boxes</small></div><div><b>${t.layouts.length}</b><small>layouts</small></div></div>
  ${outs(t)}<div class="foot">${raced(t)}</div></div></article>`; };
const trE = (t) => { const l = t.layouts[0]; return `<article class="card e"><div class="shot"><img class="photo" src="${l.preview}"><div class="tl">${prov(t.prov, 1)}</div>${racedBadge(t)}${l.outline ? `<div class="ov" style="width:26%"><img class="outline-img" src="${l.outline}"></div>` : ''}</div>
  <div class="body"><div class="name">${esc(t.name)}</div>${country(t)}
  <div class="figs num"><span><b>${span(t.len, km)}</b> km</span><span><b>${span(t.pits, fmt)}</b> boxes</span><span><b>${t.layouts.length}</b> layouts</span></div></div></article>`; };

const OPTIONS = {
  cars: [
    ['A', 'Today', 'What the app shows now, for comparison.', carA, ''],
    ['B', 'Poster', 'The name and maker sit on the photo over a dark fade, so the card starts with the car rather than a row of small text. Figures become one line of text, and the championship footer keeps its chips. About 40px shorter than today.', carB, ''],
    ['C', 'Spec sheet', 'Photo on the left, details on the right, figures as labelled rows. Two cards across instead of three or four, so it suits comparing over browsing.', carC, 'wide'],
    ['D', 'Numbers first', 'A coloured edge along the top says which disciplines race it at a glance. The figures drop their boxes and get bigger, split by thin rules.', carD, ''],
    ['E', 'Compact', 'A shorter photo, one line of name, figures inline, and the championship count on the photo as a badge with discipline dots. Fits more cards on a screen, at the cost of the discipline names and the specs.', carE, 'tight'],
  ],
  tracks: [
    ['A', 'Today', 'What the app shows now, for comparison.', trA, ''],
    ['B', 'Poster', 'Name and country on the photo over a dark fade; the outline moves to the top right. Figures in one line.', trB, ''],
    ['C', 'Map first', 'The layout outline is the picture, drawn large on a tinted panel, with the photo as a small inset. Circuits read by their shape, which is how most people recognise them.', trC, ''],
    ['D', 'Numbers first', 'Discipline edge on top, bigger figures without boxes - the track twin of car option D.', trD, ''],
    ['E', 'Compact', 'Shorter photo with the outline and a championship badge on it; one line of figures.', trE, 'tight'],
  ],
};

/* ---------- List options at 940px ---------- */
const railMini = () => `<div class="rail"><b>Filters</b>Raced in a championship<b>Class</b>Formula 1 · GT3 · DTM…<b>Source</b>Base game · DLC · Mod<b>Brand</b>Race Sim Studio · VRC…</div>`;
const tb = (filters) => `<div class="tb"><div class="s">Search cars…</div>${filters ? `<span class="btn on">${icon('filter', 13)} Filters 2</span>` : ''}<span class="btn">Sort: Name</span><span class="btn">▦ ☰</span></div>`;
const pbar = (c) => `<span class="pbar">${fmt(c.pw)}<i style="--w:${Math.min(100, (c.pw / 1000) * 100)}%"></i></span>`;
const nameCell = (c, withSpecs, withProv) => `<div class="nm"><b>${esc(c.name)}</b><span>${esc(c.brand)} ${flag(c.flag)}${withProv ? ` ${prov(c.prov, 1)}` : ''}</span>${withSpecs && c.specs.length ? `<span>${c.specs.map((s) => `<span class="chip sm neutral">${esc(s)}</span>`).join('')}</span>` : ''}</div>`;
const dotsN = (c) => (c.series ? `<span class="raced">${discs(c).map((d) => `<i class="dot d-${d}"></i>`).join('')}<b>${c.series}</b></span>` : '<span class="muted">-</span>');
const allCols = (cars) => `<div class="tbl"><table><thead><tr><th></th><th>Car</th><th>Class</th><th class="r">Year</th><th class="r">Power</th><th class="r">Weight</th><th class="r">Power to weight</th><th class="r">Liveries</th><th>Championships</th><th>Source</th></tr></thead><tbody>
  ${cars.map((c) => `<tr><td><div class="th"><img src="${c.img}"></div></td><td>${nameCell(c)}</td><td><div class="tags">${specs(c)}</div></td><td class="r num">${c.year ?? '-'}</td><td class="r num">${fmt(c.bhp)}</td><td class="r num">${fmt(c.kg)}</td><td class="r num">${pbar(c)}</td><td class="r num">${c.skins}</td><td>${dotsN(c)}</td><td><div class="tags">${prov(c.prov, 1)}</div></td></tr>`).join('')}</tbody></table></div>`;
const priority = (cars) => `<div class="tbl"><table><thead><tr><th></th><th>Car</th><th class="r">Power</th><th class="r">Power to weight</th><th>Champ.</th></tr></thead><tbody>
  ${cars.map((c) => `<tr><td><div class="th"><img src="${c.img}"></div></td><td>${nameCell(c, true, true)}</td><td class="r num">${fmt(c.bhp)}</td><td class="r num">${pbar(c)}</td><td>${dotsN(c)}</td></tr>`).join('')}</tbody></table></div>`;
const twoLine = (cars) => `<div class="tbl">${cars.map((c) => `<div class="row2"><div class="th" style="width:76px;height:42px"><img src="${c.img}"></div>
  <div class="nm"><b>${esc(c.name)}</b><span>${esc(c.brand)} ${flag(c.flag)} ${c.year ? `· ${c.year}` : ''}</span></div>
  <div class="figs2 num"><span>${fmt(c.bhp)}<small>bhp</small></span><span>${fmt(c.kg)}<small>kg</small></span><span>${fmt(c.pw)}<small>bhp/t</small></span><span>${c.skins}<small>liveries</small></span></div>
  <div class="sub">${specs(c)} ${prov(c.prov, 1)} <span style="margin-left:auto">${dotsN(c)}</span></div></div>`).join('')}</div>`;
const LIST = [
  ['Now', 'Every column, scrolled sideways', 'What happens today at the minimum window: the table is wider than the space, so Liveries, Championships and Source are off to the right behind a horizontal scrollbar.', true, false, allCols],
  ['L1', 'Columns give way by priority', 'The table watches its own width and drops what matters least first: Source and Liveries, then Weight and Year. Class moves under the car\'s name and the source chip beside the brand, so nothing is lost outright - only Year, Weight and Liveries. At full width every column is back.', true, false, priority],
  ['L2', 'Two-line rows', 'Each car takes two lines: name and figures on the first, specs, source and championships on the second. Nothing is dropped and nothing scrolls sideways, but a row is taller, so fewer fit on screen.', true, false, twoLine],
  ['L3', 'The rail folds away', 'Below a certain window width the rail becomes a Filters button that opens it as a panel over the results, giving the table the whole width. Helps the card view too. Best combined with L1 or L2 for the narrowest windows.', false, true, priority],
];

let mode = 'cars';
const render = () => {
  document.querySelectorAll('.picker [data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === mode)));
  const root = document.getElementById('root');
  if (mode === 'list') {
    root.innerHTML = `<p class="why">The app's minimum window is 940px wide. Each frame below is drawn at exactly that width, with the cars you have installed. <b>My recommendation is L1</b>, with L3 as a follow-up if you want the cards to breathe too.</p>`
      + LIST.map(([k, title, why, rail, filters, fn]) => `<div class="label">${k} - ${title}</div><p class="why">${why}</p>
        <div class="window"><div class="bar">940 × 620 window</div><div class="in${rail ? '' : ' norail'}">${rail ? railMini() : ''}<div style="min-width:0">${tb(filters)}<div class="res">${fn(CARS)}</div></div></div></div>`).join('');
    return;
  }
  const items = mode === 'cars' ? CARS : TRACKS;
  root.innerHTML = `<p class="why">Each row is the same eight ${mode === 'cars' ? 'cars' : 'circuits'} from your install, drawn at the width the results column has beside the rail in a full-size window. Hover a card for the same glow the app uses.</p>`
    + OPTIONS[mode].map(([k, title, why, fn, cls]) => `<div class="label">${k} - ${title}</div><p class="why">${why}</p><div class="grid ${cls}" style="max-width:${cls === 'wide' ? 980 : 980}px">${items.map(fn).join('')}</div>`).join('');
};
document.querySelectorAll('.picker [data-v]').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; render(); }));
document.getElementById('theme').addEventListener('click', (e) => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  e.currentTarget.setAttribute('aria-pressed', String(dark));
});
render();
</script>
</body>
</html>
