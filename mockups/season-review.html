<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season review and history mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-soft: oklch(0.93 0.05 155); --success-soft-fg: oklch(0.34 0.09 155);
  --destructive: oklch(0.58 0.22 27);
  --missed: oklch(0.925 0.035 8); --missed-fg: oklch(0.42 0.09 12);
  --s-practice: oklch(0.93 0.045 250); --s-practice-fg: oklch(0.4 0.13 258);
  --s-qualify: oklch(0.93 0.05 310); --s-qualify-fg: oklch(0.4 0.15 310);
  --s-race: oklch(0.89 0.085 150); --s-race-fg: oklch(0.33 0.1 152);
  --gold: oklch(0.9 0.085 88); --gold-fg: oklch(0.42 0.1 75);
  --silver: oklch(0.91 0.008 255); --silver-fg: oklch(0.42 0.015 260);
  --bronze: oklch(0.89 0.07 52); --bronze-fg: oklch(0.41 0.09 48);
  --d-single: oklch(0.925 0.06 212); --d-single-fg: oklch(0.36 0.11 215);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270);
  --t-steel: oklch(0.875 0.022 250); --t-steel-fg: oklch(0.36 0.035 255);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
  --sk: oklch(0.925 0.018 255); --sk-hi: oklch(0.965 0.01 255); --sk-deep: oklch(0.885 0.02 255);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-soft: oklch(0.32 0.06 155); --success-soft-fg: oklch(0.86 0.11 155);
  --destructive: oklch(0.66 0.2 25);
  --missed: oklch(0.32 0.035 8); --missed-fg: oklch(0.86 0.075 12);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --gold: oklch(0.36 0.07 88); --gold-fg: oklch(0.89 0.12 92);
  --silver: oklch(0.33 0.006 260); --silver-fg: oklch(0.86 0.008 260);
  --bronze: oklch(0.33 0.06 50); --bronze-fg: oklch(0.85 0.09 55);
  --d-single: oklch(0.32 0.07 212); --d-single-fg: oklch(0.86 0.1 212);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);
  --t-steel: oklch(0.315 0.028 250); --t-steel-fg: oklch(0.82 0.035 255);
  --sk: oklch(0.3 0.016 265); --sk-hi: oklch(0.345 0.016 265); --sk-deep: oklch(0.27 0.016 265);
  --map-filter: invert(1);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.caps { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker .grp[hidden] { display: none; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.app-nav .gone { text-decoration: line-through; opacity: .45; }
.hdr { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.c-single { background: var(--d-single); color: var(--d-single-fg); }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-road { background: var(--d-road); color: var(--d-road-fg); }
.c-t5 { background: var(--t-steel); color: var(--t-steel-fg); }
.c-you { background: var(--primary); color: var(--primary-foreground); font-size: 10.5px; padding: 3px 5px; }
.c-done { background: var(--success-soft); color: var(--success-soft-fg); }
.c-live { background: color-mix(in oklch, var(--primary) 14%, var(--card)); color: var(--primary); }
.c-champ { background: var(--gold); color: var(--gold-fg); }
/* An edition's name and a year are identifiers, not categories - neutral on purpose. */
.c-ed { background: var(--muted); color: var(--foreground); }
.c-practice { background: var(--s-practice); color: var(--s-practice-fg); }
.c-qualify { background: var(--s-qualify); color: var(--s-qualify-fg); }
.c-race { background: var(--s-race); color: var(--s-race-fg); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel > h3 { margin: 0; padding: 12px 14px 0; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel > h3 .end { margin-left: auto; font-weight: 400; font-size: 12.5px; color: var(--muted-foreground); }
.panel .pb { padding: 10px 14px 14px; }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .1); }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--muted); gap: 2px; }
.seg span { padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted-foreground); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.seg span.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.lg { height: 38px; padding: 0 16px; }
.btn.dim { opacity: .5; }
.placeholder { border: 1px dashed var(--border); border-radius: 12px; padding: 12px 14px; color: var(--muted-foreground); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.placeholder b { color: var(--foreground); font-weight: 600; font-size: 13px; }

/* The result cell - the same piece the results screens use. */
.rc { position: relative; display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 5px; border-radius: 6px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rc.p1 { background: var(--gold); color: var(--gold-fg); }
.rc.p2 { background: var(--silver); color: var(--silver-fg); }
.rc.p3 { background: var(--bronze); color: var(--bronze-fg); }
.rc.pts { background: var(--success-soft); color: var(--success-soft-fg); }
.rc.out { color: var(--foreground); font-weight: 500; }
.rc.none { color: var(--muted-foreground); font-weight: 400; }
.rc .pole, .rc .fl { position: absolute; top: 2px; width: 5px; height: 5px; border-radius: 50%; }
.rc .pole { left: 2px; background: var(--s-qualify-fg); }
.rc .fl { right: 2px; background: var(--primary); }
.rc.lg { min-width: 40px; height: 30px; font-size: 15px; }
.rc.xl { min-width: 72px; height: 56px; font-size: 30px; border-radius: 12px; }
.rc.sm { min-width: 26px; height: 20px; font-size: 11px; padding: 0 3px; }
.mv { display: inline-flex; align-items: center; gap: 1px; font-size: 11px; font-weight: 600; min-width: 26px; font-variant-numeric: tabular-nums; }
.mv.up { color: var(--success); }
.mv.down { color: var(--destructive); }
.mv.same { color: var(--muted-foreground); font-weight: 400; }
.green { color: var(--success-soft-fg); }

/* ---------- Skeleton primitives, as mockups/loading.html draws them ---------- */
.sk { display: block; background: var(--sk); border-radius: 6px; flex: none;
  background-image: linear-gradient(100deg, transparent 0 40%, var(--sk-hi) 50%, transparent 60% 100%);
  background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }
.sk.round { border-radius: 99px; }
.sk.deep { background-color: var(--sk-deep); }
@keyframes sweep { from { background-position: 100vw 0; } to { background-position: -100vw 0; } }
.l11 { height: 9px; margin: 3px 0; } .l13 { height: 10px; margin: 4px 0; } .l14 { height: 11px; margin: 4px 0; }
.l16 { height: 13px; margin: 5px 0; } .l20 { height: 16px; margin: 6px 0; } .l24 { height: 20px; margin: 6px 0; } .l30 { height: 24px; margin: 4px 0; }

/* ---------- Tables ---------- */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted-foreground); padding: 8px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t td { padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t tbody tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; }
.t td.r .sk { margin-left: auto; }
.t tr.me td { background: color-mix(in srgb, var(--primary) 9%, var(--card)); font-weight: 600; }
.t tr.me td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
.t tr.link:hover td { background: var(--accent); cursor: pointer; }
.drv { display: flex; align-items: center; gap: 8px; min-width: 0; }
.drv .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.drv .nm small { font-size: 11.5px; color: var(--muted-foreground); font-weight: 400; }
.pts-big { font-weight: 650; font-size: 13.5px; }

/* The figures strip, as the round and result pages draw it. */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.strip > div { padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; }
.strip > div:not(:first-child) { border-left: 1px solid var(--border); }
.strip .k { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
.strip b { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; min-height: 30px; }
.strip b small { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }

/* ---------- Championship review ---------- */
.hero { position: relative; border-radius: 14px; overflow: hidden; background: var(--scrim); min-height: 200px; }
.hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, oklch(0.14 0.012 265 / .92), oklch(0.14 0.012 265 / .55) 60%, oklch(0.14 0.012 265 / .25)); }
.hero .cap { position: relative; z-index: 1; color: var(--on-scrim); display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; max-width: 70%; }
.hero .over { display: flex; gap: 6px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.hero h1 { margin: 0; font-size: 30px; font-weight: 650; line-height: 1.15; }
.hero .line { font-size: 13px; opacity: .85; }
.hero .final { position: absolute; z-index: 1; right: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--on-scrim); text-align: center; }
.hero .final .rc.xl { box-shadow: 0 6px 24px oklch(0 0 0 / .35); }
.hero .final small { font-size: 12.5px; opacity: .85; }
.hero .final .title { font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
/* The loading hero is a card-coloured panel: no photograph to darken yet. */
.hero.loading { background: var(--card); border: 1px solid var(--border); }
.hero.loading::after { display: none; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; margin-top: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.champs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 14px 14px; }
.champ-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.champ-card img.car, .champ-card .car { width: 100%; aspect-ratio: 16 / 6; object-fit: cover; background: var(--scrim); display: block; }
.champ-card .tx { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.champ-card .tx b { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.champ-card .tx span { font-size: 12px; color: var(--muted-foreground); }
.champ-card .k { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--gold-fg); display: flex; gap: 6px; align-items: center; }
.chart { padding: 6px 14px 4px; }
.chart svg { width: 100%; height: 170px; display: block; }
.chart .grid line { stroke: var(--border); }
.chart .lbl { fill: var(--muted-foreground); font-size: 10.5px; font-family: inherit; }
.rounds-row { display: grid; gap: 6px; padding: 4px 14px 14px; }
.rounds-row > div { display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 8px; padding: 6px 4px; background: color-mix(in srgb, var(--muted) 45%, var(--card)); min-height: 74px; }
.rounds-row .rn { font-size: 11px; font-weight: 600; display: flex; gap: 4px; align-items: center; }
.rounds-row .rn img { width: 16px; height: 11px; border-radius: 2px; object-fit: cover; }
.rounds-row .rr { display: flex; gap: 2px; }
.rounds-row .pp { font-size: 11.5px; font-weight: 600; color: var(--success-soft-fg); }
.h2h-head { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px 0; font-weight: 600; font-size: 13px; }
.h2h { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; gap: 4px 10px; align-items: center; padding: 4px 14px 14px; font-size: 13px; }
.h2h .lab { grid-column: 1 / -1; text-align: center; font-size: 11.5px; color: var(--muted-foreground); margin-top: 6px; }
.h2h .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--muted); }
.h2h .bar i { display: block; height: 100%; }
.h2h .bar .a { background: var(--primary); }
.h2h .bar .b { background: var(--muted-foreground); opacity: .5; }
.h2h .v { font-weight: 650; font-variant-numeric: tabular-nums; }
.h2h .v.r { text-align: right; }
.next { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.next h2 { margin: 0; font-size: 16px; font-weight: 650; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; min-height: 20px; }
.kv > span:first-child { color: var(--muted-foreground); }

/* ---------- Year review and history ---------- */
.title { display: flex; align-items: flex-end; gap: 12px; padding: 22px 0 14px; }
.title h1 { margin: 0; font-size: 26px; font-weight: 650; display: flex; align-items: center; gap: 10px; }
.title .sub { color: var(--muted-foreground); }
.eds { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.ed { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px 12px 12px; align-items: center; min-height: 104px; }
.ed:hover { background: var(--accent); }
.ed .stripe { align-self: stretch; border-radius: 99px; }
.ed .nm { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ed .nm b { font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.ed .nm .ln { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }
.ed .pos { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.ed .pos small { font-size: 12px; color: var(--muted-foreground); }
.spark { width: 100%; height: 26px; display: block; }
.st-single { background: var(--d-single-fg); } .st-road { background: var(--d-road-fg); } .st-sports { background: var(--d-sports-fg); }
.year { margin-bottom: 22px; }
.year-h { display: flex; align-items: center; gap: 10px; padding: 0 2px 8px; min-height: 40px; }
.year-h h2 { margin: 0; font-size: 20px; font-weight: 650; }
.year-h .tot { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted-foreground); margin-left: 6px; }
.year-h .tot b { color: var(--foreground); }
.year-h .go { margin-left: auto; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 30px 0 18px; }
.home-head h2 { margin: 2px 0 0; font-size: 24px; font-weight: 650; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: stretch; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.feature { padding: 22px; display: flex; flex-direction: column; gap: 12px; min-height: 280px; }
.feature h3 { margin: 0; font-size: 20px; font-weight: 650; }
.feature p { margin: 0; color: var(--muted-foreground); }
.feature .icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklch, var(--primary) 12%, transparent); color: var(--primary); }
.feature .icon svg { width: 20px; height: 20px; }
.feature .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.feature .note { font-size: 12.5px; color: var(--muted-foreground); }
.again { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.again a { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; }
.again a + a { border-top: 1px solid var(--border); }
.again a:hover { background: var(--accent); }
.again .stripe { align-self: stretch; border-radius: 99px; }
.champs-card { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.crow { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; padding: 8px; border-radius: 8px; align-items: center; }
.crow:hover { background: var(--accent); }
.crow .stripe { align-self: stretch; border-radius: 99px; }
.crow .prog { display: flex; gap: 2px; margin: 6px 0 4px; }
.crow .prog i { flex: 1; height: 6px; border-radius: 99px; background: var(--muted); }
.crow .prog i.r { background: var(--success); } .crow .prog i.m { background: var(--missed-fg); opacity: .6; } .crow .prog i.n { background: var(--primary); }
.crow .pos { text-align: right; }
.crow .pos b { font-size: 18px; }
.done-banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 18px; border-radius: 12px; background: color-mix(in srgb, var(--gold) 55%, var(--card)); border: 1px solid color-mix(in srgb, var(--gold-fg) 25%, var(--border)); }
.done-banner .tx { display: flex; flex-direction: column; }
.done-banner .tx b { font-size: 14.5px; }
.done-banner .tx span { font-size: 12.5px; color: var(--muted-foreground); }
.done-banner .btn { margin-left: auto; }
.ic-gold { color: var(--gold-fg); }

/* Results and History, as two doors on Home. */
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
.door { display: flex; flex-direction: column; overflow: hidden; transition: border-color .15s; }
.door:hover { border-color: color-mix(in oklch, var(--primary) 45%, var(--border)); }
.door .top { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
.door .well { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.door .well svg { width: 20px; height: 20px; }
/* The two wells take the colour of what they hold: a race's green, a title's gold. */
.well.results { background: var(--s-race); color: var(--s-race-fg); }
.well.history { background: var(--gold); color: var(--gold-fg); }
.door .top .tx { display: flex; flex-direction: column; }
.door .top .tx b { font-size: 16px; font-weight: 650; }
.door .top .tx span { font-size: 12.5px; color: var(--muted-foreground); }
.door .top .go { margin-left: auto; color: var(--primary); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.door .peek { border-top: 1px solid var(--border); padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 110px; }
.door .pl { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 26px; }
.door .pl .w { color: var(--muted-foreground); font-size: 12px; width: 70px; flex: none; }
.door .pl .end { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }

/* Home's own tabs, the way Settings has them. */
.htabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.htabs a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 14px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.htabs a.on { color: var(--foreground); border-bottom-color: var(--primary); }
.htabs a .well { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; }
.htabs a .well svg { width: 14px; height: 14px; }
.htabs a .well.home { background: color-mix(in oklch, var(--primary) 12%, transparent); color: var(--primary); }
.htabs .n { font-size: 12px; font-weight: 400; color: var(--muted-foreground); }

/* The Results list's cards, reduced to their heads. */
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
.wk { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.wk .ph { position: relative; height: 110px; background: var(--scrim); }
.wk .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .85; }
.wk .ph .cap { position: absolute; left: 14px; bottom: 10px; color: var(--on-scrim); display: flex; flex-direction: column; }
.wk .ph .cap b { font-size: 16px; }
.wk .rows { padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.wk .rows div { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.wk .rows .rc { margin-left: auto; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 0 0 14px; }
.search { display: flex; align-items: center; gap: 8px; width: 300px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); font-size: 13px; }
.select { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; }

/* ---------- Editions on a championship page ---------- */
.sum { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.sum .bar { height: 5px; border-radius: 99px; background: linear-gradient(90deg, oklch(0.4 0.09 115), oklch(0.55 0.1 125)); }
.sum h2 { margin: 0; font-size: 19px; font-weight: 650; }
.edsw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.edsw a { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--card); min-height: 78px; }
.edsw a.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.edsw a .top { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.edsw a .top .rc, .edsw a .top .chip { margin-left: auto; }
.edsw a small { font-size: 12px; color: var(--muted-foreground); }
.edsw .prog { display: flex; gap: 2px; }
.edsw .prog i { flex: 1; height: 5px; border-radius: 99px; background: var(--muted); }
.edsw .prog i.r { background: var(--success); } .edsw .prog i.n { background: var(--primary); }
.cp { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.cal-card { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-left: 3px solid var(--d-sports-fg); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.tabs a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--foreground); border-bottom-color: var(--primary); }
</style>
</head>
<body>
<div class="picker">
  <div class="grp"><strong>Page</strong>
    <button class="opt" data-k="page" data-v="home">Home</button>
    <button class="opt" data-k="page" data-v="results">Results</button>
    <button class="opt" data-k="page" data-v="history">History</button>
    <button class="opt" data-k="page" data-v="year">Year review</button>
    <button class="opt" data-k="page" data-v="review">Championship review</button>
    <button class="opt" data-k="page" data-v="editions">Editions</button>
  </div>
  <div class="grp"><strong>State</strong>
    <button class="opt" data-k="load" data-v="loaded">Loaded</button>
    <button class="opt" data-k="load" data-v="loading">Loading</button>
  </div>
  <div class="grp" data-for="home"><strong>Moment</strong>
    <button class="opt" data-k="moment" data-v="complete">A championship ends</button>
    <button class="opt" data-k="moment" data-v="done">Nothing left this year</button>
    <button class="opt" data-k="moment" data-v="new">A new year</button>
  </div>
  <div class="grp" data-for="review"><strong>You finished</strong>
    <button class="opt" data-k="finish" data-v="third">P3</button>
    <button class="opt" data-k="finish" data-v="champion">Champion</button>
    <button class="opt" data-k="finish" data-v="midfield">P11</button>

  </div>
  <div class="grp" data-for="editions"><strong>Runs</strong>
    <button class="opt" data-k="names" data-v="q">Four times a year</button>

  <div class="grp"><strong>Theme</strong>

  </div>
</div>
<div class="why" id="why"></div>
<div class="frame" id="app"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const FLAG = (c) => `${AC}gui/NationFlags/${c}.png`;
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  arrow: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="m6 15 6-6 6 6"/></svg>',
  dn: '<svg class="i" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="m6 9 6 6 6-6"/></svg>',
  trophy: '<svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  flagc: '<svg class="i" viewBox="0 0 24 24"><path d="M4 22V4M4 4h13l-2 4 2 4H4"/></svg>',
  cal: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  history: '<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg>',
  results: '<svg class="i" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="m8 14 3-3 3 3 5-6"/></svg>',
  home: '<svg class="i" viewBox="0 0 24 24"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
};

// ---------- One edition of the Italian F4 Championship ----------
const PLAYER = 'Eterry';
const TEAMS = [
  ['adria', 'Adria Junior Team', [['Gioele Bortolussi', 'ITA'], ['Mattia Zamperlin', 'ITA'], ['Kevin Piovesana', 'ITA']]],
  ['romagna', 'Romagna Corse', [['Samuele Fabbrucci', 'ITA'], ['Denis Montanari', 'ITA'], ['Christian Ricciotti', 'ITA']]],
  ['tuscia', 'Tuscia Racing', [['Francesco Pallottelli', 'ITA'], ['Brando Cardarelli', 'ITA'], ['Giacomo Anselmetti', 'ITA']]],
  ['stelvio', 'Stelvio Motorsport', [['Nicola Tschurtschenthaler', 'ITA'], ['Jonas Pircher', 'ITA'], ['Luca Gufler', 'ITA']]],
  ['levante', 'Levante Racing', [[PLAYER, 'GBR'], ['Pablo Estellés', 'ESP'], ['Marc Ferrús', 'ESP']]],
  ['helvetia', 'Helvetia Junior', [['Nico Bachofner', 'CHE'], ['Levin Zürcher', 'CHE'], ['Yanis Chappuis', 'CHE']]],
  ['falcons', 'Gulf Falcons', [['Rashid Al Mansoori', 'ARE'], ['Hamdan Al Suwaidi', 'ARE'], ['Omar Al Falasi', 'ARE']]],
  ['vistula', 'Vistula Racing', [['Szymon Wroblewicz', 'POL'], ['Kacper Dziedzic', 'POL'], ['Igor Stachurski', 'POL']]],
];
const F4 = ['01_project_one_yellow_17', '02_project_one_orange_18', '03_NGA_red_4', '04_NGA_green_5', '05_NGA_blue_6', '06_veldfield_purple_20', '07_veldfield_cyan_21', '08_carbon'];
const SEATS = TEAMS.flatMap(([team, teamName, ds], t) => ds.map(([name, nat], i) => ({
  id: `${team}-${i}`, name, nat, team, teamName, me: name === PLAYER, skin: `${AC}cars/rss_formula_rss_4_2024/skins/${F4[(t + i * 3) % 8]}`,
})));
const MATE = SEATS.find((s) => s.name === 'Marc Ferrús');
const ROUNDS = [
  { name: 'Imola', code: 'IMO', nat: 'ITA', img: `${AC}tracks/imola/ui/preview.png` },
  { name: 'Vallelunga', code: 'VAL', nat: 'ITA', img: `${AC}tracks/ks_vallelunga/ui/extended_circuit/preview.png` },
  { name: 'Mugello', code: 'MUG', nat: 'ITA', img: `${AC}tracks/mugello/ui/preview.png` },
  { name: 'Red Bull Ring', code: 'RBR', nat: 'AUT', img: '' },
  { name: 'Monza', code: 'MNZ', nat: 'ITA', img: `${AC}tracks/monza/ui/preview.png` },
];
const POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
const pointsFor = (pos) => POINTS[pos - 1] ?? 0;

// Seeded so every toggle draws the same season; the player's pace is what the "You finished" switch moves.
const season = (myPace) => {
  let seed = 42;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const skill = new Map(SEATS.map((s) => [s.id, s.me ? myPace : rnd()]));
  const races = ROUNDS.map(() => [0, 1, 2].map(() => {
    const order = SEATS.map((s) => ({ s, k: skill.get(s.id) + rnd() * 0.55 })).sort((a, b) => b.k - a.k);
    const grid = SEATS.map((s) => ({ s, k: skill.get(s.id) + rnd() * 0.5 })).sort((a, b) => b.k - a.k).map((x) => x.s.id);
    const fl = order[Math.floor(rnd() * 5)].s.id;
    return order.map((x, i) => ({ seat: x.s.id, pos: i + 1, grid: grid.indexOf(x.s.id) + 1, fl: fl === x.s.id }));
  }));
  const placeOf = (rd, ri, seat) => races[rd][ri].find((p) => p.seat === seat);
  const after = (n) => {
    const rows = SEATS.map((s) => {
      let pts = 0; let wins = 0; let pods = 0; let best = 99; let poles = 0; let fls = 0; let sum = 0;
      for (let r = 0; r < n; r += 1) for (let ri = 0; ri < 3; ri += 1) {
        const p = placeOf(r, ri, s.id);
        pts += pointsFor(p.pos); sum += p.pos;
        if (p.pos === 1) wins += 1; if (p.pos <= 3) pods += 1; if (p.grid === 1 && ri !== 1) poles += 1; if (p.fl) fls += 1;
        best = Math.min(best, p.pos);
      }
      return { ...s, pts, wins, pods, best, poles, fls, avg: n ? sum / (n * 3) : 0 };
    });
    rows.sort((a, b) => b.pts - a.pts || b.wins - a.wins || a.best - b.best);
    rows.forEach((r, i) => { r.pos = i + 1; });
    return rows;
  };
  const final = after(ROUNDS.length);
  const before = after(ROUNDS.length - 1);
  final.forEach((r) => { r.move = before.find((b) => b.id === r.id).pos - r.pos; });
  const path = ROUNDS.map((_, i) => after(i + 1).find((r) => r.me).pos);
  const teams = TEAMS.map(([id, name]) => ({ id, name, nat: SEATS.find((s) => s.team === id).nat, me: id === 'levante', pts: final.filter((r) => r.team === id).reduce((a, r) => a + r.pts, 0), wins: final.filter((r) => r.team === id).reduce((a, r) => a + r.wins, 0) }))
    .sort((a, b) => b.pts - a.pts).map((t, i) => ({ ...t, pos: i + 1 }));
  return { placeOf, final, path, teams };
};
const PACE = { third: 0.9, champion: 1.08, midfield: 0.5 };

// ---------- Atoms ----------
const rcClass = (pos) => (pos <= 3 ? `p${pos}` : pos <= 10 ? 'pts' : 'out');
const rc = (pos, extra = '', marks = {}) => `<span class="rc ${rcClass(pos)} ${extra}">${marks.pole ? '<i class="pole"></i>' : ''}${pos}${marks.fl ? '<i class="fl"></i>' : ''}</span>`;
const rcP = (pos, extra = '') => `<span class="rc ${rcClass(pos)} ${extra}">P${pos}</span>`;
const mv = (m) => (m > 0 ? `<span class="mv up">${I.up}${m}</span>` : m < 0 ? `<span class="mv down">${I.dn}${-m}</span>` : '<span class="mv same">-</span>');
const you = '<span class="chip c-you">You</span>';
const drv = (s, sub = true) => `<span class="drv"><img class="flag" src="${FLAG(s.nat)}"><span class="nm"><span>${s.name} ${s.me ? you : ''}</span>${sub ? `<small>${s.teamName}</small>` : ''}</span></span>`;
const ordinal = (n) => `${n}${['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th'}`;
const strip = (cells) => `<section class="panel strip">${cells.map(([k, v]) => `<div><span class="k">${k}</span><b>${v}</b></div>`).join('')}</section>`;

// Skeleton pieces: a block, a line the height of the text it stands for.
const sk = (w, h, cls = '') => `<span class="sk ${cls}" style="width:${typeof w === 'number' ? `${w}px` : w};height:${h}px"></span>`;
const ln = (w, size = 14, cls = '') => `<span class="sk l${size} ${cls}" style="width:${typeof w === 'number' ? `${w}px` : w}"></span>`;
const rep = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join('');

const state = { page: 'home', reach: 'doors', load: 'loaded', moment: 'complete', finish: 'third', year: 'open', names: 'q', th: 'light', who: 'drivers' };
const loading = () => state.load === 'loading';

// Results and History leave the navigation; both are reached from Home.
const nav = (on) => `<div class="app-nav"><span class="brand">Another Assetto Corsa Career</span>${['Home', 'Race', 'Calendar', 'Championships', 'Results', 'Cars', 'Tracks', 'Settings']
  .map((n) => `<span class="${n === on ? 'on' : ''} ${n === 'Results' ? 'gone' : ''}">${n}</span>`).join('')}</div>`;

// Home's tabs, for variant B: the page Results and History become part of.
const homeTabs = (on, counts = true) => `<nav class="htabs">
  <a class="${on === 'home' ? 'on' : ''}" data-set="page=home"><span class="well home">${I.home}</span>Overview</a>
  <a class="${on === 'results' ? 'on' : ''}" data-set="page=results"><span class="well results">${I.results}</span>Results ${counts ? '<span class="n">12 events</span>' : sk(52, 10)}</a>
  <a class="${on === 'history' ? 'on' : ''}" data-set="page=history"><span class="well history">${I.trophy}</span>History ${counts ? '<span class="n">2 seasons</span>' : sk(52, 10)}</a>
</nav>`;

// The way back from a page Home leads to: Back for the cards, Home's tabs for the tabs.
const homeChild = (page, back = 'Home') => (state.reach === 'tabs' && (page === 'results' || page === 'history')
  ? `<div class="home-head" style="padding-bottom:12px"><div><span class="caps">2027 season</span><h2>Friday 1 January</h2></div></div>${homeTabs(page, !loading())}`
  : `<div class="hdr"><a class="back">${I.back} ${back}</a></div>`);

// ---------- Shared pieces ----------
const finalTable = (rows) => `<table class="t">
  <thead><tr><th>Pos</th><th></th><th>Driver</th><th class="r">Wins</th><th class="r">Podiums</th><th class="r">Best</th><th class="r">Gap</th><th class="r">Points</th></tr></thead>
  <tbody>${rows.map((r) => `<tr class="${r.me ? 'me' : ''}"><td style="width:40px">${rc(r.pos)}</td><td style="width:30px">${mv(r.move)}</td><td>${drv(r)}</td>
    <td class="r num">${r.wins || '<span class="muted">-</span>'}</td><td class="r num">${r.pods || '<span class="muted">-</span>'}</td><td class="r num">${ordinal(r.best)}</td>
    <td class="r num muted">${r.pos === 1 ? '' : `-${rows[0].pts - r.pts}`}</td><td class="r num pts-big">${r.pts}</td></tr>`).join('')}</tbody></table>`;
const teamTable = (rows) => `<table class="t">
  <thead><tr><th>Pos</th><th>Team</th><th class="r">Wins</th><th class="r">Gap</th><th class="r">Points</th></tr></thead>
  <tbody>${rows.map((r) => `<tr class="${r.me ? 'me' : ''}"><td style="width:40px">${rc(r.pos)}</td>
    <td><span class="drv"><img class="flag" src="${FLAG(r.nat)}"><span>${r.name} ${r.me ? '<span class="chip c-you">Yours</span>' : ''}</span></span></td>
    <td class="r num">${r.wins || '<span class="muted">-</span>'}</td><td class="r num muted">${r.pos === 1 ? '' : `-${rows[0].pts - r.pts}`}</td><td class="r num pts-big">${r.pts}</td></tr>`).join('')}</tbody></table>`;
const positionChart = (path, field) => {
  const w = 640; const h = 170; const l = 34; const r = 14; const t = 12; const b = 24;
  const x = (i) => l + (i * (w - l - r)) / (path.length - 1);
  const y = (p) => t + ((p - 1) * (h - t - b)) / (field - 1);
  const ticks = [1, 3, 6, 10, 15, 20, field];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <rect x="${l}" y="${y(1) - 4}" width="${w - l - r}" height="${y(3) - y(1) + 8}" fill="var(--gold)" opacity=".55" rx="4"/>
    <g class="grid">${ticks.map((p) => `<line x1="${l}" x2="${w - r}" y1="${y(p)}" y2="${y(p)}"/><text class="lbl" x="${l - 8}" y="${y(p) + 3.5}" text-anchor="end">P${p}</text>`).join('')}</g>
    ${path.map((_, i) => `<text class="lbl" x="${x(i)}" y="${h - 6}" text-anchor="middle">${ROUNDS[i].code}</text>`).join('')}
    <polyline fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" points="${path.map((p, i) => `${x(i)},${y(p)}`).join(' ')}"/>
    ${path.map((p, i) => `<circle cx="${x(i)}" cy="${y(p)}" r="5" fill="var(--card)" stroke="var(--primary)" stroke-width="2.5"/>`).join('')}
  </svg>`;
};
const spark = (path, field, colour = 'var(--primary)') => {
  const w = 120; const h = 26;
  const x = (i) => 3 + (i * (w - 6)) / (path.length - 1);
  const y = (p) => 3 + ((p - 1) * (h - 6)) / (field - 1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${colour}" stroke-width="2" points="${path.map((p, i) => `${x(i)},${y(p)}`).join(' ')}"/></svg>`;
};
const DISC = { single: ['Single-seater', 'c-single', 'st-single'], sports: ['Sportscar', 'c-sports', 'st-sports'], road: ['Road', 'c-road', 'st-road'] };

// ---------- Championship review ----------
const reviewData = () => {
  const s = season(PACE[state.finish]);
  const me = s.final.find((r) => r.me);
  const mate = s.final.find((r) => r.id === MATE.id);
  const champion = s.final[0];
  let qAhead = 0; let rAhead = 0;
  for (let rd = 0; rd < ROUNDS.length; rd += 1) for (let ri = 0; ri < 3; ri += 1) {
    const a = s.placeOf(rd, ri, me.id); const b = s.placeOf(rd, ri, mate.id);
    if (a.grid < b.grid) qAhead += 1; if (a.pos < b.pos) rAhead += 1;
  }

    ${rep(2, (i) => `<div class="card door"><div class="top"><span class="well ${i ? 'history' : 'results'}">${i ? I.trophy : I.results}</span><span class="tx"><b>${i ? 'History' : 'Results'}</b>${i ? '<span>Every season of your career, and each championship\'s review</span>' : `<span style="display:flex;gap:6px;align-items:center">Every event you have driven · ${sk(110, 10)}</span>`}</span><span class="go">Open ${I.chev}</span></div>
      <div class="peek"><span class="caps">${i ? 'Your seasons' : 'Last driven'}</span>${ln(240, 13)}${i ? '' : `<div class="pl">${sk(70, 20)}${sk(26, 20)}${sk(56, 20)}${sk(26, 20)}</div>`}${i ? ln(200, 13) : ''}</div></div>`)}
  </div>`;

const home = () => {
  const m = state.moment;
  const tabs = state.reach === 'tabs';
  const head = (year, day) => `<div class="home-head"${tabs ? ' style="padding-bottom:12px"' : ''}><div><span class="caps">${year} season</span><h2>${day}</h2></div>
    <a class="btn">Open the calendar ${I.arrow}</a></div>${tabs ? homeTabs('home') : ''}`;
  const after = tabs ? '' : doors(m);
  if (m === 'complete') {
    return `${nav('Home')}${head(2026, 'Sunday 4 October')}
    <div class="done-banner"><span class="ic-gold">${I.trophy}</span><div class="tx"><b>The Italian F4 Championship is over - you finished 3rd</b><span>186 points, 2 wins and 6 podiums. Gioele Bortolussi is champion.</span></div><a class="btn pri" data-set="page=review">See the season ${I.arrow}</a></div>
    <div class="home-grid">
      <div class="card feature"><span class="caps" style="color:var(--primary)">Your next event</span><h3>GT86 Cup · Round 8</h3><p>Brands Hatch Indy · Saturday 10 October · six days to go</p><div class="placeholder" style="padding:30px;text-align:center">The next event, as Home draws it today</div></div>
      ${champsCard('2 this year', homeRow({ name: 'GT86 Cup', disc: 'road', tier: 5, marks: 'rrrrrrrnl', next: 'Round 8 · Sat 10 Oct', pos: 'P2', field: 18, pts: 141 }) + homeRow({ name: 'Italian F4 Championship', disc: 'single', tier: 5, marks: 'rrrrr', next: 'Finished · see the season', pos: 'P3', field: 24, pts: 186 }))}
    </div>${after}`;
  }
  if (m === 'done') {
    return `${nav('Home')}${head(2026, 'Sunday 13 December')}
    <div class="home-grid">
      <div class="card feature"><span class="icon">${I.flagc}</span><h3>Your 2026 is done</h3>
        <p>Everything you entered this year has been raced. Look back over the year, then move on to 2027 - or enter something that still runs before 31 December.</p>
        <div class="acts"><a class="btn pri lg" data-set="page=year">Review 2026 ${I.arrow}</a><a class="btn lg">Finish the year</a><a class="btn lg" style="border:0;color:var(--primary)">Find a championship</a></div>
        <span class="note">Finishing moves the clock to Friday 1 January 2027. Nothing carries over - you enter 2027's championships afresh.</span></div>
      ${champsCard('4 this year', [
    { name: 'Lotus 2-Eleven Winter Cup', ed: 'Q1', disc: 'sports', marks: 'rrrrrr', next: 'Champion · see the season', pos: 'P1', field: 12, pts: 143 },
    { name: 'Italian F4 Championship', disc: 'single', marks: 'rrrrr', next: 'Finished · see the season', pos: 'P3', field: 24, pts: 186 },
    { name: 'GT86 Cup', disc: 'road', marks: 'rrrrrrrrr', next: 'Finished · see the season', pos: 'P2', field: 18, pts: 164 },
    { name: 'Lotus 2-Eleven Winter Cup', ed: 'Q4', disc: 'sports', marks: 'rrrrrr', next: 'Finished · see the season', pos: 'P4', field: 12, pts: 98 },
  ].map((c) => homeRow({ tier: 5, ...c })).join(''))}
    </div>${after}`;
  }
  return `${nav('Home')}${head(2027, 'Friday 1 January')}
  <div class="home-grid">
    <div class="card feature"><span class="caps" style="color:var(--primary)">A new season</span><h3>2027 is open</h3>
      <p>Nothing is entered yet. Here is what you raced last year - each opens its championship with your class and car already picked.</p>
      <div class="again">${[
    { name: 'Italian F4 Championship', disc: 'single', pos: 3, when: 'opens Sun 3 Jan', ed: '2027' },
    { name: 'GT86 Cup', disc: 'road', pos: 2, when: 'opens Sat 13 Feb', ed: '2027' },
    { name: 'Lotus 2-Eleven Winter Cup', disc: 'sports', pos: 4, when: 'opens Wed 6 Jan', ed: 'Q1 2027' },
  ].map((c) => `<a><span class="stripe ${DISC[c.disc][2]}"></span><span style="display:flex;flex-direction:column;min-width:0"><b style="font-size:13.5px">${c.name}</b><span class="muted" style="font-size:12px">Last year ${rcP(c.pos, 'sm')} · ${c.ed} ${c.when}</span></span><span class="chip ${DISC[c.disc][1]}">${DISC[c.disc][0]}</span><span class="btn" style="height:28px">Enter ${c.ed} ${I.chev}</span></a>`).join('')}</div>
      <div class="acts"><a class="btn">Find another championship</a><a class="btn" style="border:0;color:var(--primary)" data-set="page=year">Look back at 2026 ${I.chev}</a></div></div>
    ${champsCard('none yet', '<p class="muted" style="padding:8px;margin:0;font-size:13px">Nothing entered for 2027 yet.</p>')}
  </div>${after}`;
};

const homeSkeleton = () => {
  const tabs = state.reach === 'tabs';
  return `${nav('Home')}
  <div class="home-head"${tabs ? ' style="padding-bottom:12px"' : ''}><div>${ln(90, 11)}${ln(220, 24)}</div><a class="btn">Open the calendar ${I.arrow}</a></div>
  ${tabs ? homeTabs('home', false) : ''}
  <div class="home-grid">
    <div class="card feature">${ln(110, 11)}${ln(260, 20)}${ln(320, 13)}<span class="sk" style="width:100%;height:120px"></span></div>
    <div class="card champs-card"><div style="display:flex;justify-content:space-between;padding:0 8px 4px"><span class="caps">Your championships</span>${ln(60, 11)}</div>
      ${rep(3, () => `<div class="crow"><span class="sk" style="width:4px;height:100%"></span><span style="display:flex;flex-direction:column">${ln(170, 13)}<span class="sk" style="height:6px;width:100%;margin:6px 0 4px"></span>${ln(110, 11)}</span><span class="pos">${ln(30, 16)}${ln(40, 11)}</span></div>`)}</div>
  </div>
  ${tabs ? '' : doorsSkeleton()}`;
};

// ---------- Editions on a championship page ----------
// Quarters are Q1-Q4 and halves H1-H2; a championship that runs once a year names only its year.
const editionLabel = (q, y = 2027) => `${state.names === 'q' ? 'Q' : 'H'}${q} ${y}`;
const MONTHS = { q: ['January - March', 'April - June', 'July - September', 'October - December'], h: ['January - June', 'July - December'] };
const editions = () => {
  const eds = (state.names === 'q' ? [
    { q: 1, status: 'done', pos: 1, marks: 'rrrrrr', sub: 'You won it' },
    { q: 2, status: 'in', marks: 'rrnlll', sub: 'You are in · round 3 next' },
    { q: 3, status: 'open', marks: 'llllll', sub: 'Opens Wed 7 Jul' },
    { q: 4, status: 'open', marks: 'llllll', sub: 'Opens Wed 6 Oct' },
  ] : [
    { q: 1, status: 'done', pos: 1, marks: 'rrrrrr', sub: 'You won it' },
    { q: 2, status: 'in', marks: 'rrnlll', sub: 'You are in · round 3 next' },
  ]);
  return `${nav('Championships')}
  <div class="hdr"><a class="back">${I.back} All championships</a></div>
  <div class="cp">
    <aside><section class="panel sum"><div class="bar"></div><h2>Lotus 2-Eleven Winter Cup</h2>
      <div style="display:flex;gap:4px;flex-wrap:wrap"><span class="chip c-sports">Sportscar</span><span class="chip c-t5">Tier 5</span><span class="chip c-ed">${editionLabel(2)}</span></div>
      <div class="kv"><span>Runs</span><span>${state.names === 'q' ? 'Four times' : 'Twice'} a year, 6 rounds each</span></div>
      <div class="kv"><span>Grid</span><span>12 cars, 6 teams</span></div>
      <a class="btn pri lg">Race round 3</a></section></aside>
    <main class="col">
      <div class="edsw" style="grid-template-columns:repeat(${eds.length},1fr)">${eds.map((e) => `<a class="${e.q === 2 ? 'on' : ''}"><span class="top">${editionLabel(e.q)}${e.status === 'done' ? rcP(e.pos, 'sm') : e.status === 'in' ? '<span class="chip c-live">Entered</span>' : ''}</span>
        <span class="prog">${e.marks.split('').map((m) => `<i class="${m}"></i>`).join('')}</span><small>${MONTHS[state.names][e.q - 1]} · ${e.sub}</small></a>`).join('')}</div>
      <nav class="tabs"><a class="on">Rounds</a><a>Standings</a><a>Classes</a><a>Points, prizes and formats</a></nav>
      <div class="placeholder" style="padding:40px;text-align:center">The championship page's tabs for the edition picked above, as they are today</div>
      <section class="panel" style="padding:14px;display:flex;flex-direction:column;gap:10px"><span class="caps">The same edition elsewhere</span>
        <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
          <div class="panel cal-card" style="min-width:260px"><b style="font-size:13px">Lotus 2-Eleven Winter Cup</b><span class="muted" style="font-size:12px">${editionLabel(2)} · Round 3 · Brands Hatch</span></div>
          <span class="muted" style="font-size:12.5px">A calendar card, an event page's heading, a Results card and Home's row all name the edition the same way. A championship that runs once a year names only its year.</span>
        </div></section>
    </main>
  </div>`;
};

// The switcher draws as soon as the library says the championship runs more than once a year -
// which it does before the season's own results arrive - so it never pushes the page down.
const editionsSkeleton = () => `${nav('Championships')}
  <div class="hdr"><a class="back">${I.back} All championships</a></div>
  <div class="cp">
    <aside><section class="panel sum">${sk('100%', 5)}${ln(220, 20)}<div style="display:flex;gap:4px">${sk(70, 20)}${sk(44, 20)}${sk(56, 20)}</div>
      <div class="kv"><span>Runs</span>${ln(160, 13)}</div><div class="kv"><span>Grid</span>${ln(100, 13)}</div>${sk('100%', 38)}</section></aside>
    <main class="col">
      <div class="edsw">${rep(4, () => `<div class="panel" style="padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:78px">${ln(70, 13)}<span class="sk" style="height:5px;width:100%"></span>${ln(150, 11)}</div>`)}</div>
      <nav class="tabs"><a class="on">Rounds</a><a>Standings</a><a>Classes</a><a>Points, prizes and formats</a></nav>
      <div class="placeholder" style="padding:40px;text-align:center">The championship page's own skeleton below, as it is today</div>
    </main>
  </div>`;

// ---------- Notes ----------
const WHY = {
  home: `<b>Home</b>. Results leaves the navigation (struck through) and History never joins it: both are reached from Home, through two large
    cards under the season, each previewing what it holds - the last event driven, and your seasons with their final places - and opening its page,
    whose Back returns Home. The three <i>moments</i> are this slice's: a championship ending, nothing left in the year, and a new year.`,
  results: `<b>Results</b>, reached from Home's card: a page with Back to Home. The list itself, its filters and the result page it opens are as
    they are today.`,
  history: `<b>History</b>: every year of the career, newest first, the current one included, each with the editions you entered and how they ended, and
    a way into the year's review. A championship you were not in has no history.`,
  year: `<b>Year review</b>, at <code>/history/:season</code>. While the year is open it is the year so far and where <b>Finish 2026</b> lives - if anything
    you entered is still to run, the same skip dialog as everywhere else lists what that gives up. Once the year has closed the button goes.`,
  review: `<b>Championship review</b> - the Report layout - at <code>/history/:season/:series/:edition</code>. It opens once an edition's last round has run,
    from Home's banner, from the round page of its final round, from the championship's page and from History. Read off the season's own copy of the
    championship, so it never changes afterwards. The dashed boxes are what Phases 7, 8 and 9 fill in.`,
  editions: `<b>Editions</b>: a quarter-length championship runs four times a year, a half-year one twice. Its page gets a switcher across the year's
    editions, and the tabs below show the edition picked. Quarters are named <code>Q1 2027</code> to <code>Q4 2027</code> and halves <code>H1 2027</code>
    and <code>H2 2027</code>; switch <i>Runs</i> to see both.`,
};
const NOTES = `<ul>
  <li><b>Loading</b> (switch <i>State</i>): everything that does not wait on the data is drawn for real - titles, Back, tabs, headings, table heads,
    labels, the dashed later-phase boxes, the doors' names - and everything the data fills is a shimmer block of the size and place of what replaces it.</li>
  <li><b>Colour</b>: positions wear the podium metals and a points finish green; discipline and tier chips as everywhere else; <i>Complete</i> is success,
    <i>Under way</i> and <i>Entered</i> are primary, a title is gold. The Results door wears a race's green and History a title's gold. An edition's name and
    a year are identifiers and stay neutral on purpose.</li>
</ul>`;

const PAGES = {
  home: [home, homeSkeleton], results: [results, resultsSkeleton], history: [history, historySkeleton],
  year: [yearReview, yearSkeleton], review: [review, reviewSkeleton], editions: [editions, editionsSkeleton],
};
const render = () => {
  document.documentElement.dataset.theme = state.th;
  document.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', String(state[b.dataset.k] === b.dataset.v)));
  document.querySelectorAll('.grp[data-for]').forEach((g) => { g.hidden = g.dataset.for !== state.page; });
  document.getElementById('why').innerHTML = WHY[state.page] + NOTES;
  document.getElementById('app').innerHTML = PAGES[state.page][loading() ? 1 : 0]();
};
document.addEventListener('click', (e) => {
  const opt = e.target.closest('.opt');
  if (opt) { state[opt.dataset.k] = opt.dataset.v; render(); return; }
  const set = e.target.closest('[data-set]');
  if (set) { const [k, v] = set.dataset.set.split('='); state[k] = v; render(); if (k === 'page') window.scrollTo(0, 0); }
});
// A hash such as #page=year&year=closed opens the mockup on that state.
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in state) state[k] = v; });
render();
</script>
</body>
</html>
