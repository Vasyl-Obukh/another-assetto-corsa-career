* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
/* The page behind the mock window, not an app colour. */
:root body { background: oklch(0.9 0.008 255); }
:root[data-theme="dark"] body { background: oklch(0.12 0.01 265); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.caps { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.end { margin-left: auto; }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: oklch(0.16 0.01 260); color: oklch(0.965 0.007 250); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid oklch(1 0 0 / 25%); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: oklch(0.965 0.007 250); color: oklch(0.16 0.01 260); }
.why { max-width: 1280px; margin: 16px auto 0; padding: 0 24px; font-size: 13.5px; }
.why .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 2px 0; }
.why .q { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
.why .q b { color: var(--primary); }
.stage { max-width: 1280px; margin: 14px auto 60px; padding: 0 24px; }

/* ---------- The app window ---------- */
.win { position: relative; height: 820px; display: flex; flex-direction: column; overflow: hidden; background: var(--background); border-radius: 12px; box-shadow: 0 0 0 1px oklch(0 0 0 / .12), 0 18px 50px oklch(0 0 0 / .18); }
.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; font-size: 11px; color: var(--muted-foreground); background: var(--card); border-bottom: 1px solid var(--border); }
.titlebar span:first-child { margin-right: auto; }
.hd { flex: none; display: flex; align-items: center; gap: 22px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--background); position: relative; z-index: 5; }
.hd h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.nav { display: flex; gap: 2px; align-items: center; }
.nav a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
.nav a.on { color: var(--primary); background: color-mix(in oklch, var(--primary) 10%, transparent); }
.nav a .i { width: 15px; height: 15px; }
.body { flex: 1; min-height: 0; overflow: hidden; padding: 22px 28px; position: relative; }
.shdr { display: flex; align-items: center; gap: 12px; padding: 12px 28px; border-bottom: 1px solid var(--border); flex: none; background: var(--background); }
.shdr h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.backlink { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.c-single { background: var(--d-single); color: var(--d-single-fg); }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.c-road { background: var(--d-road); color: var(--d-road-fg); }
.c-t1 { background: var(--t1); color: var(--t1-fg); } .c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-t3 { background: var(--t3); color: var(--t3-fg); } .c-t4 { background: var(--t4); color: var(--t4-fg); }
.c-t5 { background: var(--t5); color: var(--t5-fg); }
.c-career { background: var(--m-career); color: var(--m-career-fg); }
.c-champ { background: var(--m-champ); color: var(--m-champ-fg); }
.c-quick { background: var(--m-quick); color: var(--m-quick-fg); }
.c-named { background: var(--k-named); color: var(--k-named-fg); }
.c-kquick { background: var(--k-quick); color: var(--k-quick-fg); }
.c-auto { background: var(--k-auto); color: var(--k-auto-fg); }
.c-practice { background: var(--s-practice); color: var(--s-practice-fg); }
.c-qualify { background: var(--s-qualify); color: var(--s-qualify-fg); }
.c-race { background: var(--s-race); color: var(--s-race-fg); }
.c-done { background: var(--success-soft); color: var(--success-soft-fg); }
.c-gold { background: var(--gold); color: var(--gold-fg); }
.c-later { border: 1px dashed var(--border); color: var(--muted-foreground); background: transparent; }
/* A year, a date, a count - identifiers, neutral on purpose. */
.c-plain { background: var(--muted); color: var(--foreground); }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .12); }
.flag.lg { width: 27px; height: 18px; border-radius: 3px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.pri { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { background: var(--destructive); color: white; border-color: transparent; }
.btn.lg { height: 40px; padding: 0 18px; font-size: 14px; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.icon { width: 32px; padding: 0; }
.btn.dim { opacity: .5; }
.split { display: inline-flex; }
.split .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split .btn:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; width: 28px; padding: 0; }
.split .btn.pri:last-child { border-left: 1px solid oklch(1 0 0 / 25%); }
.kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border); border-bottom-width: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted-foreground); background: var(--card); font-family: inherit; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel > h3 { margin: 0; padding: 12px 14px 0; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel .pb { padding: 10px 14px 14px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--muted); gap: 2px; }
.seg span { padding: 4px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted-foreground); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.seg span.on { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.seg span small { font-size: 11px; opacity: .8; }
.placeholder { border: 1px dashed var(--border); border-radius: 12px; padding: 12px 14px; color: var(--muted-foreground); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.placeholder b { color: var(--foreground); font-weight: 600; font-size: 13px; }
.note { border-left: 3px solid var(--primary); background: color-mix(in srgb, var(--primary) 7%, var(--card)); border-radius: 0 8px 8px 0; padding: 7px 10px; font-size: 12px; color: var(--muted-foreground); }
.note b { color: var(--foreground); }
.input { height: 34px; border: 1px solid var(--input); border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: var(--card); font-size: 13.5px; }
.input.focus { box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 25%, transparent); border-color: var(--primary); }
.lbl { font-size: 13px; font-weight: 500; }
.hint { font-size: 12px; color: var(--muted-foreground); }
.field { display: flex; flex-direction: column; gap: 6px; }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--muted); position: relative; flex: none; box-shadow: inset 0 0 0 1px var(--border); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .3); }
.switch.on { background: var(--primary); box-shadow: none; }
.switch.on::after { left: 17px; }
.slider { position: relative; height: 34px; }
.slider .track { position: absolute; left: 0; right: 0; top: 9px; height: 6px; border-radius: 99px; background: var(--muted); }
.slider .fill { position: absolute; left: 0; top: 9px; height: 6px; border-radius: 99px; background: var(--primary); }
.slider .knob { position: absolute; top: 3px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--card); border: 2px solid var(--primary); box-shadow: 0 1px 3px oklch(0 0 0 / .25); }
.slider .stops { position: absolute; left: 0; right: 0; top: 22px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-foreground); }
.slider .stops span.on { color: var(--foreground); font-weight: 600; }

/* ---------- Photographs ---------- */
.ph { position: relative; overflow: hidden; background: var(--scrim); }
.ph > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph.shade::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, oklch(0.14 0.012 265 / .05), oklch(0.14 0.012 265 / .82)); }
.ph.side::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, oklch(0.14 0.012 265 / .94), oklch(0.14 0.012 265 / .7) 38%, oklch(0.14 0.012 265 / .1)); }
.ph > .cap { position: relative; z-index: 1; color: var(--on-scrim); }

/* ---------- Menus, dialogs, toasts ---------- */
.scrim { position: absolute; inset: 0; background: oklch(0.14 0.012 265 / .45); z-index: 20; }
.dlg { position: absolute; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 60px oklch(0 0 0 / .3); display: flex; flex-direction: column; }
.dlg .dh { padding: 18px 20px 6px; }
.dlg .dh h3 { margin: 0; font-size: 16.5px; font-weight: 650; }
.dlg .dh p { margin: 4px 0 0; font-size: 13px; color: var(--muted-foreground); }
.dlg .db { padding: 10px 20px 14px; display: flex; flex-direction: column; gap: 12px; }
.dlg .df { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.menu { position: absolute; z-index: 30; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 40px oklch(0 0 0 / .22); padding: 5px; min-width: 280px; }
.menu .mi { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 9px; border-radius: 7px; font-size: 13.5px; }
.menu .mi.tall { height: auto; padding: 7px 9px; align-items: flex-start; }
.menu .mi.hl { background: var(--accent); }
.menu .mi .kbd { margin-left: auto; }
.menu .mi small { display: block; font-size: 11.5px; color: var(--muted-foreground); line-height: 1.3; }
.menu .sep { height: 1px; background: var(--border); margin: 4px -5px; }
.menu .mh { padding: 8px 9px 6px; display: flex; gap: 9px; align-items: center; }
.menu .mi.danger { color: var(--destructive); }
.toast { position: absolute; z-index: 40; right: 22px; bottom: 22px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 40px oklch(0 0 0 / .25); padding: 12px 14px; display: flex; gap: 12px; align-items: center; min-width: 380px; font-size: 13px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }

/* ---------- Lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.li:last-child { border-bottom: 0; }
.li.sel { background: color-mix(in srgb, var(--primary) 8%, var(--card)); box-shadow: inset 3px 0 0 var(--primary); }
.li.hover { background: var(--accent); }
.li .t { font-weight: 600; font-size: 13.5px; }
.li .s { font-size: 12px; color: var(--muted-foreground); }
.thumb { width: 64px; height: 40px; border-radius: 6px; object-fit: cover; flex: none; background: var(--muted); }
.well { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.well .i { width: 17px; height: 17px; }
.well.blue { background: var(--w-blue); color: var(--w-blue-fg); }
.well.violet { background: var(--w-violet); color: var(--w-violet-fg); }
.well.green { background: var(--w-green); color: var(--w-green-fg); }
.well.amber { background: var(--w-amber); color: var(--w-amber-fg); }
.well.career { background: var(--m-career); color: var(--m-career-fg); }
.well.champ { background: var(--m-champ); color: var(--m-champ-fg); }
.well.quick { background: var(--m-quick); color: var(--m-quick-fg); }
.well.named { background: var(--k-named); color: var(--k-named-fg); }
.well.kquick { background: var(--k-quick); color: var(--k-quick-fg); }
.well.auto { background: var(--k-auto); color: var(--k-auto-fg); }

/* ---------- Settings ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 28px; flex: none; background: var(--background); }
.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 10px 10px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a.on { color: var(--foreground); border-bottom-color: var(--primary); }
.sect { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: 34px 1fr; gap: 6px 14px; }
.sect h4 { margin: 0; font-size: 14.5px; font-weight: 600; align-self: center; display: flex; gap: 8px; align-items: center; }
.sect .sh { grid-column: 2; font-size: 12.5px; color: var(--muted-foreground); margin-top: -4px; }
.sect .sb { grid-column: 2; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.inherit { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted-foreground); }

/* ---------- Overview page ---------- */
.doc { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.doc .panel .pb { padding: 14px 18px 18px; }
.doc h2 { margin: 0; font-size: 18px; }
.flow { display: grid; gap: 10px; }
.flow .lvl { display: grid; gap: 10px; }
.flow .arrow { text-align: center; color: var(--muted-foreground); font-size: 12px; }
.node { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.node h5 { margin: 0; font-size: 13.5px; display: flex; gap: 7px; align-items: center; }
.node p { margin: 0; font-size: 12px; color: var(--muted-foreground); }
.node .pills { display: flex; flex-wrap: wrap; gap: 4px; }
.node .pill { font-size: 11.5px; padding: 2px 7px; border-radius: 99px; background: var(--muted); }
.node.career { border-top: 3px solid var(--m-career-solid); }
.node.champ { border-top: 3px solid var(--m-champ-solid); }
.node.quick { border-top: 3px solid var(--m-quick-solid); }
pre.tree { margin: 0; font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; line-height: 1.6; color: var(--foreground); background: var(--muted); padding: 12px 14px; border-radius: 10px; overflow: auto; }
pre.tree i { color: var(--muted-foreground); font-style: normal; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted-foreground); padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.yes { color: var(--success); font-weight: 600; }
.no { color: var(--muted-foreground); }

/* ---------- Start screen ---------- */
.btn.glass { background: oklch(1 0 0 / 13%); border-color: oklch(1 0 0 / 22%); color: var(--on-scrim); backdrop-filter: blur(6px); }
.btn.glass small.cnt { font-size: 11px; opacity: .75; }
.st-title h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
/* The start screen follows the theme; only its tiles are photographs. */
.st-a { flex: 1; min-height: 0; position: relative; padding: 32px 40px 26px; display: flex; flex-direction: column; gap: 24px;
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--primary) 9%, var(--background)), var(--background) 55%); }
.st-tiles { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; min-height: 0; }
.st-tile { border-radius: 16px; box-shadow: 0 14px 34px oklch(0 0 0 / .2); border-top: 4px solid; }
.st-tile.career { border-top-color: var(--m-career-solid); }
.st-tile.champ { border-top-color: var(--m-champ-solid); }
.st-tile.quick { border-top-color: var(--m-quick-solid); }
.st-tile.shade::after { background: linear-gradient(180deg, oklch(0.14 0.012 265 / .25), oklch(0.14 0.012 265 / .55) 35%, oklch(0.14 0.012 265 / .93)); }
.st-tile > .cap { height: 100%; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.st-tile h2 { margin: 6px 0 0; font-size: 26px; font-weight: 650; }
.st-tile p { margin: 0; font-size: 13px; opacity: .82; }
.cont { background: oklch(1 0 0 / 10%); border: 1px solid oklch(1 0 0 / 16%); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
.cont b { display: block; font-size: 14px; }
.cont small { display: block; font-size: 12px; opacity: .75; }
.st-foot { display: flex; align-items: center; gap: 8px; }

/* ---------- New career, new championship ---------- */
.lvl-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.lvl-tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.lvl-tile.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 20%, transparent); }
.lvl-tile .ex { font-size: 12px; color: var(--muted-foreground); line-height: 1.35; }
.lvl-tile .rt { font-size: 12px; margin-top: auto; }
.kv2 { display: grid; grid-template-columns: 100px 1fr; gap: 6px 10px; font-size: 13px; }
.kv2 span { color: var(--muted-foreground); }
.kv2 b { display: flex; gap: 6px; align-items: center; }
.caret { width: 1px; height: 16px; background: var(--foreground); margin-left: -6px; }
.stepper { display: flex; align-items: center; gap: 8px; margin-left: 24px; font-size: 13px; color: var(--muted-foreground); }
.stepper span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.stepper i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--muted); font-size: 11.5px; font-weight: 600; }
.stepper span.on { color: var(--foreground); font-weight: 600; }
.stepper span.on i { background: var(--primary); color: var(--primary-foreground); }
.stepper span.done i { background: var(--success-soft); color: var(--success-soft-fg); }
.stepper b { width: 24px; height: 1px; background: var(--border); }
.foot-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 28px; border-top: 1px solid var(--border); background: var(--card); }
.ch-card { overflow: hidden; }
.ch-card.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 20%, transparent); }
.car-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.car-tile { border: 1px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; background: var(--card); }
.car-tile img { width: 100%; height: 90px; object-fit: contain; }
.car-tile.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 20%, transparent); }

/* ---------- Inside a slot ---------- */
.slotbtn { display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); text-align: left; flex: none; }
.slotbtn b { display: block; font-size: 13.5px; line-height: 1.2; white-space: nowrap; }
.slotbtn small { display: block; font-size: 11.5px; color: var(--muted-foreground); white-space: nowrap; }
.slotbtn.open { box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 22%, transparent); border-color: var(--primary); }
.idx { padding: 5px 10px; border-radius: 7px; color: var(--muted-foreground); }
.idx.on { background: var(--accent); color: var(--foreground); font-weight: 500; }

/* ---------- Rounds, classes, aids ---------- */
.rounds { display: flex; flex-direction: column; }
.rd { display: grid; grid-template-columns: 30px 76px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--border); }
.rd:first-child { border-top: 0; }
.rd .no { font-size: 11px; font-weight: 700; color: var(--muted-foreground); text-align: center; line-height: 1.1; }
.rd .no b { display: block; font-size: 17px; color: var(--foreground); font-weight: 650; }
.rd .pic { position: relative; width: 76px; height: 46px; border-radius: 7px; overflow: hidden; background: var(--muted); }
.rd .pic img.p { width: 100%; height: 100%; object-fit: cover; }
.rd .pic img.o { position: absolute; right: 3px; bottom: 3px; width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 0 2px oklch(0 0 0 / .8)); }
.rd .tn { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.rd .ts { font-size: 12px; color: var(--muted-foreground); }
.rd .dt { text-align: right; font-size: 12.5px; white-space: nowrap; }
.rd .dt small { display: block; color: var(--muted-foreground); font-size: 11.5px; }
.rd .ss { display: flex; gap: 3px; margin-top: 4px; }
.c-cl1 { background: var(--cl-1); color: var(--cl-1-fg); }
.c-cl2 { background: var(--cl-2); color: var(--cl-2-fg); }
.cls-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cls-tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--card); border-left-width: 4px; }
.cls-tile.cl1 { border-left-color: var(--cl-1-fg); }
.cls-tile.cl2 { border-left-color: var(--cl-2-fg); }
.cls-tile.on { border-color: var(--primary); border-left-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 20%, transparent); }
.cls-tile .models { display: flex; gap: 4px; }
.cls-tile .models img { width: 54px; height: 32px; object-fit: cover; border-radius: 4px; }
.aid-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.aid { border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
.aid.sw { flex-direction: row; align-items: center; justify-content: space-between; }
.aid.diff { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); background: color-mix(in srgb, var(--primary) 5%, var(--card)); }
.aid small { font-weight: 400; font-size: 11.5px; color: var(--primary); }
.follow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; background: var(--muted); font-size: 13px; }
.follow .lbl { font-weight: 600; }
.dimmed { opacity: .5; pointer-events: none; }
.c-warn { background: var(--warning-soft); color: var(--warning-soft-fg); }
.toast.warn { border-color: color-mix(in srgb, var(--warning-soft-fg) 40%, var(--border)); }
.li.save { display: grid; grid-template-columns: 30px minmax(0, 1fr) 90px 76px 32px; }
.li.save > .k { justify-self: end; }
.btn.icon.on { background: var(--accent); }

/* ---------- Skeletons, as the shimmer utility in globals.css draws them ---------- */
:root { --skeleton: oklch(0.925 0.018 255); --skeleton-shine: oklch(0.965 0.01 255); }
:root[data-theme="dark"] { --skeleton: oklch(0.3 0.016 265); --skeleton-shine: oklch(0.345 0.016 265); }
.shim { display: inline-block; flex: none; vertical-align: middle; background-color: var(--skeleton);
  background-image: linear-gradient(100deg, transparent 0 40%, var(--skeleton-shine) 50%, transparent 60% 100%);
  background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }
.shim.block { display: block; }
/* Over a photograph the fill is translucent white, so the photo still reads through. */
.shim.on-photo { background-color: oklch(1 0 0 / 14%); background-image: linear-gradient(100deg, transparent 0 40%, oklch(1 0 0 / 14%) 50%, transparent 60% 100%); }
@keyframes sweep { from { background-position: 100vw 0; } to { background-position: -100vw 0; } }
/* ---------- This mockup ---------- */
/* Proposed: what an invitation's answer is. Awaiting on the warning amber,
   because it wants something of the player; accepted on the success green;
   lapsed on the calendar's missed rose, since a lapsed invitation is an event
   passed by; declined on the autosave's half-chroma slate 232, which no inbox
   shows and which sits clear of the rose - the destructive red 27 would sit
   beside it on the wheel. The kind of mail is its well: an invitation in the
   historic leather it is about. */
:root {
  --historic: oklch(0.915 0.04 40); --historic-fg: oklch(0.42 0.075 38);
  --event-missed: oklch(0.925 0.035 8); --event-missed-fg: oklch(0.42 0.09 12);
}
:root[data-theme="dark"] {
  --historic: oklch(0.33 0.04 40); --historic-fg: oklch(0.86 0.06 45);
  --event-missed: oklch(0.32 0.035 8); --event-missed-fg: oklch(0.86 0.075 12);
}
.c-historic { background: var(--historic); color: var(--historic-fg); }
.c-await { background: var(--warning-soft); color: var(--warning-soft-fg); }
.c-acc { background: var(--success-soft); color: var(--success-soft-fg); }
.c-dec { background: var(--k-auto); color: var(--k-auto-fg); }
.c-lapsed { background: var(--event-missed); color: var(--event-missed-fg); }
.well.leather { background: var(--historic); color: var(--historic-fg); }
.bal { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); font-weight: 600; font-size: 13.5px; }
.bal .i { color: var(--success); }
.bal.rat .i { color: var(--d-sports-fg); }
.new-outline { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 2px; }
.nav a .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--primary); color: var(--primary-foreground); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; margin-left: 1px; }

/* ---------- Inbox ---------- */
.inbox { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px 400px minmax(0, 1fr); }
.rail { border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.rail .caps { padding: 14px 10px 6px; }
.folder { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); }
.folder.on { background: var(--accent); color: var(--foreground); }
.folder .cnt { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.folder .cnt.pill { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.folder .cnt.pri { background: var(--primary); color: var(--primary-foreground); }
.folder .cnt.amb { background: var(--warning-soft); color: var(--warning-soft-fg); }
.folder .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.folder.later { opacity: .5; }
.mlist { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.mlist .tools { padding: 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.mlist .scroll { flex: 1; overflow: auto; }
.mgrp { position: sticky; top: 0; padding: 8px 14px 6px; background: var(--background); border-bottom: 1px solid var(--border); z-index: 1; }
.mrow { display: grid; grid-template-columns: 8px 34px minmax(0, 1fr); gap: 0 10px; padding: 11px 14px 11px 10px; border-bottom: 1px solid var(--border); align-items: start; cursor: pointer; }
.mrow .ud { width: 8px; height: 8px; border-radius: 50%; margin-top: 13px; }
.mrow.unread .ud { background: var(--primary); }
.mrow .top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted-foreground); }
.mrow .top .from { color: var(--foreground); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .top .when { margin-left: auto; white-space: nowrap; font-size: 12px; }
.mrow .subj { font-size: 13.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .bot { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.mrow .bot .s { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow.unread .from, .mrow.unread .subj { font-weight: 650; }
.mrow.sel { background: color-mix(in srgb, var(--primary) 8%, var(--card)); box-shadow: inset 3px 0 0 var(--primary); }
.mrow.hover { background: var(--accent); }
.reader { min-height: 0; display: flex; flex-direction: column; }
.reader .rs { flex: 1; overflow: auto; padding: 22px 30px 26px; }
.mail { max-width: 760px; display: flex; flex-direction: column; gap: 16px; }
.mail h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.mfrom { display: flex; align-items: center; gap: 12px; }
.mfrom b { display: block; font-size: 14px; }
.mfrom small { display: block; font-size: 12px; color: var(--muted-foreground); }
.letter { font-size: 14px; line-height: 1.6; }
.letter p { margin: 0 0 10px; max-width: 66ch; }
.letter .blurb { border-left: 3px solid var(--historic-fg); padding: 2px 0 2px 12px; color: var(--muted-foreground); font-style: italic; }
.evcard { overflow: hidden; }
.evcard .ph { height: 132px; }
.evcard .ph .cap { position: absolute; left: 16px; bottom: 12px; right: 16px; display: flex; align-items: flex-end; gap: 12px; }
.evcard .ph h3 { margin: 4px 0 0; font-size: 19px; font-weight: 650; }
.evcard .ph .d { font-size: 12.5px; opacity: .85; }
.evcard .facts { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; }
.evcard .facts > div { padding: 11px 14px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.evcard .facts > div:last-child { border-right: 0; }
.evcard .facts .k { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.evcard .facts b { font-size: 13.5px; font-weight: 600; }
.evcard .facts small { font-size: 12px; color: var(--muted-foreground); }
.seatcell { display: flex; gap: 10px; align-items: center; }
.seatcell img { width: 78px; height: 44px; object-fit: contain; flex: none; }
.fstrip { display: inline-flex; gap: 2px; }
.fstrip span { width: 20px; height: 18px; border-radius: 4px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; }
.replybar { flex: none; border-top: 1px solid var(--border); background: var(--card); padding: 12px 30px; display: flex; align-items: center; gap: 12px; }
.replybar .msg { display: flex; align-items: center; gap: 10px; font-size: 13px; min-width: 0; }
.replybar .msg b { font-weight: 600; }
.replybar .msg small { display: block; color: var(--muted-foreground); font-size: 12px; }
.replybar .acts { margin-left: auto; display: flex; gap: 8px; }
.note.amber { border-left-color: var(--warning-soft-fg); background: color-mix(in srgb, var(--warning-soft) 55%, var(--card)); }
.note { display: flex; gap: 8px; align-items: flex-start; }
.empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted-foreground); }
.empty b { display: block; color: var(--foreground); font-size: 15px; margin: 10px 0 4px; }
.menu.small { min-width: 210px; }
.hdrmenu { position: relative; }

/* ---------- Other screens ---------- */
.banner { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-left: 4px solid var(--historic-fg); }
.banner b { font-size: 14px; }
.banner small { display: block; color: var(--muted-foreground); font-size: 12.5px; }
.evhead { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; gap: 18px; align-items: center; }
.evhead h2 { margin: 6px 0 2px; font-size: 24px; font-weight: 650; }
.evhead .facts { display: flex; gap: 14px; font-size: 13px; color: var(--muted-foreground); }
.evhead img.map { width: 120px; height: 70px; object-fit: contain; margin-left: auto; }
.evbody { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; padding: 18px 28px; }
.seatwell { display: flex; gap: 12px; align-items: center; }
.seatwell img { width: 110px; height: 62px; object-fit: contain; }
.launch { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 12px; }
.tl { display: flex; flex-direction: column; gap: 10px; max-width: 900px; }
.tlday { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: start; }
.tlday .dd { font-size: 12.5px; color: var(--muted-foreground); padding-top: 12px; }
.tlday .dd b { display: block; color: var(--foreground); font-size: 18px; font-weight: 650; }
.tlcard { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.tlcard.invited { border-style: dashed; border-color: color-mix(in srgb, var(--historic-fg) 55%, var(--border)); background: color-mix(in srgb, var(--historic) 30%, var(--card)); }
.tlcard .t { font-weight: 600; }
.tlcard .s { font-size: 12px; color: var(--muted-foreground); }
.tlcard img { width: 60px; height: 36px; object-fit: contain; }
.lost { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; }
.lost .when { margin-left: auto; color: var(--muted-foreground); font-size: 12.5px; white-space: nowrap; }
.mono { font-family: "Cascadia Code", Consolas, monospace; }
.pager { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12.5px; }
.pager .btn.on { background: var(--accent); border-color: transparent; }
.toast .lines { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; font-size: 12.5px; color: var(--muted-foreground); }
.toast .lines span { display: flex; gap: 6px; align-items: center; }
.toast .lines .d { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: none; }
.cost { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 13px; }
.cost span { color: var(--muted-foreground); }
.cost b { text-align: right; font-variant-numeric: tabular-nums; }
.cost .tot { border-top: 1px solid var(--border); padding-top: 6px; color: var(--foreground); font-weight: 600; }
.carpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.carpick > div { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.carpick > div.on { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 20%, transparent); }
.carpick b { font-size: 13px; }
.meter { height: 8px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--historic-fg); border-radius: 99px; }
.chances { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chances > div { border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.chances b { font-size: 20px; font-weight: 650; }
.c-pending { border: 1px dashed color-mix(in srgb, var(--historic-fg) 60%, var(--border)); color: var(--historic-fg); background: transparent; }
.tlcard.open { border-color: color-mix(in srgb, var(--historic-fg) 35%, var(--border)); }
.enterp { border: 1px dashed var(--primary); border-radius: 12px; background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.enterp .eh { display: flex; flex-direction: column; gap: 4px; }
.enterp .eh b { font-size: 15px; font-weight: 600; gap: 8px; }
.enterp .eh span { font-size: 13px; color: var(--muted-foreground); }
.carrow { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.carrow b { display: block; font-weight: 500; }
.carrow .grow { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.thumb16 { width: 64px; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--muted); flex: none; }
.thumb16 img { width: 100%; height: 100%; object-fit: cover; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.rentdl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12px; }
.rentdl dt { color: var(--muted-foreground); }
.rentdl dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.rentdl dd.hint2 { grid-column: span 2; text-align: left; font-weight: 400; color: var(--muted-foreground); }
.chancebox { display: flex; flex-direction: column; align-items: flex-start; }
.chancebox > .row, .chancebox > .meter { align-self: stretch; }
/* Whose a car is, as CAR_SOURCE_ACCENT draws it: rented on the rental's teal. */
:root { --ledger-rent: oklch(0.92 0.055 195); --ledger-rent-fg: oklch(0.38 0.09 200); }
:root[data-theme="dark"] { --ledger-rent: oklch(0.33 0.06 195); --ledger-rent-fg: oklch(0.86 0.09 195); }
.c-rented { background: var(--ledger-rent); color: var(--ledger-rent-fg); }
.c-rented .i { width: 12px; height: 12px; }
.life { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
.life .node { position: relative; }
.life .node h5 .chip { margin-left: auto; }
.in { color: var(--success); font-weight: 600; }
.out { color: var(--destructive-soft-fg); font-weight: 600; }
.tiles4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.tile.hero { border-top: 3px solid var(--success); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 140px minmax(0, 1fr) 90px; align-items: center; gap: 10px; font-size: 12.5px; }
.bar .tr { height: 8px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 99px; }
.bar .amt { text-align: right; }
.led td.amt, .led th.amt { text-align: right; white-space: nowrap; }
.led td { vertical-align: middle; }
.panel.ledger { height: 100%; min-height: 0; display: flex; flex-direction: column; }
.panel.ledger .pb { flex: 1; min-height: 0; overflow: auto; padding-top: 0; margin-top: 8px; }
.led thead th { position: sticky; top: 0; background: var(--card); z-index: 1; }
.led .w { font-weight: 600; }
.led .s { font-size: 12px; color: var(--muted-foreground); }
.feebox { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.feebox .k { color: var(--muted-foreground); }
.feebox .v { text-align: right; font-weight: 600; }
.feebox .tot { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 2px; }
.errbox { border: 1px solid color-mix(in srgb, var(--destructive) 35%, var(--border)); background: var(--destructive-soft); color: var(--destructive-soft-fg); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.errbox .txt { display: flex; flex-direction: column; gap: 3px; }
.enter-card { border: 1px dashed var(--primary); border-radius: 12px; background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.enter-card h4 { margin: 0; font-size: 14.5px; font-weight: 600; }
.enter-card .desc { font-size: 12.5px; color: var(--muted-foreground); margin-top: -8px; }
.carrow { display: flex; align-items: center; gap: 12px; }
.carrow img { width: 64px; aspect-ratio: 16 / 10; border-radius: 6px; object-fit: cover; flex: none; }
.carrow .t { font-size: 13.5px; font-weight: 500; }
.carrow .s { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.select { height: 34px; border: 1px solid var(--input); border-radius: 8px; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: var(--card); font-size: 13.5px; }
.select .i:last-child { margin-left: auto; color: var(--muted-foreground); }
.costs { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12.5px; padding-top: 10px; border-top: 1px solid var(--border); }
.costs span { color: var(--muted-foreground); }
.costs b { text-align: right; font-weight: 600; }
.ctabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.ctabs a { padding: 9px 10px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ctabs a.on { color: var(--foreground); border-bottom-color: var(--primary); }
.sum { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sum .stripe { height: 6px; border-radius: 99px; background: var(--d-sports-fg); opacity: .8; }
.sum h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 650; }
.fact { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; font-size: 13px; align-items: center; }
.fact > span:first-child { color: var(--muted-foreground); font-size: 12px; }
.kebab { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--muted-foreground); }
.kebab.on { background: var(--accent); color: var(--foreground); }

/* ---------- Contracts ---------- */
/* Proposed: anything a contract says or pays - a seat offer in the inbox, the
   contract card, its ledger lines - on violet 295, mod provenance's hue. No
   inbox, Finances, Home or championship sidebar shows a provenance chip; the
   nearest family that can share a screen with it is qualifying 310, which a
   seat offer deliberately leaves out (it shows no format strip). A fine is the
   destructive red: it is a penalty, not a term. Who offers a seat is the
   team's budget chip, which already exists. */
:root {
  --contract: oklch(0.93 0.05 295); --contract-fg: oklch(0.42 0.14 295); --contract-solid: oklch(0.55 0.17 295);
  --b-works: oklch(0.91 0.075 320); --b-works-fg: oklch(0.38 0.15 320);
  --b-indep: oklch(0.92 0.06 18); --b-indep-fg: oklch(0.42 0.13 22);
  --b-priv: oklch(0.93 0.055 132); --b-priv-fg: oklch(0.4 0.09 135);
  --l-fee: oklch(0.93 0.05 235); --l-fee-fg: oklch(0.38 0.12 250);
}
:root[data-theme="dark"] {
  --contract: oklch(0.33 0.07 295); --contract-fg: oklch(0.87 0.1 295); --contract-solid: oklch(0.62 0.16 295);
  --b-works: oklch(0.34 0.085 320); --b-works-fg: oklch(0.87 0.11 320);
  --b-indep: oklch(0.33 0.07 18); --b-indep-fg: oklch(0.86 0.09 22);
  --b-priv: oklch(0.32 0.06 132); --b-priv-fg: oklch(0.86 0.08 135);
  --l-fee: oklch(0.32 0.06 235); --l-fee-fg: oklch(0.86 0.08 245);
}
.c-contract { background: var(--contract); color: var(--contract-fg); }
.c-works { background: var(--b-works); color: var(--b-works-fg); }
.c-indep { background: var(--b-indep); color: var(--b-indep-fg); }
.c-priv { background: var(--b-priv); color: var(--b-priv-fg); }
.c-fee { background: var(--l-fee); color: var(--l-fee-fg); }
.c-fine { background: var(--destructive-soft); color: var(--destructive-soft-fg); }
.c-own { background: var(--k-named); color: var(--k-named-fg); }
.well.violet2 { background: var(--contract); color: var(--contract-fg); }
.btn.soft-red { background: var(--destructive-soft); color: var(--destructive-soft-fg); border-color: transparent; }
.btn.green { background: var(--success); color: white; border-color: transparent; }

/* The contract card: a seat row, then the terms. */
.kcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.kcard .khead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 45%, var(--card)); }
.kcard .khead img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; background: var(--muted); }
.kcard .khead b { display: block; font-size: 14px; }
.kcard .khead small { display: block; font-size: 12px; color: var(--muted-foreground); }
.terms { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 0; font-size: 13px; }
.terms > span { padding: 8px 14px; border-bottom: 1px solid var(--border); }
.terms > span:nth-last-child(-n+2) { border-bottom: 0; }
.terms > span.k { color: var(--muted-foreground); font-size: 12.5px; }
.terms > span.v b { font-weight: 600; }
.terms > span.v small { display: block; color: var(--muted-foreground); font-size: 12px; margin-top: 1px; }
.terms.narrow { grid-template-columns: 96px minmax(0, 1fr); }
.terms.narrow > span { padding: 7px 12px; }
.ktiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ktiles > div { padding: 11px 14px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ktiles > div:last-child { border-right: 0; }
.ktiles .k { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.ktiles b { font-size: 15px; font-weight: 650; }
.ktiles small { font-size: 12px; color: var(--muted-foreground); }
.kfoot { display: flex; gap: 16px; flex-wrap: wrap; padding: 9px 14px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted-foreground); }
.kfoot b { color: var(--foreground); font-weight: 600; }
.pos { color: var(--success); font-weight: 600; }
.neg { color: var(--destructive-soft-fg); font-weight: 600; }
.yourcard { border-top: 3px solid var(--contract-solid); }
.paid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12.5px; padding: 10px 12px; border-top: 1px solid var(--border); }
.paid span { color: var(--muted-foreground); }
.paid b { text-align: right; font-variant-numeric: tabular-nums; }
.meter.v i { background: var(--contract-fg); }

/* Concept page */
.dec { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--border); }
.dec:first-of-type { border-top: 0; }
.dec .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--contract); color: var(--contract-fg); }
.dec h4 { margin: 0; font-size: 14.5px; font-weight: 650; align-self: center; }
.dec .q { grid-column: 2; font-size: 13px; color: var(--muted-foreground); margin: 0; }
.opts { grid-column: 2; display: grid; gap: 8px; margin-top: 6px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.opt2 { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; background: var(--card); }
.opt2 b { font-size: 13px; display: flex; gap: 6px; align-items: center; }
.opt2 span { color: var(--muted-foreground); }
.opt2.rec { border-color: color-mix(in srgb, var(--success) 55%, var(--border)); background: color-mix(in srgb, var(--success-soft) 35%, var(--card)); }
.opt2.rec b::after { content: 'Recommended'; margin-left: auto; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 99px; background: var(--success-soft); color: var(--success-soft-fg); }
.slices { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
.slices .node ul { margin: 2px 0 0; padding-left: 18px; font-size: 12.5px; }
.slices .node.on { border-top: 3px solid var(--contract-solid); }
.yr { position: relative; height: 92px; margin-top: 8px; }
.yr .axis { position: absolute; left: 0; right: 0; top: 70px; display: grid; grid-template-columns: repeat(12, 1fr); font-size: 11px; color: var(--muted-foreground); border-top: 1px solid var(--border); }
.yr .axis span { padding-top: 4px; border-left: 1px solid var(--border); padding-left: 4px; }
.yr .lane { position: absolute; height: 18px; border-radius: 5px; font-size: 11px; display: flex; align-items: center; padding: 0 6px; white-space: nowrap; overflow: hidden; }
.yr .win { background: var(--contract); color: var(--contract-fg); }
.yr .ed { background: var(--d-sports); color: var(--d-sports-fg); }
.yr .ed1 { background: var(--d-single); color: var(--d-single-fg); }
.four { width: 100%; border-collapse: collapse; font-size: 13px; }
.four th, .four td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.four th { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.four td.r, .four th.r { text-align: right; font-variant-numeric: tabular-nums; }
.four tr.tot td { font-weight: 650; border-bottom: 0; }
.heat { display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 12.5px; }
.heat > div { padding: 8px 10px; border-radius: 8px; background: var(--muted); }
.heat > div.h { background: transparent; padding: 4px 2px; font-weight: 600; font-size: 12px; color: var(--muted-foreground); }
.heat > div.x { background: transparent; border: 1px dashed var(--border); color: var(--muted-foreground); }
.heat > div.y { background: color-mix(in srgb, var(--contract) 60%, var(--card)); }
.heat > div small { display: block; color: var(--muted-foreground); font-size: 11.5px; }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ocard { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.ocard img { width: 100%; height: 70px; object-fit: cover; border-radius: 6px; background: var(--muted); }
.ocard b { font-size: 13.5px; }
.banner.k { border-left-color: var(--contract-fg); }

/* The budget chip's tooltip - the vendored ui/tooltip as it draws: foreground
   fill, background text, text-xs, px-3 py-1.5, rounded-md, an arrow. Hover any
   budget chip; the works offer in the inbox shows one held open. */
.tipwrap { position: relative; display: inline-flex; }
.tipbox { display: none; position: absolute; z-index: 30; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: 260px; background: var(--foreground); color: var(--background); font-size: 12px; line-height: 1.4; font-weight: 400; padding: 6px 12px; border-radius: 6px; text-align: left; white-space: normal; text-transform: none; letter-spacing: 0; }
.tipbox::before { content: ''; position: absolute; bottom: -4px; left: 50%; width: 10px; height: 10px; background: var(--foreground); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.tipbox b { display: block; font-weight: 600; margin-bottom: 2px; font-size: 12px; color: inherit; }
.tipwrap:hover .tipbox, .tipwrap.open .tipbox { display: block; }
.kcard { overflow: visible; }
.kcard .khead { border-radius: 12px 12px 0 0; }
.opt2.rec b::after { content: 'Agreed'; }
.opt2.rec.pend b::after { content: 'Recommended'; }
.steps { margin: 0; padding-left: 20px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.feetab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.feetab td, .feetab th { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.feetab th { font-weight: 500; color: var(--muted-foreground); }
.feetab .r { text-align: right; font-variant-numeric: tabular-nums; }
.amend { margin-top: 2px; padding: 5px 8px; border-radius: 6px; background: var(--contract); color: var(--contract-fg); font-size: 12px; }
/* ---------- Grouped offers ---------- */
.stage { max-width: 1640px; }
.why { max-width: 1640px; }
.doc { max-width: 1200px; }
.win { height: 1240px; }
.inbox { grid-template-columns: 216px 400px minmax(0, 1fr); }
.mail.wide { max-width: 1080px; }
.mrow .bot .mini { display: inline-flex; gap: 3px; }
.mrow .bot .mini .chip { padding: 3px 5px; font-size: 10.5px; }
.lede { font-size: 14px; line-height: 1.6; margin: 0; max-width: 72ch; }
.termline { font-size: 12.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.termline b { color: var(--foreground); font-weight: 600; }
.clhead { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.clhead b { font-size: 14px; }

/* Layout A: a column per team, a row per term. */
.cmp { display: grid; border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; font-size: 13px; }
.cmp > div { padding: 8px 12px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); min-width: 0; }
.cmp > div.k { border-left: 0; color: var(--muted-foreground); font-size: 12.5px; background: color-mix(in srgb, var(--muted) 30%, var(--card)); }
.cmp > div.last { border-bottom: 0; }
.cmp > div b { font-weight: 600; }
.cmp > div small { display: block; color: var(--muted-foreground); font-size: 12px; margin-top: 1px; }
.cmp > div.head { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: color-mix(in srgb, var(--muted) 45%, var(--card)); }
.cmp > div.head > img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--muted); }
.cmp > div.head .tn { font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.cmp > div.head .cn { font-size: 12px; color: var(--muted-foreground); }
.cmp > div.best { background: color-mix(in srgb, var(--success-soft) 45%, var(--card)); }
.cmp > div.best b::after { content: 'Best'; margin-left: 6px; font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 99px; background: var(--success-soft); color: var(--success-soft-fg); vertical-align: 1px; }
.cmp > div.own { background: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--muted) 55%, transparent) 8px 9px); }
.cmp > div.own.head { background: color-mix(in srgb, var(--muted) 30%, var(--card)); }
.cmp > div.act { display: flex; align-items: center; }
.cmp > div.act .btn { width: 100%; }
.cmp > div.off { opacity: .55; }
.cmp > div.won { box-shadow: inset 0 3px 0 var(--success); }
.ownwell { width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; border: 1px dashed var(--border); display: grid; place-items: center; color: var(--muted-foreground); }
.ownwell .i { width: 22px; height: 22px; }

/* Layout B: pick a team, read its card. */
.picks { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; }
.pick { display: grid; grid-template-columns: 18px 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.pick:last-child { border-bottom: 0; }
.pick > img { width: 72px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 5px; background: var(--muted); }
.pick .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--input); }
.pick.on { background: color-mix(in srgb, var(--primary) 7%, var(--card)); box-shadow: inset 3px 0 0 var(--primary); }
.pick.on .radio { border: 5px solid var(--primary); }
.pick .tn { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.pick .sub { font-size: 12px; color: var(--muted-foreground); }
.pick .hl { text-align: right; }
.pick .hl b { display: block; font-weight: 600; }
.pick .hl small { color: var(--muted-foreground); font-size: 12px; }
.pickcap { padding: 8px 14px 6px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 35%, var(--card)); display: flex; gap: 6px; align-items: center; }

/* Accepted looks */
.cmp { position: relative; }
.cmp > div.frame { position: absolute; inset: 0; padding: 0; border: 2px solid var(--success); border-radius: 8px; pointer-events: none; background: transparent; }
.cmp > div.tint { background: color-mix(in srgb, var(--success-soft) 45%, var(--card)); }
.cmp > div.head.tint { background: color-mix(in srgb, var(--success-soft) 70%, var(--card)); }
.cmp > div.muted2 b { color: var(--muted-foreground); font-weight: 500; }
.cmp > div.muted2.head img { filter: grayscale(.8); opacity: .75; }
.signedtxt { display: inline-flex; align-items: center; gap: 6px; color: var(--success-soft-fg); font-weight: 600; font-size: 12.5px; }
.kcard.signed { border-color: color-mix(in srgb, var(--success) 55%, var(--border)); }
.sstrip { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--success-soft); color: var(--success-soft-fg); font-size: 13px; font-weight: 600; border-radius: 12px 12px 0 0; }
.sstrip small { margin-left: auto; font-weight: 400; }
.disclose { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 13px; font-weight: 500; }
.disclose .mini { display: inline-flex; gap: 3px; margin-left: 4px; }

/* The championship, as a link */
.ccard { display: block; border: 1px solid var(--border); border-radius: 10px; background: var(--card); overflow: hidden; }
.ccard:hover, .ccard.hov { outline: 2px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 1px; }
.cchead { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 40%, var(--card)); }
.cchead b { display: block; font-size: 15px; font-weight: 650; }
.cchead small { display: block; font-size: 12.5px; color: var(--muted-foreground); }
.cchead .open { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; }
.crounds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.crounds > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 12px; }
.crounds img { width: 100%; aspect-ratio: 16 / 10; object-fit: contain; border-radius: 6px; background: var(--muted); padding: 6px; margin-bottom: 4px; }
:root[data-theme="dark"] .crounds img { filter: invert(1) hue-rotate(180deg); background: oklch(0.8 0.01 260); }
.crounds b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crounds span { color: var(--muted-foreground); }
.crounds .more { display: grid; place-items: center; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted-foreground); font-size: 12.5px; aspect-ratio: 16 / 10; }
.cfacts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cfacts > div { padding: 10px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cfacts > div:last-child { border-right: 0; }
.cfacts .k { font-size: 10.5px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.cfacts b { font-size: 13.5px; font-weight: 600; }
.cfacts small { font-size: 12px; color: var(--muted-foreground); }
.cstrip { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 13px; }
.cstrip .well { width: 30px; height: 30px; }
.cstrip b { font-weight: 600; }
.cstrip small { display: block; font-size: 12px; color: var(--muted-foreground); }

/* Concept */
.odds { width: 100%; border-collapse: collapse; font-size: 13px; }
.odds th, .odds td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.odds th { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.odds td.r, .odds th.r { text-align: right; font-variant-numeric: tabular-nums; }
.odds tr.new td { background: color-mix(in srgb, var(--contract) 35%, var(--card)); }
.bars2 { display: flex; height: 26px; border-radius: 6px; overflow: hidden; font-size: 11.5px; font-weight: 600; }
.bars2 span { display: grid; place-items: center; }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.flow > div { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.flow > div .n { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 11.5px; background: var(--contract); color: var(--contract-fg); }
.flow > div b { font-size: 13px; }
.flow > div span { color: var(--muted-foreground); }
pre.store { margin: 0; font-size: 12px; background: var(--muted); border-radius: 8px; padding: 10px 12px; overflow: auto; }
pre.store i { color: var(--muted-foreground); font-style: normal; }
/* ---------- The market (slice 2) ---------- */
.stage { max-width: 1640px; }
.why { max-width: 1640px; }
.doc { max-width: 1240px; }
.win { height: auto; min-height: 860px; }
.inbox { grid-template-columns: 216px 380px minmax(0, 1fr); }
.mail.wide { max-width: 1120px; }
/* The renewing team's column: a wash of the contract violet, since it is the
   contract you hold asking to go on. */
.cmp > div.ren { background: color-mix(in srgb, var(--contract) 26%, var(--card)); }
.cmp > div.head.ren { background: color-mix(in srgb, var(--contract) 55%, var(--card)); }
.cmp > div.k.new-outline, .paid .new-outline { outline-offset: -3px; border-radius: 6px; }
.cmp .was { color: var(--muted-foreground); text-decoration: line-through; font-weight: 400; margin-left: 4px; font-size: 12px; }
.chip .i { width: 12px; height: 12px; }
.paid .full { grid-column: 1 / -1; }
.paid .full.fg { color: var(--foreground); font-weight: 600; }
.paid small { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted-foreground); margin-top: -2px; }
.keep { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); font-size: 12.5px; }
.keep .tgt { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.keep .tgt .i { color: var(--contract-fg); }
.keep .vs { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.keep .vs span { color: var(--muted-foreground); }
.keep .vs b { text-align: right; font-variant-numeric: tabular-nums; }
.c-onc { background: var(--success-soft); color: var(--success-soft-fg); }
.c-short { background: var(--warning-soft); color: var(--warning-soft-fg); }
/* A podium place, as PLACE_ACCENT draws it; fourth and below stay unfilled. */
.c-p1 { background: var(--gold); color: var(--gold-fg); }
.c-p2 { background: var(--silver); color: var(--silver-fg); }
.c-p3 { background: var(--bronze); color: var(--bronze-fg); }
.c-pn { background: transparent; box-shadow: inset 0 0 0 1px var(--border); color: var(--foreground); }

/* The Enter panel's two ways in. */
.enter-card .seg { align-self: stretch; }
.enter-card .seg span { flex: 1; justify-content: center; }
.sellers { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seller { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.seller:last-child { border-bottom: 0; }
.seller .thumb16 { width: 64px; }
.seller .tn { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.seller .sub { display: flex; gap: 6px; align-items: center; color: var(--muted-foreground); margin-top: 3px; font-size: 12px; min-width: 0; }
.seller .pr { text-align: right; }
.seller .pr b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
.seller .pr small { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.seller.no { opacity: .55; }
.seller.on { background: color-mix(in srgb, var(--primary) 7%, var(--card)); box-shadow: inset 3px 0 0 var(--primary); }
.seller.offered { background: color-mix(in srgb, var(--contract) 22%, var(--card)); }

/* The Contracts page */
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.kcard .khead .grow b { margin-top: 5px; }
.kfoot .tgt { display: inline-flex; gap: 6px; align-items: center; }
.kfoot .tgt .i { color: var(--contract-fg); }
.hist td { vertical-align: middle; }
.hist .w { font-weight: 600; }
.hist .s { font-size: 12px; color: var(--muted-foreground); }
.hist td.amt, .hist th.amt { text-align: right; white-space: nowrap; }
.hist tr.yrow td { background: color-mix(in srgb, var(--muted) 45%, var(--card)); font-size: 11.5px; font-weight: 650; letter-spacing: .05em; color: var(--muted-foreground); padding: 5px 8px; }
.kcard .khead img.flag { width: 18px; height: 12px; border-radius: 2px; }
.c-renewed { background: var(--contract); color: var(--contract-fg); }

/* Home's doors, as Door draws them. */
.doors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.door { background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 2px oklch(0 0 0 / .05); }
.door .dh { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
.door .dw { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.door .dw .i { width: 19px; height: 19px; }
.door .dh b { display: block; font-size: 14.5px; }
.door .dh small { display: block; font-size: 11.5px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.door .dh .op { margin-left: auto; color: var(--primary); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; }
.door .db { border-top: 1px solid var(--border); padding: 9px 14px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 112px; font-size: 13px; }
.door .ln { display: flex; justify-content: space-between; gap: 10px; min-width: 0; }
.door .ln b { white-space: nowrap; }
.door .ln span:first-child { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Concept */
.tline { position: relative; height: 128px; margin-top: 6px; }
.tline .axis { position: absolute; left: 0; right: 0; top: 104px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: 11.5px; color: var(--muted-foreground); border-top: 1px solid var(--border); }
.tline .axis span { padding: 4px 0 0 6px; border-left: 1px solid var(--border); }
.tline .lane { position: absolute; height: 22px; border-radius: 6px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.tline .ed { background: var(--d-sports); color: var(--d-sports-fg); }
.tline .k { background: var(--contract); color: var(--contract-fg); }
.tline .pin { position: absolute; top: 0; bottom: 24px; width: 0; border-left: 2px dashed var(--contract-fg); }
.tline .pin b { position: absolute; top: -2px; left: 6px; font-size: 11px; white-space: nowrap; color: var(--contract-fg); }
.tline .pin.amber { border-left-color: var(--warning-soft-fg); }
.tline .pin.amber b { color: var(--warning-soft-fg); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.three .node ul { margin: 2px 0 0; padding-left: 18px; font-size: 12.5px; }
.three .node.on { border-top: 3px solid var(--contract-solid); }
.dec .opts { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.toast.k { border-color: color-mix(in srgb, var(--contract-fg) 40%, var(--border)); }

/* ---------- Sponsors (new) ---------- */
/* Proposed: a sponsor's pink-magenta at 350. Every screen a sponsor shows on -
   the inbox, Home, Finances, a round's page and the Sponsors page - already
   carries the contract violet 295, the historic leather 40, the fee blue 235,
   the rent cyan 195 and the disciplines, so the free arc between custom origin
   340 and the destructive 27 is where it fits. Custom origin and the named save
   share 340 but show only on the Championships list and the saves list; the
   third class of a round (also 340) is the one place they could meet. */
:root {
  --sponsor: oklch(0.93 0.05 350); --sponsor-fg: oklch(0.43 0.15 352); --sponsor-solid: oklch(0.58 0.18 352);
}
:root[data-theme="dark"] {
  --sponsor: oklch(0.33 0.07 350); --sponsor-fg: oklch(0.87 0.09 352); --sponsor-solid: oklch(0.65 0.17 352);
}
.c-sponsor { background: var(--sponsor); color: var(--sponsor-fg); }
.c-dropped { background: var(--destructive-soft); color: var(--destructive-soft-fg); }
.well.pink { background: var(--sponsor); color: var(--sponsor-fg); }
.opt2.rec b::after { content: 'Recommended'; }
.dec .n { background: var(--sponsor); color: var(--sponsor-fg); }
.flow > div .n { background: var(--sponsor); color: var(--sponsor-fg); }
.three .node.on { border-top-color: var(--sponsor-solid); }
.slices .node.on { border-top-color: var(--sponsor-solid); }

/* A sponsor's mark: its initials on the sponsor pink, its trade as an icon -
   an icon rather than a chip, so the eight trades spend no hues. */
.mark { position: relative; width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--sponsor); color: var(--sponsor-fg); font-weight: 750; font-size: 14px; letter-spacing: .02em; }
.mark .tr { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: var(--card); color: var(--sponsor-fg); box-shadow: 0 0 0 1px var(--border); }
.mark .tr .i { width: 12px; height: 12px; }
.mark.sm { width: 32px; height: 32px; border-radius: 8px; font-size: 10.5px; letter-spacing: 0; }
.mark.sm .tr { width: 16px; height: 16px; right: -3px; bottom: -3px; border-radius: 5px; }
.mark.sm .tr .i { width: 10px; height: 10px; }

.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips i { width: 9px; height: 9px; border-radius: 99px; background: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
.pips i.on { background: var(--warning-soft-fg); box-shadow: none; }
.pips.red i.on { background: var(--destructive); }

/* The slots board. */
.slots { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 14px; align-items: stretch; }
.spcard { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border-top: 3px solid var(--sponsor-solid); }
.spcard .sh { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--sponsor) 25%, var(--card)); }
.spcard .sh b { display: flex; gap: 6px; align-items: center; font-size: 14.5px; }
.spcard .sh small { display: block; font-size: 12px; color: var(--muted-foreground); }
.spcard .slotname { font-size: 10.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--sponsor-fg); }
.spcard .terms { flex: none; }
.spcard .prog { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12.5px; padding: 10px 14px; border-top: 1px solid var(--border); }
.spcard .prog span { color: var(--muted-foreground); }
.spcard .prog b { text-align: right; font-variant-numeric: tabular-nums; }
.spcard .sf { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12.5px; }
.spcard.free { border-top: 1px dashed var(--border); border-style: dashed; background: transparent; align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 8px; color: var(--muted-foreground); }
.spcard.locked { border: 1px dashed var(--border); background: color-mix(in srgb, var(--muted) 45%, transparent); align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 8px; color: var(--muted-foreground); }
.spcard.locked b { color: var(--foreground); }
.spcard.warn { border-top-color: var(--warning-soft-fg); }
.lockrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* A round's sponsors, in the aside under the sessions. */
.rspon { display: flex; flex-direction: column; }
.rspon .ln { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--border); font-size: 12.5px; }
.rspon .ln b { font-size: 13px; }
.rspon .ln small { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.rspon .ln .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.aside { display: flex; flex-direction: column; gap: 14px; }
.cardh { display: flex; align-items: center; gap: 8px; padding: 11px 12px; font-size: 13.5px; font-weight: 600; }
.cardh .i { color: var(--sponsor-fg); }

/* The backing note on an Enter panel. */
.backing { display: flex; gap: 10px; padding: 10px; border-radius: 10px; background: color-mix(in srgb, var(--sponsor) 40%, var(--card)); border: 1px solid color-mix(in srgb, var(--sponsor-fg) 25%, var(--border)); font-size: 12.5px; }
.backing b { display: block; font-size: 13px; }
.backing small { display: block; color: var(--muted-foreground); margin-top: 2px; }

/* The ladder's rung card, as LadderCell draws it, for the backed case. */
.lad { display: grid; grid-template-columns: 120px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; font-size: 12.5px; }
.lad .rh { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.lad .th { text-align: center; }
.rungc { position: relative; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--d-sports-fg); border-radius: 9px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }
.rungc h5 { margin: 0; font-size: 13px; font-weight: 600; }
.rungc .ft { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted-foreground); }
.rungc.lock { opacity: .5; }
.rungc.lock h5::after { content: ' 🔒'; font-size: 11px; }

/* Ledger snippet. */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted-foreground); padding: 7px 10px; border-bottom: 1px solid var(--border); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t td.amt, table.t th.amt { text-align: right; font-variant-numeric: tabular-nums; }
table.t .s { font-size: 12px; color: var(--muted-foreground); }

/* The offers mail: a table per slot kind. */
.slotgrp { display: flex; flex-direction: column; gap: 8px; }
.slotgrp h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.slotgrp h3 small { font-weight: 400; color: var(--muted-foreground); font-size: 12.5px; }
.cmp > div.tint2 { background: color-mix(in srgb, var(--success-soft) 30%, var(--card)); }
.cmp > div.head.tint2 { background: color-mix(in srgb, var(--success-soft) 60%, var(--card)); }
.spname { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13.5px; }
.doors.six { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.doors.six .door .dh small { white-space: normal; }
.doors.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.slice2 { outline: 2px dashed color-mix(in oklch, var(--sponsor-fg) 50%, transparent); outline-offset: 2px; }

/* The pool: a trade's icon on its own, and a table's group rows. */
.ti { width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; background: var(--sponsor); color: var(--sponsor-fg); flex: none; }
.ti .i { width: 13px; height: 13px; }
.tis { display: inline-flex; gap: 4px; flex-wrap: wrap; }
table.t tr.gr td { background: color-mix(in srgb, var(--sponsor) 30%, var(--card)); font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--sponsor-fg); padding: 6px 10px; }
table.t tr.gr td small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted-foreground); margin-left: 6px; }
table.t td b { font-weight: 600; }
.s2t { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; font-size: 10.5px; font-weight: 600; border: 1px dashed color-mix(in oklch, var(--sponsor-fg) 60%, transparent); color: var(--sponsor-fg); vertical-align: 1px; }
.recipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }

:root { --partner: oklch(0.93 0.05 200); --partner-fg: oklch(0.38 0.09 205); --partner-solid: oklch(0.6 0.11 205);

.sp2.lockt { border: 2px dashed var(--border); background: transparent; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 18px; color: var(--muted-foreground); font-size: 12.5px; min-height: 190px; }

.sp2.lockt.lk-hatched b { color: var(--muted-foreground); }
/* Well: sunk into the page - a muted fill with an inner shadow and no border. */

/* Merged: one well for every slot still to open, a line each. */

/* The History tab's ways to a past offer. */

.prow { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--partner-solid); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }

.sigrow { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 440px); gap: 16px; align-items: start; }

const concept2 = () => `<div class="doc">

const WHY3 = {
  store: () => ({
    price: '<b>By the price (recommended)</b>: a small pink sparkle beside the figure it changes, and the sponsor and the amount in a tooltip. It also explains why a car over your balance reads Purchase. The picture stays clean.',

  seat: () => ({

];

  document.documentElement.dataset.theme = S.theme;

render();
