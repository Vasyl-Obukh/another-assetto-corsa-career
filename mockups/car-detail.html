<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car detail mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --secondary: oklch(0.935 0.012 252);
  --secondary-foreground: oklch(0.28 0.03 258);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75); --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295); --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);

  --d-single-seater: oklch(0.925 0.06 212); --d-single-seater-fg: oklch(0.36 0.11 215);
  --d-sportscar: oklch(0.925 0.06 112); --d-sportscar-fg: oklch(0.36 0.1 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --secondary: oklch(0.27 0.014 265);
  --secondary-foreground: oklch(0.94 0.005 260);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70); --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295); --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);

  --d-single-seater: oklch(0.32 0.07 212); --d-single-seater-fg: oklch(0.86 0.1 212);
  --d-sportscar: oklch(0.32 0.07 112); --d-sportscar-fg: oklch(0.86 0.1 112);
  --d-touring: oklch(0.32 0.065 175); --d-touring-fg: oklch(0.86 0.09 175);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }



/* Extra tokens this page would add or reuse from globals.css. */
:root {
  --tier-platinum: oklch(0.945 0.022 210); --tier-platinum-fg: oklch(0.4 0.05 215);
  --tier-gold: oklch(0.9 0.085 88); --tier-gold-fg: oklch(0.42 0.1 75);
  --tier-silver: oklch(0.91 0.008 255); --tier-silver-fg: oklch(0.42 0.015 260);
  --tier-bronze: oklch(0.89 0.07 52); --tier-bronze-fg: oklch(0.41 0.09 48);
  --tier-steel: oklch(0.875 0.022 250); --tier-steel-fg: oklch(0.36 0.035 255);
  --origin-modified: oklch(0.93 0.05 195); --origin-modified-fg: oklch(0.36 0.09 200);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
  /* New: the two curves. Power on the primary hue, torque on a warm one clear of it. */
  --curve-power: oklch(0.52 0.19 262); --curve-torque: oklch(0.6 0.15 45);
}
:root[data-theme="dark"] {
  --tier-platinum: oklch(0.34 0.025 210); --tier-platinum-fg: oklch(0.9 0.03 210);
  --tier-gold: oklch(0.36 0.07 88); --tier-gold-fg: oklch(0.89 0.12 92);
  --tier-silver: oklch(0.33 0.006 260); --tier-silver-fg: oklch(0.86 0.008 260);
  --tier-bronze: oklch(0.33 0.06 50); --tier-bronze-fg: oklch(0.85 0.09 55);
  --tier-steel: oklch(0.315 0.028 250); --tier-steel-fg: oklch(0.82 0.035 255);
  --origin-modified: oklch(0.32 0.06 195); --origin-modified-fg: oklch(0.86 0.09 200);
  --curve-power: oklch(0.7 0.16 262); --curve-torque: oklch(0.76 0.13 50);
}

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .spacer { flex: 1; }
.why { max-width: 1240px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.new { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; border: 1px dashed var(--muted-foreground); color: var(--muted-foreground); margin-left: 6px; vertical-align: 2px; }

/* ---------- App frame ---------- */
.frame { max-width: 1240px; margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); margin-bottom: 0; }
.app-nav b { color: var(--foreground); }
.app-nav .on { color: var(--primary); font-weight: 600; }
.hdr { position: sticky; top: 49px; z-index: 20; background: var(--background); padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }

/* ---------- Shared ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip.neutral { background: var(--secondary); color: var(--secondary-foreground); }
.chip.outline { box-shadow: inset 0 0 0 1px var(--border); }
.p-base { background: var(--provenance-base); color: var(--provenance-base-fg); }
.p-dlc { background: var(--provenance-dlc); color: var(--provenance-dlc-fg); }
.p-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.d-single-seater { background: var(--d-single-seater); color: var(--d-single-seater-fg); }
.d-sportscar { background: var(--d-sportscar); color: var(--d-sportscar-fg); }
.d-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.d-road { background: var(--d-road); color: var(--d-road-fg); }
.t-1 { background: var(--tier-platinum); color: var(--tier-platinum-fg); }
.t-2 { background: var(--tier-gold); color: var(--tier-gold-fg); }
.t-3 { background: var(--tier-silver); color: var(--tier-silver-fg); }
.t-4 { background: var(--tier-bronze); color: var(--tier-bronze-fg); }
.t-5 { background: var(--tier-steel); color: var(--tier-steel-fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.d-single-seater { background: var(--d-single-seater-fg); } .dot.d-sportscar { background: var(--d-sportscar-fg); }
.dot.d-touring { background: var(--d-touring-fg); } .dot.d-road { background: var(--d-road-fg); }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--border); }
.muted { color: var(--muted-foreground); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel > h3 { margin: 0; padding: 12px 14px 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel > h3 .act { margin-left: auto; }
.panel .pb { padding: 10px 14px 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--card); white-space: nowrap; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.search { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted-foreground); font-size: 13px; width: 260px; box-shadow: 0 1px 2px oklch(0 0 0 / .04); }
.badge-w { width: 22px; height: 22px; border-radius: 5px; background: color-mix(in oklch, var(--on-scrim) 90%, transparent); padding: 1px; object-fit: contain; flex: none; }
.badge-p { width: 40px; height: 40px; object-fit: contain; flex: none; }

/* Figures */
.figs { display: grid; grid-template-columns: repeat(3, 1fr); }
.figs > div { padding: 10px 14px; display: flex; flex-direction: column; gap: 1px; }
.figs > div:nth-child(n+4) { border-top: 1px solid var(--border); }
.figs > div:not(:nth-child(3n+1)) { border-left: 1px solid var(--border); }
.figs b { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.figs b small { font-size: 12px; font-weight: 500; color: var(--muted-foreground); letter-spacing: 0; margin-left: 3px; }
.figs span { font-size: 11.5px; color: var(--muted-foreground); }
.figs .none b { color: var(--muted-foreground); font-weight: 500; }
.figs.six { grid-template-columns: repeat(6, 1fr); }
.figs.six > div:nth-child(n+4) { border-top: 0; }
.figs.six > div:not(:first-child) { border-left: 1px solid var(--border); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin: 0; }
.dl dt { color: var(--muted-foreground); }
.dl dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Classification */
.cls { display: flex; flex-direction: column; gap: 8px; }
.cls .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cls .row .lbl { color: var(--muted-foreground); min-width: 54px; font-size: 12px; }

/* Championships */
.champs { display: flex; flex-direction: column; }
.champ { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); }
.champ:first-child { border-top: 0; padding-top: 2px; }
.champ .edge { align-self: stretch; border-radius: 2px; }
.champ .edge.d-single-seater { background: var(--d-single-seater-fg); } .champ .edge.d-sportscar { background: var(--d-sportscar-fg); }
.champ .edge.d-touring { background: var(--d-touring-fg); } .champ .edge.d-road { background: var(--d-road-fg); }
.champ b { font-weight: 600; font-size: 13.5px; display: block; }
.champ .meta { display: flex; gap: 5px; margin-top: 3px; flex-wrap: wrap; }
.champ .go { color: var(--muted-foreground); }
.champ-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.champ-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--edge); }

/* Source */
.src { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.src a { color: var(--primary); text-decoration: none; font-weight: 500; margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.desc { font-size: 13.5px; line-height: 1.55; white-space: pre-line; margin: 0; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 6px; }
.chart .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.chart .grid line { stroke: var(--border); }
.chart text { fill: var(--muted-foreground); font-size: 10px; }

/* Liveries */
.liv-head { display: flex; align-items: center; gap: 12px; margin: 26px 0 12px; flex-wrap: wrap; }
.liv-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.liv-head .count { color: var(--muted-foreground); font-size: 13px; }
.liv-head .search { margin-left: auto; }
.liv-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.liv { overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.liv:hover { border-color: var(--primary); }
.liv.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.liv .ph { aspect-ratio: 16/9; position: relative; background: var(--muted); overflow: hidden; }
.liv .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.liv .bd { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.liv .bd b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.liv .bd span { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 5px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate { position: absolute; left: 8px; top: 8px; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 5px; background: var(--on-scrim); color: var(--scrim); font-weight: 750; font-size: 13px; display: grid; place-items: center; font-variant-numeric: tabular-nums; box-shadow: 0 1px 3px oklch(0 0 0 / .35); letter-spacing: -0.02em; }
.plate.inline { position: static; display: inline-grid; height: 20px; font-size: 12px; box-shadow: inset 0 0 0 1px var(--border); }

/* ---------- A: hero ---------- */
.a-hero { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 21/8; background: var(--muted); }
.a-hero img.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
.a-hero::after { content: ""; position: absolute; inset: 35% 0 0; background: linear-gradient(to top, color-mix(in oklch, var(--scrim) 92%, transparent), color-mix(in oklch, var(--scrim) 50%, transparent) 55%, transparent); }
.a-hero .cap { position: absolute; z-index: 1; left: 22px; right: 22px; bottom: 18px; color: var(--on-scrim); display: flex; align-items: flex-end; gap: 16px; }
.a-hero .cap .t { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.a-hero .over { display: flex; gap: 8px; align-items: center; font-size: 13.5px; opacity: .9; }
.a-hero h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 650; letter-spacing: -0.015em; text-shadow: 0 1px 3px var(--scrim); }
.a-hero .chips { display: flex; gap: 5px; flex-wrap: wrap; }
.a-hero .tl { position: absolute; z-index: 1; top: 14px; right: 14px; display: flex; gap: 6px; }
.a-hero .livname { position: absolute; z-index: 1; top: 14px; left: 14px; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; background: color-mix(in oklch, var(--scrim) 60%, transparent); color: var(--on-scrim); padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(6px); }
.a-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; margin-top: 16px; align-items: start; }
.a-main, .a-side { display: flex; flex-direction: column; gap: 16px; }

/* ---------- B: showroom ---------- */
.b-top { display: flex; align-items: center; gap: 14px; }
.b-top h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
.b-top .sub { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted-foreground); margin-top: 3px; flex-wrap: wrap; }
.b-top .act { margin-left: auto; display: flex; gap: 8px; }
.b-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.viewer { overflow: hidden; }
.viewer .stage { position: relative; aspect-ratio: 16/9; background: var(--muted); }
.viewer .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.viewer .stage::after { content: ""; position: absolute; inset: 60% 0 0; background: linear-gradient(to top, color-mix(in oklch, var(--scrim) 85%, transparent), transparent); }
.viewer .stage .cap { position: absolute; z-index: 1; left: 14px; right: 14px; bottom: 12px; color: var(--on-scrim); display: flex; align-items: center; gap: 10px; }
.viewer .stage .cap b { font-size: 16px; }
.viewer .stage .cap span { font-size: 12.5px; opacity: .85; display: flex; gap: 6px; align-items: center; }
.viewer .stage .cap .n { margin-left: auto; font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
.viewer .nav { position: absolute; z-index: 2; top: 50%; translate: 0 -50%; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklch, var(--scrim) 55%, transparent); color: var(--on-scrim); border: 0; backdrop-filter: blur(6px); }
.viewer .nav.l { left: 10px; } .viewer .nav.r { right: 10px; }
.strip-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; }
.strip-bar .search { height: 30px; width: 220px; margin-left: auto; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 8px; overflow-x: auto; padding: 10px 12px 12px; scrollbar-width: thin; }
.strip button { padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--muted); aspect-ratio: 16/9; position: relative; }
.strip button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.strip button.sel { border-color: var(--primary); }
.strip button .plate { left: 4px; top: 4px; height: 17px; min-width: 20px; font-size: 10.5px; padding: 0 4px; border-radius: 4px; }
.b-side { display: flex; flex-direction: column; gap: 16px; }
.b-below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }

/* ---------- C: tabs ---------- */
.c-head { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: stretch; }
.c-shot { position: relative; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; background: var(--muted); }
.c-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c-id { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 4px 0; }
.c-id .over { display: flex; gap: 8px; align-items: center; color: var(--muted-foreground); font-size: 13.5px; }
.c-id h1 { margin: 0; font-size: 28px; line-height: 1.12; font-weight: 650; letter-spacing: -0.015em; }
.c-id .chips { display: flex; gap: 5px; flex-wrap: wrap; }
.c-id .figs { margin-top: auto; }
.c-id .act { display: flex; gap: 8px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 20px 0 16px; }
.tabs button { background: none; border: 0; padding: 9px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button.on { color: var(--foreground); border-bottom-color: var(--primary); }
.tabs .cnt { font-size: 11.5px; background: var(--secondary); color: var(--secondary-foreground); border-radius: 999px; padding: 1px 7px; }
.c-over { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.c-col { display: flex; flex-direction: column; gap: 16px; }

/* ---------- Carousel hero ---------- */
.car-stage { overflow: hidden; }
.car-stage .stage { position: relative; aspect-ratio: 21/8; background: var(--muted); }
.car-stage .stage img.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
.car-stage .stage::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(to top, color-mix(in oklch, var(--scrim) 92%, transparent), color-mix(in oklch, var(--scrim) 45%, transparent) 55%, transparent); pointer-events: none; }
.car-stage .id { position: absolute; z-index: 1; left: 22px; bottom: 18px; right: 40%; color: var(--on-scrim); display: flex; flex-direction: column; gap: 6px; }
.car-stage .id .over { display: flex; gap: 8px; align-items: center; font-size: 13.5px; opacity: .9; }
.car-stage .id h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 650; letter-spacing: -0.015em; text-shadow: 0 1px 3px var(--scrim); }
.car-stage .id .chips { display: flex; gap: 5px; flex-wrap: wrap; }

const championships = (c) => `<div class="panel"><h3>${ic('trophy', 14)}Raced in<span class="muted" style="font-weight:400">${c.series.length}</span></h3>
  <div class="pb champs">${champRows(c)}</div></div>`;

const source = (c) => `<div class="panel"><h3>Where it comes from</h3><div class="pb" style="display:flex;flex-direction:column;gap:10px">
  <div class="src">${provChips(c)}<span>${c.prov.source === 'dlc' ? 'Official DLC' : c.prov.source === 'mod' ? 'Mod' : 'Ships with the game'}</span>
  ${c.source ? `<a href="#">${c.source[1].split('/')[0]} ${ic('ext', 13)}</a>` : ''}</div>
  <div class="src muted" style="font-size:12px">Folder <code style="margin-left:auto">${c.id}</code></div>
  ${c.tags.length ? `<div class="tags">${c.tags.slice(0, 10).map((t) => `<span class="chip outline muted">${esc(t)}</span>`).join('')}</div>` : ''}
</div></div>`;

const about = (c) => c.description ? `<div class="panel"><h3>About<span class="new">new scan field</span></h3><div class="pb"><p class="desc">${esc(c.description)}</p></div></div>` : '';

const chart = (c) => {
  if (!c.power.length) return '';
  const W = 560, H = 190, L = 34, R = 34, T = 10, B = 22;
  const xs = c.power.map((p) => p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const pMax = Math.max(...c.power.map((p) => p[1])) * 1.1, tMax = Math.max(...c.torqueCurve.map((p) => p[1])) * 1.1;
  const X = (v) => L + (v - x0) / (x1 - x0) * (W - L - R);
  const Y = (v, m) => T + (1 - v / m) * (H - T - B);
  const path = (pts, m) => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1], m).toFixed(1)}`).join('');
  const ticks = [0, .25, .5, .75, 1];
  const rpm = []; for (let r = Math.ceil(x0 / 1000) * 1000; r <= x1; r += 1000) rpm.push(r);
  return `<div class="panel chart"><h3>Power and torque<span class="new">new scan field</span></h3><div class="pb">
    <div class="legend"><span><i style="background:var(--curve-power)"></i>Power, bhp - peak ${fmt(Math.max(...c.power.map((p) => p[1])))}</span>
    <span><i style="background:var(--curve-torque)"></i>Torque, Nm - peak ${fmt(Math.max(...c.torqueCurve.map((p) => p[1])))}</span></div>
    <svg viewBox="0 0 ${W} ${H}"><g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t * pMax, pMax)}" y2="${Y(t * pMax, pMax)}"/>`).join('')}</g>
    ${ticks.map((t) => `<text x="${L - 6}" y="${Y(t * pMax, pMax) + 3}" text-anchor="end">${Math.round(t * pMax)}</text><text x="${W - R + 6}" y="${Y(t * tMax, tMax) + 3}">${Math.round(t * tMax)}</text>`).join('')}
    ${rpm.map((r) => `<text x="${X(r)}" y="${H - 6}" text-anchor="middle">${r / 1000}k</text>`).join('')}
    <path d="${path(c.torqueCurve, tMax)}" fill="none" stroke="var(--curve-torque)" stroke-width="2.2"/>
    <path d="${path(c.power, pMax)}" fill="none" stroke="var(--curve-power)" stroke-width="2.2"/>
    </svg></div></div>`;
};

const livMeta = (s) => {
  const bits = [];
  if (s.driver) bits.push(`${ic('user', 12)}${esc(s.driver)}`);
  if (s.team) bits.push(esc(s.team));
  return bits.length ? `<span>${bits.join(' <span class="muted">·</span> ')}</span>` : '';
};
const livGrid = (c) => `<div class="liv-grid">${c.skins.map((s, i) => `<div class="panel liv ${i === state.liv ? 'sel' : ''}" data-liv="${i}">
  <div class="ph">${s.img ? `<img src="${s.img}" alt="" loading="lazy">` : ''}${s.number && s.number !== '0' ? `<span class="plate">${esc(s.number)}</span>` : ''}</div>
  <div class="bd"><b title="${esc(s.name)}">${esc(s.name)}</b>${livMeta(s)}</div></div>`).join('')}</div>`;
const livHead = (c, title = 'Liveries') => `<div class="liv-head"><h2>${title}</h2><span class="count">${c.skins.length}</span>
  <div class="search">${ic('search', 14)}Search liveries, drivers, teams</div></div>`;

const header = (inner = '') => `<div class="hdr"><span class="back">${ic('back', 14)}Cars</span>${inner}</div>`;

const classificationRO = (c) => `<div class="panel"><h3>Classification</h3>
  <div class="pb cls">${c.classes.map((k, i) => `<div class="row"><span class="lbl">Class</span><b>${esc(k)}</b>
    <span class="muted">${ic('chev', 13)}</span><span class="chip neutral">${esc(c.specs[i] || '')}</span></div>`).join('')}
    <div class="ro-note">Changed in Settings - Car classes.</div></div></div>`;

const livCard = (s, i, sel) => `<div class="panel liv ${sel ? 'sel' : ''}" data-liv="${i}">
  <div class="ph">${s.img ? `<img src="${s.img}" alt="" loading="lazy">` : ''}${s.number && s.number !== '0' ? `<span class="plate">${esc(s.number)}</span>` : ''}</div>
  <div class="bd"><b title="${esc(s.name)}">${esc(s.name)}</b>${livMeta(s)}</div></div>`;

const viewA2 = (c) => {
  const s = livery();
  const n = s.number && s.number !== '0' ? `<span class="plate inline">${esc(s.number)}</span>` : '';
  return `${header()}
  <div class="panel car-stage">
    <div class="stage">${s.img ? `<img class="ph" src="${s.img}" alt="">` : ''}
      <button class="nav l" data-step="-1">${ic('left', 18)}</button><button class="nav r" data-step="1">${ic('chev', 18)}</button>
      <span class="count">${ic('palette', 12)}${state.liv + 1} / ${c.skins.length}</span>
      <div class="id">
        <div class="over">${c.badge ? `<img class="badge-w" src="${c.badge}" alt="">` : ''}<span>${esc(c.brand)}</span>${flag(c)}<span>${c.year ?? ''}</span></div>
        <h1>${esc(c.name)}</h1>
        <div class="chips">${provChips(c)}${specChips(c)}</div>
      </div>
      <div class="liv-cap"><div><b>${esc(s.name)}</b>${s.driver || s.team ? `<span>${[s.driver, s.team].filter(Boolean).map(esc).join(' · ')}</span>` : ''}</div>${n}</div>
    </div>
    <div class="strip">${c.skins.map((k, i) => `<button class="${i === state.liv ? 'sel' : ''}" data-liv="${i}" title="${esc(k.name)}">
      ${k.img ? `<img src="${k.img}" alt="" loading="lazy">` : ''}${k.number && k.number !== '0' ? `<span class="plate">${esc(k.number)}</span>` : ''}</button>`).join('')}</div>
  </div>
  <div class="a-body">
    <div class="a-main"><div class="panel">${figures(c, 'six')}</div>${about(c)}${chart(c)}</div>
    <div class="a-side">${championships(c)}${classificationRO(c)}${source(c)}</div>
  </div>`;
};

const viewP = (c) => {
  const first = c.skins[0];
  return `<div class="scrim-page"><div class="dialog">
    <button class="iconbtn close">${ic('x', 16)}</button>
    <div class="dh"><h2>Pick a livery</h2><p>The livery you race in. Every other car on the grid is given one of the rest.</p></div>
    <div class="bar"><button class="btn sm ghost">${ic('left', 14)}All cars</button>
      <div class="search" style="margin-left:auto;width:340px">${ic('search', 14)}Search liveries, drivers, teams, numbers</div></div>
    <div class="panel carline">${first && first.img ? `<img class="t" src="${first.img}" alt="">` : ''}
      <div style="min-width:0"><b>${esc(c.name)}</b><div class="sub">${c.badge ? `<img style="width:16px;height:16px;object-fit:contain" src="${c.badge}" alt="">` : ''}${esc(c.brand)} ${flag(c)} ${provChips(c)}${specChips(c)}</div></div>
      <span class="muted" style="margin-left:auto;font-size:13px">${c.skins.length} liveries</span></div>
    <div class="scroll"><div class="liv-grid">${c.skins.map((k, i) => livCard(k, i, i === 2)).join('')}</div></div>
  </div></div>`;
};

const viewS = () => {
  const cls = [['GT3', 4, true], ['GT2', 1], ['GTE', 2], ['GT4', 3], ['Formula 4', 2], ['Touring Car', 5]];
  const specs = [['GT3 (2010s)', SPEC.length, true], ['GT3 (2020s)', 11], ['GT3 (2000s)', 3], ['GT3 (yours)', 2, false, true]];
  const kind = state.sheet;
  const list = kind === 'new' ? [] : kind === 'mine' ? SPEC.filter((c) => c.user || c.id === 'ks_ferrari_488_gt3') : SPEC;
  const specName = kind === 'new' ? '' : kind === 'mine' ? 'GT3 (yours)' : 'GT3 (2010s)';
  const rowsOf = (cars) => cars.map((c) => `<div class="panel carrow">${c.img ? `<img class="t" src="${c.img}" alt="">` : '<span></span>'}
    <div style="min-width:0"><b>${esc(c.name)}</b><div class="sub">${esc(c.brand)}<span class="chip p-${c.prov.source}">${PROV[c.prov.source]}</span>
    ${c.user && kind === 'shipped' ? '<span class="chip o-custom">Added by you</span>' : ''}${c.specs.filter((x) => x !== 'GT3 (2010s)').map((x) => `<span class="chip neutral">${esc(x)}</span>`).join('')}</div></div>
    <div class="acts"><button class="iconbtn" title="Open the car">${ic('ext', 14)}</button><button class="iconbtn" title="Take it off this spec">${ic('x', 15)}</button></div></div>`).join('');
  const nameField = `<label class="fld"><span>Name</span>
    <div class="input ${kind === 'shipped' ? 'locked' : ''} ${kind === 'new' ? 'focus' : ''}">${specName ? esc(specName) : '<span class="ph-text">e.g. GT3 (club spec)</span>'}${kind === 'shipped' ? '<span class="lockn">Ships with the app</span>' : ''}</div>
    ${kind === 'shipped' ? '<small>A spec the app ships keeps its name, since its championships refer to it. Its cars are still yours to change.</small>' : ''}</label>`;
  const empty = `<div class="empty-cars"><b>No cars yet</b><span>Add the cars that race on this grid. A car can be in more than one spec.</span>
    <button class="btn">${ic('plus', 14)}Add cars</button></div>`;
  return `<div class="set-tabs"><span>General</span><span>Diagnostics</span><span>Your content</span><span class="on">Car classes</span><span>Content sources</span><span>Championships</span></div>
  <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:14px"><p class="muted" style="margin:0;max-width:640px;font-size:13.5px">A spec is a grid of cars that can race each other, and a class is the family it belongs to. Open a spec to see its cars and add any installed car to it.</p><button class="btn">${ic('plus', 14)}Add class</button></div>
  <div class="panel acc">${cls.map(([n, k, open]) => `<div class="cl">${ic(open ? 'down' : 'chev', 14)}<b>${n}</b><span class="muted" style="font-size:12.5px">${k} specs</span></div>
    ${open ? `<div class="specs">${specs.map(([sn, cnt, sel, mine]) => `<div class="spec ${sn === specName ? 'sel' : ''}"><span style="font-weight:500">${sn}</span>
      <div class="foot">${mine ? '<span class="chip o-custom">Yours</span>' : ''}<span class="chip outline">${cnt} cars</span><span class="go">Open ${ic('chev', 12)}</span></div></div>`).join('')}
      <div class="spec ${kind === 'new' ? 'sel' : ''}" style="background:transparent;border-style:dashed;align-items:center;justify-content:center;color:var(--muted-foreground)">${ic('plus', 14)} Add spec</div></div>` : ''}`).join('')}</div>
  <div class="sheet-veil"></div>
  <div class="sheet"><div class="sh"><div style="display:flex;align-items:center;gap:8px"><span class="muted" style="font-size:12.5px">GT3</span><span class="muted">${ic('chev', 12)}</span>
      ${kind === 'mine' ? '<span class="chip o-custom">Yours</span>' : ''}<button class="iconbtn" style="margin-left:auto">${ic('x', 16)}</button></div>
    <h2>${kind === 'new' ? 'New spec in GT3' : esc(specName)}</h2></div>
    <div class="sb">${nameField}
      <div class="cars-head"><b>Cars</b><span class="muted">${list.length}</span>${list.length ? `<button class="btn sm" style="margin-left:auto">${ic('plus', 14)}Add cars</button>` : ''}</div>
      ${list.length ? rowsOf(list) : empty}</div>
    <div class="sf">${kind === 'new' ? '<button class="btn primary" disabled style="opacity:.5">Create spec</button><span class="muted" style="font-size:12.5px">Needs a name.</span>'
      : '<button class="btn primary">Save</button>'}<button class="btn ghost" style="margin-left:auto">Cancel</button></div>
  </div>`;
};

const viewA = (c) => {
  const s = livery();
  return `${header()}
  <div class="a-hero">${s.img ? `<img class="ph" src="${s.img}" alt="">` : ''}
    <span class="livname">${ic('palette', 12)}${esc(s.name)}</span>
    <div class="cap"><div class="t">
      <div class="over">${c.badge ? `<img class="badge-w" src="${c.badge}" alt="">` : ''}<span>${esc(c.brand)}</span>${flag(c)}<span>${c.year ?? ''}</span></div>
      <h1>${esc(c.name)}</h1>
      <div class="chips">${provChips(c)}${specChips(c)}</div>
    </div></div>
  </div>
  <div class="a-body">
    <div class="a-main"><div class="panel">${figures(c, 'six')}</div>${about(c)}${chart(c)}</div>
    <div class="a-side">${championships(c)}${classification(c)}${source(c)}</div>
  </div>
  ${livHead(c)}${livGrid(c)}`;
};

const viewB = (c) => {
  const s = livery();
  return `${header(`<div class="b-top">${c.badge ? `<img class="badge-p" src="${c.badge}" alt="">` : ''}
    <div style="min-width:0"><h1>${esc(c.name)}</h1>
    <div class="sub">${esc(c.brand)} ${flag(c)} <span>${c.year ?? ''}</span>${provChips(c)}${specChips(c)}</div></div>
    <div class="act"><button class="btn">${ic('tags', 14)}Classify</button></div></div>`)}
  <div class="b-body">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="panel viewer">
        <div class="stage">${s.img ? `<img src="${s.img}" alt="">` : ''}
          <button class="nav l" data-step="-1">${ic('left', 16)}</button><button class="nav r" data-step="1">${ic('chev', 16)}</button>
          <div class="cap">${s.number && s.number !== '0' ? `<span class="plate inline">${esc(s.number)}</span>` : ''}
            <div><b>${esc(s.name)}</b>${s.driver || s.team ? `<span>${[s.driver, s.team].filter(Boolean).map(esc).join(' · ')}</span>` : ''}</div>
            <span class="n">${state.liv + 1} / ${c.skins.length}</span></div>
        </div>
        <div class="strip-bar"><b style="font-size:13px">Liveries</b><span class="muted" style="font-size:13px">${c.skins.length}</span>
          <div class="search">${ic('search', 13)}Search liveries</div></div>
        <div class="strip">${c.skins.map((k, i) => `<button class="${i === state.liv ? 'sel' : ''}" data-liv="${i}" title="${esc(k.name)}">
          ${k.img ? `<img src="${k.img}" alt="" loading="lazy">` : ''}${k.number && k.number !== '0' ? `<span class="plate">${esc(k.number)}</span>` : ''}</button>`).join('')}</div>
      </div>
      ${chart(c)}${about(c)}
    </div>
    <div class="b-side"><div class="panel"><h3>Figures</h3><div class="pb">${figures(c)}</div></div>${championships(c)}${classification(c)}${source(c)}</div>
  </div>`;
};

const viewC = (c) => {
  const s = c.skins[0];
  const tabs = [['overview', 'Overview', null], ['liveries', 'Liveries', c.skins.length], ['championships', 'Championships', c.series.length]];
  let body = '';
  if (state.tab === 'overview') {
    body = `<div class="c-over"><div class="c-col">${about(c)}${chart(c)}</div><div class="c-col">${classification(c)}${source(c)}</div></div>`;
  } else if (state.tab === 'liveries') {
    body = `<div class="liv-head" style="margin-top:0"><span class="count">${c.skins.length} liveries</span><div class="search">${ic('search', 14)}Search liveries, drivers, teams</div></div>${livGrid(c)}`;
  } else {
    body = c.series.length ? `<div class="champ-cards">${c.series.map((x) => `<div class="panel champ-card" style="--edge:var(--d-${x.discipline}-fg)">
      <b>${esc(x.name)}</b><div class="champ meta" style="display:flex;gap:5px;padding:0;border:0"><span class="chip d-${x.discipline}">${DISC[x.discipline]}</span><span class="chip t-${x.tier}">${x.tierName}</span></div>
      <span class="muted" style="font-size:12px">Races it in ${esc(c.classes[0])}</span></div>`).join('')}</div>` : '<p class="muted">No championship races it yet.</p>';
  }
  return `${header()}
  <div class="c-head">
    <div class="c-shot">${s && s.img ? `<img src="${s.img}" alt="">` : ''}</div>
    <div class="c-id">
      <div class="over">${c.badge ? `<img class="badge-w" style="background:none" src="${c.badge}" alt="">` : ''}<span>${esc(c.brand)}</span>${flag(c)}<span>${c.year ?? ''}</span></div>
      <h1>${esc(c.name)}</h1>
      <div class="chips">${provChips(c)}${specChips(c)}</div>
      <div class="panel">${figures(c, 'six')}</div>
    </div>
  </div>
  <div class="tabs">${tabs.map(([k, l, n]) => `<button class="${state.tab === k ? 'on' : ''}" data-tab="${k}">${l}${n != null ? `<span class="cnt">${n}</span>` : ''}</button>`).join('')}</div>
  ${body}`;
};

const WHY = {
  a: '<b>Car page.</b> The hero is now a carousel: arrows and the filmstrip under it step through every livery, the car stays named over the photo and the livery is named in the opposite corner. No livery grid and no search here - that is the picker&#39;s job. Classification is read-only, with no Classify button.',
  p: '<b>Picker - livery step.</b> What clicking a car opens inside a championship, the race screen or Enter round: the existing second step, restyled with the same livery cards, the car summarised at the top, and search across name, driver, team and number. It stays laid over the car browser so Back keeps the filters.',
  s: '<b>Settings - spec cars.</b> Closes the gap: a spec card in Car classes opens a side sheet with its name and its cars - and Add spec opens the same sheet empty, so a new spec gets its cars straight away. Name and cars save together. Add cars opens the car library (every installed car, shipped ones included) and the cross takes one off. A shipped car changed this way reads Modified and can be reverted. The car-centric Classify dialog stays as an action on Your content cards, for an unknown mod that needs a first class.',
  old: '<b>Previous A.</b> For comparison.',
  oldA: '<b>A - Hero.</b> The car arrives as a wide photograph in the livery you pick below, with its name, maker and chips laid over it like the poster cards. Under it, figures and the curves on the left, championships, classification and source in a side column. Liveries stay a full grid at the bottom; picking one repaints the hero.',
  b: '<b>B - Showroom.</b> One large stage cycles through the liveries with arrows and a filmstrip under it, which replaces the livery grid entirely. Everything about the car sits in the right column; the curves and description follow under the stage.',
  c: '<b>C - Tabs.</b> A compact identity block - photo, name, chips, the six figures - over three tabs: Overview, Liveries and Championships. Shortest page; a car with 200 liveries never pushes its figures off screen.',
};

const render = () => {
  document.querySelectorAll('.picker .opt[data-k]').forEach((b) => b.setAttribute('aria-pressed', String(String(state[b.dataset.k]) === b.dataset.v)));
  document.getElementById('why').innerHTML = (state.v === 'old' ? WHY.oldA : WHY[state.v]) + ' <span class="new">new scan field</span> marks data the scan does not read yet (description, curves) - optional.';
  const c = car();
  const html = { a: viewA2, p: viewP, s: viewS, old: viewA, b: viewB, c: viewC }[state.v](c);
  document.getElementById('root').innerHTML = `<div class="frame" style="${state.w === 'min' ? 'max-width:940px' : ''}">
    <div class="app-nav"><b>Career</b><span>Championships</span><span>Calendar</span><span class="on">Cars</span><span>Tracks</span><span>Results</span><span>Settings</span></div>${html}</div>`;
};
document.querySelector('.picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt[data-k]');
  if (!b) return;
  state[b.dataset.k] = b.dataset.k === 'car' ? Number(b.dataset.v) : b.dataset.v;
  if (b.dataset.k === 'car') state.liv = 0;
  render();
});
document.getElementById('root').addEventListener('click', (e) => {
  const l = e.target.closest('[data-liv]'); const st = e.target.closest('[data-step]'); const t = e.target.closest('[data-tab]');
  if (l) state.liv = Number(l.dataset.liv);
  else if (st) state.liv = (state.liv + Number(st.dataset.step) + car().skins.length) % car().skins.length;
  else if (t) state.tab = t.dataset.tab;
  else return;
  render();
});
document.getElementById('theme').addEventListener('click', (e) => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  e.target.textContent = dark ? 'Light' : 'Dark';
});
render();
</script>
</body>
</html>
