/* A round's sponsors, in the aside under the sessions. */
.rspon { display: flex; flex-direction: column; }
.rspon .ln { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--border); font-size: 12.5px; }
.rspon .ln b { font-size: 13px; }
.rspon .ln small { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.rspon .ln .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.aside { display: flex; flex-direction: column; gap: 14px; }
.cardh { display: flex; align-items: center; gap: 8px; padding: 11px 12px; font-size: 13.5px; font-weight: 600; }
.cardh .i { color: var(--sponsor-fg); }

/* The backing note on an Enter panel. */
.backing { display: flex; gap: 10px; padding: 10px; border-radius: 10px; background: color-mix(in srgb, var(--sponsor) 40%, var(--card)); border: 1px solid color-mix(in srgb, var(--sponsor-fg) 25%, var(--border)); font-size: 12.5px; }
.backing b { display: block; font-size: 13px; }
.backing small { display: block; color: var(--muted-foreground); margin-top: 2px; }

/* The ladder's rung card, as LadderCell draws it, for the backed case. */
.lad { display: grid; grid-template-columns: 120px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; font-size: 12.5px; }
.lad .rh { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.lad .th { text-align: center; }
.rungc { position: relative; background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--d-sports-fg); border-radius: 9px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }
.rungc h5 { margin: 0; font-size: 13px; font-weight: 600; }
.rungc .ft { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted-foreground); }
.rungc.lock { opacity: .5; }
.rungc.lock h5::after { content: ' 🔒'; font-size: 11px; }

/* Ledger snippet. */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted-foreground); padding: 7px 10px; border-bottom: 1px solid var(--border); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t td.amt, table.t th.amt { text-align: right; font-variant-numeric: tabular-nums; }
table.t .s { font-size: 12px; color: var(--muted-foreground); }

/* The offers mail: a table per slot kind. */
.slotgrp { display: flex; flex-direction: column; gap: 8px; }
.slotgrp h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.slotgrp h3 small { font-weight: 400; color: var(--muted-foreground); font-size: 12.5px; }
.cmp > div.tint2 { background: color-mix(in srgb, var(--success-soft) 30%, var(--card)); }
.cmp > div.head.tint2 { background: color-mix(in srgb, var(--success-soft) 60%, var(--card)); }
.spname { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13.5px; }
.doors.six { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.doors.six .door .dh small { white-space: normal; }
.doors.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.slice2 { outline: 2px dashed color-mix(in oklch, var(--sponsor-fg) 50%, transparent); outline-offset: 2px; }

/* The pool: a trade's icon on its own, and a table's group rows. */
.ti { width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; background: var(--sponsor); color: var(--sponsor-fg); flex: none; }
.ti .i { width: 13px; height: 13px; }
.tis { display: inline-flex; gap: 4px; flex-wrap: wrap; }
table.t tr.gr td { background: color-mix(in srgb, var(--sponsor) 30%, var(--card)); font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--sponsor-fg); padding: 6px 10px; }
table.t tr.gr td small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted-foreground); margin-left: 6px; }
table.t td b { font-weight: 600; }
.s2t { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; font-size: 10.5px; font-weight: 600; border: 1px dashed color-mix(in oklch, var(--sponsor-fg) 60%, transparent); color: var(--sponsor-fg); vertical-align: 1px; }
.recipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.recipe > div { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.recipe > div .n { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 11.5px; background: var(--sponsor); color: var(--sponsor-fg); }
.recipe > div b { font-size: 13px; }
.recipe > div span { color: var(--muted-foreground); }
.agreed { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--success-soft) 55%, var(--card)); font-size: 13px; }
.agreed .i { color: var(--success-soft-fg); flex: none; margin-top: 2px; }
.cmp .none { color: var(--muted-foreground); font-weight: 400; }
/* Proposed: a partner's cyan at 200, on the rent and modified-origin hue - rent
   shows on Finances, the Garage and an Enter panel, modified origin on the
   Championships list, and none of them shows a sponsor's slot. A renewal's
   periwinkle at 250 sits on practice's hue, which only a round's sessions wear. */
:root { --partner: oklch(0.93 0.05 200); --partner-fg: oklch(0.38 0.09 205); --partner-solid: oklch(0.6 0.11 205);
  --renewal: oklch(0.93 0.045 250); --renewal-fg: oklch(0.4 0.13 258); }
:root[data-theme="dark"] { --partner: oklch(0.33 0.06 200); --partner-fg: oklch(0.86 0.08 200); --partner-solid: oklch(0.66 0.11 200);
  --renewal: oklch(0.33 0.06 255); --renewal-fg: oklch(0.86 0.08 255); }
.c-partner { background: var(--partner); color: var(--partner-fg); }
.c-renewal { background: var(--renewal); color: var(--renewal-fg); }
.c-renewal .i { width: 11px; height: 11px; }
.mark.partner { background: var(--partner); color: var(--partner-fg); }
.mark.partner .tr { color: var(--partner-fg); }
.well.cyan { background: var(--partner); color: var(--partner-fg); }

/* A sponsor's terms, a price and its condition to a line. */
.pairs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 10px; font-size: 12.5px; align-items: baseline; }
.pairs b { font-variant-numeric: tabular-nums; font-weight: 650; }
.pairs span { color: var(--muted-foreground); }
.pairs .sig { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; color: var(--foreground); font-weight: 600; }
.pairs .sig .i { width: 13px; height: 13px; color: var(--sponsor-fg); }
.goalln { display: flex; gap: 8px; align-items: center; font-size: 12.5px; flex-wrap: wrap; }
.goalln .gk { font-size: 10.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.goalln small { flex-basis: 100%; color: var(--muted-foreground); font-size: 12px; }

/* Variant A: compact cards. */
.sp2grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.sp2 { background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; border-top: 3px solid var(--sponsor-solid); overflow: hidden; }
.sp2.partner { border-top-color: var(--partner-solid); }
.sp2 .h { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }
.sp2 .h b { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.sp2 .h small { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.sp2 .bd { padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.sp2 .f { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
.sp2 .f b { color: var(--foreground); }
.sp2.free { border: 2px dashed var(--border); border-top: 4px dashed var(--partner-solid); background: transparent; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 18px; color: var(--muted-foreground); font-size: 12.5px; }
.locks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sp2.lockt { border: 2px dashed var(--border); background: transparent; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 18px; color: var(--muted-foreground); font-size: 12.5px; min-height: 190px; }
.sp2.lockt b { color: var(--foreground); }
.sp2.lockt .i { width: 18px; height: 18px; }
/* Locked slot options. Faded: the whole tile at half strength on a solid hairline. */
.sp2.lockt.lk-faded { border: 1px solid var(--border); opacity: .5; }
/* Hatched: diagonal stripes, the usual "not available" texture, on a solid hairline. */
.sp2.lockt.lk-hatched { border: 1px solid var(--border); background: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in oklch, var(--muted-foreground) 13%, transparent) 7px 8.5px); }
.sp2.lockt.lk-hatched b { color: var(--muted-foreground); }
/* Well: sunk into the page - a muted fill with an inner shadow and no border. */
.sp2.lockt.lk-well { border: 0; background: var(--muted); box-shadow: inset 0 1px 4px rgb(0 0 0 / .08); }
.sp2.lockt.lk-well b { color: var(--muted-foreground); }
/* Merged: one well for every slot still to open, a line each. */
.sp2.lockt.lk-merged { border: 0; background: var(--muted); box-shadow: inset 0 1px 4px rgb(0 0 0 / .08); align-items: stretch; justify-content: flex-start; text-align: left; gap: 8px; }
.lk-merged .lh { display: flex; gap: 8px; align-items: center; color: var(--muted-foreground); font-weight: 600; }
.lk-merged .lr { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
.lk-merged .lr .end { margin-left: auto; font-variant-numeric: tabular-nums; }
/* The History tab's ways to a past offer. */
table.t tr.hov td { background: color-mix(in srgb, var(--accent) 70%, transparent); }
table.t td .olink { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-weight: 550; font-size: 12.5px; white-space: nowrap; }
table.t td .olink .i { width: 14px; height: 14px; }
.hmenu { position: relative; }
.hmenu .menu { right: 0; top: 34px; min-width: 190px; }
.lock1 { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border: 1px dashed var(--border); border-radius: 10px; font-size: 12.5px; color: var(--muted-foreground); background: color-mix(in srgb, var(--muted) 40%, transparent); }
.lock1 .i { width: 14px; height: 14px; }
.lock1 b { color: var(--foreground); font-weight: 600; }

/* Variant B: one row a sponsor. */
table.sprows td { vertical-align: top; padding: 11px 10px; }
table.sprows tr.lockr td { color: var(--muted-foreground); background: color-mix(in srgb, var(--muted) 30%, transparent); padding: 8px 10px; }
.slotbar { width: 3px; border-radius: 3px; align-self: stretch; background: var(--sponsor-solid); }
.slotbar.partner { background: var(--partner-solid); }

/* Variant C: the main sponsor large, partners beside it. */
.board { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.hero2 { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.hero2 .top { padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: color-mix(in srgb, var(--sponsor) 45%, var(--card)); }
.hero2 .top b { font-size: 17px; display: flex; gap: 6px; align-items: center; }
.hero2 .top small { display: block; color: var(--muted-foreground); font-size: 12px; }
.hero2 .sigband { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.hero2 .sigband .i { color: var(--sponsor-fg); }
.hero2 .bd { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--partner-solid); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
.prow .who { display: flex; gap: 10px; align-items: center; }
.prow .who b { font-size: 13.5px; display: flex; gap: 6px; align-items: center; }
.prow .who small { display: block; font-size: 11.5px; color: var(--muted-foreground); }

/* A round's sponsors, redrawn. */
.rsp { display: flex; flex-direction: column; }
.rsp .blk { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
.rsp .blk.main { box-shadow: inset 3px 0 0 var(--sponsor-solid); }
.rsp .blk.partner { box-shadow: inset 3px 0 0 var(--partner-solid); }
.rsp .who { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.rsp .who b { font-weight: 650; }
.rsp .ln2 { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.rsp .ln2 .c { color: var(--muted-foreground); }
.rsp .ln2 .a { font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; }
.rsp .ln2.pre { grid-template-columns: max-content minmax(0, 1fr); }

/* The sponsor an offer would replace, washed in its pink as a renewal is in the contract violet. */
.cmp > div.cur { background: color-mix(in srgb, var(--sponsor) 28%, var(--card)); }
.work { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* ---------- Slice 2 ---------- */
/* Every signature side by side, the one shown lit. */
.sigstrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.sigt { background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--sponsor-solid); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted-foreground); }
.sigt b { color: var(--foreground); font-size: 13.5px; }
.sigt .i { color: var(--sponsor-fg); }
.sigt.on { box-shadow: 0 0 0 2px var(--sponsor-solid); }
.sigrow { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 440px); gap: 16px; align-items: start; }
/* A perk that helps rather than pays: one line, in its slot's colour. */
.help { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; }
.help .i { width: 14px; height: 14px; color: var(--sponsor-fg); flex: none; }
.help.partner .i { color: var(--partner-fg); }
.climbed { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted-foreground); border-radius: 6px; }
/* The Store's cards, as the car browser draws them, priced. */
.stgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stc { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.stc.on { box-shadow: 0 0 0 2px var(--primary); }
.sti { aspect-ratio: 16 / 9; background: var(--scrim); }
.sti img { width: 100%; height: 100%; object-fit: cover; }
.stb { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.stf { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); font-size: 13px; }
.lnote { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted-foreground); border-radius: 6px; }
.lnote .i { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.lnote.new-outline .i { color: var(--sponsor-fg); }
.reward { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--border); border-left: 4px solid var(--sponsor-solid); border-radius: 12px; background: var(--card); }
.reward .grow { display: flex; flex-direction: column; gap: 3px; }
.reward b { font-size: 14.5px; }
.reward small { font-size: 12.5px; color: var(--muted-foreground); }
.invn { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.cbar { height: 6px; border-radius: 99px; background: var(--historic); overflow: hidden; display: block; }
.cbar i { display: block; height: 100%; border-radius: 99px; background: var(--historic-fg); }
.seller .pr { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.ccgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.cc { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.cc .pic { position: relative; flex: none; aspect-ratio: 4 / 3; background: var(--scrim); overflow: hidden; }
.cc .pic img.p { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cc .pic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, oklch(0.14 0.012 265 / .85)); }
.cc .tl { position: absolute; top: 8px; left: 8px; right: 54px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 1; }
.cc .tl { flex-direction: row; align-items: flex-start; }
.cc .tr { position: absolute; top: 8px; right: 8px; z-index: 1; }
.cc .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 2px 8px; font-size: 11.5px; font-weight: 500; background: oklch(0.14 0.012 265 / .6); color: var(--on-scrim); }
.cc .pill .i { width: 12px; height: 12px; }
.cc .cap { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 1; color: var(--on-scrim); }
.cc .cap .ov { display: flex; align-items: center; gap: 6px; font-size: 11.5px; opacity: .9; }
.cc .cap .nm { font-size: 15px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
.cc .bd { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.fig { display: flex; gap: 10px; font-size: 12px; color: var(--muted-foreground); }
.fig b { color: var(--foreground); font-weight: 600; }
.raced { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 5px; align-items: center; margin-top: auto; }
.raced .i { width: 13px; height: 13px; }
.pf { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--muted); }
.pf b { font-size: 17px; font-weight: 650; line-height: 1.15; }
.pf b.dim { color: var(--muted-foreground); }
.pf small { font-size: 12px; color: var(--muted-foreground); }
.pf.own { background: var(--k-named); color: var(--k-named-fg); }
.pf.own small { color: inherit; opacity: .75; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.pf.own b { font-size: 15px; }
.btn.go { background: var(--success); color: oklch(0.985 0.005 260); border-color: transparent; }
.btn.cant { background: var(--destructive-soft); color: var(--destructive-soft-fg); border-color: transparent; }
.sp2.free.mainfree { border-top-color: var(--sponsor-solid); }
.cmp > div.curp { background: color-mix(in srgb, var(--partner) 28%, var(--card)); }
.rcar { display: flex; flex-direction: column; gap: 8px; border-radius: 6px; }
.rcar .ph { aspect-ratio: 16 / 9; border-radius: 6px; }
.swt { display: flex; align-items: center; gap: 14px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.swt .grow { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.swt b { font-size: 13.5px; font-weight: 500; }
.swt small { font-size: 12px; color: var(--muted-foreground); }

.olink { display: inline-flex; gap: 5px; align-items: center; color: var(--primary); font-size: 12.5px; font-weight: 500; }
.olink .i { width: 14px; height: 14px; }

/* ---------- Phase 11 - the paddock talks ---------- */
.stage { max-width: 1640px; }
.why { max-width: 1640px; }
.doc { max-width: 1240px; }
.win { height: 1180px; }
.mfrom b.row { display: flex; }
.ppl b.row { display: flex; }
.inbox { grid-template-columns: 216px 380px minmax(0, 1fr); }
.dec .n { background: var(--debrief); color: var(--debrief-fg); }
.opt2.rec b::after { content: 'Recommended'; }
.opt2.rec.agreed b::after { content: 'Agreed'; }
.dec.done .opt2:not(.rec) { opacity: .45; }
/* Proposed: a debrief on teal 175, touring's hue, and a championship's result
   on a laurel 110, sportscar's hue. The inbox shows no discipline chip - its
   rows carry budgets (18, 132, 320), slots (350, 200), the contract violet 295,
   the historic leather 40, the reply states (80, 155, 232, 8) and the renewal
   periwinkle 250 - so the two arcs left clear of all of them are 100-120 and
   165-185. Team news and market news stay on the contract violet, being what a
   team's contract says or puts on offer; a rung's mail wears its tier's metal. */
:root {
  --debrief: oklch(0.925 0.055 175); --debrief-fg: oklch(0.36 0.09 178);
  --results: oklch(0.925 0.065 110); --results-fg: oklch(0.38 0.1 115);
}
:root[data-theme="dark"] {
  --debrief: oklch(0.32 0.065 175); --debrief-fg: oklch(0.86 0.09 175);
  --results: oklch(0.33 0.07 110); --results-fg: oklch(0.87 0.1 112);
}
.c-debrief { background: var(--debrief); color: var(--debrief-fg); }
.c-results { background: var(--results); color: var(--results-fg); }
.well.debrief { background: var(--debrief); color: var(--debrief-fg); }
.well.results { background: var(--results); color: var(--results-fg); }
.well.t3 { background: var(--t3); color: var(--t3-fg); } .well.t4 { background: var(--t4); color: var(--t4-fg); }
.c-new { background: var(--primary); color: var(--primary-foreground); font-size: 10px; padding: 3px 6px; }
.medal { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; }
.m3 { background: var(--t3); color: var(--t3-fg); } .m4 { background: var(--t4); color: var(--t4-fg); }
.c-tier3 { background: var(--t3); color: var(--t3-fg); } .c-tier4 { background: var(--t4); color: var(--t4-fg); }
.c-qualify .i, .c-race .i { width: 12px; height: 12px; }
/* A person writing: initials in a round well of their kind's colour. */
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.av.sm { width: 34px; height: 34px; font-size: 12.5px; }
.av.debrief { background: var(--debrief); color: var(--debrief-fg); }
.av.contract { background: var(--contract); color: var(--contract-fg); }
.av.results { background: var(--results); color: var(--results-fg); }
.mrow .av.sm { width: 34px; height: 34px; }
/* ResultCell, as components/results draws it. */
.rc { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; position: relative; }
.rc.p1 { background: var(--gold); color: var(--gold-fg); } .rc.p2 { background: var(--silver); color: var(--silver-fg); }
.rc.p3 { background: var(--bronze); color: var(--bronze-fg); }
.rc.pts { background: var(--success-soft); color: var(--success-soft-fg); }
.rc.np { font-weight: 500; color: var(--foreground); }
.rc.lg { min-width: 40px; height: 30px; font-size: 15px; }
.rc .fl { position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.rc .pl { position: absolute; top: 2px; left: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--s-qualify-fg); }
.mv { display: inline-flex; align-items: center; gap: 1px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mv.up { color: var(--success); } .mv.dn { color: var(--destructive); } .mv.eq { color: var(--muted-foreground); font-weight: 400; }
.mv .i { width: 12px; height: 12px; }
/* The debrief's table: a row a session. */
.dtab { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtab th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted-foreground); padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: color-mix(in srgb, var(--muted) 40%, var(--card)); }
.dtab td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
.dtab tr:last-child td { border-bottom: 0; }
.dtab .r { text-align: right; font-variant-numeric: tabular-nums; }
.dtab td small { display: block; font-size: 11.5px; color: var(--muted-foreground); }
.dtab tr.me td { background: color-mix(in srgb, var(--primary) 7%, var(--card)); }
.dtab tr.champ td { font-weight: 600; }
.dtab .dim { color: var(--muted-foreground); }
.tbox { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.tbox > .th { padding: 9px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.tbox > .th .end { font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
.sumtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.sumtiles > div { padding: 10px 14px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sumtiles > div:last-child { border-right: 0; }
.sumtiles .k { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.sumtiles b { font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.sumtiles small { font-size: 12px; color: var(--muted-foreground); }
.strip2 { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.strip2 b { display: block; font-size: 13.5px; }
.strip2 small { display: block; font-size: 12px; color: var(--muted-foreground); }
.strip2 .op { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted-foreground); }
.sig2 { font-size: 13px; color: var(--muted-foreground); }
.sig2 b { color: var(--foreground); display: block; }
.champbar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; border: 1px solid color-mix(in oklch, var(--gold-fg) 25%, transparent); background: color-mix(in oklch, var(--gold) 60%, transparent); }
.champbar .i { width: 22px; height: 22px; color: var(--gold-fg); }
.champbar b { font-size: 15px; }
.champbar small { display: block; font-size: 12.5px; color: var(--muted-foreground); }
.rungbar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; background: var(--d-sports); color: var(--d-sports-fg); }
.rungbar .medal { width: 34px; height: 34px; font-size: 15px; box-shadow: 0 0 0 3px var(--card); }
.rungbar b { font-size: 15px; display: block; }
.rungbar.down { background: var(--warning-soft); color: var(--warning-soft-fg); }
.carrow { display: flex; gap: 12px; align-items: center; }
.carrow img { width: 128px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--muted); flex: none; }
.ppl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ppl > div { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: var(--card); }
.ppl b { display: block; font-size: 13.5px; }
.ppl small { display: block; font-size: 12px; color: var(--muted-foreground); }
.month { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 0; font-size: 12.5px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.month > div { padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.month > div.d { color: var(--muted-foreground); font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--muted) 40%, var(--card)); }
.month > div:nth-last-child(-n+2) { border-bottom: 0; }
.kinds td .chip { margin-right: 4px; }
.toast .av { width: 34px; height: 34px; font-size: 12.5px; }
.chip.dl .i { width: 11px; height: 11px; }
</style>

<body>

<div class="why" id="why"></div>
<div class="stage" id="stage"></div>
<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const P = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const I = {
  chev: P('<path d="m9 18 6-6-6-6"/>'),

  store: P('<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/>'),
  garage: P('<path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/>'),
  gear: P('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'),
  wallet: P('<path d="M4 7h15a1 1 0 0 1 1 1v11H5a1 1 0 0 1-1-1z"/><path d="M4 7V6a2 2 0 0 1 2-2h11v3"/><circle cx="16" cy="13" r="1.2"/>'),

  brief: P('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>'),
  inbox: P('<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>'),
  unread: P('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/><circle cx="19" cy="6" r="3" fill="currentColor"/>'),
  reply: P('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v5"/>'),
  search: P('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),
  dots: P('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'),
  check: P('<path d="m5 12 5 5 9-10"/>'),
  checks: P('<path d="m2 12 5 5L18 6M13 16l1 1 8-9"/>'),
  news: P('<path d="M4 4h13v16H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v10a2 2 0 0 1-2 2"/><path d="M8 8h5M8 12h5M8 16h3"/>'),
  spark: P('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/>'),
  headset: P('<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20a3 3 0 0 1-3 2h-3"/>'),
  flag2: P('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'),
  medal: P('<circle cx="12" cy="15" r="6"/><path d="M8 3h8l-2 6h-4z"/>'),
  tag: P('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/>'),
  eye: P('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  target: P('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
  x: P('<path d="M18 6 6 18M6 6l12 12"/>'),
  clock: P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  ext: P('<path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>'),
  sparkles: P('<path d="M12 3 13.8 9 20 11l-6.2 2L12 19l-1.8-6L4 11l6.2-2z"/>'),
};
const img = (src, cls = '') => `<img class="${cls}" src="${src}" alt="" onerror="this.style.visibility='hidden'">`;
const flag = (c) => `<img class="flag" src="${AC}gui/NationFlags/${c}.png" alt="" onerror="this.remove()">`;
const chip = (cls, t) => `<span class="chip ${cls}">${t}</span>`;
const money = (n) => `$${Math.abs(n).toLocaleString('en-US')}`;
const PREV = (car, skin) => `${AC}cars/${car}/skins/${skin}/preview.jpg`;
const BUDGET = { works: ['c-works', 'Works team'], indep: ['c-indep', 'Independent'], priv: ['c-priv', 'Privateer'] };
const budget = (b) => chip(BUDGET[b][0], BUDGET[b][1]);
const medal = (t, sz) => `<span class="medal m${t}"${sz ? ` style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz * 0.5)}px"` : ''}>${t}</span>`;
const TIER = { 3: 'Silver', 4: 'Bronze', 5: 'Rookie' };
const tierChip = (t) => `<span class="chip c-tier${t}">${medal(t, 14)}Tier ${t} · ${TIER[t]}</span>`;
const nb = (html) => `<span class="new-outline" style="border-radius:6px;display:inline-flex">${html}</span>`;
// ResultCell: a podium in its metals, a points finish green, the rest plain.
const rc = (p, { pts = true, fl = false, pl = false, lg = false } = {}) => {
  const cls = p === 1 ? 'p1' : p === 2 ? 'p2' : p === 3 ? 'p3' : pts ? 'pts' : 'np';
  return `<span class="rc ${cls}${lg ? ' lg' : ''}">${pl ? '<i class="pl"></i>' : ''}P${p}${fl ? '<i class="fl"></i>' : ''}</span>`;
};
// Movement, as components/results draws it.
const mv = (n) => (n > 0 ? `<span class="mv up">${I.up}${n}</span>` : n < 0 ? `<span class="mv dn">${I.down}${-n}</span>` : '<span class="mv eq">-</span>');
const sess = (t, name) => chip(t === 'q' ? 'c-qualify' : 'c-race', name);

// ---------- The career: Sam Whitaker, Bronze in Sportscar ----------
const RATING = '3,512';
const BAL = 48250;
const titlebar = () => '<div class="titlebar"><span>Assetto Corsa Career</span><span>-</span><span>☐</span><span>✕</span></div>';
const win = (inner) => `<div class="win">${titlebar()}${inner}</div>`;
const NAV = [['home', 'Home', I.home], ['inbox', 'Inbox', I.mail], ['calendar', 'Calendar', I.cal], ['champs', 'Championships', I.trophy], ['store', 'Store', I.store], ['garage', 'Garage', I.garage], ['settings', 'Settings', I.gear]];
const hdr = (on, { badge = 3, date = 'Sun 8 Jul' } = {}) => `<header class="hd">
  <button class="slotbtn">${flag('GBR')}<span><b>Sam Whitaker</b><small>Career · 2029 · ${date}</small></span>${I.down}</button>
  <nav class="nav">${NAV.map(([id, l, ic]) => `<a class="${id === on ? 'on' : ''}">${ic}${l}${id === 'inbox' && badge ? `<span class="badge">${badge}</span>` : ''}</a>`).join('')}</nav>
  <span class="end row" style="gap:10px"><a class="bal rat">${I.gauge}<span class="num">${RATING}</span></a><a class="bal">${I.wallet}<span class="num">${money(BAL)}</span></a></span></header>`;

// The people. Each is drawn once off the shared name books - a team's engineer
// and boss seeded on the career and the team, so they stay the same season
// after season - and copied into every mail they write.
const WHO = {
  tom: { ini: 'TH', name: 'Tom Hadley', nation: 'GBR', role: 'Race engineer', team: 'Chiltern Sportscars', av: 'debrief' },
  lukas: { ini: 'LB', name: 'Lukas Brenner', nation: 'DEU', role: 'Race engineer', team: 'Lechner Racing', av: 'debrief' },
  rachel: { ini: 'RO', name: 'Rachel Okafor', nation: 'GBR', role: 'Team manager', team: 'Chiltern Sportscars', av: 'contract' },
  cup: { name: 'Carrera Cup 991', role: 'The organisers', well: 'results', icon: I.trophy },
  cat: { name: 'Driver categorisation', role: 'Sportscar', well: 't3', icon: I.medal },
  paddock: { name: 'Paddock news', role: 'The market', well: 'violet2', icon: I.news },
};
const avatar = (w, sm) => (w.ini
  ? `<span class="av ${w.av}${sm ? ' sm' : ''}">${w.ini}</span>`
  : `<span class="well ${w.well}"${sm ? '' : ' style="width:40px;height:40px;border-radius:10px"'}>${w.icon}</span>`);
const from = (w) => `<div class="mfrom">${avatar(w)}<span><b class="row" style="gap:6px">${w.name}${w.nation ? flag(w.nation) : ''}</b><small>${[w.role, w.team].filter(Boolean).join(' · ')} · to Sam Whitaker</small></span></div>`;
const KIND = {
  debrief: ['c-debrief', 'Debrief'],
  notice: ['c-contract', 'Team news'],
  results: ['c-results', 'Championship result'],
  rung: null,
  market: ['c-contract', 'Market'],
  sponsor: ['c-partner', 'Partner'],
};

// ---------- The inbox list ----------
// The month of mail a busy career gets: two championships, one under contract.
const LIST = [
  { m: 'July 2029' },
  { id: 'debrief', w: WHO.tom, subj: 'Spa-Francorchamps: P3 and P7', when: 'Sun 8 Jul', unread: true, chips: () => [chip('c-debrief', 'Debrief')], s: 'GT4 European Series · Round 3' },
  { id: 'team', w: WHO.rachel, subj: 'Halfway in GT4 European Series 2029', when: 'Sun 8 Jul', unread: true, chips: () => [chip('c-contract', 'Team news'), chip('c-onc', 'On course')] },
  { id: 'rung', w: WHO.cat, subj: 'Promoted to Tier 3 in Sportscar', when: 'Sun 8 Jul', unread: true, chips: () => [tierChip(3)] },
  { id: 'debrief2', w: WHO.lukas, subj: 'Brands Hatch: P14', when: 'Sun 1 Jul', chips: () => [chip('c-debrief', 'Debrief')], s: 'Carrera Cup 991 · Round 2' },
  { m: 'June 2029' },
  { id: 'sponsor', w: { name: 'Castrol', well: 'pink', icon: I.sparkles }, subj: 'Partner offer', when: 'Sun 24 Jun', chips: () => [chip('c-await', `Awaiting${S.cl === 'chip' ? ' · 9 days left' : ''}`), chip('c-partner', 'Partner')] },
  { id: 'results', w: WHO.cup, subj: 'Carrera Cup 991 H1 2029: 5th', when: 'Sun 17 Jun', chips: () => [chip('c-results', 'Championship result')] },
  { id: 'debrief3', w: WHO.lukas, subj: 'Silverstone: P4', when: 'Sun 17 Jun', chips: () => [chip('c-debrief', 'Debrief')], s: 'Carrera Cup 991 · Round 6' },
  { id: 'missed', w: WHO.rachel, subj: 'Nürburgring missed', when: 'Sun 10 Jun', chips: () => [chip('c-contract', 'Team news'), chip('c-fine', 'Fine')] },
  { id: 'debrief4', w: WHO.tom, subj: 'Silverstone: P5 and P2', when: 'Sun 20 May', chips: () => [chip('c-debrief', 'Debrief')], s: 'GT4 European Series · Round 1' },
  { m: 'January 2029' },
  { id: 'market', w: WHO.paddock, subj: 'Seats for sale in 2029', when: 'Mon 1 Jan', chips: () => [chip('c-contract', 'Market')] },
  { m: 'December 2028' },
  { id: 'welcome', w: WHO.rachel, subj: 'Welcome to Chiltern Sportscars', when: 'Thu 14 Dec', chips: () => [chip('c-contract', 'Team news')] },
];
// Which row a reader view lights.
const SEL = () => ({
  debrief: S.dv === 'good' ? 'debrief' : 'debrief2',
  team: { welcome: 'welcome', halfway: 'team', short: 'team', missed: 'missed' }[S.tv],

const mrow = (r) => (r.m ? `<div class="mgrp caps">${r.m}</div>` : `<div class="mrow${r.unread && SEL() !== r.id ? ' unread' : ''}${SEL() === r.id ? ' sel' : ''}">

</nav>`;

// ---------- Debriefs ----------
const debriefGood = () => reader(`
  ${rhead([nb(chip('c-debrief', 'Debrief'))], 'Sunday 8 July 2029')}
  <h2>Spa-Francorchamps: P3 and P7</h2>
  ${from(WHO.tom)}
  ${strip('violet2', I.trophy, 'GT4 European Series 2029 · Round 3 of 6', 'Spa-Francorchamps · Ginetta G55 GT4 · GT4')}
  <div class="letter">
    <p>Race one is our first podium of the year - fourth on the grid to third at the flag, and your best lap was the third quickest in GT4.</p>

  </div>
  <div class="tbox"><div class="th">Your weekend<span class="end">Places are in GT4, of 18</span></div>
  <table class="dtab"><thead><tr><th>Session</th><th>Started</th><th>Finished</th><th class="r">Best lap</th><th class="r">To class best</th><th>Jonas Bakker</th><th class="r">Points</th></tr></thead><tbody>
    <tr><td>${sess('q', 'Qualifying 1')}</td><td class="dim">-</td><td>${rc(4)}</td><td class="r num">2:31.402</td><td class="r num">+0.284</td><td>${rc(9, { pts: false })}</td><td class="r num dim">-</td></tr>
    <tr><td>${sess('q', 'Qualifying 2')}</td><td class="dim">-</td><td>${rc(6)}</td><td class="r num">2:31.630</td><td class="r num">+0.512</td><td>${rc(5)}</td><td class="r num dim">-</td></tr>
    <tr><td>${sess('r', 'Race 1')}</td><td>${rc(4)}</td><td>${rc(3)}</td><td class="r num">2:31.884</td><td class="r num">+0.196</td><td>${rc(8)}</td><td class="r num">6</td></tr>
    <tr><td>${sess('r', 'Race 2')}</td><td>${rc(6)}</td><td>${rc(7)}</td><td class="r num">2:32.410</td><td class="r num">+0.731</td><td>${rc(5)}</td><td class="r num">2</td></tr>
  </tbody></table></div>
  <div class="sumtiles">
    <div><span class="k">Championship</span><b>P7 ${mv(2)}</b><small>41 points</small></div>
    <div><span class="k">This round</span><b>8 points</b><small>Your best round so far</small></div>
    <div><span class="k">Jonas Bakker</span><b>P6 ${mv(-1)}</b><small>47 points</small></div>
    <div><span class="k">Next round</span><b>Portimão</b><small>Sat 28 Jul · in 3 weeks</small></div>
  </div>`);
const debriefTough = () => reader(`
  ${rhead([nb(chip('c-debrief', 'Debrief'))], 'Sunday 1 July 2029')}
  <h2>Brands Hatch: P14</h2>
  ${from(WHO.lukas)}
  ${strip('violet2', I.trophy, 'Carrera Cup 991 H2 2029 · Round 2 of 6', 'Brands Hatch · Porsche 911 GT3 Cup · your own car, for Lechner Racing')}
  <div class="letter">
    <p>A hard day at Brands Hatch. Twelfth in qualifying, nine tenths off pole, and fourteenth at the flag.</p>
    <p>Twelfth in the championship, two places down. Snetterton is next, on Sunday 22 July.</p>
  </div>
  <div class="tbox"><div class="th">Your weekend<span class="end">Places of 20</span></div>
  <table class="dtab"><thead><tr><th>Session</th><th>Started</th><th>Finished</th><th class="r">Best lap</th><th class="r">To best</th><th>Max Hofer</th><th class="r">Points</th></tr></thead><tbody>
    <tr><td>${sess('q', 'Qualifying')}</td><td class="dim">-</td><td>${rc(12, { pts: false })}</td><td class="r num">1:23.118</td><td class="r num">+0.912</td><td>${rc(10, { pts: false })}</td><td class="r num dim">-</td></tr>
    <tr><td>${sess('r', 'Race')}</td><td>${rc(12, { pts: false })}</td><td>${rc(14, { pts: false })}</td><td class="r num">1:23.540</td><td class="r num">+0.866</td><td>${rc(9)}</td><td class="r num">0</td></tr>
  </tbody></table></div>
  <div class="sumtiles">
    <div><span class="k">Championship</span><b>P12 ${mv(-2)}</b><small>14 points</small></div>
    <div><span class="k">This round</span><b>No points</b><small>&nbsp;</small></div>
    <div><span class="k">Max Hofer</span><b>P9 ${mv(1)}</b><small>22 points</small></div>
    <div><span class="k">Next round</span><b>Snetterton</b><small>Sun 22 Jul · in 3 weeks</small></div>
  </div>`);

// ---------- Team news ----------
const keepBlock = (on, you, mate) => `<div class="panel"><div class="keep" style="border-top:0">
  <span class="tgt">${I.target}Top 9 in GT4, or ahead of your teammate${on == null ? '' : `<span class="end">${on ? chip('c-onc', 'On course') : chip('c-short', 'Short of it')}</span>`}</span>

     rung:&lt;discipline&gt;:&lt;tier&gt;:&lt;season&gt;   market:seats:&lt;season&gt;   market:works:&lt;discipline&gt;:&lt;tier&gt;</pre>

    debrief: S.dv === 'good'
      ? '<b>A debrief under contract</b>: one mail for the round, from the team\'s engineer. The prose states the facts the table holds; the table is a row a session, places in the class.'
      : '<b>A hard day on your own</b>: the engineer of Lechner Racing, the team drawn for you this edition - one qualifying and one race. The words follow the facts - no podium, no points.',
    team: ({
      welcome: '<b>Welcome</b>, the day an offer is signed: the car in the team\'s livery, the engineer and teammate, and what keeps you on.',
      halfway: '<b>Halfway, on course</b>: the KeepBlock the contract card already shows, with a sentence.',
      short: '<b>Halfway, short of it</b>: the same, amber.',
      missed: '<b>A round missed under contract</b>: the fine, and how your car did without you.',
    })[S.tv],
    results: ({
      contract: '<b>A championship\'s result under contract</b>, from the team manager: your place, your teammate, the team, what it paid, the top of the table and the review.',
      champ: '<b>Champion</b>: the gold bar Home\'s finished banner wears, and the bonus.',
      own: '<b>On your own</b>, from the organisers.',
    })[S.rv],
    rung: S.gv === 'up' ? '<b>A rung opened</b>, worded as Home\'s banner.' : '<b>A rung lost</b> as the year closes, worded as Home\'s banner.',
    market: S.kv === 'seats' ? '<b>Seats for sale</b>, as the season opens.' : '<b>Works teams watching</b>, once a discipline: the day they start calling at full chance, naming their championships.',
  })[S.mail],
};
const QUESTIONS = {
  concept: ['-'],
  inbox: () => ({
    debrief: ['Is the table the right amount - or should qualifying fold into the race rows as Started?', 'Do the tiles under it earn their place, or is the prose enough?'],
    team: ['-'],
    results: ['Top five and your row, or the whole class table?'],
    rung: ['-'],
    market: ['Decision 10 on the Concept screen: keep this mail or leave it out?'],
  })[S.mail],
};
const GROUPS = [
  { k: 'view', label: 'Screen', opts: [['concept', 'Concept'], ['inbox', 'Inbox']] },
  { k: 'mail', label: 'Mail', for: ['inbox'], opts: [['debrief', 'Debrief'], ['team', 'Team news'], ['results', 'Championship result'], ['rung', 'Categorisation'], ['market', 'Market']] },
  { k: 'dv', label: 'Case', for: ['inbox'], when: () => S.mail === 'debrief', opts: [['good', 'Under contract'], ['tough', 'On your own, a hard day']] },
  { k: 'toast', label: 'Toast', for: ['inbox'], when: () => S.mail === 'debrief' && S.dv === 'good', opts: [['off', 'Off'], ['on', 'Just arrived']] },
  { k: 'tv', label: 'Case', for: ['inbox'], when: () => S.mail === 'team', opts: [['welcome', 'Welcome'], ['halfway', 'Halfway, on course'], ['short', 'Halfway, short'], ['missed', 'Round missed']] },
  { k: 'rv', label: 'Case', for: ['inbox'], when: () => S.mail === 'results', opts: [['contract', 'Under contract'], ['champ', 'Champion'], ['own', 'On your own']] },
  { k: 'gv', label: 'Case', for: ['inbox'], when: () => S.mail === 'rung', opts: [['up', 'Opened'], ['down', 'Lost']] },
  { k: 'kv', label: 'Case', for: ['inbox'], when: () => S.mail === 'market', opts: [['seats', 'Seats for sale'], ['watching', 'Works teams watching (open)']] },
  { k: 'cl', label: 'Closing', for: ['inbox'], opts: [['chip', 'Days left'], ['none', 'As today']] },
  { k: 'theme', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
];
const S = { view: 'concept', mail: 'debrief', dv: 'good', toast: 'off', tv: 'welcome', rv: 'contract', gv: 'up', kv: 'seats', cl: 'chip', theme: 'light' };

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('picker').innerHTML = GROUPS.filter((g) => (!g.for || g.for.includes(S.view)) && (!g.when || g.when()))
    .map((g) => `<div class="grp"><strong>${g.label}</strong>${g.opts.map(([v, l]) => `<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${S[g.k] === v}">${l}</button>`).join('')}</div>`).join('');
  const q = QUESTIONS[S.view];
  document.getElementById('why').innerHTML = `<div class="box">${WHY[S.view]()}<div class="q"><b>To decide</b><ul>${(typeof q === 'function' ? q() : q).map((x) => `<li>${x}</li>`).join('')}</ul></div></div>`;
  document.getElementById('stage').innerHTML = { concept, inbox: inboxView }[S.view]();
};
document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  history.replaceState(null, '', `#${new URLSearchParams(S)}`);
  render();
});
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in S) S[k] = v; });
render();
</script>
</body>
</html>
