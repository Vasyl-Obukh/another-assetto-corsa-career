<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Championship editor</title>
<style>

/* Tokens copied from src/renderer/src/globals.css. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-foreground: oklch(0.985 0.005 155);
  --warning: oklch(0.79 0.15 80);
  --warning-foreground: oklch(0.28 0.06 70);
  --destructive: oklch(0.58 0.22 27);
  --destructive-foreground: oklch(0.985 0.005 60);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75);   --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295);  --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);
  --session-practice: oklch(0.93 0.045 250); --session-practice-fg: oklch(0.4 0.13 258);
  --session-qualify: oklch(0.93 0.05 310);   --session-qualify-fg: oklch(0.4 0.15 310);
  --session-race: oklch(0.89 0.085 150);     --session-race-fg: oklch(0.33 0.1 152);
  --gold: oklch(0.9 0.085 88);     --gold-fg: oklch(0.42 0.1 75);
  --silver: oklch(0.91 0.008 255); --silver-fg: oklch(0.42 0.015 260);
  --bronze: oklch(0.89 0.07 52);   --bronze-fg: oklch(0.41 0.09 48);
  --sportscar: oklch(0.925 0.06 112); --sportscar-fg: oklch(0.36 0.1 118);
  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88);    --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255);  --t3-fg: oklch(0.42 0.015 260);
  --works: oklch(0.91 0.075 320); --works-fg: oklch(0.38 0.15 320);
  --independent: oklch(0.92 0.06 18); --independent-fg: oklch(0.42 0.13 22);
  --privateer: oklch(0.93 0.055 132); --privateer-fg: oklch(0.4 0.09 135);
  --temperate: oklch(0.925 0.03 150); --temperate-fg: oklch(0.4 0.05 150);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-foreground: oklch(0.17 0.03 158);
  --warning: oklch(0.8 0.14 82);
  --warning-foreground: oklch(0.2 0.04 70);
  --destructive: oklch(0.66 0.2 25);
  --destructive-foreground: oklch(0.16 0.02 30);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70);   --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295);  --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);
  --session-practice: oklch(0.32 0.06 250); --session-practice-fg: oklch(0.86 0.09 255);
  --session-qualify: oklch(0.33 0.07 310);  --session-qualify-fg: oklch(0.87 0.1 310);
  --session-race: oklch(0.35 0.09 150);     --session-race-fg: oklch(0.88 0.13 150);
  --gold: oklch(0.36 0.07 88);     --gold-fg: oklch(0.89 0.12 92);
  --silver: oklch(0.33 0.006 260); --silver-fg: oklch(0.86 0.008 260);
  --bronze: oklch(0.33 0.06 50);   --bronze-fg: oklch(0.85 0.09 55);
  --sportscar: oklch(0.32 0.07 112); --sportscar-fg: oklch(0.86 0.1 112);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88);   --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --works: oklch(0.34 0.085 320); --works-fg: oklch(0.87 0.11 320);
  --independent: oklch(0.33 0.07 18); --independent-fg: oklch(0.86 0.09 22);
  --privateer: oklch(0.32 0.06 132); --privateer-fg: oklch(0.86 0.08 135);
  --temperate: oklch(0.32 0.03 150); --temperate-fg: oklch(0.85 0.05 150);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.small { font-size: 12px; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }

/* Mockup chrome */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker strong { font-weight: 600; margin-right: 8px; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 5px 12px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .sep { width: 1px; align-self: stretch; background: color-mix(in oklch, var(--background) 30%, transparent); margin: 0 6px; }
.picker .spacer { flex: 1; }
.rationale { max-width: 84ch; margin: 20px auto 0; padding: 0 16px; color: var(--muted-foreground); font-size: 13.5px; }
.rationale b { color: var(--foreground); font-weight: 600; }
.window { max-width: 1440px; margin: 16px auto 48px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--background); box-shadow: 0 20px 50px -30px oklch(0.2 0.02 260 / 0.35); }
.app-header { display: flex; align-items: center; gap: 24px; padding: 14px 32px; border-bottom: 1px solid var(--border); }
.app-header h1 { font-size: 17px; font-weight: 600; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { padding: 5px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500; }
.nav a.on { background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary); }
.screen { padding: 20px 32px 40px; }
.back { color: var(--muted-foreground); font-size: 13px; margin-bottom: 14px; display: inline-block; }

/* Shared pieces */
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.chip.outline { border: 1px solid var(--border); padding: 3px 7px; }
.chip.filled { background: var(--primary); color: var(--primary-foreground); }
.c-sportscar { background: var(--sportscar); color: var(--sportscar-fg); }
.c-t1 { background: var(--t1); color: var(--t1-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-t3 { background: var(--t3); color: var(--t3-fg); }
.c-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.c-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.c-works { background: var(--works); color: var(--works-fg); }
.c-independent { background: var(--independent); color: var(--independent-fg); }
.c-privateer { background: var(--privateer); color: var(--privateer-fg); }
.c-temperate { background: var(--temperate); color: var(--temperate-fg); }
.c-success { background: var(--success); color: var(--success-foreground); }
.c-warning { background: var(--warning); color: var(--warning-foreground); }
.c-destructive { background: var(--destructive); color: var(--destructive-foreground); }
.p1 { background: var(--gold); color: var(--gold-fg); }
.p2 { background: var(--silver); color: var(--silver-fg); }
.p3 { background: var(--bronze); color: var(--bronze-fg); }
.fmt { display: inline-flex; gap: 2px; }
.fmt span { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.s-practice { background: var(--session-practice); color: var(--session-practice-fg); }
.s-qualify { background: var(--session-qualify); color: var(--session-qualify-fg); }
.s-race { background: var(--session-race); color: var(--session-race-fg); }
.medal { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.medal.sm { width: 24px; height: 24px; font-size: 12px; box-shadow: 0 0 0 2px var(--card); }
.medals { display: flex; }
.medals .medal + .medal { margin-left: -4px; }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 6px 12px; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.kebab { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; line-height: 1; color: inherit; }
.switch { width: 36px; height: 20px; border-radius: 10px; background: var(--success); position: relative; flex-shrink: 0; border: 0; }
.switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.card-h { padding: 14px 18px 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 600; }
.card-b { padding: 0 18px 16px; }
.map { width: 64px; height: 40px; border-radius: 6px; background: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
.map svg { width: 50px; height: 30px; }
.map path, .big-map path { fill: none; stroke: var(--foreground); stroke-width: 2.4; stroke-linejoin: round; opacity: .75; }
.shot { border-radius: 8px; overflow: hidden; background: var(--muted); display: flex; flex-direction: column; }
.shot .img { aspect-ratio: 16 / 9; display: grid; place-items: center; background: linear-gradient(180deg, color-mix(in oklch, var(--muted) 60%, var(--card)), var(--muted)); }
.shot .img svg { width: 62%; }
.shot .img path { fill: color-mix(in oklch, var(--foreground) 55%, transparent); }
.shot .cap { font-size: 11.5px; padding: 5px 7px; background: var(--card); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 8px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 6px 8px; font-weight: 400; }
th { color: var(--muted-foreground); font-size: 12px; }
tbody tr { border-top: 1px solid var(--border); }
.you { background: color-mix(in oklch, var(--primary) 8%, transparent); }
.cell-res { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 4px; border-radius: 5px; font-weight: 600; font-size: 12px; }
.r { text-align: right; }
details > summary { color: var(--primary); font-size: 13px; padding: 8px 0 0; list-style: none; }
details[open] > summary { margin-bottom: 8px; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.team { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; background: var(--card); }
.team .th { display: flex; align-items: center; gap: 8px; }
.team .th b { flex: 1; min-width: 0; font-size: 13.5px; }
.team .drv { display: flex; justify-content: space-between; font-size: 13px; }
.team .drv.me span:first-child { font-weight: 600; color: var(--primary); }
.needs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }


:root {
  --single: oklch(0.925 0.06 212); --single-fg: oklch(0.36 0.11 215);
  --custom: oklch(0.93 0.05 340); --custom-fg: oklch(0.38 0.12 340);
  --mediterranean: oklch(0.93 0.035 108); --mediterranean-fg: oklch(0.41 0.055 110);
  --arid: oklch(0.93 0.04 70); --arid-fg: oklch(0.42 0.06 65);
  --oceanic: oklch(0.925 0.03 232); --oceanic-fg: oklch(0.4 0.05 235);
  --steel: oklch(0.875 0.022 250); --steel-fg: oklch(0.36 0.035 255);
  --input: oklch(0.885 0.01 255);
}
:root[data-theme="dark"] {
  --single: oklch(0.32 0.07 212); --single-fg: oklch(0.86 0.1 212);
  --custom: oklch(0.33 0.07 340); --custom-fg: oklch(0.86 0.1 340);
  --mediterranean: oklch(0.32 0.03 108); --mediterranean-fg: oklch(0.86 0.055 110);
  --arid: oklch(0.33 0.035 70); --arid-fg: oklch(0.86 0.06 75);
  --oceanic: oklch(0.32 0.03 232); --oceanic-fg: oklch(0.85 0.045 235);
  --steel: oklch(0.315 0.028 250); --steel-fg: oklch(0.82 0.035 255);
  --input: oklch(1 0 0 / 15%);
}
.c-single { background: var(--single); color: var(--single-fg); }
.c-custom { background: var(--custom); color: var(--custom-fg); }
.c-mediterranean { background: var(--mediterranean); color: var(--mediterranean-fg); }
.c-arid { background: var(--arid); color: var(--arid-fg); }
.c-oceanic { background: var(--oceanic); color: var(--oceanic-fg); }
.c-t4 { background: var(--bronze); color: var(--bronze-fg); }
.c-t5 { background: var(--steel); color: var(--steel-fg); }
.c-warning { background: var(--warning); color: var(--warning-foreground); }

/* Form bits */
.in { border: 1px solid var(--input); background: transparent; border-radius: 7px; height: 34px; padding: 0 10px; font: inherit; color: inherit; width: 100%; min-width: 0; display: flex; align-items: center; }
.in.sm { height: 28px; padding: 0 8px; font-size: 13px; border-radius: 6px; }
.in.sel { justify-content: space-between; }
.in.sel::after { content: "⌄"; opacity: .5; margin-left: 6px; transform: translateY(-3px); }
.in.num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
textarea.in { height: auto; padding: 8px 10px; resize: none; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted-foreground); }
.fields { display: grid; gap: 14px 16px; }
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
:where(.seg) button { border: 0; background: none; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; }
.seg:not(.chips) button.on { background: var(--card); box-shadow: 0 0 0 1px var(--border), 0 1px 2px oklch(0 0 0 / .08); }
.seg.chips button.on { box-shadow: none; }
.sw { width: 34px; height: 19px; border-radius: 10px; background: var(--input); position: relative; flex-shrink: 0; border: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
.sw.on { background: var(--success); }
.sw.on::after { left: auto; right: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.toggle-row:first-child { border-top: 0; }
.stepper { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; border: 1px solid var(--input); border-radius: 7px; height: 34px; overflow: hidden; }
.stepper button { border: 0; background: none; height: 100%; color: var(--muted-foreground); }
.stepper span { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.stepper span.pos { color: var(--success); }
.stepper span.neg { color: var(--destructive); }
.ghost { border: 0; background: none; border-radius: 6px; padding: 5px 8px; color: var(--muted-foreground); font-size: 13px; }
.ghost:hover { background: var(--accent); color: var(--foreground); }
.add { border: 1px dashed var(--border); border-radius: 8px; background: transparent; color: var(--muted-foreground); padding: 7px 12px; font-size: 13px; font-weight: 500; text-align: left; }
.add:hover { border-color: var(--primary); color: var(--primary); }
.grip { color: var(--muted-foreground); opacity: .5; cursor: grab; width: 14px; flex-shrink: 0; font-size: 13px; letter-spacing: -2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.err { background: var(--destructive); }
.dot.dirty { background: var(--warning); }
.pencil { opacity: 0; color: var(--muted-foreground); font-size: 13px; }
.editable:hover .pencil { opacity: 1; }
.editable { cursor: pointer; }
.editable:hover { background: color-mix(in oklch, var(--accent) 55%, transparent); }

/* Editor header */
.ed-head { position: sticky; top: 49px; z-index: 30; background: var(--background); padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ed-head h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.ed-head .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.problems { border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border)); background: color-mix(in oklch, var(--destructive) 6%, var(--card)); border-radius: 10px; padding: 9px 14px; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; font-size: 13px; flex-wrap: wrap; }
.problems b { color: var(--destructive); }
.problems a { color: var(--primary); }

/* ===== A: section rail ===== */
.a-shell { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 125px; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); }
.rail a .n { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.rail a.on { background: var(--card); color: var(--foreground); box-shadow: 0 0 0 1px var(--border); }
.rail a.on::before { content: ""; width: 3px; height: 16px; border-radius: 2px; background: var(--primary); margin-left: -6px; }
.rail .sub { padding: 2px 10px 2px 26px; font-size: 12.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.rail hr { border: 0; border-top: 1px solid var(--border); margin: 8px 4px; }
.sec { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 130px; }
.sec + .sec { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h h3 { font-size: 17px; font-weight: 650; }
.sec-h .hint { color: var(--muted-foreground); font-size: 13px; }
.sec-h .end { margin-left: auto; }
.two-pane { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.two-pane > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.two-pane > div + div { border-left: 1px solid var(--border); }
.pane-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); }
.three-pane { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.three-pane > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.three-pane > div + div { border-left: 1px solid var(--border); }
.assists { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px 9px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.tile .t { display: flex; align-items: center; gap: 8px; }
.tile .t b { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.tile.add-tile { border-style: dashed; background: transparent; color: var(--muted-foreground); justify-content: center; align-items: center; font-weight: 500; min-height: 58px; }

        ${field('Entry fee', input(money(s.fee, s.cur), 'num'), 'Per round, unless a round says otherwise')}
        ${field('Season length', select(s.length), 'How much of a career year it fills')}
      </div>
      <div class="toggle-row" style="border-top:0;padding-top:0"><span><b style="font-weight:500">Generated weather</b><br><span class="small muted">Drawn from a climate; a round or session may still set its own</span></span><span class="sw ${s.weather ? 'on' : ''}"></span></div>
      <div class="field"><label>Climate</label>${seg(['arid', 'mediterranean', 'temperate', 'oceanic'], s.climate, true)}</div>
      <div class="field"><label>Hemisphere</label>${seg(['Northern', 'Southern'], s.hemi)}</div>
    </div>
  </div>`;

const rules = (s) => `
  <div class="card three-pane">
    <div>
      <span class="pane-t">AI field</span>
      <span class="small muted">Over the difficulty in settings. A class, a round and a seat may move it further.</span>
      <div class="fields" style="grid-template-columns:1fr 1fr">${field('Strength', stepper(s.ai[0]))}${field('Aggression', stepper(s.ai[1]))}</div>
    </div>
    <div>
      <span class="pane-t">Assists allowed</span>
      <div class="assists">
        <span>ABS</span>${select('Factory', 'sm')}
        <span>Traction control</span>${select('Factory', 'sm')}
        <span>Stability control</span>${select('Off', 'sm')}
        <span>Automatic clutch</span>${select('Any', 'sm')}
        <span>Ideal line</span>${select('Off', 'sm')}
      </div>
      <span class="small muted">Plus damage, fuel rate, tyre wear, slipstream</span>
    </div>
    <div>
      <span class="pane-t">Race control</span>
      <div class="fields" style="grid-template-columns:1fr 1fr">${field('Jump start (s)', input('10', 'num'))}${field('Wheels off', input('Track default', 'muted'))}</div>
      <div>
        <div class="toggle-row"><span>Penalties</span><span class="sw on"></span></div>
        <div class="toggle-row"><span>Fixed setup</span><span class="sw"></span></div>
        <div class="toggle-row"><span>Tyre blankets</span><span class="sw"></span></div>
      </div>
    </div>
  </div>`;

const teamTiles = (s) => `<div class="tiles">${s.teams.map(([n, b, nat], i) => {
  const seats = teamSeats(s, i);
  const where = [...new Set(seats)].join(', ');
  return `<div class="tile editable"><div class="t"><span class="grip">⋮⋮</span><b>${n}</b><span class="nat">${nat}</span><button class="kb">⋮</button></div>
    <div class="s" style="padding-left:22px"><span class="chip c-${b}">${BUDGET[b]}</span><span>${seats.length} ${seats.length === 1 ? 'seat' : 'seats'}${s.classes.length > 1 ? ` in ${where}` : ''}</span></div></div>`;
}).join('')}<button class="tile add-tile">+ Add a team</button></div>`;

const seatRows = (s, c, rows) => rows.map(([d, nat, ti, car, ai], i) => {
  const [tn, tb] = s.teams[ti];
  return `<tr class="editable"><td style="width:14px"><span class="grip">⋮⋮</span></td><td class="num muted" style="width:22px">${i + 1}</td>
    <td>${d ? `<b style="font-weight:500">${d}</b>` : '<span class="muted">Seat free - drawn each season</span>'}</td>
    <td class="nat" style="width:36px">${nat}</td>
    <td><span class="steam"><span class="bud ${tb}"></span>${tn}</span></td>
    <td class="small muted" style="white-space:nowrap">${car ?? ''}</td>
    <td style="width:52px">${ai ? '<span class="chip outline ai">AI set</span>' : ''}</td>
    <td style="width:30px"><button class="kb">⋮</button></td></tr>`;
}).join('');

const classRow = (s, c, idx, opts = {}) => {
  const open = OPEN.has(`${SET}-${idx}`);
  const shown = open ? c.seats : c.seats.slice(0, SEATS_SHOWN);
  const hidden = c.seats.length - SEATS_SHOWN;
  return `<div class="crow">
    <div class="cg">
      <div class="id editable">
        <div class="nm">${medal(c.tier)}<b>${c.name}</b><button class="kb">⋮</button></div>
        <div class="row"><span class="chip ${s.disc[1]}">${s.disc[0]}</span>${tierChip(c.tier)}<span class="chip c-success">${c.inst} installed</span></div>
        <div class="over">
          <div><span>AI field</span><span>${c.ai[0] || c.ai[1] ? `${signed(c.ai[0])} / ${signed(c.ai[1])}` : 'As championship'}</span></div>
          <div><span>Balance of performance</span><span>${c.bop ? `${c.bop} cars` : 'None'}</span></div>
          <div><span>Prize money</span><span>${c.prize ? 'Own' : 'Championship\'s'}</span></div>
        </div>
      </div>
      <div>
        <div class="col-h"><span class="label">Cars</span><button class="ghost">Change</button></div>
        <div class="small" style="margin-bottom:8px"><span class="chip outline">${c.spec}</span> <span class="muted">${c.kind}, needs ${c.need} ${c.need === 1 ? 'model' : 'models'}</span></div>
        <div class="shots three">${c.cars.slice(0, 3).map((x) => `<div class="shot"><div class="img">${CAR}</div><div class="cap">${x}</div></div>`).join('')}</div>
        ${c.cars.length > 3 ? `<span class="small" style="color:var(--primary);display:block;margin-top:6px">and ${c.cars.length - 3} more</span>` : ''}
      </div>
      <div>
        <div class="col-h"><span class="label">Seats</span><span class="small muted">${c.seats.length} on the grid · the player takes the last</span></div>
        <table class="seats"><tbody>${seatRows(s, c, shown)}</tbody></table>
        ${open || hidden <= 0 ? '<button class="add" style="margin-top:8px">+ Add a seat</button>' : ''}
      </div>
    </div>
    ${hidden > 0 ? `<button class="foot" data-open="${SET}-${idx}" style="width:100%;border:0;border-top:1px solid var(--border)"><span class="sp"></span>${open ? 'Show less ▴' : `Show ${hidden} more seats ▾`}<span class="sp"></span></button>` : ''}
  </div>`;
};

const calendar = (s, pencil) => `<div class="card" style="padding:4px 10px">
  <table class="cal">
    <thead><tr><th style="width:14px"></th><th>Rd</th><th></th><th>Round</th><th>Weekend</th><th>Races</th><th>Own settings</th><th class="r">Entry fee</th><th style="width:30px"></th></tr></thead>
    <tbody>${s.rounds.map(([n, key, f, len, clim, cond, swaps, fee, prob], i) => `
      <tr class="editable">
        <td><span class="grip">⋮⋮</span></td>
        <td class="rd">${i + 1}</td>
        <td style="width:72px"><span class="map"><svg viewBox="0 0 56 34"><path d="${MAP}"/></svg></span></td>
        <td><div class="nm"><b>${n}</b><span>${key}</span></div>${prob ? `<span class="chip c-destructive" style="margin-top:4px">${prob}</span>` : ''}</td>
        <td><span class="fmtc">${strip(s.formats[f][1], false)}<span class="small ${f === 0 ? 'muted' : ''}">${s.formats[f][0]}${f === 0 && s.formats.length > 1 ? ' (default)' : ''}</span></span></td>
        <td class="small num" style="white-space:nowrap">${len}</td>
        <td><span class="row">
          ${clim ? climateChip(clim) : ''}
          <span class="icon-btn ${cond ? 'set' : ''}">☁ ${cond ? `${cond} conditions` : 'Conditions'}</span>
          <span class="icon-btn ${swaps ? 'set' : ''}">🚗 ${swaps ? `${swaps} car ${swaps === 1 ? 'swap' : 'swaps'}` : 'Cars'}</span>
        </span></td>
        <td class="r num small">${fee ? money(fee.replace(',', ''), s.cur) : '<span class="muted">Default</span>'}</td>
        <td>${pencil ? '<span class="pencil">✎</span>' : '<button class="kb">⋮</button>'}</td>
      </tr>`).join('')}</tbody>
  </table>
  <div style="padding:8px 0 10px"><button class="add">+ Add a round</button></div>
</div>`;

const formats = (s) => `<div class="fcards">${s.formats.map(([n, sess], fi) => {
  const days = [...new Set(sess.map((x) => x.day))];
  const used = s.rounds.filter((r) => r[2] === fi).length;
  return `<div class="fcard">
    <div class="h">${strip(sess, true)}<b>${n}</b>${fi === 0 && s.formats.length > 1 ? '<span class="chip filled">Default</span>' : ''}<button class="kb">⋮</button></div>
    ${days.map((d) => `${days.length > 1 ? `<div class="day">Day ${d}</div>` : ''}${sess.filter((x) => x.day === d).map((x) => `
      <div class="srow editable"><span class="grip">⋮⋮</span><span><span class="chip s-${x.type}">${TYPE[x.type]}</span></span>
        <span style="min-width:0">${x.name}${x.follows ? `<div class="fol">↳ grid from ${x.follows}</div>` : ''}</span>
        <span class="len">${x.len}</span><button class="kb">⋮</button></div>`).join('')}`).join('')}
    <div class="f"><button class="ghost" style="padding:3px 6px">+ Session</button><span style="margin-left:auto">${used ? `Raced at ${used} ${used === 1 ? 'round' : 'rounds'}` : '<span style="color:var(--warning-foreground)" class="chip c-warning">No round runs it</span>'}</span></div>
  </div>`;
}).join('')}<button class="add" style="min-height:120px;text-align:center">+ Add a weekend format</button></div>`;

const scoring = (s) => {
  const rows = Math.min(10, Math.max(...s.points.map((p) => p[1].length)));
  const split = s.purses.length > 1;
  const head = (p) => (split ? `<span class="chip c-t${p[1]}">${p[0]}</span>` : 'Prize money');
  return `<div class="score">
    <div class="card"><div class="card-h"><h3>Each race pays</h3><span class="small muted">${s.points[0][1].length} places score</span></div><div class="card-b">
      <table class="grid-in"><thead><tr><th></th>${s.points.map((p) => `<th>${p[0]} <span class="muted">· default</span></th>`).join('')}${s.purses.map((p) => `<th>${head(p)}</th>`).join('')}</tr></thead>
      <tbody>${Array.from({ length: rows }, (_, i) => `<tr><td class="cellm"><span class="cell-res ${pod(i)}">P${i + 1}</span></td>${s.points.map((p) => `<td>${input(p[1][i], 'num')}</td>`).join('')}${s.purses.map((p) => `<td>${input(money(p[2][i], s.cur), 'num money')}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:8px"><button class="ghost">+ Add a place</button><button class="ghost">− Drop the last</button>${s.points[0][1].length > rows ? `<span class="small" style="color:var(--primary);margin-left:auto">Show all ${s.points[0][1].length} places</span>` : ''}</div>
      <div class="notes">${field('Fastest lap', input(s.fl || '-', 'num sm'))}${field('Qualifying pays', input(s.quali || '-', 'sm'), 'Top places, comma separated')}<button class="ghost" style="align-self:end">+ Another points system</button></div>
    </div></div>
    <div class="card"><div class="card-h"><h3>The season pays</h3></div><div class="card-b">
      <table class="grid-in"><thead><tr><th></th>${s.purses.map((p) => `<th>${head(p)}</th>`).join('')}</tr></thead>
      <tbody>${Array.from({ length: 5 }, (_, i) => `<tr><td class="cellm"><span class="cell-res ${pod(i)}">P${i + 1}</span></td>${s.purses.map((p) => `<td>${input(money(p[3][i], s.cur), 'num money')}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <div class="row" style="margin-top:8px"><button class="ghost">+ Add a place</button><button class="ghost">− Drop the last</button></div>
    </div></div>
  </div>`;
};

const SECTIONS = (s) => [
  ['overview', 'Overview', '', 'Name, season and weather'],
  ['rules', 'Rules & AI', '', 'What the series allows'],
  ['teams', 'Teams', s.teams.length, 'Described once, referenced by every seat'],
  ['classes', 'Classes', s.classes.length, `${seatCount(s)} seats`],
  ['calendar', 'Calendar', s.rounds.length, 'Drag to reorder'],
  ['formats', 'Weekend formats', s.formats.length, 'What a round runs'],
  ['scoring', 'Points & prize money', '', 'What a place is worth'],
];
const BODY = { overview, rules, teams: teamTiles, classes: (s) => `<div class="stack" style="gap:12px">${s.classes.map((c, i) => classRow(s, c, i)).join('')}<button class="add">+ Add a class</button></div>`, calendar: (s) => calendar(s), formats, scoring };

// ---------- A ----------
const optA = (s) => `${header(s)}
  <div class="a-shell">
    <nav class="rail">${SECTIONS(s).map(([id, t, n], i) => `<a class="${i === 3 ? 'on' : ''}">${t}${s.dirty.includes(id) ? '<span class="dot dirty" title="Changed"></span>' : ''}${s.problems.some((p) => p[2] === id) ? '<span class="dot err" title="1 problem"></span>' : ''}<span class="n">${n}</span></a>${id === 'classes' && s.classes.length > 1 ? s.classes.map((c) => `<span class="sub">${medal(c.tier).replace('medal', 'medal sm')}${c.name}</span>`).join('') : ''}`).join('')}
      <hr><span class="small muted" style="padding:0 10px">Changed sections carry an amber dot, sections with a problem a red one.</span></nav>
    <div>${SECTIONS(s).map(([id, t, n, hint]) => `<section class="sec" id="a-${id}"><div class="sec-h"><h3>${t}</h3><span class="hint">${hint}</span></div>${BODY[id](s)}</section>`).join('')}</div>
  </div>`;

// ---------- B ----------
const TABS = (s) => [['overview', 'Overview', ''], ['teams', 'Teams', s.teams.length], ['classes', 'Classes', s.classes.length], ['calendar', 'Calendar', s.rounds.length], ['formats', 'Weekends', s.formats.length], ['scoring', 'Points & money', '']];
const classDetail = (s, c) => {
  const subs = [['cars', 'Cars'], ['seats', `Seats <span class="n">${c.seats.length}</span>`], ['performance', 'Performance'], ['prizes', 'Prize money']];
  let body = '';
  if (SUB === 'seats') {
    const byTeam = [...new Set(c.seats.map((x) => x[2]))];
    body = `<table class="sheet"><thead><tr><th></th><th>#</th><th>Driver</th><th>Nation</th><th>Team</th><th>Car and livery</th><th class="r">AI strength</th><th class="r">Aggression</th><th></th></tr></thead><tbody>
      ${byTeam.map((ti) => `<tr class="grp"><td colspan="9"><span class="row"><span class="bud ${s.teams[ti][1]}"></span>${s.teams[ti][0]}<span class="chip c-${s.teams[ti][1]}">${BUDGET[s.teams[ti][1]]}</span></span></td></tr>${c.seats.map((x, i) => [x, i]).filter(([x]) => x[2] === ti).map(([[d, nat, , car, ai], i]) => `
        <tr><td style="width:14px"><span class="grip">⋮⋮</span></td><td class="num muted" style="width:26px">${i + 1}</td>
        <td>${input(d || '<span class="muted">Drawn each season</span>')}</td><td style="width:70px">${input(nat, 'sm')}</td>
        <td style="width:15rem">${select(s.teams[ti][0])}</td><td style="width:15rem">${select(car ?? '<span class="muted">Any fieldable</span>')}</td>
        <td style="width:90px">${input(ai ? '+4' : '<span class="muted">Drawn</span>', 'num')}</td><td style="width:90px">${input('<span class="muted">Drawn</span>', 'num')}</td><td style="width:30px"><button class="kb">⋮</button></td></tr>`).join('')}`).join('')}
      </tbody></table><div class="row" style="margin-top:10px"><button class="add">+ Add a seat</button><span class="small muted">Grouped by team. The player takes the last seat.</span></div>`;
  } else if (SUB === 'cars') {
    body = `<div class="fields" style="grid-template-columns:repeat(3,minmax(0,1fr))">${field('Written as', select(c.kind))}${field('Grid', select(c.spec))}${field('Models needed', input(c.need, 'num'), 'Before the class can be raced')}</div>
      <div class="shots" style="margin-top:14px">${c.cars.map((x) => `<div class="shot"><div class="img">${CAR}</div><div class="cap">${x}</div></div>`).join('')}</div>`;
  } else if (SUB === 'performance') {
    body = `<div class="fields" style="grid-template-columns:repeat(2,12rem)">${field('AI strength', stepper(c.ai[0]))}${field('AI aggression', stepper(c.ai[1]))}</div>
      <div class="label" style="margin-top:16px">Balance of performance</div><table class="sheet"><thead><tr><th>Car</th><th class="r">Ballast (kg)</th><th class="r">Restrictor (%)</th><th></th></tr></thead><tbody>${c.cars.slice(0, c.bop).map((x, i) => `<tr><td>${x}</td><td style="width:120px">${input(10 + i * 5, 'num')}</td><td style="width:120px">${input(i * 2, 'num')}</td><td style="width:30px"><button class="kb">⋮</button></td></tr>`).join('')}</tbody></table><button class="add" style="margin-top:8px">+ Balance a car</button>`;
  } else {
    body = scoring({ ...s, points: [], purses: [s.purses[PICK] ?? s.purses[0]] }).replace('Each race pays', 'Each race pays this class');
  }
  return `<div class="card"><div style="padding:14px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border)">${medal(c.tier)}<h3 style="font-size:18px">${c.name}</h3><span class="chip ${s.disc[1]}">${s.disc[0]}</span>${tierChip(c.tier)}<span class="chip c-success">${c.inst} installed</span><span style="margin-left:auto" class="row"><button class="btn">Rename or move rung</button><button class="kb">⋮</button></span></div>
    <div class="subtabs">${subs.map(([k, l]) => `<button class="${SUB === k ? 'on' : ''}" data-sub="${k}">${l}</button>`).join('')}</div>
    <div style="padding:14px 16px">${body}</div></div>`;
};
const optB = (s) => {
  let body;
  if (TAB === 'classes') {
    body = `<div class="md"><div class="mlist">${s.classes.map((c, i) => `<button class="mitem ${i === PICK ? 'on' : ''}" data-pick="${i}"><span class="grip">⋮⋮</span>${medal(c.tier)}<span class="x"><b>${c.name}</b><span class="small muted">${c.seats.length} seats · ${c.spec}</span></span></button>`).join('')}<button class="add">+ Add a class</button></div>
      ${classDetail(s, s.classes[PICK] ?? s.classes[0])}</div>`;
  } else if (TAB === 'overview') body = `<div class="stack">${overview(s)}${rules(s)}</div>`;
  else body = BODY[TAB](s);
  return `${header(s)}<div class="tabs">${TABS(s).map(([k, l, n]) => `<button class="${TAB === k ? 'on' : ''}" data-tab="${k}">${l}${n !== '' ? `<span class="n">${n}</span>` : ''}${s.dirty.includes(k) ? '<span class="dot dirty"></span>' : ''}${s.problems.some((p) => p[2] === k) ? '<span class="dot err"></span>' : ''}</button>`).join('')}</div>${body}`;
};

// ---------- C ----------
const drawer = (s) => {

  const f = s.formats[r[2]];
  return `<div class="drawer-veil" data-close></div><aside class="drawer">

      ${field('Weekend format', select(`${f[0]}${r[2] === 0 ? ' (the default)' : ''}`))}
      ${f[1].filter((x) => x.type === 'race').map((x) => field(`${x.name} length`, `<div class="row" style="flex-wrap:nowrap">${input(x.len.split(' ')[0], 'num')}${select(x.len.split(' ')[1])}</div>`, 'Empty runs what the format says')).join('')}
      <div class="fields" style="grid-template-columns:1fr 1fr">${field('Entry fee', input(`<span class="muted">${money(s.fee, s.cur)} (default)</span>`, 'num'))}${field('Climate', select(r[4] ? r[4] : 'As championship'))}</div>
      <div class="field"><label>Conditions</label><div class="toggle-row" style="border:1px solid var(--border);border-radius:8px;padding:8px 10px"><span class="small">Weather, time of day, temperature, grip</span><span class="icon-btn">Set…</span></div></div>
      <div class="field"><label>Cars at this round</label><div class="toggle-row" style="border:1px solid var(--border);border-radius:8px;padding:8px 10px"><span class="small">Every class runs its season cars</span><span class="icon-btn">Change…</span></div></div>
    </div>
    <div class="df"><button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Apply</button></div>
  </aside>`;
};
const optC = (s) => `
  <span class="back">← Back to championships settings</span>
  ${s.problems.length ? `<div class="problems" style="margin-top:12px"><b>1 problem</b><span>${s.problems[0][0]}: ${s.problems[0][1]}.</span></div>` : ''}
  <div class="c-shell" style="margin-top:12px">
    <aside class="c-side">
      <div class="card"><div style="height:6px;background:var(--${s.disc[1] === 'c-single' ? 'single' : 'sportscar'});border-radius:12px 12px 0 0"></div><div class="card-b">
        <div class="row"><span class="chip c-custom">Custom</span><span class="chip ${s.disc[1]}">${s.disc[0]}</span><span style="margin-left:auto" class="small muted">Editing</span></div>
        ${field('Name', input(s.name))}
        ${field('Description', `<textarea class="in" rows="4">${s.desc}</textarea>`)}
        <div class="fields" style="grid-template-columns:1fr 1fr">${field('Entry fee', input(money(s.fee, s.cur), 'num'))}${field('Season', select(s.length))}</div>
        <div class="toggle-row" style="padding:0"><span>Generated weather</span><span class="sw on"></span></div>
        ${seg(['arid', 'mediterranean', 'temperate', 'oceanic'], s.climate, true)}
        <div class="fields" style="grid-template-columns:1fr 1fr">${field('AI strength', stepper(s.ai[0]))}${field('Aggression', stepper(s.ai[1]))}</div>
        <button class="btn" style="text-align:left">Regulations - 5 assists, penalties on ›</button>
      </div></div>
    </aside>
    <div>
      <div class="blk-h" style="margin-top:0"><h3>Calendar</h3><span class="small muted">${s.rounds.length} rounds · click a round to edit it</span></div>
      ${calendar(s, true)}
      <div class="blk-h"><h3>Classes</h3><span class="small muted">${s.classes.length} ${s.classes.length === 1 ? 'class' : 'classes'}, ${seatCount(s)} seats</span></div>
      <div class="stack" style="gap:12px">${s.classes.map((c, i) => classRow(s, c, i)).join('')}<button class="add">+ Add a class</button></div>
      <div class="blk-h"><h3>Teams</h3></div>${teamTiles(s)}
      <div class="blk-h"><h3>Weekend formats</h3></div>${formats(s)}
      <div class="blk-h"><h3>Points and prize money</h3></div>${scoring(s)}
      <div class="savebar"><span>2 unsaved changes</span><button class="btn">Discard</button><button class="btn primary">Save</button></div>
    </div>
  </div>${drawer(s)}`;

const WHY = {
  A: '<b>One long page, but navigable.</b> Everything stays on one scroll, as today, with a sticky rail on the left that jumps to a section, shows its count, and marks sections you changed (amber) or that have a problem (red). The sections themselves are rebuilt denser: overview and rules become two- and three-pane cards instead of a sparse two-column form; teams become tiles; each class is a row in the detail page\'s shape - identity, cars, seats - with the seat list capped and the same footer strip; the calendar becomes a table with the weekend strip, and points and prize money become one editable grid shaped like the read page\'s.',
  B: '<b>A workspace, one subject at a time.</b> Tabs split the championship into Overview, Teams, Classes, Calendar, Weekends and Points & money, each with its count and the same changed/problem dots. Classes is master-detail: pick a class on the left, then edit its cars, seats, performance or prize money on the right. Seats become a spreadsheet grouped by team, typed into directly rather than opened one row at a time. Nothing scrolls very far, at the cost of not seeing it all at once.',
  C: '<b>The read page, made editable.</b> The editor looks like the championship page you just approved - the sidebar, the rounds table, the class rows, the prize cards - so reading and editing are the same picture. The sidebar holds the plain fields directly; anything in a list (a round, a seat, a team, a session) opens in a drawer from the right, shown here on a round. Save sits in a floating bar that appears only while something is unsaved.',
};

const render = () => {
  const s = $(SET);
  document.querySelectorAll('[data-opt]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.opt === OPT));
  document.querySelectorAll('[data-set]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.set === SET));
  document.getElementById('why').innerHTML = WHY[OPT];
  document.getElementById('screen').innerHTML = { A: optA, B: optB, C: optC }[OPT](s);
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-opt],[data-set],[data-tab],[data-sub],[data-pick],[data-open],[data-close]');
  if (!t) return;
  if (t.dataset.opt) { OPT = t.dataset.opt; DRAWER = 'round'; }
  if (t.dataset.set) { SET = t.dataset.set; PICK = 0; }
  if (t.dataset.tab) TAB = t.dataset.tab;
  if (t.dataset.sub) SUB = t.dataset.sub;
  if (t.dataset.pick) PICK = Number(t.dataset.pick);
  if (t.dataset.open) { if (OPEN.has(t.dataset.open)) OPEN.delete(t.dataset.open); else OPEN.add(t.dataset.open); }
  if ('close' in t.dataset) DRAWER = null;
  render();
});
const root = document.documentElement;
const params = new URLSearchParams(location.search);
if (params.get('opt')) OPT = params.get('opt');
if (params.get('set')) SET = params.get('set');
if (params.get('tab')) TAB = params.get('tab');
if (params.get('sub')) SUB = params.get('sub');
if (params.get('drawer') === '0') DRAWER = null;
if (params.get('theme')) root.dataset.theme = params.get('theme');
else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
const themeBtn = document.getElementById('theme');
const syncTheme = () => { themeBtn.textContent = root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; };
themeBtn.addEventListener('click', () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; syncTheme(); });
syncTheme();
render();
</script>
</body>
</html>
