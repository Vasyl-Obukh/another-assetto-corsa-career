<html lang="en">
<head>

<title>Championship library table - mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css. Nothing new: every chip on
   the table already has a family on the cards. */
:root {

  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --destructive: oklch(0.58 0.22 27); --destructive-fg: oklch(0.985 0.005 60);
  --warning: oklch(0.79 0.15 80); --warning-fg: oklch(0.28 0.06 70);
  --s-practice: oklch(0.93 0.045 250); --s-practice-fg: oklch(0.4 0.13 258);
  --s-qualify: oklch(0.93 0.05 310); --s-qualify-fg: oklch(0.4 0.15 310);
  --s-race: oklch(0.89 0.085 150); --s-race-fg: oklch(0.33 0.1 152);
  --d-single: oklch(0.925 0.06 212); --d-single-fg: oklch(0.36 0.11 215); --d-single-dot: oklch(0.62 0.13 215);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118); --d-sports-dot: oklch(0.65 0.13 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178); --d-touring-dot: oklch(0.62 0.1 178);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270); --d-road-dot: oklch(0.6 0.13 270);
  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88); --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255); --t3-fg: oklch(0.42 0.015 260);
  --t4: oklch(0.89 0.07 52); --t4-fg: oklch(0.41 0.09 48);
  --t5: oklch(0.875 0.022 250); --t5-fg: oklch(0.36 0.035 255);
  --p-base: oklch(0.93 0.05 155); --p-base-fg: oklch(0.34 0.09 155);
  --p-dlc: oklch(0.93 0.06 75); --p-dlc-fg: oklch(0.38 0.1 62);

  --origin-custom: oklch(0.93 0.05 340); --origin-custom-fg: oklch(0.38 0.12 340);
  --sk: oklch(0.925 0.018 255); --sk-hi: oklch(0.965 0.01 255);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --destructive: oklch(0.66 0.2 25); --destructive-fg: oklch(0.16 0.02 30);
  --warning: oklch(0.8 0.14 82); --warning-fg: oklch(0.2 0.04 70);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --d-single: oklch(0.32 0.07 212); --d-single-fg: oklch(0.86 0.09 212); --d-single-dot: oklch(0.68 0.12 212);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112); --d-sports-dot: oklch(0.7 0.13 115);
  --d-touring: oklch(0.32 0.06 175); --d-touring-fg: oklch(0.86 0.08 175); --d-touring-dot: oklch(0.68 0.1 178);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270); --d-road-dot: oklch(0.68 0.12 270);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88); --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --t4: oklch(0.33 0.06 50); --t4-fg: oklch(0.85 0.09 55);
  --t5: oklch(0.315 0.028 250); --t5-fg: oklch(0.82 0.035 255);
  --p-base: oklch(0.32 0.06 155); --p-base-fg: oklch(0.86 0.11 155);
  --p-dlc: oklch(0.33 0.06 70); --p-dlc-fg: oklch(0.87 0.11 80);
  --p-mod: oklch(0.33 0.07 295); --p-mod-fg: oklch(0.86 0.1 295);
  --p-dist: oklch(0.33 0.07 245); --p-dist-fg: oklch(0.86 0.09 240);
  --origin-modified: oklch(0.32 0.06 195); --origin-modified-fg: oklch(0.86 0.09 200);
  --origin-custom: oklch(0.33 0.07 340); --origin-custom-fg: oklch(0.86 0.1 340);
  --sk: oklch(0.3 0.016 265); --sk-hi: oklch(0.345 0.016 265);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- App frame ---------- */
.frame { margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
.stabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.stabs span { padding: 9px 14px; font-size: 13.5px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.stabs span.on { color: var(--foreground); font-weight: 600; border-bottom-color: var(--primary); }

/* ---------- Atoms ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.c-single { background: var(--d-single); color: var(--d-single-fg); }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.c-road { background: var(--d-road); color: var(--d-road-fg); }
.c-t1 { background: var(--t1); color: var(--t1-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-t3 { background: var(--t3); color: var(--t3-fg); }
.c-t4 { background: var(--t4); color: var(--t4-fg); }
.c-t5 { background: var(--t5); color: var(--t5-fg); }
.c-base { background: var(--p-base); color: var(--p-base-fg); }
.c-dlc { background: var(--p-dlc); color: var(--p-dlc-fg); }
.c-mod { background: var(--p-mod); color: var(--p-mod-fg); }
.c-dist { background: var(--p-dist); color: var(--p-dist-fg); }
.c-modified { background: var(--origin-modified); color: var(--origin-modified-fg); }
.c-custom { background: var(--origin-custom); color: var(--origin-custom-fg); }
.c-unavail { background: var(--destructive); color: var(--destructive-fg); }
.c-misconf { background: var(--warning); color: var(--warning-fg); }
.c-p { background: var(--s-practice); color: var(--s-practice-fg); }
.c-q { background: var(--s-qualify); color: var(--s-qualify-fg); }
.c-r { background: var(--s-race); color: var(--s-race-fg); }
.medal { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--card); }
.medals { display: inline-flex; }
.medals .medal + .medal { margin-left: -4px; }
.fstrip { display: inline-flex; gap: 2px; }
.fstrip span { display: grid; place-items: center; height: 20px; min-width: 20px; padding: 0 4px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.ticks { display: flex; gap: 2px; width: 100%; max-width: 120px; }
.ticks span { height: 6px; flex: 1; border-radius: 99px; background: color-mix(in oklch, var(--s-race-fg) 60%, transparent); }
.ticks span.miss { background: color-mix(in oklch, var(--muted-foreground) 25%, transparent); }
.gswitch { display: inline-block; flex: none; width: 32px; height: 18px; border-radius: 99px; background: color-mix(in oklch, var(--muted-foreground) 35%, transparent); position: relative; vertical-align: middle; }
.gswitch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
.gswitch.on { background: var(--success); }
.gswitch.on::after { left: 16px; }
.dimmed { opacity: .5; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted-foreground); }
.btn.icon { width: 28px; height: 28px; padding: 0; }
.sk { display: block; background: var(--sk); border-radius: 6px; flex: none;
  background-image: linear-gradient(100deg, transparent 0 40%, var(--sk-hi) 50%, transparent 60% 100%);
  background-size: 200vw 100%; background-attachment: fixed; animation: sweep 1.8s linear infinite; }
.sk.round { border-radius: 99px; }
@keyframes sweep { from { background-position: 100vw 0; } to { background-position: -100vw 0; } }

/* ---------- Browser layout: FilterRail and toolbar ---------- */
.browser { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 16px; align-items: start; }
.frail { border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; }
.frail .fh { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.frail .fh h2 { margin: 0; font-size: 14px; font-weight: 600; }
.frail section { border-bottom: 1px solid var(--border); }
.frail section:last-child { border-bottom: 0; }
.frail .sh2 { padding: 10px 16px 4px; font-size: 12px; font-weight: 600; }
.frail .sb { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 1px; }
.frail .ro { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 5px; font-size: 13px; }
.frail .ro .box { width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 4px; flex: none; }
.frail .ro .n { margin-left: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.frail .ro .medal { width: 18px; height: 18px; font-size: 10px; box-shadow: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.sfield { flex: 1; min-width: 200px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 0 10px; display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13.5px; }
.vt { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.vt span { width: 34px; height: 32px; display: grid; place-items: center; color: var(--muted-foreground); }
.vt span.on { background: var(--accent); color: var(--foreground); }
.vsep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.count { font-size: 12.5px; color: var(--muted-foreground); margin: 0 0 12px; }
.new-outline { outline: 2px dashed color-mix(in oklch, var(--primary) 55%, transparent); outline-offset: 2px; border-radius: 9px; }

/* ---------- Cards (as today, for the toggle) ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); gap: 16px; }
.scard { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); background: var(--card); border-radius: 12px; }
.sband { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; font-size: 12px; font-weight: 600; }
.sband .end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sbody { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 12px; flex: 1; }
.stitle { display: flex; align-items: flex-start; gap: 12px; }
.stitle b { flex: 1; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.sdesc { margin: 0; font-size: 13px; color: var(--muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sfoot { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding: 10px 16px; font-size: 12px; color: var(--muted-foreground); }
.sfoot .r { display: flex; justify-content: space-between; align-items: center; }
.sfoot .ticks { max-width: none; }

/* ---------- The table ---------- */
.tbl-wrap { container-type: inline-size; border: 1px solid var(--border); border-radius: 12px; background: var(--card); overflow: hidden; }
table.lib { width: 100%; border-collapse: collapse; font-size: 13px; }
.lib thead { background: color-mix(in oklch, var(--muted) 40%, transparent); border-bottom: 1px solid var(--border); }
.lib th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); white-space: nowrap; }
.lib th.sort { cursor: pointer; }
.lib th.sort span { display: inline-flex; align-items: center; gap: 4px; }
.lib th.sort.on { color: var(--foreground); }
.lib th.sort svg { width: 12px; height: 12px; }
.lib th.r, .lib td.r { text-align: right; }
.lib tbody tr.row { border-top: 1px solid var(--border); }
.lib tbody tr.row:first-child { border-top: 0; }
.lib tbody tr.row:hover { background: color-mix(in oklch, var(--accent) 40%, transparent); }
.lib td { padding: 9px 10px; vertical-align: middle; }
.lib td.sw { width: 52px; padding-left: 14px; }
.lib td.menu { width: 44px; }
.name b { font-weight: 600; display: block; line-height: 1.3; }
.name b:hover { text-decoration: underline; }
.name small { display: block; max-width: 34ch; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ladder { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.season { display: flex; flex-direction: column; gap: 5px; min-width: 96px; }
.season .top { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
.season .top small { font-size: 11.5px; color: var(--muted-foreground); }
.state { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tip-host { position: relative; display: inline-flex; }
.tip-host > .chip { cursor: help; }
.tip { display: none; position: absolute; z-index: 6; right: 0; top: calc(100% + 6px); width: 340px; background: var(--foreground); color: var(--background); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 10px 30px oklch(0 0 0 / .18); flex-direction: column; gap: 8px; text-align: left; white-space: normal; }
.tip::before { content: ''; position: absolute; right: 24px; top: -5px; width: 10px; height: 10px; background: var(--foreground); transform: rotate(45deg); }
.tip-host:hover .tip, .tip.pinned { display: flex; }
.tip h4 { margin: 0; font-size: 12px; font-weight: 600; }
.tip ul { margin: 0; padding-left: 16px; }
.tip .k { opacity: .65; display: inline-block; width: 46px; }
.tip code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
.tip .foot { opacity: .65; }
.ctx { position: absolute; z-index: 5; right: 12px; top: 30px; width: 190px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px oklch(0 0 0 / .14); padding: 4px; display: flex; flex-direction: column; font-size: 13px; text-align: left; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--foreground); }
.ctx span { padding: 6px 8px; border-radius: 5px; display: flex; gap: 8px; align-items: center; }
.ctx span:first-child { background: var(--accent); }
.ctx span.del { color: var(--destructive); }
.ctx hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; width: 100%; }

/* Columns give way to the table's own width rather than the window's, as the
   historic events table does. */
@container (max-width: 68rem) { .c-classes { display: none; } .name small { max-width: 24ch; } }
@container (max-width: 60rem) { .c-format { display: none; } }
@container (max-width: 52rem) { .c-needs { display: none; } .name small { display: none; } }
</style>
</head>

  power: '<svg class="i" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>',
};
const DISC = { single: 'Single-seater', sports: 'Sportscar', touring: 'Touring', road: 'Road' };
const SRC = { base: 'Base', dlc: 'DLC', mod: 'Mod', dist: 'LFM' };
const RUNS = { 1: '', 2: 'twice a year', 4: '4 times a year' };

// d: disciplines, cls: [class, tier], rounds/miss: ticks, f: format,
// needs / rounds-need / widened: source chips, origin, avail, on, locked.
const L = [
  { id: 'adac', name: 'ADAC GT Masters', desc: 'Germany\'s GT3 sprint series - two one-hour races a weekend, two drivers a car.', d: ['sports'], cls: [['GT3', 2]], rounds: 7, miss: [], runs: 1, f: 'PQRR', cars: 30, teams: 15, needs: ['dlc', 'mod'], on: true },
  { id: 'f1-1967', name: 'Formula 1 1967', desc: 'The season of the Lotus 49\'s debut, with the real entry list and seven of its grands prix at their real distances.', d: ['single'], cls: [['F1 1967', 1]], rounds: 7, miss: [], runs: 1, f: 'PQR', cars: 18, teams: 12, needs: ['base', 'mod', 'dist'], roundsNeed: ['dlc'], widened: ['dlc'], on: false },
  { id: 'mx5', name: 'MX-5 Cup', desc: 'Identical roadsters, short races and a full grid. Where a road career starts.', d: ['road'], cls: [['MX-5 Cup', 5]], rounds: 6, miss: [], runs: 4, f: 'PQRR', cars: 20, teams: 10, needs: ['base'], on: true },
  { id: 'mx5-plus', name: 'MX-5 Cup +', desc: 'The MX-5 Cup again, with longer races, filling the rung above it.', d: ['road'], cls: [['MX-5 Cup', 4]], rounds: 6, miss: [], runs: 4, f: 'PQR', cars: 20, teams: 10, needs: ['base'], on: true },
  { id: 'gt4', name: 'GT4 European Series', desc: 'Pro-Am GT4 across Europe\'s classic circuits.', d: ['sports'], cls: [['GT4', 3]], rounds: 6, miss: [], runs: 1, f: 'PQRR', cars: 36, teams: 18, needs: ['dlc', 'mod'], origin: 'modified', on: true },
  { id: 'wec-2024-lfm', name: 'WEC 2024 (LFM)', desc: 'The world endurance championship with the LFM grid: Hypercars and LMGT3 on the same track.', d: ['sports'], cls: [['Hypercar', 1], ['LMGT3', 2]], rounds: 8, miss: [3, 6], runs: 1, f: 'PQR', cars: 37, teams: 19, needs: ['mod', 'dist'], roundsNeed: ['mod'], avail: 'unavail', on: true,
    missing: { cars: ['lfm_peugeot_9x8_2024', 'lfm_lamborghini_sc63'], tracks: ['rt_lusail', 'fn_cota'] } },
  { id: 'dtm-2021', name: 'DTM 2021', desc: 'The first GT3 season of the DTM.', d: ['touring'], cls: [['DTM GT3', 1]], rounds: 8, miss: [], runs: 1, f: 'PQRR', cars: 20, teams: 10, needs: ['mod'], on: true, locked: true },
  { id: 'tcr', name: 'TCR Europe', desc: 'Front-wheel-drive touring cars under balance of performance.', d: ['touring'], cls: [['TCR', 3]], rounds: 7, miss: [], runs: 1, f: 'PQRR', cars: 24, teams: 12, needs: ['mod'], on: true },
  { id: 'cup-2023', name: 'Porsche Supercup 2023', desc: 'The one-make support series of the Formula 1 weekend.', d: ['sports'], cls: [['992 GT3 Cup', 3]], rounds: 8, miss: [], runs: 1, f: 'PQR', cars: 28, teams: 14, needs: ['dlc'], on: true },
  { id: 'lotus', name: 'Lotus Cup at home', desc: 'Exiges at the tracks I race on.', d: ['road'], cls: [['Exige', 4]], rounds: 5, miss: [], runs: 2, f: 'PR', cars: 12, teams: 6, needs: ['base'], origin: 'custom', avail: 'misconf', on: true,
    problems: ['Round 3 runs format "Sprint", which the championship does not define.', 'Class "Exige" has 12 seats but only 10 pit boxes at magione.'] },
  { id: 'fabarth', name: 'Formula Abarth', desc: 'Junior single-seaters - the bottom rung of the single-seater ladder.', d: ['single'], cls: [['Formula Abarth', 5]], rounds: 6, miss: [], runs: 2, f: 'PQRR', cars: 14, teams: 7, needs: ['base'], on: true },
  { id: 'imsa', name: 'IMSA 2025', desc: 'Four classes on one grid, from GTP prototypes to GTD.', d: ['sports'], cls: [['GTP', 1], ['LMP2', 2], ['GTD Pro', 2], ['GTD', 3]], rounds: 11, miss: [9], runs: 1, f: 'PQR', cars: 50, teams: 25, needs: ['mod', 'dist'], roundsNeed: ['mod'], on: true },
  { id: 'group-a', name: 'Group A 1987', desc: 'The World Touring Car Championship\'s only season.', d: ['touring'], cls: [['Group A', 2]], rounds: 9, miss: [], runs: 1, f: 'PQR', cars: 24, teams: 12, needs: ['dlc', 'mod'], on: false },
  { id: 'sf-2023', name: 'Super Formula 2023', desc: 'Japan\'s top single-seater series.', d: ['single'], cls: [['SF23', 2]], rounds: 7, miss: [], runs: 1, f: 'PQR', cars: 22, teams: 11, needs: ['mod'], on: true },
];

const chip = (cls, text) => `<span class="chip ${cls}">${text}</span>`;
const medal = (t) => `<span class="medal c-t${t}">${t}</span>`;
const sk = (w, h, cls = '') => `<span class="sk ${cls}" style="width:${typeof w === 'number' ? `${w}px` : w};height:${h}px"></span>`;
const fstrip = (f) => `<span class="fstrip">${[...f].map((s) => `<span class="c-${s.toLowerCase()}">${s}</span>`).join('')}</span>`;
const ticks = (e) => `<div class="ticks" title="${e.rounds} rounds">${Array.from({ length: e.rounds }, (_, i) => `<span class="${e.miss.includes(i) ? 'miss' : ''}"></span>`).join('')}</div>`;
const tiersOf = (e) => [...new Set(e.cls.map(([, t]) => t))].sort();
const srcChips = (list) => (list || []).map((s) => chip(`c-${s}`, SRC[s])).join('');
const originChip = (o) => (o === 'modified' ? chip('c-modified', 'Modified') : o === 'custom' ? chip('c-custom', 'Your own') : '');
const availChip = (a) => (a === 'unavail' ? chip('c-unavail', 'Unavailable') : a === 'misconf' ? chip('c-misconf', `${I.alert}Misconfigured`) : '');
const lockChip = (e) => (e.locked ? chip('c-misconf', 'In your career') : '');

const menu = () => `<div class="ctx">
  <span>${I.open}Open</span><span>${I.pencil}Edit</span><span>${I.copy}Duplicate</span><span>${I.dl}Export</span>
  <hr><span>${I.power}Switch off</span><hr><span class="del">${I.trash}Delete</span></div>`;

// ---------- Cards, as the tab is today ----------
const card = (e) => {
  const dim = e.on ? '' : 'dimmed';
  const lead = e.d[0];
  return `<div class="scard">
    <div class="sband c-${lead}"><span class="${dim}">${DISC[lead]}</span><span class="end"><span class="medals ${dim}">${tiersOf(e).map(medal).join('')}</span><button class="btn ghost icon">${I.dots}</button></span></div>
    <div class="sbody">
      <div class="stitle"><b class="${dim}">${e.name}</b><span class="gswitch ${e.on ? 'on' : ''}"></span></div>
      <div class="${dim}" style="display:flex;flex-direction:column;gap:10px">
        <p class="sdesc">${e.desc}</p>
        ${e.cls.length > 1 ? `<div class="chips">${e.cls.map(([c, t]) => chip(`c-t${t}`, c)).join('')}</div>` : ''}
        ${e.origin || e.avail || e.locked ? `<div class="chips">${originChip(e.origin)}${availChip(e.avail)}${lockChip(e)}</div>` : ''}
        <div class="chips muted" style="font-size:12px">Needs ${srcChips(e.needs)}${e.roundsNeed ? `<span style="margin-left:6px">Some rounds need</span>${srcChips(e.roundsNeed)}` : ''}</div>
      </div>
    </div>
    <div class="sfoot ${dim}"><div class="r"><span class="num">${e.rounds} rounds</span>${fstrip(e.f)}</div>${ticks(e)}</div>
  </div>`;
};
const cardSkeleton = (i) => {
  const d = ['single', 'sports', 'touring', 'road'][i % 4];
  return `<div class="scard"><div class="sband c-${d}"><span>${DISC[d]}</span></div>
    <div class="sbody">${sk('70%', 18)}${sk('100%', 32)}${sk(140, 18)}</div>
    <div class="sfoot"><div class="r">${sk(56, 12)}${sk(66, 20)}</div>${sk('100%', 6, 'round')}</div></div>`;
};

// ---------- The table ----------
const head = () => `<thead><tr>
  <th aria-hidden="true"></th>
  <th class="sort ${state.load === 'loaded' ? 'on' : ''}"><span>Championship ${I.up}</span></th>
  <th class="sort"><span>Ladder</span></th>
  <th class="c-classes">Classes</th>
  <th>Season</th>
  <th class="c-format">Format</th>
  <th class="r">Grid</th>
  <th class="c-needs">Needs</th>
  <th aria-hidden="true"></th>
  <th aria-hidden="true"></th>
</tr></thead>`;

// What is wrong, in a tooltip on the availability chip: what is not
// installed, or the problems, and what the championship needs.
const tip = (e) => {
  const pinned = state.tip === 'on' && e.id === 'wec-2024-lfm' ? 'pinned' : '';
  const body = e.missing
    ? `<h4>Not installed</h4>
       <div><span class="k">Cars</span><code>${e.missing.cars.join(', ')}</code></div>
       <div><span class="k">Tracks</span><code>${e.missing.tracks.join(', ')}</code></div>
       <span class="foot">Not on the Championships page until its cars are installed. Rounds at a missing track are skipped.</span>`
    : `<h4>${e.problems.length} problems</h4><ul>${e.problems.map((p) => `<li>${p}</li>`).join('')}</ul>
       <span class="foot">Open it in the editor to fix them.</span>`;
  return `<span class="tip ${pinned}">${body}</span>`;
};
const row = (e, at) => {
  const dim = e.on ? '' : 'dimmed';
  const avail = e.avail ? `<span class="tip-host">${availChip(e.avail)}${tip(e)}</span>` : '';
  return `<tr class="row">
    <td class="sw"><span class="gswitch ${e.on ? 'on' : ''}"></span></td>
    <td class="name ${dim}"><b>${e.name}</b><small>${e.desc}</small></td>
    <td class="${dim}"><div class="ladder">${e.d.map((d) => chip(`c-${d}`, DISC[d])).join('')}<span class="medals">${tiersOf(e).map(medal).join('')}</span></div></td>
    <td class="c-classes ${dim}"><div class="chips">${e.cls.map(([c, t]) => chip(`c-t${t}`, c)).join('')}</div></td>
    <td class="${dim}"><div class="season"><div class="top"><span class="num">${e.rounds} rounds</span>${RUNS[e.runs] ? `<small>${RUNS[e.runs]}</small>` : ''}</div>${ticks(e)}</div></td>
    <td class="c-format ${dim}">${fstrip(e.f)}</td>
    <td class="r num ${dim}" style="white-space:nowrap">${e.cars}<small class="muted"> · ${e.teams} teams</small></td>
    <td class="c-needs ${dim}"><div class="chips">${srcChips(e.needs)}${e.roundsNeed ? `<span class="muted" style="font-size:11.5px;margin-left:2px">+ rounds</span>` : ''}</div></td>
    <td><div class="state">${originChip(e.origin)}${avail}${lockChip(e)}</div></td>
    <td class="menu" style="position:relative"><button class="btn ghost icon">${I.dots}</button>${state.menu === 'on' && at === 0 ? menu() : ''}</td>
  </tr>`;
};
const rowSkeleton = () => `<tr class="row">
  <td class="sw">${sk(32, 18, 'round')}</td>
  <td class="name">${sk(170, 14)}<span style="height:5px;display:block"></span>${sk(230, 10)}</td>
  <td><div class="ladder">${sk(90, 20)}${sk(22, 22, 'round')}</div></td>
  <td class="c-classes">${sk(70, 20)}</td>
  <td><div class="season">${sk(64, 12)}${sk(110, 6, 'round')}</div></td>
  <td class="c-format">${sk(66, 20)}</td>
  <td class="r">${sk(64, 12)}</td>
  <td class="c-needs">${sk(76, 20)}</td>
  <td></td><td class="menu"></td>
</tr>`;

// ---------- The tab ----------
const ro = (label, n, extra = '') => `<div class="ro"><span class="box"></span>${extra}${label}<span class="n">${state.load === 'loading' ? sk(14, 9) : n}</span></div>`;
const rail = () => `<aside class="frail">
  <div class="fh"><h2>Filters</h2></div>
  <section><div class="sh2">Discipline</div><div class="sb">
    ${ro('Single-seater', 52, '<span class="dot" style="background:var(--d-single-dot)"></span>')}
    ${ro('Sportscar', 46, '<span class="dot" style="background:var(--d-sports-dot)"></span>')}
    ${ro('Touring', 18, '<span class="dot" style="background:var(--d-touring-dot)"></span>')}
    ${ro('Road', 16, '<span class="dot" style="background:var(--d-road-dot)"></span>')}</div></section>
  <section><div class="sh2">Tier</div><div class="sb">${[1, 2, 3, 4, 5].map((t, i) => ro(`Tier ${t}`, [41, 38, 27, 18, 9][i], medal(t))).join('')}</div></section>
  <section><div class="sh2">Whose</div><div class="sb">${ro('Ours', 129)}${ro('Modified', 2, '')}${ro('Your own', 3)}</div></section>
  <section><div class="sh2">Switched</div><div class="sb">${ro('On', 96)}${ro('Off', 38)}</div></section>
  <section><div class="sh2">Availability</div><div class="sb">${ro('Available', 118)}${ro('Unavailable', 15)}${ro('Misconfigured', 1)}</div></section>
</aside>`;

const tab = () => {
  const loading = state.load === 'loading';
  const toolbar = `<div class="toolbar">
    <div class="sfield">${I.search}Search championships, classes and cars</div>
    <span class="btn" style="gap:6px">${I.sort}Name</span>
    <span class="vsep"></span>
    <button class="btn">${I.plus}New</button>
    <button class="btn">${I.upload}Import</button>
    <span class="vt new-outline"><span class="${state.view === 'cards' ? 'on' : ''}">${I.grid}</span><span class="${state.view === 'table' ? 'on' : ''}">${I.list}</span></span>
  </div>
  <p class="count">${loading ? sk(140, 12) : 'Showing 134 of 134 championships'}</p>`;
  const list = state.view === 'cards'
    ? `<div class="cgrid">${loading ? Array.from({ length: 6 }, (_, i) => cardSkeleton(i)).join('') : L.map(card).join('')}</div>`
    : `<div class="tbl-wrap"><table class="lib">${head()}<tbody>${loading ? Array.from({ length: 10 }, rowSkeleton).join('') : L.map(row).join('')}</tbody></table></div>`;
  return `<nav class="app-nav"><span class="brand">Another Assetto Corsa Career</span><span>Home</span><span>Race</span><span>Calendar</span><span>Championships</span><span>Cars</span><span>Tracks</span><span class="on">Settings</span></nav>
    <h1>Settings</h1>
    <div class="stabs"><span>General</span><span>Diagnostics</span><span>Your content</span><span>Car classes</span><span>Content sources</span><span class="on">Championships</span><span>Historic events</span></div>
    <div class="browser">${rail()}<div>${toolbar}${list}</div></div>`;
};

// ---------- Chrome ----------
const OPTS = [
  ['view', 'View', [['cards', 'Cards'], ['table', 'Table']]],
  ['width', 'Window', [['wide', 'Wide'], ['mid', 'Medium'], ['narrow', 'Narrow']]],
  ['load', 'State', [['loaded', 'Loaded'], ['loading', 'Loading']]],
  ['menu', 'Row menu', [['off', 'Closed'], ['on', 'Open']]],
  ['tip', 'WEC tooltip', [['off', 'On hover'], ['on', 'Pinned']]],
  ['theme', 'Theme', [['light', 'Light'], ['dark', 'Dark']]],
];
const WIDTH = { wide: 1600, mid: 1240, narrow: 1040 };
const render = () => {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('picker').innerHTML = OPTS.map(([k, label, vals]) => `<div class="grp"><strong>${label}</strong>${vals.map(([v, l]) => `<button class="opt" data-k="${k}" data-v="${v}" aria-pressed="${state[k] === v}">${l}</button>`).join('')}</div>`).join('');
  const frame = document.getElementById('frame');
  frame.style.maxWidth = `${WIDTH[state.width]}px`;
  document.getElementById('why').style.maxWidth = `${WIDTH[state.width]}px`;
  frame.innerHTML = tab();
};
document.getElementById('why').innerHTML = `<b>Settings › Championships, cards or a table.</b> The view toggle (dashed) is the car and track browsers' <code>ViewToggle</code>, remembered like theirs, and the rail, search, sort, New and Import stay as they are. The table is the historic events table grown to what a championship carries:
<ul>
  <li><b>Columns.</b> The switch first, then name and a one-line description, then Ladder (discipline and tier medals), Classes (tier-coloured), Season (rounds, editions a year and the round ticks), Format, Grid, Needs, state and the menu. As the table narrows, Classes goes first, then Format, then Needs and the description. Set <i>Window</i> to see it.</li>
  <li><b>Sorting.</b> The Championship and Ladder headings sort, the same two orders the sort menu has, and both stay in step. No new orders.</li>
  <li><b>What is wrong, on hover.</b> On an Unavailable or Misconfigured row, hovering the chip opens a tooltip: what isn't installed, or the list of problems. WEC 2024 (LFM) shows it pinned open; set <i>WEC tooltip</i> to <i>On hover</i> to hover any of them. The row stays one line high.</li>
  <li><b>Same chips as the cards.</b> Modified and Your own, Unavailable and Misconfigured, In your career, the P/Q/R blocks and the source chips. Nothing new in <code>globals.css</code>. A switched-off row dims everything except its switch.</li>
  <li><b>The menu.</b> The vertical ⋮, as everywhere else, and a right-click on the row open the card's own menu.</li>
</ul>`;
document.addEventListener('click', (ev) => {
  const opt = ev.target.closest('.opt');
  if (opt) { state[opt.dataset.k] = opt.dataset.v; render(); return; }
  const vt = ev.target.closest('.vt span');
  if (vt) { state.view = vt.parentElement.firstElementChild === vt ? 'cards' : 'table'; render(); }
});
// A hash such as #width=narrow&theme=dark opens the mockup on that state.
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in state) state[k] = v; });
render();
</script>
</body>
</html>
