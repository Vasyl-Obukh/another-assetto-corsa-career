const payCell = (o) => ({
  salary: [`${money(o.pay.amount)} a season${o.pay.was ? `<span class="was">${money(o.pay.was)}</span>` : ''}`, o.pay.was ? '<span class="pos">+10%</span> for your P3 in 2028' : `${money(o.pay.amount / GT4.rounds)} as each round finishes`],
  free: ['A free seat', 'Nobody pays anyone for it'],
  seat: [`You pay ${money(o.pay.amount)}`, 'For the season, as you sign'],
})[o.pay.kind];
const feeCell = (o) => (o.cover === 1 ? ['Covered by the team', 'Every round'] : ['Half covered', `You pay ${money(GT4.fee / 2)} a round`]);
const shareCell = (o) => (o.share === 100 ? ['Every prize is yours', 'Race and championship purses'] : [`${o.share}% is yours`, `The team keeps ${100 - o.share}%`]);
const bonusCell = (o) => (o.bonus ? [o.bonus, 'On your final place in the class'] : ['None', '']);
const fineCell = (o) => (o.fine ? [`${money(o.fine)} fine`, o.pay.kind === 'salary' ? 'And no salary for it' : 'Its entry fee'] : ['No fine', 'A round missed is only yours to lose']);
const keepCell = (o) => [KEEP[o.b], o.b === 'priv' ? 'If you will pay again' : 'Judged as the next offers go out'];
const before = (o) => {
  if (o.pay.kind === 'salary') return o.pay.amount;
  if (o.pay.kind === 'seat') return -o.pay.amount;
  return -(1 - o.cover) * GT4.fee * GT4.rounds;
};
const amt = (n) => `<span class="${n >= 0 ? 'pos' : 'neg'}">${n > 0 ? '+' : n < 0 ? '-' : ''}${money(n)}</span>`;

// ---------- The compare table, with a renewal ----------
const compare = (offers, st = {}) => {
  const own = !st.acc;
  const cols = offers.length + (own ? 1 : 0);
  const cls = (o) => (st.acc ? (st.acc === o.id ? ' tint' : ' muted2') : (o.renewal ? ' ren' : ''));
  const cell = ([v, s], c = '') => `<div class="${c}"><b>${v}</b>${s ? `<small>${s}</small>` : ''}</div>`;
  const ownC = st.acc ? ' off' : '';
  const row = (label, cells, ownCell, isNew) => `<div class="k${isNew ? ' new-outline' : ''}">${label}</div>${cells.join('')}${own ? ownCell : ''}`;
  const heads = offers.map((o) => `<div class="head${cls(o)}">${img(o.car[1])}<span class="row" style="gap:4px;flex-wrap:wrap">${budget(o.b)}${o.renewal ? nb(chip('c-contract', `${I.renew}Your team`)) : ''}${st.acc === o.id ? chip('c-acc', 'Signed') : st.acc ? chip('c-dec', 'Declined') : ''}</span><span class="tn">${o.team}${flag(o.nation)}</span><span class="cn">${o.car[0]}</span></div>`);
  const ownHead = `<div class="head own"><span class="ownwell">${I.key}</span><span class="row" style="gap:4px">${chip('c-dec', 'No contract')}</span><span class="tn">On your own</span><span class="cn">In a team drawn for you · your car</span></div>`;
  const acts = offers.map((o) => {
    let btn;
    if (st.acc) btn = st.acc === o.id ? `<span class="signedtxt">${I.check}Signed on Tue 16 Jan</span>` : '<span class="muted" style="font-size:12.5px">Declined on Tue 16 Jan</span>';
    else if (o.renewal) btn = `<button class="btn pri new-outline">${I.renew}Renew</button>`;
    else if (o.pay.kind === 'seat') btn = `<button class="btn pri">${I.sign}Accept and pay ${money(o.pay.amount)}</button>`;
    else btn = `<button class="btn pri">${I.sign}Accept</button>`;
    return `<div class="act last${cls(o)}">${btn}</div>`;
  });
  const fees = GT4.fee * GT4.rounds;
  const rent = GT4.rent * GT4.rounds;
  return `<div class="cmp" style="grid-template-columns:128px repeat(${cols}, minmax(0, 1fr));max-width:${128 + cols * 245}px">
    <div class="k head"></div>${heads.join('')}${own ? ownHead : ''}
    ${row('Pay', offers.map((o) => cell(payCell(o), cls(o))), cell(['Nothing', 'You pay your own way'], `own${ownC}`))}
    ${row('Entry fees', offers.map((o) => cell(feeCell(o), cls(o))), cell(['Yours to pay', `${money(GT4.fee)} as each round launches`], `own${ownC}`))}
    ${row('Car', offers.map((o) => cell(["The team's", 'Nothing to rent or buy'], cls(o))), cell(['Yours', `Owned, or ${money(GT4.rent)} a round to rent`], `own${ownC}`))}
    ${row('Before prizes', offers.map((o) => cell([amt(before(o)), 'For the season'], cls(o))), cell([amt(-(fees + rent)), `${money(fees)} in fees, ${money(rent)} renting`], `own${ownC}`))}
    ${row('Prize money', offers.map((o) => cell(shareCell(o), cls(o))), cell(['Every prize is yours', ''], `own${ownC}`))}
    ${row('Standings bonus', offers.map((o) => cell(bonusCell(o), cls(o))), cell(['None', ''], `own${ownC}`))}
    ${row('To be kept on', offers.map((o) => cell(keepCell(o), cls(o))), cell(['-', 'Enter again, or not'], `own${ownC}`), true)}
    ${row('A missed round', offers.map((o) => cell(fineCell(o), cls(o))), cell(['No fine', ''], `own${ownC}`))}
    <div class="k last"></div>${acts.join('')}${own ? `<div class="act own last"><button class="btn">Enter on your own${I.chev}</button></div>` : ''}
  </div>`;
};

  home: () => '<b>A fifth door</b>, previewing what you hold and how each stands.',
};
const ENDED_NOTE = 'How a contract ended is a closed set, each on a hue the page already has: Completed the accepted green, Renewed the contract violet, Not kept on the declined slate, Terminated the fine\'s red. On course and Short of it are the success green and the warning amber. Fourth place and below stay unfilled, as everywhere.';
const QUESTIONS = {
  concept: ['Decisions 1-8 below.', 'Is anything missing from the market you had in mind - a team trying to buy you out of a contract, say, which I have left for later?'],
  inbox: ['Does the violet wash on your team\'s column read as "your team", or should it stay plain with only the chip?', 'Team news (decision 4): a mail kind now, or leave it to Phase 11?'],
  champ: ['Decision 7: a tab in the Enter panel, or a card under it?'],
  contracts: ['Decision 8: a Home door, a History tab, or the navigation?', ENDED_NOTE],
  home: ['Five doors across - or a different home for it?'],
};

const GROUPS = [
  { k: 'view', label: 'Screen', opts: [['concept', 'Concept'], ['inbox', 'Inbox'], ['champ', 'Championship page'], ['contracts', 'Contracts'], ['home', 'Home']] },
  { k: 'mail', label: 'Mail', for: ['inbox'], opts: [['renew', 'Renewal offered'], ['accRenew', 'Renewed'], ['notKept', 'Not kept on']] },
  { k: 'champ', label: 'Case', for: ['champ'], opts: [['one', 'On course'], ['short', 'Short of target'], ['renewed', 'Renewed'], ['buy', 'Buy a seat'], ['buyConfirm', 'Buy: confirm']] },
  { k: 'buyAt', label: 'Buy layout', for: ['champ'], when: () => S.champ.startsWith('buy'), opts: [['tabs', 'Tab'], ['card', 'Card']] },
  { k: 'buyTab', label: 'Tab', for: ['champ'], when: () => S.champ.startsWith('buy') && S.buyAt === 'tabs', opts: [['seat', "A team's seat"], ['own', 'Your car']] },
  { k: 'theme', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
];
const S = { view: 'concept', mail: 'renew', champ: 'one', buyAt: 'tabs', buyTab: 'seat', theme: 'light' };

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('picker').innerHTML = GROUPS.filter((g) => (!g.for || g.for.includes(S.view)) && (!g.when || g.when()))
    .map((g) => `<div class="grp"><strong>${g.label}</strong>${g.opts.map(([v, l]) => `<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${S[g.k] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('why').innerHTML = `<div class="box">${WHY[S.view]()}<div class="q"><b>To decide</b><ul>${QUESTIONS[S.view].map((q) => `<li>${q}</li>`).join('')}</ul></div></div>`;
  document.getElementById('stage').innerHTML = {
    concept, inbox, champ, contracts, home,
  }[S.view]();
};
document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  history.replaceState(null, '', `#${new URLSearchParams(S)}`);
  render();
});
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in S) S[k] = v; });
render();
</script>
</body>
</html>
