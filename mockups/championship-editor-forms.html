<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor forms</title>
<style>

/* Tokens copied from src/renderer/src/globals.css. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-foreground: oklch(0.985 0.005 155);
  --warning: oklch(0.79 0.15 80);
  --warning-foreground: oklch(0.28 0.06 70);
  --destructive: oklch(0.58 0.22 27);
  --destructive-foreground: oklch(0.985 0.005 60);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75);   --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295);  --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);
  --session-practice: oklch(0.93 0.045 250); --session-practice-fg: oklch(0.4 0.13 258);
  --session-qualify: oklch(0.93 0.05 310);   --session-qualify-fg: oklch(0.4 0.15 310);
  --session-race: oklch(0.89 0.085 150);     --session-race-fg: oklch(0.33 0.1 152);
  --gold: oklch(0.9 0.085 88);     --gold-fg: oklch(0.42 0.1 75);
  --silver: oklch(0.91 0.008 255); --silver-fg: oklch(0.42 0.015 260);
  --bronze: oklch(0.89 0.07 52);   --bronze-fg: oklch(0.41 0.09 48);
  --sportscar: oklch(0.925 0.06 112); --sportscar-fg: oklch(0.36 0.1 118);
  --t1: oklch(0.945 0.022 210); --t1-fg: oklch(0.4 0.05 215);
  --t2: oklch(0.9 0.085 88);    --t2-fg: oklch(0.42 0.1 75);
  --t3: oklch(0.91 0.008 255);  --t3-fg: oklch(0.42 0.015 260);
  --works: oklch(0.91 0.075 320); --works-fg: oklch(0.38 0.15 320);
  --independent: oklch(0.92 0.06 18); --independent-fg: oklch(0.42 0.13 22);
  --privateer: oklch(0.93 0.055 132); --privateer-fg: oklch(0.4 0.09 135);
  --temperate: oklch(0.925 0.03 150); --temperate-fg: oklch(0.4 0.05 150);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-foreground: oklch(0.17 0.03 158);
  --warning: oklch(0.8 0.14 82);
  --warning-foreground: oklch(0.2 0.04 70);
  --destructive: oklch(0.66 0.2 25);
  --destructive-foreground: oklch(0.16 0.02 30);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70);   --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295);  --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);
  --session-practice: oklch(0.32 0.06 250); --session-practice-fg: oklch(0.86 0.09 255);
  --session-qualify: oklch(0.33 0.07 310);  --session-qualify-fg: oklch(0.87 0.1 310);
  --session-race: oklch(0.35 0.09 150);     --session-race-fg: oklch(0.88 0.13 150);
  --gold: oklch(0.36 0.07 88);     --gold-fg: oklch(0.89 0.12 92);
  --silver: oklch(0.33 0.006 260); --silver-fg: oklch(0.86 0.008 260);
  --bronze: oklch(0.33 0.06 50);   --bronze-fg: oklch(0.85 0.09 55);
  --sportscar: oklch(0.32 0.07 112); --sportscar-fg: oklch(0.86 0.1 112);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88);   --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --works: oklch(0.34 0.085 320); --works-fg: oklch(0.87 0.11 320);
  --independent: oklch(0.33 0.07 18); --independent-fg: oklch(0.86 0.09 22);
  --privateer: oklch(0.32 0.06 132); --privateer-fg: oklch(0.86 0.08 135);
  --temperate: oklch(0.32 0.03 150); --temperate-fg: oklch(0.85 0.05 150);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.small { font-size: 12px; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }

/* Mockup chrome */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker strong { font-weight: 600; margin-right: 8px; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 5px 12px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .sep { width: 1px; align-self: stretch; background: color-mix(in oklch, var(--background) 30%, transparent); margin: 0 6px; }
.picker .spacer { flex: 1; }
.rationale { max-width: 84ch; margin: 20px auto 0; padding: 0 16px; color: var(--muted-foreground); font-size: 13.5px; }
.rationale b { color: var(--foreground); font-weight: 600; }
.window { max-width: 1440px; margin: 16px auto 48px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--background); box-shadow: 0 20px 50px -30px oklch(0.2 0.02 260 / 0.35); }
.app-header { display: flex; align-items: center; gap: 24px; padding: 14px 32px; border-bottom: 1px solid var(--border); }
.app-header h1 { font-size: 17px; font-weight: 600; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { padding: 5px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500; }
.nav a.on { background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary); }
.screen { padding: 20px 32px 40px; }
.back { color: var(--muted-foreground); font-size: 13px; margin-bottom: 14px; display: inline-block; }

/* Shared pieces */
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.chip.outline { border: 1px solid var(--border); padding: 3px 7px; }
.chip.filled { background: var(--primary); color: var(--primary-foreground); }
.c-sportscar { background: var(--sportscar); color: var(--sportscar-fg); }
.c-t1 { background: var(--t1); color: var(--t1-fg); }
.c-t2 { background: var(--t2); color: var(--t2-fg); }
.c-t3 { background: var(--t3); color: var(--t3-fg); }
.c-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.c-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.c-works { background: var(--works); color: var(--works-fg); }
.c-independent { background: var(--independent); color: var(--independent-fg); }
.c-privateer { background: var(--privateer); color: var(--privateer-fg); }
.c-temperate { background: var(--temperate); color: var(--temperate-fg); }
.c-success { background: var(--success); color: var(--success-foreground); }
.c-warning { background: var(--warning); color: var(--warning-foreground); }
.c-destructive { background: var(--destructive); color: var(--destructive-foreground); }
.p1 { background: var(--gold); color: var(--gold-fg); }
.p2 { background: var(--silver); color: var(--silver-fg); }
.p3 { background: var(--bronze); color: var(--bronze-fg); }
.fmt { display: inline-flex; gap: 2px; }
.fmt span { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.s-practice { background: var(--session-practice); color: var(--session-practice-fg); }
.s-qualify { background: var(--session-qualify); color: var(--session-qualify-fg); }
.s-race { background: var(--session-race); color: var(--session-race-fg); }
.medal { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.medal.sm { width: 24px; height: 24px; font-size: 12px; box-shadow: 0 0 0 2px var(--card); }
.medals { display: flex; }
.medals .medal + .medal { margin-left: -4px; }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 6px 12px; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.kebab { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; line-height: 1; color: inherit; }
.switch { width: 36px; height: 20px; border-radius: 10px; background: var(--success); position: relative; flex-shrink: 0; border: 0; }
.switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.card-h { padding: 14px 18px 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 600; }
.card-b { padding: 0 18px 16px; }
.map { width: 64px; height: 40px; border-radius: 6px; background: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
.map svg { width: 50px; height: 30px; }
.map path, .big-map path { fill: none; stroke: var(--foreground); stroke-width: 2.4; stroke-linejoin: round; opacity: .75; }
.shot { border-radius: 8px; overflow: hidden; background: var(--muted); display: flex; flex-direction: column; }
.shot .img { aspect-ratio: 16 / 9; display: grid; place-items: center; background: linear-gradient(180deg, color-mix(in oklch, var(--muted) 60%, var(--card)), var(--muted)); }
.shot .img svg { width: 62%; }
.shot .img path { fill: color-mix(in oklch, var(--foreground) 55%, transparent); }
.shot .cap { font-size: 11.5px; padding: 5px 7px; background: var(--card); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 8px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 6px 8px; font-weight: 400; }
th { color: var(--muted-foreground); font-size: 12px; }
tbody tr { border-top: 1px solid var(--border); }
.you { background: color-mix(in oklch, var(--primary) 8%, transparent); }
.cell-res { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 4px; border-radius: 5px; font-weight: 600; font-size: 12px; }
.r { text-align: right; }
details > summary { color: var(--primary); font-size: 13px; padding: 8px 0 0; list-style: none; }
details[open] > summary { margin-bottom: 8px; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.team { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; background: var(--card); }
.team .th { display: flex; align-items: center; gap: 8px; }
.team .th b { flex: 1; min-width: 0; font-size: 13.5px; }
.team .drv { display: flex; justify-content: space-between; font-size: 13px; }
.team .drv.me span:first-child { font-weight: 600; color: var(--primary); }
.needs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); }


:root {
  --single: oklch(0.925 0.06 212); --single-fg: oklch(0.36 0.11 215);
  --custom: oklch(0.93 0.05 340); --custom-fg: oklch(0.38 0.12 340);
  --mediterranean: oklch(0.93 0.035 108); --mediterranean-fg: oklch(0.41 0.055 110);
  --arid: oklch(0.93 0.04 70); --arid-fg: oklch(0.42 0.06 65);
  --oceanic: oklch(0.925 0.03 232); --oceanic-fg: oklch(0.4 0.05 235);
  --steel: oklch(0.875 0.022 250); --steel-fg: oklch(0.36 0.035 255);
  --input: oklch(0.885 0.01 255);
}
:root[data-theme="dark"] {
  --single: oklch(0.32 0.07 212); --single-fg: oklch(0.86 0.1 212);
  --custom: oklch(0.33 0.07 340); --custom-fg: oklch(0.86 0.1 340);
  --mediterranean: oklch(0.32 0.03 108); --mediterranean-fg: oklch(0.86 0.055 110);
  --arid: oklch(0.33 0.035 70); --arid-fg: oklch(0.86 0.06 75);
  --oceanic: oklch(0.32 0.03 232); --oceanic-fg: oklch(0.85 0.045 235);
  --steel: oklch(0.315 0.028 250); --steel-fg: oklch(0.82 0.035 255);
  --input: oklch(1 0 0 / 15%);
}
.c-single { background: var(--single); color: var(--single-fg); }
.c-custom { background: var(--custom); color: var(--custom-fg); }
.c-mediterranean { background: var(--mediterranean); color: var(--mediterranean-fg); }
.c-arid { background: var(--arid); color: var(--arid-fg); }
.c-oceanic { background: var(--oceanic); color: var(--oceanic-fg); }
.c-t4 { background: var(--bronze); color: var(--bronze-fg); }
.c-t5 { background: var(--steel); color: var(--steel-fg); }
.c-warning { background: var(--warning); color: var(--warning-foreground); }

/* Form bits */
.in { border: 1px solid var(--input); background: transparent; border-radius: 7px; height: 34px; padding: 0 10px; font: inherit; color: inherit; width: 100%; min-width: 0; display: flex; align-items: center; }
.in.sm { height: 28px; padding: 0 8px; font-size: 13px; border-radius: 6px; }
.in.sel { justify-content: space-between; }
.in.sel::after { content: "⌄"; opacity: .5; margin-left: 6px; transform: translateY(-3px); }
.in.num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
textarea.in { height: auto; padding: 8px 10px; resize: none; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted-foreground); }
.fields { display: grid; gap: 14px 16px; }
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
:where(.seg) button { border: 0; background: none; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; }
.seg:not(.chips) button.on { background: var(--card); box-shadow: 0 0 0 1px var(--border), 0 1px 2px oklch(0 0 0 / .08); }
.seg.chips button.on { box-shadow: none; }
.sw { width: 34px; height: 19px; border-radius: 10px; background: var(--input); position: relative; flex-shrink: 0; border: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .2); }
.sw.on { background: var(--success); }
.sw.on::after { left: auto; right: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.toggle-row:first-child { border-top: 0; }
.stepper { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; border: 1px solid var(--input); border-radius: 7px; height: 34px; overflow: hidden; }
.stepper button { border: 0; background: none; height: 100%; color: var(--muted-foreground); }
.stepper span { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.stepper span.pos { color: var(--success); }
.stepper span.neg { color: var(--destructive); }
.ghost { border: 0; background: none; border-radius: 6px; padding: 5px 8px; color: var(--muted-foreground); font-size: 13px; }
.ghost:hover { background: var(--accent); color: var(--foreground); }
.add { border: 1px dashed var(--border); border-radius: 8px; background: transparent; color: var(--muted-foreground); padding: 7px 12px; font-size: 13px; font-weight: 500; text-align: left; }
.add:hover { border-color: var(--primary); color: var(--primary); }
.grip { color: var(--muted-foreground); opacity: .5; cursor: grab; width: 14px; flex-shrink: 0; font-size: 13px; letter-spacing: -2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot.err { background: var(--destructive); }
.dot.dirty { background: var(--warning); }
.pencil { opacity: 0; color: var(--muted-foreground); font-size: 13px; }
.editable:hover .pencil { opacity: 1; }
.editable { cursor: pointer; }
.editable:hover { background: color-mix(in oklch, var(--accent) 55%, transparent); }

/* Editor header */
.ed-head { position: sticky; top: 49px; z-index: 30; background: var(--background); padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ed-head h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.ed-head .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.problems { border: 1px solid color-mix(in oklch, var(--destructive) 40%, var(--border)); background: color-mix(in oklch, var(--destructive) 6%, var(--card)); border-radius: 10px; padding: 9px 14px; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; font-size: 13px; flex-wrap: wrap; }
.problems b { color: var(--destructive); }
.problems a { color: var(--primary); }

/* ===== A: section rail ===== */
.a-shell { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 125px; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); }
.rail a .n { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
.rail a.on { background: var(--card); color: var(--foreground); box-shadow: 0 0 0 1px var(--border); }
.rail a.on::before { content: ""; width: 3px; height: 16px; border-radius: 2px; background: var(--primary); margin-left: -6px; }
.rail .sub { padding: 2px 10px 2px 26px; font-size: 12.5px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.rail hr { border: 0; border-top: 1px solid var(--border); margin: 8px 4px; }
.sec { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 130px; }
.sec + .sec { margin-top: 28px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; }
.sec-h h3 { font-size: 17px; font-weight: 650; }
.sec-h .hint { color: var(--muted-foreground); font-size: 13px; }
.sec-h .end { margin-left: auto; }
.two-pane { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.two-pane > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.two-pane > div + div { border-left: 1px solid var(--border); }
.pane-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); }
.three-pane { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.three-pane > div { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.three-pane > div + div { border-left: 1px solid var(--border); }
.assists { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px 9px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.tile .t { display: flex; align-items: center; gap: 8px; }
.tile .t b { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; }
.tile.add-tile { border-style: dashed; background: transparent; color: var(--muted-foreground); justify-content: center; align-items: center; font-weight: 500; min-height: 58px; }

.linechart { height: 150px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); position: relative; }
.linechart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted-foreground); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.bonus-row td { background: color-mix(in oklch, var(--muted) 40%, transparent); }
.exp-row { background: var(--card); border: 1px solid var(--primary); box-shadow: 0 0 0 1px var(--primary); border-radius: 12px; overflow: hidden; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols3 > div { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cols3 > div + div { border-left: 1px solid var(--border); }
.cls-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cls-card { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; background: var(--card); }
.cls-card.on { border-color: color-mix(in oklch, var(--primary) 50%, var(--border)); background: color-mix(in oklch, var(--primary) 5%, var(--card)); }
.chiplist { display: flex; gap: 4px; flex-wrap: wrap; }
.x-chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font-size: 12px; background: var(--card); }
.x-chip i { font-style: normal; color: var(--muted-foreground); }
.sumline { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted-foreground); flex-wrap: wrap; }
.sumline b { color: var(--foreground); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="picker">
  <strong>Editor forms</strong>
  <button class="opt" data-go="team">1 Team</button>
  <button class="opt" data-go="class">2 Class</button>
  <button class="opt" data-go="bop">3 Balance</button>
  <button class="opt" data-go="prize">4 Prize money</button>
  <button class="opt" data-go="round">5 Round</button>
  <button class="opt" data-go="format">6 Formats</button>
  <button class="opt" data-go="points">7 Points</button>
  <span class="spacer"></span>
  <button class="opt" id="theme">Dark mode</button>
</div>
<div id="root"></div>

<script>
const CAR = '<svg viewBox="0 0 120 40" aria-hidden="true"><path d="M6 30 C6 24 12 22 22 21 L40 12 C46 9 56 8 66 9 L84 11 C94 13 102 18 108 22 C114 23 116 26 116 30 L106 30 A8 8 0 0 0 90 30 L36 30 A8 8 0 0 0 20 30 Z M28 36 A6 6 0 1 1 28.1 36 Z M98 36 A6 6 0 1 1 98.1 36 Z"/></svg>';
const MAP = 'M6 14 C6 7 12 4 20 5 L44 7 C51 8 52 14 48 18 L36 28 C32 31 26 30 24 26 L20 20 C18 17 14 18 12 21 C10 25 6 22 6 18 Z';
const GT3 = ['Aston Martin Vantage', 'Audi R8 LMS', 'BMW M4 GT3', 'Corvette Z06', 'Ferrari 296 GT3', 'Ford Mustang GT3', 'Lamborghini Huracán', 'McLaren 720S', 'Mercedes-AMG GT3', 'Porsche 911 GT3 R'];
const BOP = { 'Aston Martin Vantage': [10, 0], 'Ferrari 296 GT3': [25, 2], 'Lamborghini Huracán': [15, 0], 'Mercedes-AMG GT3': [0, 3], 'Porsche 911 GT3 R': [30, 0] };
const F = (label, control, hint) => `<div class="field"><label>${label}</label>${control}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
const I = (v, cls = '') => `<div class="in ${cls}">${v}</div>`;
const S = (v, cls = '') => `<div class="in sel ${cls}">${v}</div>`;
const sw = (on) => `<span class="sw ${on ? 'on' : ''}"></span>`;
const seg = (opts, on, cls = {}) => `<div class="seg ${Object.keys(cls).length ? 'chips' : ''}">${opts.map((o) => `<button class="${o === on ? `on ${cls[o] ?? ''}` : ''}">${o}</button>`).join('')}</div>`;
const medal = (t, cls = '') => `<span class="medal ${cls} c-t${Math.min(t, 5)}">${t}</span>`;
const stepper = (n) => `<div class="stepper"><button>−</button><span class="${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? `+${n}` : n}</span><button>+</button></div>`;
const pod = (i) => (i < 3 ? `p${i + 1}` : '');
const P = (i) => `<span class="cell-res ${pod(i)}">P${i + 1}</span>`;
const money = (n) => `$${Number(n).toLocaleString('en-US')}`;
const opt = (tag, title, why, body, stageCls = '') => `<div class="opt-card"><div class="opt-head"><span class="tag">${tag}</span><b>${title}</b><span class="why">${why}</span></div><div class="stage ${stageCls}">${body}</div></div>`;
const block = (id, title, lead, opts) => `<section class="block" id="${id}"><h2>${title}</h2><p class="lead">${lead}</p>${opts}</section>`;
const footer = (left = '') => `<div class="df">${left ? `<span class="l">${left}</span>` : ''}<button class="btn">Cancel</button><button class="btn primary">Save</button></div>`;
const BUD = ['works', 'independent', 'privateer'];
const BUDN = { works: 'Works', independent: 'Independent', privateer: 'Privateer' };

// ---------------- 1. Team ----------------
const budgetChips = (on) => `<div class="seg chips">${[...BUD, 'unsaid'].map((b) => `<button class="${b === on ? `on c-${b}` : ''}">${b === 'unsaid' ? 'Not stated' : BUDN[b]}</button>`).join('')}</div>`;
const teamSeats = `<div class="mini-list"><div><span>Beau Ledbetter</span><span class="muted">GTP · seat 1</span></div><div><span>Travis Oakhurst</span><span class="muted">GTP · seat 2</span></div></div>`;
const teamA = `<div class="tiles" style="grid-template-columns:repeat(4,minmax(0,1fr))">
  <div class="tile" style="grid-column:span 2;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);padding:14px 16px;gap:12px">
    <div class="g2">${F('Name', I('Dixie Prototypes'))}<div class="g2" style="grid-template-columns:1fr 5rem">${F('Nationality', I('United States'))}${F('Code', I('USA'))}</div></div>
    ${F('Budget', budgetChips('works'), 'Carried and not applied yet: a later phase shapes contract offers from it.')}
    <div class="row" style="justify-content:space-between"><span class="small muted">Fields 2 seats in GTP</span><span class="row"><button class="btn sm">Cancel</button><button class="btn sm primary">Done</button></span></div>
  </div>
  ${['Sunshine State Racing|works|USA', 'Hudson Valley Racing|independent|USA', 'Saint-Laurent Racing|independent|CAN', 'Baja Endurance|privateer|MEX', 'Bluebonnet Racing|independent|USA'].map((x) => { const [n, b, c] = x.split('|'); return `<div class="tile faded"><div class="t"><b>${n}</b><span class="nat">${c}</span></div><div class="s"><span class="chip c-${b}">${BUDN[b]}</span>2 seats in GTP</div></div>`; }).join('')}
</div>`;
const teamB = `<div style="height:600px;position:relative;border-radius:10px;overflow:hidden;background:var(--background)">
  <div class="tiles faded" style="padding:14px;grid-template-columns:repeat(3,minmax(0,1fr));width:calc(100% - 460px)">${['Dixie Prototypes', 'Sunshine State Racing', 'Hudson Valley Racing', 'Saint-Laurent Racing', 'Baja Endurance', 'Bluebonnet Racing'].map((n) => `<div class="tile"><div class="t"><b>${n}</b></div><div class="s">2 seats</div></div>`).join('')}</div>

    ${F('Name', I('Dixie Prototypes'))}
    <div class="g2" style="grid-template-columns:1fr 6rem">${F('Nationality', I('United States'))}${F('Code', I('USA'))}</div>
    ${F('Budget', budgetChips('works'))}
    <span class="sec-t">Its drivers</span>${teamSeats}<span class="link">Open GTP seats →</span>
  </div>
  <div class="df"><button class="btn danger" style="margin-right:auto">Remove team</button><button class="btn">Cancel</button><button class="btn primary">Apply</button></div></aside>
</div>`;
const teamC = `<div class="dialog" style="max-width:620px"><div class="dh"><h3>Dixie Prototypes</h3><span class="small muted">A team is described once and every seat it runs points at it.</span></div>
  <div class="db">
    <div class="g2" style="grid-template-columns:2fr 1.2fr 5rem">${F('Name', I('Dixie Prototypes'))}${F('Nationality', I('United States'))}${F('Code', I('USA'))}</div>
    <div class="field"><label>Budget</label><div class="radio-cards" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      ${[['works', 'Works', 'Factory backed, the fastest cars and drivers'], ['independent', 'Independent', 'A customer team with a serious budget'], ['privateer', 'Privateer', 'Gentleman drivers, bought seats'], ['', 'Not stated', 'Leave it unsaid']].map(([k, n, d]) => `<div class="rc ${k === 'works' ? 'on' : ''}"><span class="dot-r"></span><div class="x">${k ? `<span class="chip c-${k}" style="align-self:flex-start">${n}</span>` : `<b style="font-size:13px">${n}</b>`}<span>${d}</span></div></div>`).join('')}
    </div></div>
  </div>${footer('<span class="small muted">Fields 2 seats in GTP</span>')}</div>`;

// ---------------- 2. Class ----------------
const DISC = [['Single-seater', 'c-single'], ['Sportscar', 'c-sportscar'], ['Touring', 'c-touring'], ['Road', 'c-road']];
const discChips = (on) => `<div class="seg chips">${DISC.map(([n, c]) => `<button class="${n === on ? `on ${c}` : ''}">${n}</button>`).join('')}</div>`;
const tierPick = (on) => `<div class="row" style="gap:8px">${[1, 2, 3, 4, 5].map((t) => `<span style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:10px;${t === on ? 'box-shadow:0 0 0 2px var(--primary);background:color-mix(in oklch,var(--primary) 7%,transparent)' : ''}">${medal(t)}<span class="small muted">${['Platinum', 'Gold', 'Silver', 'Bronze', 'Steel'][t - 1]}</span></span>`).join('')}<span class="small muted" style="max-width:18ch">Lower rungs: type a tier number</span></div>`;
const classA = `<div class="dialog" style="max-width:760px"><div class="dh"><span class="small muted">New class</span><h3>Add a class to IMSA SportsCar Championship</h3></div>
  <div class="db">
    ${F('Name', I('GTD'))}
    ${F('Discipline', discChips('Sportscar'))}
    ${F('Rung of the ladder', tierPick(3), 'Tier 1 is the top of a discipline. A driver may enter any class at or below their level.')}
    <span class="sec-t">Start it with</span>
    <div class="g3">${F('Cars', S('GT3 (LFM)'), '12 models installed')}${F('Seats', I('8', 'num'), 'Empty seats, drawn each season')}${F('Copy seats from', S('Nothing'))}</div>
  </div>${footer()}</div>`;
const classB = `<div class="card" style="max-width:1100px">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);position:relative">
    ${medal(3)}<h3 style="font-size:18px"><span class="inline-edit">GTD</span></h3>
    <span class="chip c-sportscar">Sportscar ⌄</span><span class="chip c-t3">Silver · Tier 3 ⌄</span><span class="chip c-success">12 installed</span>
    <span class="small muted" style="margin-left:auto">Click the name, the discipline or the rung to change it</span>
    <div class="popover" style="left:228px;top:48px"><div class="it">${medal(1, 'sm')} Platinum · Tier 1</div><div class="it">${medal(2, 'sm')} Gold · Tier 2</div><div class="it on">${medal(3, 'sm')} Silver · Tier 3 ✓</div><div class="it">${medal(4, 'sm')} Bronze · Tier 4</div><div class="it">${medal(5, 'sm')} Steel · Tier 5</div><div class="it muted">Deeper…</div></div>
  </div>
  <div class="subtabs" style="padding:10px 18px"><button>Cars</button><button class="on">Seats 8</button><button>Performance</button><button>Prize money</button></div>
  <div style="padding:14px 18px 190px" class="small muted">… the class's tabs, unchanged …</div>
</div>`;
const LAD = { 'Single-seater': ['F1', 'F2', 'F3 · Euroformula', 'F4 · FRECA', 'Karting'], Sportscar: ['WEC · IMSA GTP', 'ELMS · IMSA LMP2', 'GT World Challenge', 'GT4 European', 'Cup racing'], Touring: ['DTM', 'BTCC', 'TCR World Tour', 'TCR national', 'Clio Cup'], Road: ['Nordschleife pro', 'Trackday cup', 'Hot hatch cup', 'MX-5 Cup', 'Club days'] };
const classC = `<div class="dialog" style="max-width:980px"><div class="dh"><h3>GTD</h3><span class="small muted">Pick the rung it enters at. The ladder shows what already sits on each.</span></div>
  <div class="db">
    <div class="g2" style="grid-template-columns:1.4fr 1fr">${F('Name', I('GTD'))}${F('Rung', I('Sportscar · Tier 3 (Silver)'))}</div>
    <div class="ladder"><span></span>${[5, 4, 3, 2, 1].map((t) => `<span class="h">${medal(t, 'sm')}</span>`).join('')}
      ${Object.entries(LAD).map(([d, list]) => `<span class="d"><span class="chip ${DISC.find((x) => x[0] === d)[1]}">${d}</span></span>${[...list].reverse().map((x, i) => `<span class="cell ${d === 'Sportscar' && i === 2 ? 'here' : ''}">${d === 'Sportscar' && i === 2 ? '<b style="font-size:12px">GTD here</b>' : ''}<small>${x}</small></span>`).join('')}`).join('')}
    </div>
  </div>${footer()}</div>`;

// ---------------- 3. BoP ----------------
const bopA = `<div class="card" style="padding:14px 16px;max-width:980px">
  <div class="row" style="margin-bottom:10px"><b>Balance of performance</b><span class="small muted">Every car GTD may field. Empty runs the car as it is.</span><span style="margin-left:auto" class="row"><span class="small">Only balanced</span>${sw(false)}</span></div>
  <table class="tb"><thead><tr><th style="width:70px"></th><th>Car</th><th class="r" style="width:140px">Ballast (kg)</th><th class="r" style="width:140px">Restrictor (%)</th><th style="width:120px"></th></tr></thead><tbody>
  ${GT3.map((c) => { const b = BOP[c]; return `<tr class="${b ? 'hl' : ''}"><td><span class="thumb">${CAR}</span></td><td>${b ? `<b style="font-weight:500">${c}</b>` : c}</td><td>${I(b?.[0] ? b[0] : '<span class="muted">-</span>', 'num sm')}</td><td>${I(b?.[1] ? b[1] : '<span class="muted">-</span>', 'num sm')}</td><td>${b ? '<span class="chip c-warning">Balanced</span>' : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
const bopB = `<div class="carcards">${GT3.map((c) => { const b = BOP[c]; return `<div class="carcard ${b ? 'on' : ''}"><div class="img">${CAR}</div><div class="b"><b>${c}</b>
  <div class="g2" style="gap:6px"><div class="field"><span class="small muted">Ballast kg</span><div class="mini-step"><button>−</button><span>${b?.[0] ?? 0}</span><button>+</button></div></div><div class="field"><span class="small muted">Restrictor %</span><div class="mini-step"><button>−</button><span>${b?.[1] ?? 0}</span><button>+</button></div></div></div></div></div>`; }).join('')}</div>`;
const bar = (v, max, cls) => `<div class="slider"><div class="track"><div class="fill ${cls}" style="width:${(v / max) * 100}%"></div><div class="knob" style="left:${(v / max) * 100}%"></div></div></div>`;
const bopC = `<div class="card" style="padding:14px 16px;max-width:980px">
  <div class="row" style="margin-bottom:12px"><b>Balance of performance</b><span class="small muted">Drag to add weight or choke the intake. The bars compare the cars against each other.</span></div>
  <div style="display:grid;grid-template-columns:14rem 1fr 4rem 1fr 3.5rem;gap:8px 14px;align-items:center;font-size:13px">

const RACE = [18900, 13250, 9450, 7200, 5500, 4150, 3000, 2250, 1500, 950];

const prizeA = `<div class="card" style="max-width:760px"><div style="padding:14px 16px;border-bottom:1px solid var(--border)" class="row"><b>GTD prize money</b><span style="margin-left:auto" class="row"><span class="small">Pays its own</span>${sw(true)}</span></div>

const prizeC = `<div class="card" style="padding:14px 16px">

  <div class="row" style="margin-top:10px"><button class="ghost">+ Place</button><button class="ghost">− Last</button><button class="ghost">+ A class pays its own</button><span class="small muted" style="margin-left:auto">Season standings below, in the same shape</span></div></div>`;

// ---------------- 5. Round ----------------
const RACES = [['Race', '480 km']];
const condFields = (compact) => `
  <div class="field"><label>Weather</label><div class="w-tiles">${[['☀', 'Clear'], ['🌤', 'Few clouds'], ['☁', 'Overcast'], ['🌫', 'Fog'], ['🌦', 'Light rain'], ['🌧', 'Heavy rain']].map(([ic, n], i) => `<div class="w-tile ${i === 1 ? 'on' : ''}"><span class="ic">${ic}</span>${n}</div>`).join('')}</div><span class="hint">Or leave it to the climate: Temperate, drawn a week out.</span></div>

  <div class="db">

const formatB = `<div class="card" style="padding:14px 16px">
  <div class="row" style="margin-bottom:10px"><b style="font-size:15px">Three races</b><span class="chip filled">Default</span><span class="small muted">Raced at 5 rounds</span><span style="margin-left:auto" class="row"><button class="btn sm">Rename</button><button class="kebab">⋮</button></span></div>
  <table class="tb"><thead><tr><th></th><th>Day</th><th>Type</th><th>Name</th><th class="r">Length</th><th></th><th>Grid from</th><th class="r">Top</th><th class="r">Reverse</th><th>Pays</th><th>Conditions</th><th></th></tr></thead><tbody>
  ${SS.map(([k, n, l, d, f]) => `<tr><td class="grip">⋮⋮</td><td style="width:70px">${S(d, 'sm')}</td><td style="width:130px"><div class="in sel sm"><span class="chip s-${k}">${TY[k]}</span></div></td><td>${I(n, 'sm')}</td><td style="width:80px">${I(l.split(' ')[0], 'num sm')}</td><td style="width:90px">${S(l.split(' ')[1], 'sm')}</td><td style="width:150px">${k === 'race' ? S(f ? f.split(' ·')[0] : '-', 'sm') : '<span class="muted small">-</span>'}</td><td style="width:70px">${k === 'race' ? I('<span class="muted">All</span>', 'num sm') : ''}</td><td style="width:80px">${k === 'race' ? I(f?.includes('reversed') ? '10' : '<span class="muted">-</span>', 'num sm') : ''}</td><td style="width:140px">${k === 'race' ? S('Default', 'sm') : ''}</td><td><span class="icon-btn">☁</span></td><td><button class="kebab">⋮</button></td></tr>`).join('')}
  </tbody></table><button class="add" style="margin-top:8px">+ Add a session</button></div>`;
const formatC = `<div class="card" style="display:grid;grid-template-columns:20rem 1fr;overflow:hidden">

// ---------------- 7. Points ----------------
const PTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
const SPRINT = [10, 8, 6, 5, 4, 3, 2, 1];
const posList = (vals) => `<div class="pos-list">${vals.map((v, i) => `${P(i)}${I(v, 'num sm')}`).join('')}</div>`;
const pointsA = `<div class="pts-cards">
  ${[['Race points', PTS, true, '1', '', 'Race 1, Race 3 · Three races'], ['Sprint points', SPRINT, false, '', '3, 2, 1', 'Race 2 · Three races']].map(([n, v, d, fl, q, used]) => `<div class="pcard ${d ? 'def' : ''}"><div class="h">${I(n, 'sm').replace('class="in', 'style="font-weight:600" class="in')}${d ? '<span class="chip filled">Default</span>' : '<button class="btn sm">Make default</button>'}<button class="kebab">⋮</button></div>
    <div class="b"><span class="sec-t">By finishing place</span>${posList(v)}<div class="row"><button class="ghost">+ Place</button><button class="ghost">− Last</button><span class="small muted" style="margin-left:auto">${v.length} places score</span></div>
    <span class="sec-t">Bonuses</span><div class="g2">${F('Fastest lap', I(fl || '<span class="muted">None</span>', 'num sm'))}${F('Qualifying', I(q || '<span class="muted">None</span>', 'sm'), 'Pole first, e.g. 3, 2, 1')}</div>

  <button class="add" style="min-height:200px;text-align:center">+ Add a points system<br><span class="small">Start from F1 2010+, IndyCar, MotoGP or blank</span></button></div>`;
const line = (vals, color, max = 25) => `<polyline fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${vals.map((v, i) => `${(i / 14) * 100},${100 - (v / max) * 92}`).join(' ')}"/>`;
const pointsB = `<div class="card" style="padding:14px 16px">
  <div class="row" style="margin-bottom:10px"><b>Points systems</b><span class="small muted">Start from a real table, then adjust it.</span></div>
  <div class="presets">${[['F1 2010+', '25 18 15 12 10 8 6 4 2 1', true], ['IndyCar', '50 40 35 32 30 28 26…', false], ['IMSA', '350 320 300 280 260…', false], ['MotoGP', '25 20 16 13 11 10 9…', false], ['DTM', '25 18 15 12 10 + quali 3 2 1', false], ['Blank', 'Every place pays 0', false]].map(([n, v, on]) => `<button class="preset ${on ? 'on' : ''}"><b style="font-size:13px">${n}</b><span>${v}</span></button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:20px;margin-top:16px">
    <div class="stack" style="gap:10px">
      ${[['Race points', PTS, 'var(--primary)', true], ['Sprint points', SPRINT, 'var(--warning)', false]].map(([n, v, c, d]) => `<div class="stack" style="gap:6px"><div class="row"><i style="width:10px;height:10px;border-radius:3px;background:${c}"></i><b>${n}</b>${d ? '<span class="chip filled">Default</span>' : ''}<span class="small muted">Fastest lap ${d ? '1' : '-'} · qualifying ${d ? '-' : '3, 2, 1'}</span><button class="kebab" style="margin-left:auto">⋮</button></div><div class="strip-row" style="grid-template-columns:repeat(15,minmax(0,1fr))">${Array.from({ length: 15 }, (_, i) => I(v[i] ?? '<span class="muted">·</span>', 'num')).join('')}</div></div>`).join('')}
      <button class="ghost" style="align-self:flex-start">+ Add a points system</button>
    </div>
    <div class="stack" style="gap:6px"><span class="small muted">What each place is worth</span><div class="linechart"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${line(PTS, 'var(--primary)')}${line(SPRINT, 'var(--warning)')}</svg></div><div class="legend"><span><i style="background:var(--primary)"></i>Race points</span><span><i style="background:var(--warning)"></i>Sprint points</span></div></div>
  </div></div>`;
const pointsC = `<div class="card" style="padding:14px 16px;max-width:900px">
  <table class="tb"><thead>
    <tr><th style="width:70px"></th>${[['Race points', true, 'Race 1, Race 3'], ['Sprint points', false, 'Race 2']].map(([n, d, u]) => `<th class="r" style="width:220px"><div class="stack" style="gap:4px;align-items:flex-end">${I(n, 'sm').replace('class="in', 'style="font-weight:600;color:var(--foreground)" class="in')}<span class="row">${d ? '<span class="chip filled">Default</span>' : '<span class="link small">Make default</span>'}<button class="kebab" style="height:22px">⋮</button></span><span class="small">Pays ${u}</span></div></th>`).join('')}<th class="r"><button class="btn sm">+ System</button></th></tr></thead>
    <tbody>${Array.from({ length: 10 }, (_, i) => `<tr><td>${P(i)}</td><td>${I(PTS[i], 'num sm')}</td><td>${I(SPRINT[i] ?? '<span class="muted">-</span>', 'num sm')}</td><td></td></tr>`).join('')}
    <tr><td colspan="4"><div class="row"><button class="ghost">+ Place</button><button class="ghost">− Last</button></div></td></tr>
    <tr class="bonus-row"><td colspan="4"><span class="sec-t">Bonuses</span></td></tr>
    ${[['Pole', '', '3'], ['Qualifying 2nd', '', '2'], ['Qualifying 3rd', '', '1'], ['Fastest lap', '1', '']].map(([n, a, b]) => `<tr class="bonus-row"><td class="small">${n}</td><td>${I(a || '<span class="muted">-</span>', 'num sm')}</td><td>${I(b || '<span class="muted">-</span>', 'num sm')}</td><td></td></tr>`).join('')}
    <tr class="bonus-row"><td colspan="4"><button class="ghost">+ Pay another qualifying place</button></td></tr>
  </tbody></table></div>`;

const BLOCKS = [
  ['team', '1 · Team form', 'Name, budget, nationality and nation code - and, worth seeing while editing, which seats the team fields.', [['A', 'Tile opens in place', 'The tile grows to two columns and becomes the form; budget as coloured chips. Nothing covers the other teams.', teamA], ['B', 'Side sheet', 'A drawer from the right with a live preview of the tile, the fields, and the drivers the team fields across every class. Remove lives in its footer.', teamB, 'dim'], ['C', 'Compact dialog', 'One dialog, one row of fields; budget as four cards that say what each tier means.', teamC, 'dim']]],
  ['class', '2 · Creating and changing a class', 'Name, discipline and rung - and, when creating, what it starts with.', [['A', 'Dialog with a starter', 'Discipline as coloured chips, the rung as the medals themselves. A new class can start with a spec and a number of empty seats, so it is never born unraceable.', classA, 'dim'], ['B', 'No dialog: edit the header', 'The name is edited where it is shown, and the discipline and rung chips are menus - the rung menu open here.', classB], ['C', 'Place it on the ladder', 'The rung is picked on the ladder itself, disciplines down and tiers across from the bottom rung up, as the Championships page lays it out, with what already sits on each rung for context.', classC, 'dim']]],
  ['bop', '3 · Balance of performance', 'Ballast and intake restriction per car the class may field.', [['A', 'Every car, one table', 'All fieldable cars listed; typing into a row balances it, clearing it takes the car off. No add form at all.', bopA], ['B', 'Car cards', 'The car pictures with a stepper for each figure; a balanced car is outlined amber.', bopB], ['C', 'Sliders that compare', 'Bars show the handicap car against car, which is the question BoP actually answers.', bopC]]],
  ['prize', '4 · Prize money', 'A purse: what each race pays by place, and what the season pays. A class may pay its own or share the championship\'s.', [['A', 'Two lists with totals', 'Race and season side by side as money, with the total each pays. A switch says whether this class pays its own, and what it pays otherwise.', prizeA], ['B', 'Generate, then adjust', 'Set the pot and the shape of the curve, generate, then fix any place. A bar chart shows the curve.', prizeB], ['C', 'One line per purse', 'Places across, purses down - every class\'s purse readable against the others at once.', prizeC]]],
  ['round', '5 · Round, its conditions and its cars', 'Name, circuit, format, race length, entry fee, AI offsets, climate, hemisphere, conditions (weather, time, temperature, track state, wind) and which cars each class runs here.', [['A', 'One sheet, everything', 'A tall drawer in sections - where, weekend, weather, cars - with conditions and car swaps inline instead of two more dialogs.', roundA, 'dim'], ['B', 'The row opens in the calendar', 'The round expands in place into circuit, weekend and weather columns, with a strip of classes for the cars underneath.', roundB], ['C', 'Tabbed dialog, visual conditions', 'Basics, Conditions and Cars as tabs. Conditions shown as weather tiles, a sun arc for the time and a wind compass.', roundC, 'dim']]],
  ['format', '6 · Weekend formats and sessions', 'A format\'s name and its sessions: type, name, length and unit, day, which session sets its grid (how many carry over, how many reversed), which points it pays, and its conditions.', [['A', 'Timeline by day', 'Days as columns, sessions as coloured blocks you drag between them; the selected session is edited beside the days.', formatA], ['B', 'One table, typed into', 'Every session a line, every setting a cell - the seat sheet\'s approach.', formatB], ['C', 'List and a session page', 'Sessions down the side, the selected one opened with its grid explained as a diagram.', formatC]]],
  ['points', '7 · Points systems', 'Name, points by finishing place, fastest-lap bonus, qualifying bonus by place, which is the default, and which races pay it.', [['A', 'A card per system', 'Each system complete in its own card - places, bonuses, and which races use it. The default is outlined.', pointsA], ['B', 'Presets and a comparison', 'Start from a real table; every system as a strip of places, with a chart comparing them.', pointsB], ['C', 'One table, bonuses as rows', 'The championship page\'s shape: systems as columns, then pole, qualifying places and fastest lap as rows of the same table.', pointsC]]],
];

document.getElementById('root').innerHTML = BLOCKS.map(([id, t, lead, opts]) => block(id, t, lead, opts.map(([tag, title, why, body, cls]) => opt(tag, title, why, body, cls)).join(''))).join('');
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => document.getElementById(b.dataset.go).scrollIntoView({ behavior: 'smooth' })));
const root = document.documentElement;
const params = new URLSearchParams(location.search);
if (params.get('theme')) root.dataset.theme = params.get('theme');
else if (matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
const themeBtn = document.getElementById('theme');
const syncTheme = () => { themeBtn.textContent = root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; };
themeBtn.addEventListener('click', () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; syncTheme(); });
syncTheme();
</script>
