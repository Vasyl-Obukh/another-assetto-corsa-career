<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track pages mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --secondary: oklch(0.935 0.012 252);
  --secondary-foreground: oklch(0.28 0.03 258);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --border: oklch(0.885 0.01 255);
  --warning: oklch(0.93 0.07 80); --warning-fg: oklch(0.4 0.1 70);
  --skeleton: oklch(0.92 0.01 252); --skeleton-shine: oklch(0.97 0.006 252);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75); --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295); --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);

  --d-single-seater: oklch(0.925 0.06 212); --d-single-seater-fg: oklch(0.36 0.11 215);
  --d-sportscar: oklch(0.925 0.06 112); --d-sportscar-fg: oklch(0.36 0.1 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270);

  --tier-platinum: oklch(0.945 0.022 210); --tier-platinum-fg: oklch(0.4 0.05 215);
  --tier-gold: oklch(0.9 0.085 88); --tier-gold-fg: oklch(0.42 0.1 75);
  --tier-silver: oklch(0.91 0.008 255); --tier-silver-fg: oklch(0.42 0.015 260);
  --tier-bronze: oklch(0.89 0.07 52); --tier-bronze-fg: oklch(0.41 0.09 48);
  --tier-steel: oklch(0.875 0.022 250); --tier-steel-fg: oklch(0.36 0.035 255);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --secondary: oklch(0.27 0.014 265);
  --secondary-foreground: oklch(0.94 0.005 260);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --border: oklch(1 0 0 / 12%);
  --warning: oklch(0.34 0.07 75); --warning-fg: oklch(0.88 0.11 85);
  --skeleton: oklch(0.27 0.014 265); --skeleton-shine: oklch(0.32 0.016 265);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70); --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295); --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);

  --d-single-seater: oklch(0.32 0.07 212); --d-single-seater-fg: oklch(0.86 0.1 212);
  --d-sportscar: oklch(0.32 0.07 112); --d-sportscar-fg: oklch(0.86 0.1 112);
  --d-touring: oklch(0.32 0.065 175); --d-touring-fg: oklch(0.86 0.09 175);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);

  --tier-platinum: oklch(0.34 0.025 210); --tier-platinum-fg: oklch(0.9 0.03 210);
  --tier-gold: oklch(0.36 0.07 88); --tier-gold-fg: oklch(0.89 0.12 92);
  --tier-silver: oklch(0.33 0.006 260); --tier-silver-fg: oklch(0.86 0.008 260);
  --tier-bronze: oklch(0.33 0.06 50); --tier-bronze-fg: oklch(0.85 0.09 55);
  --tier-steel: oklch(0.315 0.028 250); --tier-steel-fg: oklch(0.82 0.035 255);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .spacer { flex: 1; }
.picker .grp.off { opacity: .35; pointer-events: none; }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }
.new { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; border: 1px dashed var(--muted-foreground); color: var(--muted-foreground); margin-left: 6px; vertical-align: 2px; font-style: normal; }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .on { color: var(--primary); font-weight: 600; }
.hdr { position: sticky; top: 49px; z-index: 20; background: var(--background); padding: 12px 0 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }

/* ---------- Shared ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip.neutral { background: var(--secondary); color: var(--secondary-foreground); }
.chip.warn { background: var(--warning); color: var(--warning-fg); }
.p-base { background: var(--provenance-base); color: var(--provenance-base-fg); }
.p-dlc { background: var(--provenance-dlc); color: var(--provenance-dlc-fg); }
.p-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.p-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.d-single-seater { background: var(--d-single-seater); color: var(--d-single-seater-fg); }
.d-sportscar { background: var(--d-sportscar); color: var(--d-sportscar-fg); }
.d-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.d-road { background: var(--d-road); color: var(--d-road-fg); }
.t-1 { background: var(--tier-platinum); color: var(--tier-platinum-fg); }
.t-2 { background: var(--tier-gold); color: var(--tier-gold-fg); }
.t-3 { background: var(--tier-silver); color: var(--tier-silver-fg); }
.t-4 { background: var(--tier-bronze); color: var(--tier-bronze-fg); }
.t-5 { background: var(--tier-steel); color: var(--tier-steel-fg); }
.edge-single-seater { background: var(--d-single-seater-fg); } .edge-sportscar { background: var(--d-sportscar-fg); }
.edge-touring { background: var(--d-touring-fg); } .edge-road { background: var(--d-road-fg); }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .2); }
.muted { color: var(--muted-foreground); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel > h3 { margin: 0; padding: 12px 14px 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel > h3 .cnt { font-weight: 400; color: var(--muted-foreground); }
.panel > h3 .act { margin-left: auto; }
.panel .pb { padding: 10px 14px 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--card); white-space: nowrap; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.link { color: var(--primary); font-weight: 500; display: inline-flex; gap: 4px; align-items: center; text-decoration: none; }
/* Outlines ship white, black or both - flattened to the text colour, like the cards do. */
img.outline { object-fit: contain; filter: brightness(0); }
:root[data-theme="dark"] img.outline { filter: brightness(0) invert(1); }
img.outline.on-scrim, :root[data-theme="dark"] img.outline.on-scrim { filter: brightness(0) invert(1); }

/* Figures */
.figs { display: grid; grid-template-columns: repeat(5, 1fr); }
.figs > div { padding: 10px 14px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.figs > div:not(:first-child) { border-left: 1px solid var(--border); }
.figs b { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.figs b small { font-size: 12px; font-weight: 500; color: var(--muted-foreground); letter-spacing: 0; }
.figs span { font-size: 11.5px; color: var(--muted-foreground); }
.figs .none b { color: var(--muted-foreground); font-weight: 500; }
.figs .scope { font-size: 11px; color: var(--muted-foreground); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; margin: 0; }
.dl dt { color: var(--muted-foreground); }
.dl dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.desc { font-size: 13.5px; line-height: 1.55; margin: 0; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }

/* ---------- Track hero ---------- */
.stage { overflow: hidden; }
.stage .ph { position: relative; aspect-ratio: 21/8; background: var(--muted); overflow: hidden; }
.stage .ph img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage .ph img.photo.soft { filter: blur(1.5px) saturate(.9); transform: scale(1.02); }
.stage .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, color-mix(in oklch, var(--scrim) 92%, transparent), color-mix(in oklch, var(--scrim) 40%, transparent) 45%, transparent 75%); pointer-events: none; }
.stage .ph.loading::after { display: none; }
.stage .ph.soft::after { background: linear-gradient(to top, color-mix(in oklch, var(--scrim) 92%, transparent), color-mix(in oklch, var(--scrim) 55%, transparent)); }
.stage .id { position: absolute; z-index: 1; left: 22px; bottom: 18px; right: 36%; color: var(--on-scrim); display: flex; flex-direction: column; gap: 6px; }
.stage .over { display: flex; gap: 8px; align-items: center; font-size: 13.5px; opacity: .92; }
.stage .logo { width: 26px; height: 26px; object-fit: contain; border-radius: 5px; background: color-mix(in oklch, var(--on-scrim) 90%, transparent); padding: 1px; }
.stage h1 { margin: 0; font-size: 32px; line-height: 1.1; font-weight: 650; letter-spacing: -0.015em; text-shadow: 0 1px 3px var(--scrim); }
.stage .chips { display: flex; gap: 5px; flex-wrap: wrap; }
.stage .chips .chip { box-shadow: 0 1px 2px oklch(0 0 0 / .25); }
.stage .map { position: absolute; z-index: 1; right: 18px; bottom: 16px; top: 16px; width: 30%; border-radius: 12px; background: color-mix(in oklch, var(--scrim) 55%, transparent); backdrop-filter: blur(6px); display: flex; flex-direction: column; padding: 10px 12px; color: var(--on-scrim); }
.stage .map img { flex: 1; min-height: 0; width: 100%; padding: 6px; }
.stage .map .cap { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.stage .map .cap b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .map .cap span { margin-left: auto; opacity: .8; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stage .count { position: absolute; z-index: 2; top: 14px; left: 14px; font-size: 12px; background: color-mix(in oklch, var(--scrim) 60%, transparent); color: var(--on-scrim); padding: 4px 9px; border-radius: 999px; backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
.stage .nav { position: absolute; z-index: 2; top: 42%; translate: 0 -50%; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklch, var(--scrim) 55%, transparent); color: var(--on-scrim); border: 0; backdrop-filter: blur(6px); }
.stage .nav.l { left: 12px; }
.stage .nav.r { right: calc(30% + 30px); }
.stage .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 4px; padding: 4px; overflow-x: auto; scrollbar-width: thin; }
.stage .strip button { padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: var(--muted); aspect-ratio: 16/9; position: relative; }
.stage .strip button img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage .strip button.sel { border-color: var(--primary); }

/* ---------- Layout cards on the track page ---------- */
.sec-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
.sec-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sec-head .cnt { color: var(--muted-foreground); font-size: 13px; }
.sec-head .act { margin-left: auto; }
.lay-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); }
.lay { overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; transition: border-color .15s, box-shadow .15s; }
.lay:hover { border-color: var(--primary); }
.lay.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.lay .mp { position: relative; aspect-ratio: 16/10; background: var(--muted); }
.lay .mp img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 12px 14px; }
.lay .mp .tl { position: absolute; top: 7px; left: 7px; display: flex; gap: 4px; }
.lay .mp .dir { position: absolute; top: 7px; right: 7px; color: var(--muted-foreground); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--card); }
.lay .bd { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lay .bd b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay .bd .fig { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; display: flex; gap: 6px; }
.lay .bd .raced { margin-top: 2px; font-size: 12px; display: flex; align-items: center; gap: 5px; color: var(--muted-foreground); }
.lay .bd .raced.yes { color: var(--foreground); }
.lay .bd .raced .dots { display: flex; gap: 3px; margin-left: auto; }
.lay .bd .raced .dots i { width: 7px; height: 7px; border-radius: 50%; }

/* ---------- Page body ---------- */
.body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; margin-top: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--muted); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--muted-foreground); display: inline-flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--card); color: var(--foreground); font-weight: 600; box-shadow: 0 1px 2px oklch(0 0 0 / .08); }
.seg button .n { font-variant-numeric: tabular-nums; font-size: 11.5px; opacity: .8; }
.champs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
.champ { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); text-decoration: none; color: inherit; }
.champ .edge { align-self: stretch; border-radius: 2px; }
.champ b { font-weight: 600; font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.champ .round { font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; margin-top: 1px; white-space: nowrap; overflow: hidden; }
.champ .meta { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.champ .go { color: var(--muted-foreground); }
.champ:hover b { color: var(--primary); }
.disc-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 14px 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); }
.disc-head:first-child { padding-top: 4px; }
.disc-head i { width: 8px; height: 8px; border-radius: 50%; }
.disc-head + .champ, .disc-head + .champ + .champ { border-top: 0; }
.more { display: flex; justify-content: center; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 4px; }
.empty { padding: 18px 0 6px; color: var(--muted-foreground); font-size: 13px; text-align: center; }
.loc { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.loc .pin { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.loc .pin.yes { background: var(--provenance-base); color: var(--provenance-base-fg); }
.loc .pin.no { background: var(--secondary); color: var(--muted-foreground); }
.loc small { display: block; color: var(--muted-foreground); font-size: 12px; margin-top: 1px; }

/* ---------- B: layout tabs ---------- */
.b-top { display: flex; align-items: center; gap: 14px; }
.b-top .logo { width: 52px; height: 52px; object-fit: contain; border-radius: 10px; background: var(--card); border: 1px solid var(--border); padding: 4px; }
.b-top h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
.b-top .sub { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted-foreground); margin-top: 4px; flex-wrap: wrap; }
.ltabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 18px 0 16px; overflow-x: auto; scrollbar-width: thin; }
.ltabs button { background: none; border: 0; padding: 8px 12px 9px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.ltabs button img { width: 30px; height: 20px; opacity: .7; }
.ltabs button.on { color: var(--foreground); border-bottom-color: var(--primary); }
.ltabs button.on img { opacity: 1; }
.ltabs .cnt { font-size: 11px; background: var(--secondary); color: var(--secondary-foreground); border-radius: 999px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.b-hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); overflow: hidden; }
.b-hero .shot { position: relative; aspect-ratio: 16/9; background: var(--muted); }
.b-hero .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.b-hero .shot .tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; }
.b-hero .map { position: relative; background: var(--muted); border-left: 1px solid var(--border); }
.b-hero .map img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 26px; }
.b-hero .map .dir { position: absolute; bottom: 10px; right: 12px; font-size: 12px; color: var(--muted-foreground); display: inline-flex; gap: 5px; align-items: center; }

/* ---------- Picker dialog ---------- */
.scrim-page { position: relative; padding: 1px 0; min-height: calc(100vh - 100px); }
.scrim-page::before { content: ""; position: fixed; inset: 0; background: color-mix(in oklch, var(--scrim) 55%, transparent); z-index: 0; }
.ghost-race { position: relative; z-index: 0; opacity: .5; padding: 20px 0; }
.dialog { position: relative; z-index: 1; background: var(--background); border: 1px solid var(--border); border-radius: 14px; margin: 20px auto; max-width: 1240px; height: 820px; display: flex; flex-direction: column; box-shadow: 0 20px 60px oklch(0 0 0 / .35); overflow: hidden; }
.dialog .dh { padding: 18px 24px 4px; }
.dialog .dh h2 { margin: 0; font-size: 18px; font-weight: 600; }
.dialog .dh p { margin: 3px 0 0; font-size: 13px; color: var(--muted-foreground); }
.dialog .close { position: absolute; top: 14px; right: 14px; }
.dialog .bar { display: flex; align-items: center; gap: 12px; padding: 10px 24px 12px; }
.circuit { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; flex: 1; min-width: 0; }
.circuit img.t { width: 92px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--muted); flex: none; }
.circuit b { font-size: 14px; }

const ic = (n, s = 15) => `<svg class="i" style="width:${s}px;height:${s}px" viewBox="0 0 24 24">${I[n]}</svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const km = (m) => (m / 1000).toFixed(m < 10000 ? 2 : 1);
const DISC = { 'single-seater': 'Single-seater', sportscar: 'Sportscar', touring: 'Touring', road: 'Road' };
const ORDER = ['single-seater', 'sportscar', 'touring', 'road'];
const RUN = { cw: 'Clockwise', acw: 'Anticlockwise' };

const track = () => TRACKS[state.t];
const layoutOf = (t, key) => t.layouts.find((l) => l.key === key);
const outline = (t, l, cls = '') => `<img class="outline ${cls}" src="${T(t.id, l.key, 'outline.png')}" alt="">`;
const preview = (t, l) => T(t.id, l.key, 'preview.png');
const racing = (t, l) => t.champs.filter((c) => c.layouts.includes(l.key));
const discs = (list) => ORDER.filter((d) => list.some((c) => c.disc === d));
const flag = (t) => `<img class="flag" src="${FLAG(t.nation)}" alt="">`;
const provChips = (t) => {
  const src = t.source === 'dlc' ? `<span class="chip p-dlc">${esc(t.sourceName)}</span>`
    : t.source === 'mod' ? `<span class="chip p-mod">${esc(t.sourceName)}</span>` : '<span class="chip p-base">Base game</span>';
  return src + (t.layouts.some((l) => l.dist) ? `<span class="chip p-dist">${esc(t.distributor)}</span>` : '');
};
const span = (vals, f) => { const lo = Math.min(...vals); const hi = Math.max(...vals); return lo === hi ? f(lo) : `${f(lo)}-${f(hi)}`; };
const photos = (t) => (t.photos.length ? t.photos.map((p) => ({ src: `${AC}tracks/${t.id}/ui/${p}`, soft: false }))
  : t.layouts.map((l) => ({ src: preview(t, l), soft: true })).filter((p, i, a) => a.findIndex((q) => q.src === p.src) === i));
const ladder = (c) => `<span class="chip d-${c.disc}">${DISC[c.disc]}</span>${c.tiers.map((n) => `<span class="chip t-${n}">Tier ${n}</span>`).join('')}`;
const dots = (list) => discs(list).map((d) => `<i class="edge-${d}" title="${DISC[d]}"></i>`).join('');

/* ---------------- Track page A ---------------- */
const hero = (t) => {
  const ps = photos(t);
  const p = ps[state.photo % ps.length];
  // The whole circuit shows its longest layout, which is the one the circuit is known by.
  const l = state.lay ? layoutOf(t, state.lay) : [...t.layouts].sort((a, b) => b.len - a.len)[0];
  return `<div class="panel stage">
    <div class="ph ${p.soft ? 'soft' : ''}">
      <img class="photo ${p.soft ? 'soft' : ''}" src="${p.src}" alt="">
      ${ps.length > 1 ? `<span class="count">${ic('image', 12)}${state.photo % ps.length + 1} / ${ps.length}</span>
        <button class="nav l" data-step="-1">${ic('left', 17)}</button><button class="nav r" data-step="1">${ic('chev', 17)}</button>` : ''}
      <div class="id">
        <div class="over">${t.logo ? `<img class="logo" src="${t.logo}" alt="">` : ''}${flag(t)}<span>${esc(t.country)} · ${esc(t.city)}</span></div>
        <h1>${esc(t.name)}</h1>
        <div class="chips">${provChips(t)}</div>
      </div>
      <div class="map">
        ${outline(t, l, 'on-scrim')}
        <div class="cap"><b>${esc(l.short)}</b><span>${km(l.len)} km</span></div>
      </div>
    </div>
    ${ps.length > 1 && !ps[0].soft ? `<div class="strip">${ps.map((x, i) => `<button class="${i === state.photo % ps.length ? 'sel' : ''}" data-photo="${i}"><img src="${x.src}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
  </div>`;
};

const layCard = (t, l) => {
  const r = racing(t, l);
  return `<button class="panel lay ${state.lay === l.key ? 'sel' : ''}" data-lay="${l.key}" aria-pressed="${state.lay === l.key}">
    <div class="mp">${outline(t, l)}
      <div class="tl">${l.dist ? `<span class="chip p-dist">${l.dist}</span>` : ''}</div>
      <span class="dir" title="${RUN[l.run]}">${ic(l.run, 13)}</span></div>
    <div class="bd"><b title="${esc(l.name)}">${esc(l.short)}</b>
      <span class="fig"><span>${km(l.len)} km</span>·<span>${l.pits} pits</span>·<span>${l.width} m wide</span></span>
      <span class="raced ${r.length ? 'yes' : ''}">${ic('trophy', 12)}${r.length ? `${r.length} championship${r.length > 1 ? 's' : ''}` : 'No championship yet'}<span class="dots">${dots(r)}</span></span>
    </div></button>`;
};

const figures = (t) => {
  const l = state.lay ? layoutOf(t, state.lay) : null;
  const ls = l ? [l] : t.layouts;
  const f = [
    ['Length', `${span(ls.map((x) => x.len), km)}<small>km</small>`],
    ['Width', `${span(ls.map((x) => x.width), String)}<small>m</small>`],
    ['Pit boxes', span(ls.map((x) => x.pits), String)],
    ['Direction', l ? `${ic(l.run, 18)}<span style="font-size:15px;font-weight:600;color:var(--foreground)">${RUN[l.run]}</span>` : (new Set(ls.map((x) => x.run)).size > 1 ? '<span style="font-size:15px;color:var(--foreground)">Both</span>' : `${ic(ls[0].run, 18)}<span style="font-size:15px;font-weight:600;color:var(--foreground)">${RUN[ls[0].run]}</span>`)],
    ['Layouts', String(t.layouts.length)],
  ];
  return `<div class="panel"><div class="figs">${f.map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div></div>`;
};

// Folded per discipline rather than overall, or Silverstone's twenty Formula One
// seasons would be all a reader saw.
const champList = (t, list) => {
  const cap = state.all ? Infinity : 4;
  let shown = 0;
  let html = '';
  for (const d of discs(list)) {
    const rows = list.filter((c) => c.disc === d);
    html += `<div class="disc-head"><i class="edge-${d}"></i>${DISC[d]}<span style="font-weight:400">${rows.length}</span></div>`;
    for (const c of rows.slice(0, cap)) {
      shown += 1;
      const lays = c.layouts.map((k) => layoutOf(t, k).short);
      html += `<a class="champ" href="#"><i class="edge edge-${c.disc}"></i><div style="min-width:0">
        <b>${esc(c.name)}</b>
        <span class="round">${esc(c.round.split(',')[0])}${t.layouts.length > 1 ? ` · ${esc(lays.join(', '))}` : ''}</span>
        <div class="meta">${ladder(c)}${c.career ? '<span class="chip neutral">' + ic('flagc', 11) + 'Your career</span>' : ''}</div></div>
        <span class="go">${ic('chev', 15)}</span></a>`;
    }
    if (rows.length > cap) html += `<button class="btn sm ghost" style="grid-column:1/-1;justify-self:start;margin-left:-6px" data-all="1">${rows.length - cap} more ${DISC[d].toLowerCase()} championships</button>`;
  }
  return { html, more: list.length - shown };
};

const championships = (t) => {
  const list = state.lay ? t.champs.filter((c) => c.layouts.includes(state.lay)) : t.champs;
  const raced = t.layouts.filter((l) => racing(t, l).length);
  const { html, more } = champList(t, list);
  return `<div class="panel"><h3>${ic('trophy', 14)}Raced here<span class="cnt">${list.length}</span>
    ${t.layouts.length > 1 ? `<span class="act"><span class="seg">
      <button class="${state.lay ? '' : 'on'}" data-lay="">All<span class="n">${t.champs.length}</span></button>
      ${raced.map((l) => `<button class="${state.lay === l.key ? 'on' : ''}" data-lay="${l.key}">${esc(l.short)}<span class="n">${racing(t, l).length}</span></button>`).join('')}
    </span></span>` : ''}</h3>
    <div class="pb">${list.length ? `<div class="champs">${html}</div>${more > 0 ? `<div class="more"><button class="btn sm ghost" data-all="1">Show all ${list.length}</button></div>` : ''}`
      : `<p class="empty">No championship races ${state.lay ? `the ${esc(layoutOf(t, state.lay).short)} layout` : 'here'} yet.</p>`}</div>
  </div>`;
};

const whereIs = (t) => `<div class="panel"><h3>Where it is</h3><div class="pb" style="display:flex;flex-direction:column;gap:12px">
  <dl class="dl"><dt>Country</dt><dd style="display:flex;gap:6px;justify-content:flex-end;align-items:center">${flag(t)}${esc(t.country)}</dd><dt>Town</dt><dd>${esc(t.city)}</dd></dl>
  <div class="loc"><span class="pin ${t.located ? 'yes' : 'no'}">${ic(t.located ? 'pin' : 'pinoff', 15)}</span>
    <div>${t.located ? `<b>${esc(t.coords)}</b><small>Custom Shaders Patch sets the sun for the real place and its time zone.</small>`
      : '<b>No coordinates</b><small>The track gives none, so Custom Shaders Patch can only guess where the sun stands.</small>'}</div></div>
  </div></div>`;

const source = (t) => `<div class="panel"><h3>Where it comes from</h3><div class="pb" style="display:flex;flex-direction:column;gap:12px">
  <div class="chips" style="display:flex;gap:5px;flex-wrap:wrap">${provChips(t)}</div>
  <dl class="dl"><dt>Author</dt><dd>${esc(t.author)}</dd>
    ${t.version ? `<dt>Version</dt><dd>${esc(t.version)}</dd>` : ''}${t.year ? `<dt>Year</dt><dd>${t.year}</dd>` : ''}
    ${t.layouts.some((l) => l.dist) ? `<dt>${esc(t.distributor)} layouts</dt><dd>${t.layouts.filter((l) => l.dist).length} of ${t.layouts.length}</dd>` : ''}</dl>
  ${t.url ? `<a class="link" href="#">${ic('ext', 13)}Steam store page</a>` : ''}
  <div class="tags">${t.tags.map((x) => `<span class="chip neutral">${esc(x)}</span>`).join('')}</div>
  </div></div>`;

const about = (t) => (t.description && t.description.length > 40 ? `<div class="panel"><h3>About</h3><div class="pb"><p class="desc">${esc(t.description)}</p></div></div>` : '');

const header = (label = 'Tracks') => `<div class="hdr"><span class="back">${ic('back', 14)}${label}</span></div>`;

const viewA = (t) => {
  if (state.s === 'loading') return header() + skeletonA(t);
  return `${header()}${hero(t)}
    <div class="sec-head"><h2>Layouts</h2><span class="cnt">${t.layouts.length}</span>
      ${state.lay ? `<button class="btn sm ghost act" data-lay="">${ic('x', 13)}Whole circuit</button>` : '<span class="act muted" style="font-size:12.5px">Pick one to see it alone</span>'}</div>
    <div class="lay-grid">${t.layouts.map((l) => layCard(t, l)).join('')}</div>
    <div class="body">
      <div class="col">${figures(t)}${championships(t)}</div>
      <div class="col">${whereIs(t)}${source(t)}${about(t)}</div>
    </div>`;
};

const skeletonA = (t) => `<div class="panel stage"><div class="ph loading">
    <div class="id"><div class="sk" style="width:180px;height:14px"></div><div class="sk" style="width:300px;height:34px"></div><div class="sk" style="width:130px;height:20px"></div></div>
    <div class="map" style="background:none;backdrop-filter:none;padding:0"><span class="sk" style="flex:1;border-radius:12px"></span></div></div>
    <div class="strip">${[0, 1, 2, 3].map(() => '<span class="sk" style="aspect-ratio:16/9;border-radius:6px"></span>').join('')}</div></div>
  <div class="sec-head"><h2>Layouts</h2><span class="sk" style="width:16px;height:14px"></span></div>
  <div class="lay-grid">${[0, 1, 2, 3].map(() => `<div class="panel lay"><div class="mp"><span class="sk" style="position:absolute;inset:18px 26px;border-radius:40%"></span></div>
    <div class="bd"><span class="sk" style="width:60%;height:16px"></span><span class="sk" style="width:85%;height:12px"></span><span class="sk" style="width:50%;height:12px"></span></div></div>`).join('')}</div>
  <div class="body"><div class="col">
    <div class="panel"><div class="figs">${['Length', 'Width', 'Pit boxes', 'Direction', 'Layouts'].map((k) => `<div><span class="sk" style="width:60%;height:24px;margin-bottom:3px"></span><span>${k}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>${ic('trophy', 14)}Raced here</h3><div class="pb"><div class="champs">${[0, 1, 2, 3, 4, 5].map(() => `<div class="champ"><span class="sk edge"></span><div style="display:flex;flex-direction:column;gap:5px"><span class="sk" style="width:75%;height:15px"></span><span class="sk" style="width:45%;height:12px"></span><span class="sk" style="width:55%;height:18px"></span></div><span></span></div>`).join('')}</div></div></div>
  </div><div class="col">
    <div class="panel"><h3>Where it is</h3><div class="pb"><dl class="dl"><dt>Country</dt><dd><span class="sk" style="display:inline-block;width:110px;height:14px"></span></dd><dt>Town</dt><dd><span class="sk" style="display:inline-block;width:80px;height:14px"></span></dd></dl></div></div>
    <div class="panel"><h3>Where it comes from</h3><div class="pb" style="display:flex;flex-direction:column;gap:10px"><span class="sk" style="width:120px;height:20px"></span><span class="sk" style="width:100%;height:14px"></span></div></div>
  </div></div>`;

/* ---------------- Track page B ---------------- */
const viewB = (t) => {
  const l = layoutOf(t, state.lay) || t.layouts[0];
  const r = racing(t, l);
  const { html, more } = champList(t, r);
  return `${header()}
    <div class="b-top">${t.logo ? `<img class="logo" src="${t.logo}" alt="">` : ''}
      <div style="min-width:0"><h1>${esc(t.name)}</h1>
      <div class="sub">${flag(t)}<span>${esc(t.country)} · ${esc(t.city)}</span>${provChips(t)}<span>${t.champs.length} championships across ${t.layouts.length} layouts</span></div></div></div>
    <div class="ltabs">${t.layouts.map((x) => `<button class="${x.key === l.key ? 'on' : ''}" data-lay="${x.key}">${outline(t, x)}${esc(x.short)}${racing(t, x).length ? `<span class="cnt">${racing(t, x).length}</span>` : ''}</button>`).join('')}</div>
    <div class="body" style="margin-top:0">
      <div class="col">
        <div class="panel b-hero"><div class="shot"><img src="${preview(t, l)}" alt=""><div class="tl">${l.dist ? `<span class="chip p-dist">${l.dist}</span>` : ''}</div></div>
          <div class="map">${outline(t, l)}<span class="dir">${ic(l.run, 13)}${RUN[l.run]}</span></div></div>
        <div class="panel"><div class="figs">${[['Length', `${km(l.len)}<small>km</small>`], ['Width', `${l.width}<small>m</small>`], ['Pit boxes', l.pits], ['Direction', `<span style="font-size:15px">${RUN[l.run]}</span>`], ['Championships', r.length]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div></div>
        <div class="panel"><h3>${ic('trophy', 14)}Raced on ${esc(l.short)}<span class="cnt">${r.length}</span></h3><div class="pb">${r.length ? `<div class="champs">${html}</div>${more > 0 ? `<div class="more"><button class="btn sm ghost" data-all="1">Show all ${r.length}</button></div>` : ''}` : '<p class="empty">No championship races this layout yet.</p>'}</div></div>
      </div>
      <div class="col">${whereIs(t)}${source(t)}${about(t)}</div>
    </div>`;
};

/* ---------------- Picker ---------------- */
const ghostRace = () => `<div class="ghost-race"><div class="hdr" style="position:static"><h1 style="margin:0;font-size:22px">Race</h1></div>
  <div class="panel" style="height:140px;margin-top:10px"></div><div class="panel" style="height:220px;margin-top:16px"></div></div>`;

const circuitLine = (t) => {
  const grid = Number(state.g);
  const fits = t.layouts.filter((l) => l.pits >= grid).length;
  return `<div class="panel circuit"><img class="t" src="${photos(t)[0].src}" alt="">
    <div style="min-width:0"><b>${esc(t.name)}</b><div class="sub">${flag(t)}<span>${esc(t.country)} · ${esc(t.city)}</span>${provChips(t)}</div></div>
    <div class="grid-note"><b>${grid} cars on the grid</b><span>${fits === t.layouts.length ? 'Every layout has room for them' : `${fits} of ${t.layouts.length} layouts have room`}</span></div></div>`;
};

const pitsWarn = (l) => (l.pits < Number(state.g) ? `<span class="chip warn" title="Assetto Corsa drops the cars that do not fit">${ic('warn', 11)}${l.pits} pits for ${state.g} cars</span>` : '');

const ptile = (t, l) => {
  const r = racing(t, l);
  const cur = l.key === t.layouts[0].key;
  return `<button class="panel ptile ${cur ? 'sel' : ''}">
    <div class="mp">${outline(t, l)}<img class="thumb" src="${preview(t, l)}" alt="">
      <div class="tl">${l.dist ? `<span class="chip p-dist">${l.dist}</span>` : ''}${pitsWarn(l)}${cur ? `<span class="chip cur" style="background:var(--primary);color:var(--primary-foreground)">${ic('check', 11)}Current</span>` : ''}</div></div>
    <div class="bd"><b title="${esc(l.name)}">${esc(l.short)}</b>
      <div class="fl"><span><b>${km(l.len)}</b> km</span><span><b>${l.pits}</b> pits</span><span>${ic(l.run, 12)}${RUN[l.run]}</span></div>
      <span class="raced ${r.length ? 'yes' : ''}">${ic('trophy', 12)}${r.length ? `Raced by ${r.length} championship${r.length > 1 ? 's' : ''}` : 'No championship races it'}<span class="dots">${dots(r)}</span></span>
    </div></button>`;
};

// Layouts that share a length are versions of one shape - reversed, re-pitted, redistributed.
const byLength = (t) => {
  const groups = new Map();
  for (const l of t.layouts) groups.set(l.len, [...(groups.get(l.len) || []), l]);
  return [...groups.entries()].sort((a, b) => b[0] - a[0]);
};

const viewPA = (t) => `${ghostRace()}<div class="scrim-page" style="position:absolute;inset:0;top:0"></div>
  <div class="dialog" style="position:absolute;left:0;right:0;top:110px">
    <button class="btn ghost close">${ic('x', 15)}</button>
    <div class="dh"><h2>Choose a layout</h2><p>${esc(t.name)} has ${t.layouts.length} layouts. Each races as its own circuit.</p></div>
    <div class="bar"><button class="btn sm ghost">${ic('left', 14)}All tracks</button>${circuitLine(t)}</div>
    <div class="scroll">${t.layouts.length > 4 ? byLength(t).map(([len, ls]) => `<div class="pgroup"><h4>${km(len)} km<span>${ls.length} layout${ls.length > 1 ? 's' : ''}</span></h4>
      <div class="ptiles">${ls.map((l) => ptile(t, l)).join('')}</div></div>`).join('') : `<div class="ptiles">${t.layouts.map((l) => ptile(t, l)).join('')}</div>`}</div>
  </div>`;

const viewPB = (t) => {
  const l = layoutOf(t, state.sel) || t.layouts[0];
  const r = racing(t, l);
  return `${ghostRace()}<div class="scrim-page" style="position:absolute;inset:0"></div>
  <div class="dialog" style="position:absolute;left:0;right:0;top:110px">
    <button class="btn ghost close">${ic('x', 15)}</button>
    <div class="dh"><h2>Choose a layout</h2><p>${esc(t.name)} has ${t.layouts.length} layouts. Each races as its own circuit.</p></div>
    <div class="bar"><button class="btn sm ghost">${ic('left', 14)}All tracks</button>${circuitLine(t)}</div>
    <div class="split">
      <div class="rows">${t.layouts.map((x) => {
        const n = racing(t, x).length;
        return `<button class="panel lrow ${x.key === l.key ? 'sel' : ''}" data-sel="${x.key}">
          <span class="mp">${outline(t, x)}</span>
          <div style="min-width:0"><b><span>${esc(x.short)}</span>${x.key === t.layouts[0].key ? '<span class="chip neutral">Current</span>' : ''}</b>
            <div class="sub"><span>${ic('ruler', 12)}${km(x.len)} km</span><span>${ic('pits', 12)}${x.pits} pits</span><span>${ic(x.run, 12)}${RUN[x.run]}</span></div></div>
          <div class="right"><div style="display:flex;gap:4px">${x.dist ? `<span class="chip p-dist">${x.dist}</span>` : ''}${pitsWarn(x)}</div>
            <span style="display:inline-flex;gap:4px;align-items:center">${ic('trophy', 12)}${n || '-'}</span></div></button>`;
      }).join('')}</div>
      <div class="panel preview">
        <div class="shot"><img src="${preview(t, l)}" alt=""><div class="mapover">${outline(t, l, 'on-scrim')}</div></div>
        <div class="pv">
          <div><h3>${esc(l.short)}</h3><span class="muted" style="font-size:12.5px">${esc(l.name)}</span></div>
          <div class="figs4">${[['Length', `${km(l.len)}<small>km</small>`], ['Width', `${l.width}<small>m</small>`], ['Pit boxes', l.pits], ['Direction', `<span style="font-size:13px;font-weight:600">${ic(l.run, 14)}${RUN[l.run]}</span>`]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>
          ${pitsWarn(l) ? `<div class="chip warn" style="white-space:normal;line-height:1.35;padding:8px 10px;font-size:12.5px">${ic('warn', 13)}${l.pits} pit boxes for a ${state.g}-car grid - Assetto Corsa drops the cars that do not fit.</div>` : ''}
          <div><div style="font-size:12.5px;font-weight:600;margin-bottom:4px">${r.length ? `Raced by ${r.length} championship${r.length === 1 ? '' : 's'}` : 'No championship races it yet'}</div>
            <div class="mini">${r.slice(0, 6).map((c) => `<a href="#"><i class="edge-${c.disc}"></i><span>${esc(c.name)}</span>${ladder(c)}</a>`).join('')}${r.length > 6 ? `<span class="muted" style="font-size:12px;padding-top:4px">and ${r.length - 6} more</span>` : ''}</div></div>
        </div>
        <div class="foot"><span class="muted" style="font-size:12px">Double-click a row to choose it</span><button class="btn primary">Race on ${esc(l.short)}</button></div>
      </div>
    </div>
  </div>`;
};

const WHY = {
  a: '<b>Track page.</b> A circuit gets a page of its own at <code>/tracks/:id</code>, so a track card and every round that names a circuit can link to it, the way cars do. The hero steps through the circuit&#39;s loading-screen photographs, with the shape of the chosen layout in a plate on the right. The layouts are a row of cards: picking one turns the page to that layout alone - the map, the figures and the championships follow it - and <b>Whole circuit</b> turns it back. Championships are grouped by discipline, each with the round that runs here and on which layout, and each discipline folds after four, since Silverstone has 61 and twenty of them are Formula One. <b>Where it is</b> says whether the track gives real coordinates, which is what CSP lights the sky from.',
  b: '<b>Track page - layout tabs.</b> The same content, but the layout is always chosen: one tab per layout, each with its own preview photograph, map, figures and championships. Shorter and more direct when you care about one layout; worse for seeing the whole circuit at once, and nine tabs is a lot for Mont Tremblant.',
  pa: '<b>Layout picker - tiles.</b> The second step of the track picker, laid over the browser as today. The map stays the hero of each tile, with the layout&#39;s own photograph inset. Each tile adds direction, who redistributes it, and which championships race it. With more than four layouts they are grouped by length, so reversed and re-pitted versions of one shape sit together. Switch <b>Race grid</b> to 28 to see the pit-box warning: a layout with fewer boxes than the grid has cars is flagged rather than hidden.',
  pb: '<b>Layout picker - list + preview.</b> Layouts as a list, so long names like "GT (No Chicane Reverse)" never truncate, and the selected one shown large on the right with its photo, map, figures and championships. Picking takes a click on the button or a double-click on the row. Better for many layouts; one more click than the tiles.',
};

const render = () => {
  document.querySelectorAll('.picker .opt[data-k]').forEach((b) => b.setAttribute('aria-pressed', String(String(state[b.dataset.k]) === b.dataset.v)));
  const picker = state.v.startsWith('p');
  document.querySelector('[data-for="track"]').classList.toggle('off', state.v !== 'a');
  document.querySelector('[data-for="picker"]').classList.toggle('off', !picker);
  document.getElementById('why').innerHTML = `${WHY[state.v]} <span class="new">new scan field</span> Town, author, version, year, tags, description, direction, the loading-screen photographs and a layout&#39;s logo are in <code>ui_track.json</code> and <code>ui/</code> but not read by the scan yet.`;
  const t = track();
  const html = { a: viewA, b: viewB, pa: viewPA, pb: viewPB }[state.v](t);
  document.getElementById('root').innerHTML = `<div class="frame" style="${state.w === 'min' ? 'max-width:1008px;' : ''}${picker ? 'position:relative;min-height:1000px' : ''}">
    <div class="app-nav"><span>Home</span><span class="${picker ? 'on' : ''}">Race</span><span>Calendar</span><span>Championships</span><span>Results</span><span>Cars</span><span class="${picker ? '' : 'on'}">Tracks</span><span>Settings</span></div>${html}</div>`;
};
document.querySelector('.picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt[data-k]');
  if (!b) return;
  state[b.dataset.k] = b.dataset.k === 't' ? Number(b.dataset.v) : b.dataset.v;
  if (b.dataset.k === 't') Object.assign(state, { photo: 0, lay: null, all: false, sel: null });
  if (b.dataset.k === 'v') state.all = false;
  render();
});
document.getElementById('root').addEventListener('click', (e) => {
  const lay = e.target.closest('[data-lay]'); const st = e.target.closest('[data-step]'); const ph = e.target.closest('[data-photo]');
  const all = e.target.closest('[data-all]'); const sel = e.target.closest('[data-sel]');
  if (lay) { state.lay = lay.dataset.lay === state.lay && state.v === 'a' ? null : (lay.dataset.lay || null); state.all = false; }
  else if (st) state.photo = (state.photo + Number(st.dataset.step) + photos(track()).length) % photos(track()).length;
  else if (ph) state.photo = Number(ph.dataset.photo);
  else if (all) state.all = true;
  else if (sel) state.sel = sel.dataset.sel;
  else return;
  e.preventDefault();
  render();
});
document.getElementById('theme').addEventListener('click', (e) => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  e.target.textContent = dark ? 'Light' : 'Dark';
});
render();
</script>
</body>
</html>
