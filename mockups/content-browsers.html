<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content browsers mockup</title>
<style>
/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --secondary: oklch(0.935 0.012 252);
  --secondary-foreground: oklch(0.28 0.03 258);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);

  --provenance-base: oklch(0.93 0.05 155); --provenance-base-fg: oklch(0.34 0.09 155);
  --provenance-dlc: oklch(0.93 0.06 75); --provenance-dlc-fg: oklch(0.38 0.1 62);
  --provenance-mod: oklch(0.93 0.05 295); --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);

  --d-single-seater: oklch(0.925 0.06 212); --d-single-seater-fg: oklch(0.36 0.11 215);
  --d-sportscar: oklch(0.925 0.06 112); --d-sportscar-fg: oklch(0.36 0.1 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178);
  --d-road: oklch(0.925 0.06 270); --d-road-fg: oklch(0.37 0.12 270);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --secondary: oklch(0.27 0.014 265);
  --secondary-foreground: oklch(0.94 0.005 260);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);

  --provenance-base: oklch(0.32 0.06 155); --provenance-base-fg: oklch(0.86 0.11 155);
  --provenance-dlc: oklch(0.33 0.06 70); --provenance-dlc-fg: oklch(0.87 0.11 80);
  --provenance-mod: oklch(0.33 0.07 295); --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);

  --d-single-seater: oklch(0.32 0.07 212); --d-single-seater-fg: oklch(0.86 0.1 212);
  --d-sportscar: oklch(0.32 0.07 112); --d-sportscar-fg: oklch(0.86 0.1 112);
  --d-touring: oklch(0.32 0.065 175); --d-touring-fg: oklch(0.86 0.09 175);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Mockup chrome (not part of the app) ---------- */
.picker {
  position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 10px 16px; background: var(--foreground); color: var(--background);
}
.picker .grp { display: flex; align-items: center; gap: 6px; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt {
  border: 1px solid color-mix(in oklch, var(--background) 30%, transparent);
  background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px;
}
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .spacer { flex: 1; }
.rationale { max-width: 88ch; margin: 18px auto 0; padding: 0 16px; color: var(--muted-foreground); font-size: 13.5px; }
.rationale b { color: var(--foreground); font-weight: 600; }
.rationale ul { margin: 6px 0 0; padding-left: 18px; }
.rationale li { margin: 2px 0; }

.window {
  max-width: 1320px; margin: 16px auto 48px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  background: var(--background); box-shadow: 0 20px 50px -30px oklch(0.2 0.02 260 / 0.35);
}
.app-header { display: flex; align-items: center; gap: 24px; padding: 14px 32px; border-bottom: 1px solid var(--border); }
.app-header h1 { font-size: 17px; font-weight: 600; margin: 0; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { padding: 5px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500; }
.nav a.on { background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary); }

.screen { padding: 26px 32px 40px; }
.title-row { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.title-row h2 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; }
.title-row p { margin: 2px 0 0; color: var(--muted-foreground); }

/* ---------- Chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 1;
  padding: 4px 7px; border-radius: 6px; white-space: nowrap;
}
.chip.neutral { background: var(--secondary); color: var(--secondary-foreground); }
.p-base { background: var(--provenance-base); color: var(--provenance-base-fg); }
.p-dlc { background: var(--provenance-dlc); color: var(--provenance-dlc-fg); }
.p-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.p-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.d-single-seater { background: var(--d-single-seater); color: var(--d-single-seater-fg); }
.d-sportscar { background: var(--d-sportscar); color: var(--d-sportscar-fg); }
.d-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.d-road { background: var(--d-road); color: var(--d-road-fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.d-single-seater { background: var(--d-single-seater-fg); }
.dot.d-sportscar { background: var(--d-sportscar-fg); }
.dot.d-touring { background: var(--d-touring-fg); }
.dot.d-road { background: var(--d-road-fg); }
.dot.p-base { background: var(--provenance-base-fg); }
.dot.p-dlc { background: var(--provenance-dlc-fg); }
.dot.p-mod { background: var(--provenance-mod-fg); }
.dot.p-dist { background: var(--provenance-dist-fg); }
.flag { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px var(--border); }
.flag.none { box-shadow: none; border: 1px dashed var(--border); }

/* ---------- Toolbar (bar mode) ---------- */
.toolbar { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0 10px; }
.search {
  display: flex; align-items: center; gap: 8px; flex: 1 1 260px; max-width: 340px;
  border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 10px; color: var(--muted-foreground);
}
.facet {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px dashed var(--border); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px;
}
.facet.solid { border-style: solid; background: var(--card); }
.facet.on { border-style: solid; border-color: color-mix(in oklch, var(--primary) 45%, var(--border)); background: color-mix(in oklch, var(--primary) 7%, var(--card)); }
.facet .n { background: var(--primary); color: var(--primary-foreground); border-radius: 999px; font-size: 11px; padding: 1px 6px; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 6px 9px; display: grid; place-items: center; color: var(--muted-foreground); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--foreground); }
.push { margin-left: auto; }
.active-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--muted-foreground); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 6px 3px 10px;
  background: color-mix(in oklch, var(--primary) 9%, var(--card)); color: var(--foreground); border: 1px solid color-mix(in oklch, var(--primary) 30%, var(--border));
}
.pill b { font-weight: 600; }
.pill .x { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: none; border: 0; color: var(--muted-foreground); padding: 0; }
.linkish { background: none; border: 0; color: var(--primary); padding: 2px 4px; font-size: 13px; }

/* "More filters" popover */
.pop {
  position: absolute; z-index: 30; top: 44px; right: 0; width: 560px; padding: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 40px -16px oklch(0.2 0.02 260 / .4);
  display: none; grid-template-columns: 1fr 1fr; gap: 14px 18px;
}
.pop.open { display: grid; }

/* ---------- Rail mode ---------- */
.with-rail { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; margin-top: 20px; align-items: start; }
.rail {
  position: sticky; top: 64px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 6px 0; max-height: calc(100vh - 90px); overflow: auto;
}
.rail .sec { padding: 10px 14px; border-top: 1px solid var(--border); }
.rail .sec:first-child { border-top: 0; }
.rail h4, .pop h4 { margin: 0 0 6px; font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.rail h4 small, .pop h4 small { font-weight: 400; color: var(--muted-foreground); }
.opt-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; }
.opt-row .box { width: 15px; height: 15px; border: 1px solid color-mix(in oklch, var(--foreground) 30%, transparent); border-radius: 4px; flex: none; display: grid; place-items: center; }
.opt-row.on .box { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.opt-row .c { margin-left: auto; color: var(--muted-foreground); font-size: 12px; }
.opt-row .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.range { display: flex; gap: 6px; align-items: center; }
.range span.in { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; color: var(--muted-foreground); background: var(--background); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
.sw { width: 30px; height: 17px; border-radius: 999px; background: var(--muted); position: relative; flex: none; border: 1px solid var(--border); }
.sw::after { content: ""; position: absolute; top: 1px; left: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .3); }
.sw.on { background: var(--primary); border-color: var(--primary); }
.sw.on::after { left: 14px; }
.rail-top { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.rail-top .search { max-width: none; }
.count { color: var(--muted-foreground); font-size: 13px; }

/* ---------- Cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s;
}
.card:hover { border-color: var(--primary); box-shadow: 0 0 20px 2px color-mix(in oklch, var(--primary) 30%, transparent); }
.shot { position: relative; aspect-ratio: 16 / 9; background: var(--muted); overflow: hidden; }
.shot > img.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .over-tl { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.shot .over-tl .chip { box-shadow: 0 1px 3px oklch(0 0 0 / .25); }
.shot .over-br {
  position: absolute; right: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 5px;
  background: oklch(0.15 0.01 260 / .62); color: oklch(0.97 0 0); backdrop-filter: blur(6px);
  border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 500;
}
.shot .outline-over {
  position: absolute; right: 8px; bottom: 8px; width: 34%; aspect-ratio: 4 / 3; border-radius: 8px;
  background: oklch(0.15 0.01 260 / .55); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 6px;
}
/* Outlines ship white, black or both, so they are flattened to one colour first. */
.shot .outline-over img { max-width: 100%; max-height: 100%; filter: brightness(0) invert(1) drop-shadow(0 0 1px oklch(0 0 0 / .5)); }
.body { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.maker { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted-foreground); min-width: 0; }
.maker .logo { width: 20px; height: 20px; object-fit: contain; flex: none; }
.maker .yr { margin-left: auto; font-variant-numeric: tabular-nums; }
.maker .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name { font-weight: 600; font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.stats div { padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stats div + div { border-left: 1px solid var(--border); }
.stats b { font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats small { font-size: 11px; color: var(--muted-foreground); }
.stats .na { color: var(--muted-foreground); font-weight: 400; }
.foot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted-foreground); padding-top: 9px; border-top: 1px solid var(--border); margin-top: auto; }
.foot b { color: var(--foreground); font-weight: 600; }
.layouts { display: flex; gap: 5px; }
.layouts span {
  width: 42px; height: 32px; border-radius: 6px; background: var(--muted); display: grid; place-items: center; padding: 3px;
  font-size: 11.5px; color: var(--muted-foreground); font-weight: 600;
}
.layouts img { max-width: 100%; max-height: 100%; filter: brightness(0); opacity: .7; }
.thumb.outline img { filter: brightness(0); opacity: .75; }
:root[data-theme="dark"] .layouts img, :root[data-theme="dark"] .thumb.outline img { filter: brightness(0) invert(1); opacity: .85; }

/* ---------- List ---------- */
.table { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.table table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted-foreground);
  padding: 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none;
}
.table th.s { cursor: pointer; }
.table th.s:hover { color: var(--foreground); }
.table th.on { color: var(--foreground); font-weight: 600; }
.table th.r, .table td.r { text-align: right; }
.table td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: middle; font-size: 13.5px; }
.table tr:first-child td { border-top: 0; }
.table tbody tr:hover { background: color-mix(in oklch, var(--accent) 55%, transparent); cursor: pointer; }
.thumb { width: 92px; height: 52px; border-radius: 6px; overflow: hidden; background: var(--muted); display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.outline { padding: 5px; }
.thumb.outline img { object-fit: contain; }
.tn { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tn b { font-weight: 600; }
.tn span { display: flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-size: 12.5px; }
.tn .logo { width: 16px; height: 16px; object-fit: contain; }
.bar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.bar i { display: block; width: 54px; height: 5px; border-radius: 3px; background: var(--muted); overflow: hidden; }
.bar i::before { content: ""; display: block; height: 100%; width: var(--w); background: var(--primary); opacity: .7; border-radius: 3px; }
.muted { color: var(--muted-foreground); }
.dots { display: inline-flex; align-items: center; gap: 4px; }

@media (max-width: 900px) {
  .with-rail { grid-template-columns: 1fr; }
  .rail { position: static; max-height: none; }
  .screen, .app-header { padding-left: 16px; padding-right: 16px; }
  .table { overflow-x: auto; }
  .pop { width: min(560px, 92vw); grid-template-columns: 1fr; }
}

/* ---------- Rail, interactive ---------- */
.with-rail { position: relative; }
.rail { padding: 0; top: 12px; }
.rail-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
.rail .sec { padding: 0; }
.rail .sec.plain { padding: 8px 14px; }
.sec-h { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 10px 14px; font-size: 12.5px; font-weight: 600; text-align: left; }
.sec-h:hover { background: color-mix(in oklch, var(--accent) 50%, transparent); }
.sec-h .n, .fly-h .n { background: var(--primary); color: var(--primary-foreground); border-radius: 999px; font-size: 11px; padding: 0 6px; font-weight: 600; }
.sec-h .push { flex: 1; }
.sec-h svg { color: var(--muted-foreground); }
.sec-b { padding: 0 14px 12px; }
.sum { padding: 0 14px 10px; margin-top: -4px; font-size: 12.5px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-row { padding: 0; gap: 2px; }
.opt-row .pick { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; border: 0; background: none; padding: 4px 4px; border-radius: 5px; text-align: left; font-size: 13px; }
.opt-row .pick:hover { background: var(--accent); }
.opt-row.part .box { background: color-mix(in oklch, var(--primary) 20%, transparent); border-color: var(--primary); color: var(--primary); }
.tw { border: 0; background: none; width: 18px; height: 22px; padding: 0; display: grid; place-items: center; color: var(--muted-foreground); border-radius: 4px; margin-left: -4px; }
.tw:hover { background: var(--accent); color: var(--foreground); }
.mini-search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; background: var(--background); color: var(--muted-foreground); }
.mini-search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--foreground); min-width: 0; flex: 1; }
.mini-search.grow { flex: 1; margin: 0; }
.pinned { border-bottom: 1px dashed var(--border); padding-bottom: 4px; margin-bottom: 4px; }
.scroll { max-height: 220px; overflow: auto; margin-right: -8px; padding-right: 8px; }
.scroll.tall { max-height: 300px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding-top: 2px; }
.az { position: sticky; top: 0; background: var(--card); font-size: 11px; font-weight: 700; color: var(--muted-foreground); padding: 6px 4px 2px; z-index: 1; }
.none { color: var(--muted-foreground); font-size: 12.5px; text-align: center; margin: 10px 0; }
.more-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 4px; border: 1px solid var(--border); background: var(--background); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; }
.more-btn:hover { border-color: var(--primary); color: var(--primary); }
button.switch-row { width: 100%; border: 0; background: none; padding: 5px 0; text-align: left; }
.switch-row .c { color: var(--muted-foreground); font-size: 12px; margin-left: 4px; }
.hist { display: flex; align-items: flex-end; gap: 1px; height: 34px; margin: 2px 0 0; }
.hist i { flex: 1; background: var(--muted); border-radius: 2px 2px 0 0; }
.hist i.in { background: color-mix(in oklch, var(--primary) 55%, transparent); }
.dual { position: relative; height: 18px; margin-bottom: 6px; }
.dual input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.dual input::-webkit-slider-runnable-track { height: 3px; background: transparent; }
.dual::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 3px; border-radius: 2px; background: var(--border); }
.dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 15px; height: 15px; margin-top: -6px; border-radius: 50%; background: var(--card); border: 2px solid var(--primary); cursor: grab; position: relative; z-index: 2; }
.range .unit { font-size: 12px; color: var(--muted-foreground); }
.grid.three { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.empty { padding: 60px 0; text-align: center; color: var(--muted-foreground); }
.flyout {
  position: absolute; z-index: 40; left: 262px; top: 0; width: min(640px, calc(100% - 262px)); max-height: min(78vh, 640px);
  display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 24px 60px -20px oklch(0.2 0.02 260 / .45);
}
.fly-h { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.icon-btn { border: 0; background: none; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted-foreground); }
.icon-btn:hover { background: var(--accent); color: var(--foreground); }
.letters { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; }
.letters a, .letters span { width: 20px; text-align: center; padding: 2px 0; border-radius: 4px; text-decoration: none; }
.letters a { color: var(--primary); }
.letters a:hover { background: var(--accent); }
.letters span { color: color-mix(in oklch, var(--muted-foreground) 45%, transparent); }
.fly-b { overflow: auto; padding: 4px 14px 10px; columns: 3 170px; column-gap: 18px; }
.fly-g { break-inside: avoid-column; }
.fly-g .az { position: static; background: none; }
.fly-f { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
.primary { background: var(--primary); color: var(--primary-foreground); border: 0; border-radius: 7px; padding: 6px 14px; font-weight: 500; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>

const icon = (n, s) => `<svg class="i" viewBox="0 0 24 24"${s ? ` style="width:${s}px;height:${s}px"` : ''}>${ICON[n]}</svg>`;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const DISC = { 'single-seater': 'Single-seater', sportscar: 'Sportscar', touring: 'Touring', road: 'Road' };
const PACK = { 'dream-pack-1': 'Dream Pack 1', 'dream-pack-2': 'Dream Pack 2', 'dream-pack-3': 'Dream Pack 3', 'red-pack': 'Red Pack', 'ready-to-race': 'Ready To Race', 'ferrari-70th': 'Ferrari 70th' };

const DIST = { lfm: 'LFM' };

// The provenance chips exactly as ProvenanceBadges draws them today.
const prov = (p) => {
  let label = { base: 'Base', dlc: 'DLC', mod: 'Mod' }[p.source];
  if (p.pack) label = `DLC - ${PACK[p.pack] ?? p.pack}`;
  else if (p.maker) label = MAKER[p.maker] ?? p.maker;
  return `<span class="chip p-${p.source}">${label}</span>${p.distributor ? `<span class="chip p-dist">${DIST[p.distributor]}</span>` : ''}`;
};
const flag = (f, title, keep) => (f.url ? `<img class="flag" src="${f.url}" alt="" title="${esc(title)}">` : (keep ? '<span class="flag none"></span>' : ''));

// A car's or a circuit's place in the ladder: which disciplines race it, coloured, and how many championships.
const raced = (item, compact) => {
  const d = Object.keys(item.disciplines);
  if (item.series === 0) return `<span class="muted">${compact ? '-' : 'No championship races it yet'}</span>`;
  if (compact) {
    return `<span class="dots">${d.map((x) => `<i class="dot d-${x}" title="${DISC[x]}"></i>`).join('')}<b class="num" style="margin-left:4px">${item.series}</b></span>`;
  }
  return `<span style="margin-right:4px"><b class="num">${item.series}</b> championship${item.series === 1 ? '' : 's'}</span>${d.map((x) => `<span class="chip d-${x}" style="font-size:11px;padding:3px 6px">${DISC[x]}</span>`).join('')}`;
};

      ${t.layouts.length > 1 ? `<div class="layouts">${shown.map((l) => `<span title="${esc(l.name)}">${l.outline ? `<img src="${l.outline}" alt="">` : ''}</span>`).join('')}${t.layouts.length > shown.length ? `<span>+${t.layouts.length - shown.length}</span>` : ''}</div>` : ''}
      <div class="foot">${icon('trophy', 13)} ${raced(t)}</div>
    </div>
  </article>`;
};
const trackSorts = { name: (a, b) => a.name.localeCompare(b.name), country: (a, b) => (a.country ?? 'zz').localeCompare(b.country ?? 'zz'), len: (a, b) => (b.len?.[1] ?? 0) - (a.len?.[1] ?? 0), pits: (a, b) => (b.pits?.[1] ?? 0) - (a.pits?.[1] ?? 0), layouts: (a, b) => b.layouts.length - a.layouts.length, series: (a, b) => b.series - a.series };
const trackList = (tracks) => {
  const th = (k, label, r) => `<th class="s${r ? ' r' : ''}${state.sort === k ? ' on' : ''}" data-sort="${k}">${label}${state.sort === k ? ' ↓' : ''}</th>`;
  return `<div class="table"><table>
    <thead><tr><th></th>${th('name', 'Circuit')}${th('country', 'Country')}${th('layouts', 'Layouts', 1)}${th('len', 'Length', 1)}${th('pits', 'Pit boxes', 1)}<th>Located</th>${th('series', 'Championships')}<th>Source</th></tr></thead>
    <tbody>${tracks.map((t) => `<tr>
      <td style="width:108px"><div class="thumb outline">${t.layouts[0].outline ? `<img src="${t.layouts[0].outline}" alt="">` : ''}</div></td>
      <td><div class="tn"><b>${esc(t.name)}</b></div></td>
      <td><span class="tn"><span>${flag(t.flag, t.country, 1)} ${esc(t.country ?? '-')}</span></span></td>
      <td class="r num">${t.layouts.length}</td>
      <td class="r num">${lenLabel(t) ? `${lenLabel(t)} <span class="muted">km</span>` : '<span class="muted">-</span>'}</td>
      <td class="r num">${pitLabel(t) ?? '<span class="muted">-</span>'}</td>
      <td>${t.located ? icon('pin', 14) : '<span class="muted">-</span>'}</td>
      <td>${raced(t, true)}</td>
      <td><div class="tags">${prov(t.prov)}</div></td>
    </tr>`).join('')}</tbody></table></div>`;
};

/* ---------------- Filter rail ---------------- */
const FLAGS = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/gui/NationFlags/';
const fl = (code) => (code ? `<img class="flag" src="${FLAGS}${code}.png" alt="">` : '<span class="flag none"></span>');
const F = DATA.facets;
const TOP = 5;

// What is picked, per page. Sets of values; ranges as [from, to] or null.
const blank = () => ({
  source: new Set(), klass: new Set(), spec: new Set(), brand: new Set(), country: new Set(),
  raced: false, skins: false, located: false, year: null, power: null, length: null, pits: null,
});
const sel = { cars: blank(), tracks: blank() };
const ui = { closed: new Set(), tree: new Set(), all: new Set(), q: {}, flyout: null, flyQ: '', focus: null };

const S = () => sel[state.page];
const toggleIn = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));

const row = ({ key, value, label, count, lead = '', indent = 0, tree = null, partial = false }) => {
  const on = S()[key].has(value);
  return `<div class="opt-row${on ? ' on' : ''}${partial && !on ? ' part' : ''}" style="padding-left:${indent * 18}px">
    ${tree === null ? '' : `<button class="tw" data-tree="${esc(tree)}" aria-label="Expand">${icon(ui.tree.has(tree) ? 'chev' : 'chevr', 13)}</button>`}
    <button class="pick" data-key="${key}" data-value="${esc(value)}"><span class="box">${on ? icon('check', 11) : (partial ? icon('minus', 11) : '')}</span>${lead}<span class="lbl">${esc(label)}</span><span class="c num">${fmt(count)}</span></button>
  </div>`;
};

const section = (id, title, body, picked = []) => {
  const closed = ui.closed.has(id);
  return `<div class="sec${closed ? ' closed' : ''}">
    <button class="sec-h" data-sec="${id}"><span>${title}</span>
      ${picked.length ? `<span class="n">${picked.length}</span>` : ''}
      <span class="push"></span>${icon(closed ? 'chevr' : 'chev', 14)}</button>
    ${closed ? (picked.length ? `<div class="sum">${esc(picked.slice(0, 2).join(', '))}${picked.length > 2 ? ` +${picked.length - 2}` : ''}</div>` : '') : `<div class="sec-b">${body}</div>`}
  </div>`;
};

// A long list: what is picked pinned first, then the biggest few, then a way into the rest.
const longList = (id, key, items, noun, lead) => {
  const s = S()[key];
  const q = (ui.q[id] ?? '').trim().toLowerCase();
  const search = `<label class="mini-search">${icon('search', 13)}<input id="q-${id}" data-q="${id}" placeholder="Find a ${noun}" value="${esc(ui.q[id] ?? '')}"></label>`;
  const asRow = ([value, label, count]) => row({ key, value, label, count, lead: lead ? lead(value) : '' });

  if (q) {
    const hits = items.filter(([v, l]) => l.toLowerCase().includes(q) || String(v).toLowerCase().includes(q));
    return `${search}<div class="scroll">${hits.length ? hits.map(asRow).join('') : `<p class="none">No ${noun} matches</p>`}</div>`;
  }

  const pinned = items.filter(([v]) => s.has(v));
  if (state.long === 'inline' && ui.all.has(id)) {
    // Everything, A to Z, in a box of its own height, so the rail never grows past it.
    const az = [...items].sort((a, b) => a[1].localeCompare(b[1]));
    let letter = '';
    const body = az.map((it) => {
      const l = it[1][0].toUpperCase();
      const head = l !== letter ? `<div class="az">${(letter = l)}</div>` : '';
      return head + asRow(it);
    }).join('');
    return `${search}${pinned.length ? `<div class="pinned">${pinned.map(asRow).join('')}</div>` : ''}<div class="scroll tall">${body}</div>
      <button class="linkish" data-all="${id}">Show fewer</button>`;
  }
  const top = items.filter(([v]) => !s.has(v)).slice(0, TOP);
  const more = items.length - pinned.length - top.length;
  return `${items.length > 8 ? search : ''}
    ${pinned.length ? `<div class="pinned">${pinned.map(asRow).join('')}</div>` : ''}
    ${top.map(asRow).join('')}
    ${more > 0 ? (state.long === 'inline'
    ? `<button class="linkish" data-all="${id}">Show all ${items.length}</button>`
    : `<button class="more-btn" data-fly="${id}">All ${items.length} ${noun === 'brand' ? 'brands' : `${noun === 'country' ? 'countries' : 'classes'}`} ${icon('chevr', 13)}</button>`) : ''}`;
};

// A range with the library's own spread drawn under it, so you can see where the cars are before you drag.
const range = (id, title, unit, h, key, step, show = (v) => fmt(v)) => {
  const [from, to] = S()[key] ?? [h.lo, h.hi];
  const max = Math.max(...h.bins);
  const w = (h.hi - h.lo) / h.bins.length;
  const bars = h.bins.map((n, i) => {
    const inside = h.lo + (i + 1) * w > from && h.lo + i * w < to;
    return `<i class="${inside ? 'in' : ''}" style="height:${Math.max(4, (n / max) * 100)}%"></i>`;
  }).join('');
  const body = `<div class="hist" id="h-${id}">${bars}</div>
    <div class="dual" data-range="${key}" data-lo="${h.lo}" data-hi="${h.hi}">
      <input type="range" min="${h.lo}" max="${h.hi}" step="${step}" value="${from}" aria-label="${title} from">
      <input type="range" min="${h.lo}" max="${h.hi}" step="${step}" value="${to}" aria-label="${title} to">
    </div>
    <div class="range"><span class="in num" id="f-${id}">${show(from)}</span>-<span class="in num" id="t-${id}">${show(to)}</span><span class="unit">${unit}</span></div>`;
  return section(id, title, body, S()[key] ? [`${show(from)}-${show(to)} ${unit}`] : []);
};

const sw = (key, label, count) => `<button class="switch-row" data-sw="${key}"><span>${label} <span class="c num">${fmt(count)}</span></span><span class="sw${S()[key] ? ' on' : ''}"></span></button>`;

// Source as a tree: a pack is a kind of DLC and a maker a kind of mod, so they live under it rather than in a section of their own.
const sourceTree = (src) => {
  const s = S().source;
  const parent = (value, label, count, kids) => {
    const partial = kids.some(([v]) => s.has(v));
    return `${row({ key: 'source', value, label, count, lead: `<i class="dot p-${value}"></i>`, tree: kids.length ? `src-${value}` : null, partial })}
      ${ui.tree.has(`src-${value}`) ? kids.map(([v, l, n]) => row({ key: 'source', value: v, label: l, count: n, indent: 1 })).join('') : ''}`;
  };
  const mods = [...src.makers, ...src.dists.map(([v, l, n]) => [v, `via ${l}`, n])];
  const body = `${parent('base', 'Base game', src.base, [])}${parent('dlc', 'DLC', src.dlc, src.packs)}${parent('mod', 'Mod', src.mod, mods)}`;
  const names = { base: 'Base game', dlc: 'DLC', mod: 'Mod' };
  [...src.packs, ...mods].forEach(([v, l]) => { names[v] = l; });
  return section('source', 'Source', body, [...s].map((v) => names[v]));
};

// Class as a tree over its specs, so picking a grid never means scrolling a list of ninety.
const classTree = () => {
  const s = S();
  const q = (ui.q.klass ?? '').trim().toLowerCase();
  const node = ([name, count, specs]) => {
    const partial = specs.some(([sp]) => s.spec.has(sp));
    const kids = ui.tree.has(`cls-${name}`) || q ? specs.filter(([sp]) => !q || sp.toLowerCase().includes(q) || name.toLowerCase().includes(q)) : [];
    return row({ key: 'klass', value: name, label: name, count, tree: specs.length > 1 ? `cls-${name}` : null, partial })
      + kids.map(([sp, n]) => row({ key: 'spec', value: sp, label: sp, count: n, indent: 1 })).join('');
  };
  const all = F.cars.classes;
  let list;
  if (q) list = all.filter(([n, , specs]) => n.toLowerCase().includes(q) || specs.some(([sp]) => sp.toLowerCase().includes(q)));
  else if (ui.all.has('klass') || state.long === 'flyout') list = ui.all.has('klass') ? all : all.slice(0, 6);
  else list = all.filter(([n, , specs]) => s.klass.has(n) || specs.some(([sp]) => s.spec.has(sp)) || all.indexOf(all.find((x) => x[0] === n)) < 6);
  const body = `<label class="mini-search">${icon('search', 13)}<input id="q-klass" data-q="klass" placeholder="Find a class or spec" value="${esc(ui.q.klass ?? '')}"></label>
    <div class="${ui.all.has('klass') ? 'scroll tall' : ''}">${list.map(node).join('')}
    ${!q && (ui.all.has('klass') || list.length === all.length) ? row({ key: 'klass', value: '-', label: 'Unclassified', count: F.cars.unclassified }) : ''}</div>
    ${q ? '' : `<button class="linkish" data-all="klass">${ui.all.has('klass') ? 'Show fewer' : `Show all ${all.length}`}</button>`}`;
  return section('klass', 'Class', body, [...s.klass, ...s.spec]);
};

const railCars = () => {
  const s = S();
  const brands = F.cars.brands.map(([b, n]) => [b, b, n]);
  const countries = [...F.cars.countries.map(([c, name, n]) => [c, name, n]), ['-', 'Unknown', F.cars.countryUnknown]];
  return `
    <div class="sec plain">${sw('raced', 'Raced in a championship', F.cars.raced)}${sw('skins', 'Has liveries', F.cars.skinned)}</div>
    ${classTree()}
    ${sourceTree(F.cars.sources)}
    ${section('brand', 'Brand', longList('brand', 'brand', brands, 'brand'), [...s.brand])}
    ${section('country', 'Country', longList('country', 'country', countries, 'country', (v) => fl(v === '-' ? null : v)), [...s.country].map((c) => countries.find((x) => x[0] === c)?.[1]))}
    ${range('year', 'Year', '', F.cars.year, 'year', 1, (v) => String(v))}
    ${range('power', 'Power', 'bhp', F.cars.power, 'power', 10)}`;
};
const railTracks = () => {
  const s = S();
  const countries = [...F.tracks.countries.map(([c, name, n]) => [c, name, n]), ['-', 'Unknown', F.tracks.countryUnknown]];
  return `
    <div class="sec plain">${sw('raced', 'Raced in a championship', F.tracks.raced)}${sw('located', 'Located', F.tracks.located)}</div>
    ${sourceTree(F.tracks.sources)}
    ${section('country', 'Country', longList('country', 'country', countries, 'country', (v) => fl(v === '-' ? null : v)), [...s.country].map((c) => countries.find((x) => x[0] === c)?.[1]))}
    ${range('length', 'Length', 'km', F.tracks.length, 'length', 100, (v) => km(v))}
    ${range('pits', 'Pit boxes', '', F.tracks.pits, 'pits', 1)}`;
};

// The flyout: the whole of one long list laid out beside the rail, A to Z in columns.
const flyout = () => {
  const id = ui.flyout;
  if (!id) return '';
  const cars = state.page === 'cars';
  let items; let lead = () => ''; let key = id; let noun;
  if (id === 'brand') { items = F.cars.brands.map(([b, n]) => [b, b, n]); noun = 'brands'; }
  if (id === 'country') {
    const f = cars ? F.cars : F.tracks;
    items = [...f.countries, ['-', 'Unknown', f.countryUnknown]]; lead = (v) => fl(v === '-' ? null : v); noun = 'countries';
  }
  if (id === 'klass') { items = F.cars.classes.map(([n, c]) => [n, n, c]); key = 'klass'; noun = 'classes'; }
  const q = ui.flyQ.trim().toLowerCase();
  const az = items.filter(([v, l]) => !q || l.toLowerCase().includes(q)).sort((a, b) => a[1].localeCompare(b[1]));
  const groups = {};
  az.forEach((it) => { (groups[it[1][0].toUpperCase()] ??= []).push(it); });
  const letters = Object.keys(groups);
  const picked = S()[key].size;
  return `<div class="flyout" id="flyout">
    <div class="fly-h"><b>All ${items.length} ${noun}</b>
      <label class="mini-search grow">${icon('search', 13)}<input id="q-fly" data-flyq placeholder="Find" value="${esc(ui.flyQ)}"></label>
      <button class="icon-btn" data-fly-close aria-label="Close">${icon('x', 15)}</button></div>
    <div class="letters">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l) => (groups[l] ? `<a href="#fl-${l}" data-letter="${l}">${l}</a>` : `<span>${l}</span>`)).join('')}</div>
    <div class="fly-b">${letters.map((l) => `<div class="fly-g" id="fl-${l}"><div class="az">${l}</div>${groups[l].map(([v, label, n]) => row({ key, value: v, label, count: n, lead: lead(v) })).join('')}</div>`).join('') || '<p class="none">Nothing matches</p>'}</div>
    <div class="fly-f"><span class="count">${picked ? `${picked} picked` : 'Nothing picked'}</span>
      ${picked ? `<button class="linkish" data-fly-clear>Clear</button>` : ''}<span class="push"></span><button class="primary" data-fly-close>Done</button></div>
  </div>`;
};

/* ---------------- Applying the picks to the sample ---------------- */
const passes = (item) => {
  const s = S();
  const cars = state.page === 'cars';
  const p = item.prov;
  if (s.source.size && ![p.source, p.pack, p.maker, p.distributor].some((v) => v && s.source.has(v))) return false;
  if (cars && (s.klass.size || s.spec.size)) {
    const cls = item.classes.length ? item.classes : ['-'];
    if (!cls.some((c) => s.klass.has(c)) && !item.specs.some((sp) => s.spec.has(sp))) return false;
  }
  if (s.brand.size && !s.brand.has(item.brand)) return false;
  if (s.country.size && !s.country.has(item.countryCode ?? '-')) return false;
  if (s.raced && !item.series) return false;
  if (s.skins && !item.skins) return false;
  if (s.located && !item.located) return false;
  const inRange = (r, v) => !r || (v != null && v >= r[0] && v <= r[1]);
  if (cars && (!inRange(s.year, item.year) || !inRange(s.power, item.bhp))) return false;
  if (!cars && s.length && !(item.len && item.len[1] >= s.length[0] && item.len[0] <= s.length[1])) return false;
  if (!cars && s.pits && !(item.pits && item.pits[1] >= s.pits[0] && item.pits[0] <= s.pits[1])) return false;
  return true;
};

const pills = () => {
  const s = S();
  const out = [];
  const names = (v) => v;
  [['source', 'Source'], ['klass', 'Class'], ['spec', 'Spec'], ['brand', 'Brand'], ['country', 'Country']].forEach(([k, t]) => {
    s[k].forEach((v) => {
      let label = names(v);
      if (k === 'country') label = (state.page === 'cars' ? F.cars : F.tracks).countries.find((c) => c[0] === v)?.[1] ?? 'Unknown';
      if (k === 'source') label = { base: 'Base game', dlc: 'DLC', mod: 'Mod' }[v] ?? [...F.cars.sources.packs, ...F.cars.sources.makers, ...F.tracks.sources.packs, ...F.cars.sources.dists].find((x) => x[0] === v)?.[1] ?? v;
      if (k === 'klass' && v === '-') label = 'Unclassified';
      out.push(`<span class="pill">${t}: <b>${esc(label)}</b><button class="x" data-unpick="${k}" data-value="${esc(v)}">${icon('x', 12)}</button></span>`);
    });
  });
  [['raced', 'Raced in a championship'], ['skins', 'Has liveries'], ['located', 'Located']].forEach(([k, t]) => {
    if (s[k]) out.push(`<span class="pill"><b>${t}</b><button class="x" data-sw="${k}">${icon('x', 12)}</button></span>`);
  });
  [['year', 'Year', String], ['power', 'Power', (v) => `${fmt(v)} bhp`], ['length', 'Length', (v) => `${km(v)} km`], ['pits', 'Pit boxes', fmt]].forEach(([k, t, f]) => {
    if (s[k]) out.push(`<span class="pill">${t}: <b>${f(s[k][0])}-${f(s[k][1])}</b><button class="x" data-unrange="${k}">${icon('x', 12)}</button></span>`);
  });
  return out;
};

const viewToggle = () => `<button data-k="view" data-v="cards" aria-pressed="${state.view === 'cards'}" title="Cards">${icon('grid')}</button><button data-k="view" data-v="list" aria-pressed="${state.view === 'list'}" title="List">${icon('list')}</button>`;
const SORT_NAMES = { name: 'Name', year: 'Year', bhp: 'Power', kg: 'Weight', pw: 'Power to weight', skins: 'Liveries', series: 'Championships', country: 'Country', len: 'Length', pits: 'Pit boxes', layouts: 'Layouts' };
const sortName = () => `Sort: ${SORT_NAMES[state.sort]}`;

/* ---------------- Rationale ---------------- */
const WHY = {
  rail: `<b>The rail.</b> Every section folds. A folded section with something picked still says what, under its heading. Whatever you pick in a long list is pinned to its top, so it never scrolls out of sight. The two lists that are really one level below another become trees: <b>Source</b> holds DLC packs, mod makers and LFM, and <b>Class</b> holds its specs. That removes the separate Spec, Pack, Maker and Redistributor filters, which were six of today's ten buttons. Year, power, length and pit boxes become sliders drawn over the library's own spread, so you can see where the cars actually are.`,
  inline: `<b>1 - Inline.</b> A long list (Brand's 77, Class's 23, Country) shows its five biggest values and a search box. <b>Show all</b> turns the section into a box of its own fixed height, sorted A to Z with letter headings, that scrolls inside the rail. The rail never grows past one screen's worth of a single list. Typing searches the whole list straight away.`,
  flyout: `<b>2 - Flyout.</b> A long list shows its five biggest values, then <b>All 77 brands</b>. That opens a wide panel beside the rail with the whole list in A to Z columns, a letter index to jump with, a search box and Done. The rail itself never changes height. It suits Brand best, since 77 names fit on one screen across three columns.`,
  cards: `<b>Cards.</b> The photo carries the source chips and the livery count. Below it are the maker's logo, a flag, the specs, three figures in a fixed strip, and which disciplines race the car in how many championships.`,
  cardsT: `<b>Cards.</b> The first layout's outline is laid over the photo, each layout gets a small outline, and the footer says which disciplines hold rounds there.`,
  list: `<b>List.</b> A spec sheet for comparing. Sort by clicking a column heading.`,
  listT: `<b>List.</b> One row per circuit, with its outline as the thumbnail. Sort by clicking a column heading.`,
};

const render = () => {
  document.querySelectorAll('.picker .opt[data-k]').forEach((b) => b.setAttribute('aria-pressed', String(state[b.dataset.k] === b.dataset.v)));
  document.getElementById('nav-cars').className = state.page === 'cars' ? 'on' : '';
  document.getElementById('nav-tracks').className = state.page === 'tracks' ? 'on' : '';
  const cars = state.page === 'cars';
  const items = [...(cars ? DATA.cars : DATA.tracks)].filter(passes).sort((cars ? carSorts : trackSorts)[state.sort] ?? (() => 0));
  let content = state.view === 'cards'
    ? `<div class="grid three">${items.map(cars ? carCard : trackCard).join('')}</div>`
    : (cars ? carList(items) : trackList(items));
  if (!items.length) content = '<div class="empty">None of the sample matches. The counts in the rail are the whole library\'s.</div>';
  const p = pills();

  const title = `<div class="title-row"><div><h2>${cars ? 'Cars' : 'Tracks'}</h2><p>${cars ? '622 cars in your library' : '97 circuits and 323 layouts in your library'}</p></div></div>`;
  document.getElementById('screen').innerHTML = `${title}<div class="with-rail">
    <aside class="rail" id="rail"><div class="rail-h"><b>Filters</b>${p.length ? '<button class="linkish" data-clear>Clear all</button>' : ''}</div>${cars ? railCars() : railTracks()}</aside>
    ${flyout()}
    <div>
      <div class="rail-top"><div class="search">${icon('search')} ${cars ? 'Search cars by name, brand, folder or tag' : 'Search circuits by name, country or folder'}</div>
        <button class="facet solid">${icon('sort', 13)} ${sortName()}</button><div class="seg">${viewToggle()}</div></div>
      <div class="active-row">${p.join('')}<span class="num" style="margin-left:${p.length ? 8 : 0}px">Showing ${items.length} of the ${cars ? 16 : 12} in this mockup</span></div>
      ${content}</div></div>`;

  const view = state.view === 'cards' ? (cars ? WHY.cards : WHY.cardsT) : (cars ? WHY.list : WHY.listT);
  document.getElementById('why').innerHTML = `<ul><li>${WHY.rail}</li><li>${WHY[state.long]}</li><li>${view}</li>
    <li><b>Try it:</b> the rail works on the sample. Counts are the whole library's, and the grid narrows over the 16 cars and 12 circuits drawn here.</li></ul>`;

  bind();
  if (ui.focus) {
    const el = document.getElementById(ui.focus);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
};

const bind = () => {
  const on = (sel_, ev, fn) => document.querySelectorAll(sel_).forEach((el) => el.addEventListener(ev, fn));
  on('#screen [data-k]', 'click', (e) => { state[e.currentTarget.dataset.k] = e.currentTarget.dataset.v; render(); });
  on('th[data-sort]', 'click', (e) => { state.sort = e.currentTarget.dataset.sort; render(); });
  on('[data-key]', 'click', (e) => { const { key, value } = e.currentTarget.dataset; toggleIn(S()[key], value); render(); });
  on('[data-tree]', 'click', (e) => { toggleIn(ui.tree, e.currentTarget.dataset.tree); render(); });
  on('[data-sec]', 'click', (e) => { toggleIn(ui.closed, e.currentTarget.dataset.sec); render(); });
  on('[data-all]', 'click', (e) => { toggleIn(ui.all, e.currentTarget.dataset.all); render(); });
  on('[data-sw]', 'click', (e) => { const k = e.currentTarget.dataset.sw; S()[k] = !S()[k]; render(); });
  on('[data-unpick]', 'click', (e) => { S()[e.currentTarget.dataset.unpick].delete(e.currentTarget.dataset.value); render(); });
  on('[data-unrange]', 'click', (e) => { S()[e.currentTarget.dataset.unrange] = null; render(); });
  on('[data-clear]', 'click', () => { sel[state.page] = blank(); render(); });
  on('[data-q]', 'input', (e) => { ui.q[e.target.dataset.q] = e.target.value; ui.focus = e.target.id; render(); });
  on('[data-q]', 'blur', () => { ui.focus = null; });
  on('[data-fly]', 'click', (e) => { e.stopPropagation(); ui.flyout = e.currentTarget.dataset.fly; ui.flyQ = ''; render(); });
  on('[data-fly-close]', 'click', () => { ui.flyout = null; render(); });
  on('[data-fly-clear]', 'click', () => { S()[ui.flyout].clear(); render(); });
  on('[data-flyq]', 'input', (e) => { ui.flyQ = e.target.value; ui.focus = 'q-fly'; render(); });
  on('[data-letter]', 'click', (e) => { e.preventDefault(); document.getElementById(`fl-${e.currentTarget.dataset.letter}`)?.scrollIntoView({ block: 'start', behavior: 'smooth' }); });
  document.querySelectorAll('.dual').forEach((d) => {
    const key = d.dataset.range;
    const [a, b] = d.querySelectorAll('input');
    const id = { year: 'year', power: 'power', length: 'length', pits: 'pits' }[key];
    const show = key === 'length' ? km : (key === 'year' ? String : fmt);
    const live = () => {
      let lo = +a.value; let hi = +b.value;
      if (lo > hi) [lo, hi] = [hi, lo];
      document.getElementById(`f-${id}`).textContent = show(lo);
      document.getElementById(`t-${id}`).textContent = show(hi);
      const bins = document.querySelectorAll(`#h-${id} i`);
      const w = (+d.dataset.hi - +d.dataset.lo) / bins.length;
      bins.forEach((bin, i) => bin.classList.toggle('in', +d.dataset.lo + (i + 1) * w > lo && +d.dataset.lo + i * w < hi));
      return [lo, hi];
    };
    [a, b].forEach((inp) => {
      inp.addEventListener('input', live);
      inp.addEventListener('change', () => {
        const [lo, hi] = live();
        S()[key] = lo === +d.dataset.lo && hi === +d.dataset.hi ? null : [lo, hi];
        render();
      });
    });
  });
};
document.addEventListener('click', (e) => {
  const f = document.getElementById('flyout');
  if (f && !f.contains(e.target) && !e.target.closest('[data-fly]') && document.contains(e.target)) { ui.flyout = null; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.flyout) { ui.flyout = null; render(); } });
document.querySelectorAll('.picker .opt[data-k]').forEach((b) => b.addEventListener('click', () => {
  state[b.dataset.k] = b.dataset.v;
  if (b.dataset.k === 'page') { state.sort = 'name'; ui.flyout = null; ui.q = {}; ui.all.clear(); }
  render();
}));
document.getElementById('theme').addEventListener('click', (e) => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  e.currentTarget.setAttribute('aria-pressed', String(dark));
});
render();
</script>
</body>
</html>
