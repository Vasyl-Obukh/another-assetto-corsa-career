<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver nation picker</title>
<style>
/* Tokens copied from src/renderer/src/globals.css. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --accent: oklch(0.925 0.018 255);
  --border: oklch(0.885 0.01 255);
  --input: oklch(0.885 0.01 255);
  --warning: oklch(0.79 0.15 80);
  --warning-foreground: oklch(0.28 0.06 70);
  --destructive: oklch(0.58 0.22 27);
  --works: oklch(0.91 0.075 320); --works-fg: oklch(0.38 0.15 320);
  --independent: oklch(0.92 0.06 18); --independent-fg: oklch(0.42 0.13 22);
  --privateer: oklch(0.93 0.055 132); --privateer-fg: oklch(0.4 0.09 135);
  --custom: oklch(0.93 0.05 340); --custom-fg: oklch(0.42 0.14 340);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --input: oklch(1 0 0 / 15%);
  --warning: oklch(0.8 0.14 82);
  --warning-foreground: oklch(0.2 0.04 70);
  --works: oklch(0.34 0.085 320); --works-fg: oklch(0.87 0.11 320);
  --independent: oklch(0.33 0.07 18); --independent-fg: oklch(0.86 0.09 22);
  --privateer: oklch(0.32 0.06 132); --privateer-fg: oklch(0.86 0.08 135);
  --custom: oklch(0.33 0.07 340); --custom-fg: oklch(0.86 0.1 340);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.muted { color: var(--muted-foreground); }
.small { font-size: 12px; }
h1, h2, h3, h4, p { margin: 0; }

.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker strong { font-weight: 600; margin-right: 4px; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 5px 12px; color: inherit; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.picker .sep { width: 1px; align-self: stretch; background: color-mix(in oklch, var(--background) 30%, transparent); margin: 0 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 28px; }
.lead { color: var(--muted-foreground); max-width: 90ch; font-size: 13.5px; }
.lead b { color: var(--foreground); font-weight: 600; }
section > h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.c-works { background: var(--works); color: var(--works-fg); }
.c-independent { background: var(--independent); color: var(--independent-fg); }
.c-privateer { background: var(--privateer); color: var(--privateer-fg); }
.in { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--input); border-radius: 7px; background: var(--card); min-width: 0; white-space: nowrap; overflow: hidden; }
.in.btn { cursor: pointer; }
.in.sel::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); opacity: .5; flex: none; }
.in.open { box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 25%, transparent); border-color: var(--primary); }
.in.pale { color: var(--muted-foreground); }
.in .txt { overflow: hidden; text-overflow: ellipsis; }
.code { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }

/* A flag is AC's own 48px PNG, drawn at a card's proportions. */
.flag { width: 20px; height: 14px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .12); }
.flag.lg { width: 26px; height: 18px; }
.flag.dim { opacity: .45; filter: saturate(.4); }
.noflag { width: 20px; height: 14px; border-radius: 2px; border: 1px dashed var(--border); flex: none; }

table.sheet { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.sheet th { font-size: 12px; color: var(--muted-foreground); font-weight: 400; text-align: left; padding: 0 4px 4px; }
table.sheet td { padding: 2px 4px; }
table.sheet td.n { width: 28px; text-align: right; font-size: 12px; color: var(--muted-foreground); }
table.sheet tr.run td { padding: 14px 4px 4px 36px; font-size: 12px; font-weight: 600; color: var(--muted-foreground); }
.grip { width: 24px; color: var(--muted-foreground); text-align: center; }
.runline { display: flex; align-items: center; gap: 8px; }

.pop { position: absolute; z-index: 20; width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 18px 40px -16px oklch(0 0 0 / .45); display: flex; flex-direction: column; overflow: hidden; }
.pop .search { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.pop .search input { border: 0; outline: 0; background: transparent; flex: 1; }
.pop .list { max-height: 300px; overflow-y: auto; padding: 4px; }
.pop .grp { font-size: 11.5px; font-weight: 600; color: var(--muted-foreground); padding: 8px 8px 4px; }
.pop .it { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.pop .it:hover, .pop .it.hover { background: var(--accent); }
.pop .it.on { font-weight: 600; }
.pop .it .code { margin-left: auto; }
.pop .it .tick { width: 14px; color: var(--primary); flex: none; }
.pop .count { font-size: 11px; color: var(--muted-foreground); background: var(--muted); padding: 1px 6px; border-radius: 99px; }

.grid2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
.dlg { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; }
.hint { font-size: 12px; color: var(--muted-foreground); }
.tile { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tile .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.notes { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
.notes code, .lead code { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 12.5px; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
.notes ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
.cmp td, .cmp th { padding: 5px 8px; border-top: 1px solid var(--border); text-align: left; }
.cmp th { font-weight: 500; color: var(--muted-foreground); font-size: 12px; border-top: 0; }
.bad { color: var(--destructive); font-weight: 600; }
.tagteam { font-size: 11px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
</style>
</head>
<body>
<div class="picker">
  <strong>Seat sheet</strong>
  <button class="opt" data-opt="A">A · Flag and name</button>
  <button class="opt" data-opt="B">B · Flag and code, compact</button>
  <button class="opt" data-opt="C">C · Follows the team</button>
  <span class="sep"></span>
  <strong>Language</strong>
  <button class="opt" data-lang="en">English</button>
  <button class="opt" data-lang="uk">Українська</button>
  <span class="sep"></span>
  <button class="opt" data-theme-btn="light">Light</button>
  <button class="opt" data-theme-btn="dark">Dark</button>
</div>
<div class="wrap" id="root"></div>

// AC's flag codes are ISO 3166-1 alpha-3 plus the four home nations; the
// labels come from Intl.DisplayNames over the alpha-2 code, so they translate.
const ALPHA2 = { ARE:'AE', ARG:'AR', AUS:'AU', AUT:'AT', BEL:'BE', BRA:'BR', CAN:'CA', CHE:'CH', CHL:'CL', CHN:'CN', COL:'CO', CZE:'CZ', DEU:'DE', DNK:'DK', ESP:'ES', EST:'EE', FIN:'FI', FRA:'FR', GBR:'GB', GRC:'GR', HKG:'HK', HRV:'HR', HUN:'HU', IND:'IN', IRL:'IE', ITA:'IT', JPN:'JP', MCO:'MC', MEX:'MX', MYS:'MY', NLD:'NL', NOR:'NO', NZL:'NZ', POL:'PL', PRT:'PT', SAU:'SA', SWE:'SE', THA:'TH', UKR:'UA', USA:'US', ZAF:'ZA' };
const HOME = { en: { ENG: 'England', SCT: 'Scotland', WLS: 'Wales', NIR: 'Northern Ireland' }, uk: { ENG: 'Англія', SCT: 'Шотландія', WLS: 'Уельс', NIR: 'Північна Ірландія' } };
const T = {
  en: { driver: 'Driver', nation: 'Nation', team: 'Team', car: 'Car and livery', search: 'Search nations', used: 'In this championship', all: 'All nations', none: 'No nation', fromClass: 'Drawn from the class', teamNation: 'Team nation', teamHint: "Empty seats race under the team's flag.", sameTeam: 'Same as the team' },
  uk: { driver: 'Пілот', nation: 'Країна', team: 'Команда', car: 'Авто та лівреї', search: 'Пошук країни', used: 'У цьому чемпіонаті', all: 'Усі країни', none: 'Без країни', fromClass: 'Обирається з класу', teamNation: 'Країна команди', teamHint: 'Місце без країни виступає під прапором команди.', sameTeam: 'Як у команди' },
};
const state = { opt: 'A', lang: 'en', theme: 'light' };
const nameOf = (code) => HOME[state.lang][code] ?? new Intl.DisplayNames([state.lang], { type: 'region' }).of(ALPHA2[code]);
const flag = (code, cls = '') => (FLAGS[code] ? `<img class="flag ${cls}" src="${FLAGS[code]}" alt="">` : '<span class="noflag"></span>');

const TEAMS = [
  { name: 'Prema Junior', budget: 'works', nation: 'ITA' },
  { name: 'Van Amersfoort Racing', budget: 'privateer', nation: 'NLD' },
  { name: 'R-ace GP', budget: 'independent', nation: 'FRA' },
];
const SEATS = [
  [0, 'Gioele Bortolussi', 'ITA'], [0, 'Rashid Al Mansoori', 'ARE'], [0, '', null],
  [1, 'Levin Zürcher', 'CHE'], [1, 'Kacper Dziedzic', 'POL'], [1, 'Tijmen van der Berg', null],
  [2, 'Hugo Delacroix', 'FRA'], [2, 'Oliver Hartley', 'GBR'],
];
const budgetLabel = { works: 'Works', privateer: 'Privateer', independent: 'Independent' };
const used = () => { const c = {}; SEATS.forEach(([, , n]) => { if (n) c[n] = (c[n] ?? 0) + 1; }); TEAMS.forEach((t) => { c[t.nation] = (c[t.nation] ?? 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]); };

const popover = (selected, top, left, query = '') => {
  const t = T[state.lang];
  const all = Object.keys(FLAGS).sort((a, b) => nameOf(a).localeCompare(nameOf(b), state.lang));
  const item = (code, count) => `<div class="it ${code === selected ? 'on' : ''} ${code === 'DEU' ? 'hover' : ''}"><span class="tick">${code === selected ? '✓' : ''}</span>${flag(code)}<span>${nameOf(code)}</span>${count ? `<span class="count">${count}</span>` : ''}<span class="code">${code}</span></div>`;
  return `<div class="pop" style="top:${top}px;left:${left}px">
    <div class="search"><span class="muted">⌕</span><input placeholder="${t.search}" value="${query}"></div>
    <div class="list">
      ${state.opt === 'C' ? `<div class="it"><span class="tick"></span>${flag(TEAMS[1].nation, 'dim')}<span class="muted">${t.sameTeam}</span></div>` : `<div class="it"><span class="tick"></span><span class="noflag"></span><span class="muted">${t.none}</span></div>`}
      <div class="grp">${t.used}</div>
      ${used().map(([c, n]) => item(c, n)).join('')}
      <div class="grp">${t.all}</div>
      ${all.map((c) => item(c)).join('')}
    </div></div>`;
};

const nationCell = (seat, team, open) => {
  const [, name, code] = seat;
  const t = T[state.lang];
  const cls = `in btn sel ${open ? 'open' : ''}`;
  if (state.opt === 'A') {
    if (!code) return `<div class="${cls} pale" style="width:170px"><span class="noflag"></span><span class="txt">${t.none}</span></div>`;
    return `<div class="${cls}" style="width:170px" title="${code}">${flag(code)}<span class="txt">${nameOf(code)}</span></div>`;
  }
  if (state.opt === 'B') {
    if (!code) return `<div class="${cls} pale" style="width:92px"><span class="noflag"></span><span class="code">-</span></div>`;
    return `<div class="${cls}" style="width:92px" title="${nameOf(code)}">${flag(code)}<span class="code" style="color:var(--foreground)">${code}</span></div>`;
  }
  const own = code ?? team.nation;
  return `<div class="${cls} ${code ? '' : 'pale'}" style="width:190px" title="${code ? '' : t.teamHint}">${flag(own, code ? '' : 'dim')}<span class="txt">${nameOf(own)}</span>${code ? '' : `<span class="tagteam">${t.team}</span>`}</div>`;
};

const sheet = () => {
  const t = T[state.lang];
  let rows = ''; let last = -1; let at = 0;
  SEATS.forEach((seat) => {
    const [ti, name] = seat; const team = TEAMS[ti];
    if (ti !== last) { rows += `<tr class="run"><td colspan="6"><span class="runline">${flag(team.nation)}${team.name}<span class="chip c-${team.budget}">${budgetLabel[team.budget]}</span></span></td></tr>`; last = ti; }
    at += 1;
    const open = at === 5;
    rows += `<tr><td class="grip">⋮⋮</td><td class="n">${at}</td>
      <td><div class="in ${name ? '' : 'pale'}" style="min-width:200px">${name || 'Empty - races as an AI driver'}</div></td>
      <td style="position:relative">${nationCell(seat, team, open)}${open ? popover(seat[2], 38, 0) : ''}</td>
      <td><div class="in sel" style="width:190px">${team.name}</div></td>
      <td><div class="in" style="width:220px;background:var(--muted)">${t.fromClass}</div></td></tr>`;
  });
  return `<div class="card" style="padding:16px 16px 330px"><table class="sheet"><thead><tr><th></th><th></th><th>${t.driver}</th><th>${t.nation}</th><th>${t.team}</th><th>${t.car}</th></tr></thead><tbody>${rows}</tbody></table>
  ${state.opt === 'C' ? `<p class="hint" style="margin-top:12px">${t.teamHint}</p>` : ''}</div>`;
};

const LEAD = {
  A: '<b>A · Flag and name.</b> One column where there were two, and it reads as the nation rather than a code. About as wide as the old Nationality and Code columns together, so the sheet keeps its width. An empty seat says <i>No nation</i> and AC races it without a flag.',
  B: '<b>B · Flag and code.</b> The narrowest cell - the flag and AC\'s three letters, with the translated name on hover and in the list. Frees about 90px for the driver and the car, at the cost of reading ARE or CHE rather than a name.',
  C: '<b>C · Follows the team.</b> A seat with no nation of its own races under its team\'s flag - shown dimmed, tagged <i>Team</i>. Picking one overrides it; <i>Same as the team</i> clears it. Most grids then need no nations typed at all, and a team that changes nation carries its drivers with it. The one change in meaning: today a seat without a code races flagless.',
};

const render = () => {
  document.documentElement.dataset.theme = state.theme;
  document.querySelectorAll('[data-opt]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.opt === state.opt));
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.themeBtn === state.theme));
  const t = T[state.lang];
  document.getElementById('root').innerHTML = `
  <section><h2>Seat sheet - a nation picker in place of Nationality and Code</h2>
    <p class="lead">${LEAD[state.opt]} Seat 5's picker is shown open: search, then the nations this championship already uses (with how many seats and teams each), then all ${Object.keys(FLAGS).length} of AC's flags - the full list in the app is AC's 222.</p></section>
  ${sheet()}
  <section><h2>The same picker elsewhere</h2><p class="lead">A team's nation is the same control, and the team tile and each run of seats wear the flag, so a grid reads at a glance.</p></section>
  <div class="grid2">
    <div class="card dlg"><h3 style="font-size:15px">Team</h3>
      <div class="field"><label>Name</label><div class="in">Van Amersfoort Racing</div></div>
      <div class="field"><label>${t.nation}</label><div class="in btn sel" style="position:relative;overflow:visible">${flag('NLD')}<span class="txt">${nameOf('NLD')}</span></div><span class="hint">${state.opt === 'C' ? t.teamHint : ''}</span></div>
    </div>
    <div class="card tile"><div class="name">${flag('NLD', 'lg')}Van Amersfoort Racing</div><div class="row" style="display:flex;gap:6px"><span class="chip c-privateer">Privateer</span><span class="muted small">2 seats · Formula 4</span></div>
      <div class="muted small" style="display:flex;gap:6px;align-items:center">${flag('CHE')}${flag('POL')}<span>${nameOf('CHE')}, ${nameOf('POL')}</span></div></div>
  </div>
  <section><h2>What is stored, and a bug it fixes</h2></section>
  <div class="card notes">
    <ul>
      <li>A seat stores <code>nationCode: "NLD"</code> and nothing else; <code>nationality</code> goes from the championship format, seats and teams alike. The label is looked up when shown - translated in the UI, English in <code>race.ini</code>'s <code>NATIONALITY</code>.</li>
      <li>The codes are <b>AC's own flag names</b> - <code>content/gui/NationFlags/*.png</code>, ISO 3166-1 alpha-3 plus ENG, SCT, WLS and NIR. The flag in the app is that same PNG, served out of the install, so what the editor shows is what the game shows.</li>
      <li><b>The shipped library uses sports codes, and AC has no flag for most of them.</b> About 1,000 seats would convert:
        <table class="cmp"><tr><th>Shipped</th><th>AC's flag</th><th>Seats</th><th>Shipped</th><th>AC's flag</th><th>Seats</th></tr>
        <tr><td class="bad">GER</td><td>${flag('DEU')} DEU</td><td>570</td><td class="bad">UAE</td><td>${flag('ARE')} ARE</td><td>32</td></tr>
        <tr><td class="bad">NED</td><td>${flag('NLD')} NLD</td><td>139</td><td class="bad">MON</td><td>${flag('MCO')} MCO</td><td>22</td></tr>
        <tr><td class="bad">SUI</td><td>${flag('CHE')} CHE</td><td>117</td><td class="bad">GRE · CHI · CRO</td><td>${flag('GRC')}${flag('CHL')}${flag('HRV')}</td><td>16</td></tr>
        <tr><td class="bad">POR</td><td>${flag('PRT')} PRT</td><td>47</td><td class="bad">RSA · KSA · MAS</td><td>${flag('ZAF')}${flag('SAU')}${flag('MYS')}</td><td>7</td></tr>
        <tr><td class="bad">DEN</td><td>${flag('DNK')} DNK</td><td>45</td><td></td><td></td><td></td></tr></table></li>
      <li>A code the list does not know - a hand-edited file - is reported by the validator rather than silently raced flagless.</li>
    </ul>
  </div>`;
};
document.querySelector('.picker').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.opt) state.opt = b.dataset.opt;
  if (b.dataset.lang) state.lang = b.dataset.lang;
  if (b.dataset.themeBtn) state.theme = b.dataset.themeBtn;
  render();
});
render();
</script>
</body>
</html>
