const opensWith = (d, t) => `Tier ${t}: ${n0(FLOOR(t))} in ${DNAME[d]}${t > 1 ? `, or Tier ${t - 1} anywhere` : ''}`;
// The card the mockup holds its tooltip open on, as if hovered.
const TIPPED = ['single', 'FIA Formula 3 2024'];
const rungCard = (d, name, t, locked) => {
  const rounds = 5 + (name.length % 5);
  const mod = MODS.some((m) => name.includes(m));
  const tipped = locked && d === TIPPED[0] && name === TIPPED[1];
  return `<div class="rung ${d}${locked ? ' locked' : ''}${tipped ? ' tipped' : ''}"${locked ? ` aria-disabled="true"` : ''}>
    ${locked ? `<span class="lk">${I.lock}</span><span class="ltip">${opensWith(d, t)}</span>` : ''}
    <h5>${name}</h5><div class="row" style="gap:4px">${name === 'GT4 European Series' ? '<span class="chip c-named">Yours</span>' : '<span class="chip c-origin">Ours</span>'}${mod ? '<span class="chip c-mod">Mod</span>' : ''}${name === 'GT4 European Series' ? '<span class="chip c-done">Entered</span>' : ''}</div>
    <div class="ft"><span class="num">${rounds} rounds</span><span class="strip"><i class="p"></i><i class="q"></i><i class="r"></i></span></div></div>`;
};
const cellOf = (d, t) => {
  const names = LADDER[d][t];
  const locked = t < OPEN[d];
  if (locked && S.open === 'on') {
    return `<div class="cell above">${names.length ? `<div class="lockcell"><b>${I.lock}${names.length} locked</b><span>${opensWith(d, t)}</span></div>` : ''}</div>`;
  }
  if (!names.length) return '<div class="cell empty"></div>';
  const shown = names.slice(0, 3).map((n) => rungCard(d, n, t, locked)).join('');
  return `<div class="cell">${shown}${names.length > 3 ? `<span class="hint" style="padding-left:4px">+${names.length - 3} more</span>` : ''}</div>`;
};
const ladder = () => {
  const openCount = DISCS.reduce((a, d) => a + [1, 2, 3, 4, 5].filter((t) => t >= OPEN[d]).reduce((b, t) => b + LADDER[d][t].length, 0), 0);
  const all = DISCS.reduce((a, d) => a + [1, 2, 3, 4, 5].reduce((b, t) => b + LADDER[d][t].length, 0), 0);
  const filtered = S.open === 'on';
  const row = (d) => {
    const t = OWN[d];
    const span = (t > 1 ? FLOOR(t - 1) : FLOOR(1) + WIDTH[1]) - FLOOR(t);
    const pct = Math.max(4, Math.min(100, ((NOW[d] - FLOOR(t)) / span) * 100));
    return `<div class="dh" style="flex-direction:column;gap:2px"><span class="row" style="gap:7px"><span class="dot ${d}"></span>${DNAME[d]}</span>
      <div class="lvl"><span class="row" style="gap:5px">${medal(OPEN[d], 16)}<span>Tier ${OPEN[d]} · <b class="num" style="color:var(--foreground)">${n0(NOW[d])}</b></span></span>
      ${VIA(d) ? '<span class="chip c-sports" style="align-self:flex-start;font-size:10.5px;padding:3px 6px">through Sportscar</span>' : `<span class="mini"><i style="width:${pct}%"></i></span><span>${n0(FLOOR(t - 1) - NOW[d])} to Tier ${t - 1}</span>`}</div></div>
      ${[5, 4, 3, 2, 1].map((tt) => cellOf(d, tt)).join('')}`;
  };
  return win(`${hdr('champs')}<div class="body" style="display:flex;flex-direction:column;gap:14px;overflow:hidden">
<header><div style="font-size:22px;font-weight:600">Championships</div><div class="muted" style="font-size:13px">The championships you can race today.</div></header>
<div style="display:flex;flex:1;min-height:0"><div class="rail">
  <div class="rsec"><span class="caps">Discipline</span>${DISCS.map((d) => `<div class="ropt"><span class="cb"></span><span class="dot ${d}"></span>${DNAME[d]}<span class="cnt num">${[1, 2, 3, 4, 5].reduce((b, t) => b + LADDER[d][t].length, 0)}</span></div>`).join('')}</div>
  <div class="rsec"><span class="caps">Tier</span>${[5, 4, 3, 2, 1].map((t) => `<div class="ropt"><span class="cb"></span>${medal(t, 17)}${TIER[t]}<span class="cnt num">${DISCS.reduce((b, d) => b + LADDER[d][t].length, 0)}</span></div>`).join('')}</div>
  <div class="rsec"><span class="caps">Needs</span><div class="ropt"><span class="cb"></span>Base game<span class="cnt">21</span></div><div class="ropt"><span class="cb"></span>Mods<span class="cnt">14</span></div></div>
  <div class="rsec"><span class="caps">Yours</span><label class="rsw">Open to you <span class="switch${S.open === 'on' ? ' on' : ''}"></span></label><label class="rsw">Can afford next round <span class="switch"></span></label></div></div>
<div class="main" style="overflow:auto"><div class="toolbar"><div class="input" style="width:280px">${I.search}<span class="muted">Search championships</span></div><button class="btn">${I.sort}Ladder</button></div>
<div class="pills"><span class="num">${filtered ? `${openCount} of ${all}` : `${all} of ${all}`}</span>${filtered ? `<span class="pill">Open to you ✕</span>` : ''}</div>
<div class="grid" style="flex:none;grid-template-columns:9.5rem repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;background:var(--card)"><div></div>${[5, 4, 3, 2, 1].map((t) => `<div class="gh">${medal(t)}${TIER[t]}<span class="end muted num" style="font-size:11.5px">${n0(FLOOR(t))}</span></div>`).join('')}
${DISCS.map(row).join('')}</div></div></div></div>`, 960);
};

// ---------- A championship's Enter panel ----------
const enter = () => {
  const locked = S.enter === 'locked';
  const name = locked ? 'DTM 2025 (LFM)' : 'Audi Sport TT Cup 2016';
  const t = locked ? 2 : 4;
  const panel = locked
    ? `<div class="panel enter"><h3>Enter ${name}</h3><div class="pb col" style="gap:10px">
        <div class="lockbox"><b>${I.lock}Opens at Tier 2 in Touring</b><span>You are Tier ${OPEN.touring} in Touring, through your Sportscar Tier ${BEST}. Either opens it:</span>
          <div class="path"><span class="chip c-touring">Touring</span><span>${n0(NOW.touring)} of ${n0(FLOOR(2))}</span><b class="num">${n0(FLOOR(2) - NOW.touring)} to go</b>
            <span class="chip c-sports">Sportscar</span><span>Tier 1 anywhere: ${n0(NOW.sports)} of ${n0(FLOOR(1))}</span><b class="num">${n0(FLOOR(1) - NOW.sports)} to go</b></div></div>
        <div class="row muted" style="font-size:12.5px">${I.car}<span>A car is picked once the class is open.</span></div>
        <button class="btn pri dim">Enter</button></div></div>`
    : `<div class="panel enter"><h3>Enter ${name}</h3><div class="pb col" style="gap:10px">
        <div class="viabox"><span class="row" style="gap:6px"><b>Open through Sportscar</b><span class="end">${medal(4, 18)}</span></span><span class="muted">Touring is Tier ${OWN.touring} on its own rating. Your Sportscar Tier ${BEST} opens it one rung below.</span>
          <span class="row" style="gap:6px;font-size:12.5px"><span class="chip c-set">Lifted</span>Entering lifts your touring rating from ${n0(NOW.touring)} to <b>${n0(FLOOR(4))}</b>, Bronze's floor.</span></div>
        <div class="row" style="gap:10px"><div style="width:64px;height:40px;border-radius:6px;background:var(--muted);display:grid;place-items:center" class="muted">${I.car}</div><span class="grow" style="font-size:13px"><b style="font-weight:500">Audi TT Cup</b><div class="hint">Rented · Livery 07</div></span><button class="btn sm">Change</button></div>
        <div class="feebox"><span class="k">Rent</span><span class="v num">$2,600 a round</span></div>
        <button class="btn pri">Enter</button></div></div>`;
  return win(`${hdr('champs')}${back('Championships')}<div class="body" style="display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;overflow:auto">
    <div class="col" style="gap:14px">
      <div class="panel"><div class="pb col" style="gap:8px;padding-top:14px"><div class="row"><span class="chip c-touring">Touring</span><span class="chip c-tier${t}">${medal(t, 14)}Tier ${t} · ${TIER[t]}</span></div>
        <h2 style="margin:0;font-size:20px">${name}</h2><div class="kv2"><span>Rounds</span><b>${locked ? 8 : 6}</b><span>Entry fee</span><b class="num">$${locked ? '18,000' : '3,500'}</b><span>Field</span><b>${locked ? '20 cars' : '22 cars'}</b></div></div></div>
      ${panel}</div>
    <div class="col" style="gap:14px">
      <div class="tabs" style="padding:0;background:transparent"><a class="on">Rounds</a><a>Standings</a><a>Classes</a><a>Points, prizes and rules</a></div>
      <div class="placeholder"><b>Rounds</b>As today.</div></div></div>`);
};

// ---------- After a race ----------
const result = () => {
  const b = R5_WIN;
  const pop = S.pop === 'on';
  const before = BEFORE_R5;
  const name = (l) => (l.s.type === 'quali' ? 'Qualifying' : l.what.split(' · ').at(-1));
  const rrow = (l) => `<div class="rrow"><span>${name(l)} · <b>${l.s.type === 'quali' ? 'Q' : 'P'}${l.s.p}</b> of ${l.c.n}<div class="s">expected ${l.s.type === 'quali' ? 'Q' : 'P'}${l.a.exp} · field ${n0(l.a.mean)}${l.s.type === 'quali' ? ' · counts ¼' : ''}</div></span>${dlt(l.a.d)}<button class="btn icon xs${pop && l === b ? ' on' : ''}">${I.info}</button></div>`;
  const mine = prevOf(b).sports;
  const field = [...b.s.field].sort((x, y) => x - y);
  const H = (v) => 18 + (v + 3) * 9;
  const popover = pop ? `<div class="pop" style="right:380px;top:250px"><h4>Race 2 · ${dlt(b.a.d)} sportscar</h4>
    <div class="kv"><span>Your sportscar rating</span><b class="num">${n0(mine)}</b>
      <span>Classmates</span><b>${b.c.n - 1} in GT4, ${sgn(b.a.lo)} to ${sgn(b.a.hi)}</b>
      <span>Rated, on average</span><b class="num">${n0(b.a.mean)}</b>
      <span class="hint" style="grid-column:1 / -1;margin-top:-2px">Bronze's field is ${n0(FIELD(4))} at your own Opponents setting, ${BASE}; each point a driver races over it adds ${PER_POINT}. Your season step of +2 is in theirs.</span>
      <span>Expected</span><b>P${b.a.exp} · beat ${Math.round(b.a.E * 100)}%</b>
      <span>Finished</span><b>P${b.s.p} · beat ${Math.round(b.a.S * 100)}%</b>
      <span>Session</span><b>Race · counts in full</b>
      <span>Rating speed</span><b>×1.5</b></div>
    <span class="hint">Each classmate's strength over your setting, lowest first:</span><div class="strip2" title="Each classmate's offset over your Opponents setting">${field.map((v) => `<i style="height:${H(v)}%"></i>`).join('')}</div>
    <div class="sum">(${b.a.S.toFixed(2)} − ${b.a.E.toFixed(2)}) × ${K} × 1.5 = ${b.a.raw.toFixed(1)}<span class="end">${dlt(b.a.d)}</span></div>
    <span class="hint">Had it gone wrong, it could have taken at most ${n0(b.a.cap)}. Global moves on the same field, off its own ${n0(prevOf(b).g)}: ${sgn(b.b.d)}.</span></div>` : '';
  return win(`${hdr('champs')}${back('GT4 European Series')}
  <div class="body" style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;overflow:auto">
    <div class="col">
      <div><span class="caps">GT4 European Series · Round 5 of 8</span><h2 style="margin:4px 0 0;font-size:22px">Brands Hatch Indy</h2></div>
      <div class="placeholder"><b>Round results, the event list and each session's result</b>As today.</div>
    </div>
    <div class="col">
      <div class="placeholder"><b>Round money</b>As today.</div>
      <div class="panel"><h3>${I.gauge}Rating</h3><div class="pb">
        ${R5.map(rrow).join('')}
        <div class="rrow" style="font-weight:600"><span class="row" style="gap:6px">${dchip('sports')}<span class="num">${n0(before.sports)} → ${n0(NOW.sports)}</span></span>${dlt(NOW.sports - before.sports)}<span></span></div>
        <div class="rrow"><span class="row" style="gap:6px"><span class="chip c-plain">Global</span><span class="num">${n0(before.g)} → ${n0(NOW.g)}</span></span>${dlt(NOW.g - before.g)}<span></span></div>
        <div class="banner sports" style="margin-top:8px;padding:9px 11px;font-size:12.5px">${medal(3, 26)}<div class="grow"><b style="font-size:13px">Promoted to Tier 3</b><div>Silver opens: ${NEWLY()} more championships.</div></div></div>
      </div></div>
      <div class="placeholder"><b>Your step on the AI's strength</b>As today.</div>
    </div></div>${popover}
    <div class="toast"><span class="well" style="background:var(--d-sports);color:var(--d-sports-fg)">${I.gauge}</span><div class="grow"><b>Race 2 · P1</b><div class="muted" style="font-size:12.5px">Sportscar ${sgn(b.a.d)} to ${n0(NOW.sports)} · promoted to Tier 3</div></div>${medal(3, 26)}</div>`);
};

// ---------- A historic event ----------
const historic = () => {
  const guest = S.hist === 'guest';
  const name = guest ? '1000 km of Spa 1969' : 'Spa 24 Hours 1987';
  const disc = guest ? 'sports' : 'touring';
  const t = guest ? 1 : 3;
  const yourTier = OPEN[disc];
  const field = FIELD(yourTier);
  return win(`${hdr('calendar')}${back('Calendar')}
  <div class="body" style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;overflow:auto">
    <div class="col" style="gap:14px">
      <div class="ph shade" style="height:200px;border-radius:14px;flex:none"><img class="bg" src="${PH.spa}"><div class="cap" style="position:absolute;left:20px;bottom:16px"><span class="chip c-historic">Historic</span><h2 style="margin:6px 0 0;font-size:24px">${name}</h2><div style="opacity:.85">Wed 20 Aug 2027 · Spa-Francorchamps</div></div></div>
      <div class="panel"><h3>About this event</h3><div class="pb"><div class="placeholder"><b>HistoricAbout</b>As today - the story, the classes, the format and the purse.</div></div></div>
    </div>
    <div class="col" style="gap:14px">
      <div class="panel"><h3>Your seat</h3><div class="pb col" style="gap:10px">
        <div class="row" style="gap:10px"><div style="width:64px;height:40px;border-radius:6px;background:var(--muted);display:grid;place-items:center" class="muted">${I.car}</div><span class="grow" style="font-size:13px"><b style="font-weight:500">${guest ? 'Porsche 908/3' : 'BMW M3 E30 Gr.A'}</b><div class="hint">${guest ? 'Porsche System Engineering · #26' : 'CiBiEmme · #46'}</div></span></div>
        <div class="viabox"><span class="row" style="gap:6px"><b>${guest ? 'A guest invitation' : 'Invited'}</b><span class="end row" style="gap:4px">${dchip(disc)}${medal(t, 18)}</span></span>
          <span class="muted">${guest
    ? `This event races at Tier 1, three rungs above your Sportscar Tier ${yourTier}. The organisers invite guests from every rung.`
    : `This event races at Tier 3 in Touring; you are Tier ${yourTier} there, through your Sportscar Tier ${BEST}.`}</span>
          <span class="row" style="gap:6px;font-size:12.5px;align-items:flex-start">${I.gauge}<span>It counts as a <b>Tier ${yourTier} race in ${DNAME[disc]}</b> - your own rung - with its field rated ${n0(field)} rather than ${n0(FIELD(t))}${disc === 'touring' ? ', and it lifts nothing: a guest seat is not an entry' : ''}.</span></span></div>
        <div class="row"><button class="btn">Decline</button><span class="hint">Declining is withdrawing; it leaves the rating untouched.</span></div></div></div>
    </div></div>`);
};

// ---------- Settings: the two speeds ----------
const STOPS = ['×0.5', '×0.75', '×1', '×1.25', '×1.5', '×2', '×3', '×4'];
const slider = (on) => `<div class="slider" style="margin-bottom:12px"><span class="track"></span><span class="fill" style="width:${on / (STOPS.length - 1) * 100}%"></span><span class="knob" style="left:${on / (STOPS.length - 1) * 100}%"></span>
  <div class="stops">${STOPS.map((s, i) => `<span class="${i === on ? 'on' : ''}">${s}</span>`).join('')}</div></div>`;
const speedField = (icon, well, label, on, hint) => `<div class="field"><span class="lbl row" style="gap:8px"><span class="well ${well}" style="width:22px;height:22px">${icon}</span>${label}<b class="end num" style="font-size:18px">${STOPS[on]}</b></span>${slider(on)}<span class="hint">${hint}</span></div>`;
const speeds = (money, rating, career) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px">
  ${speedField(I.wallet, 'green', 'Prize money', money, `Scales every prize${career ? ' from the next one on; what is already paid stays' : ' the career earns'}. Entry fees stay what each championship says.${career ? ' Each change is a line in Finances.' : ''}`)}
  ${speedField(I.gauge, 'amber', 'Rating', rating, `Scales every change of rating, up and down alike - a faster career, not an easier one.${career ? ' Each change is a line in the rating log.' : ''}`)}</div>`;
const settings = () => {
  if (S.set === 'new') {
    return win(`<header class="hd"><h1>Another Assetto Corsa Career</h1></header>
  <div class="shdr"><span class="backlink">${I.back}Main menu</span><h2 style="margin-left:12px">New career</h2></div>
  <div class="body" style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;overflow:auto">
    <div class="col" style="gap:14px">
      <div class="placeholder"><b>Driver, start year, starting level and starting money</b>As today.</div>
      <div class="sect"><span class="well green">${I.speed}</span><h4>Progression</h4><div class="sh">How fast this career earns and climbs. Both can be changed later in the career's own settings.</div>
        <div class="sb">${speeds(2, 2, false)}</div></div>
    </div>
    <div class="panel" style="align-self:start"><h3>Summary</h3><div class="pb kv2"><span>Driver</span><b>${flag('GBR')}Sam Whitaker</b><span>First season</span><b>2026</b><span>Level</span><b>${tierChip(5)}</b><span>Rating</span><b class="num">${n0(START)}</b><span>Money</span><b class="num">$50,000</b><span>Prize money</span><b>×1</b><span>Rating speed</span><b>×1</b></div></div>
  </div>`);
  }
  return win(`${hdr('settings')}<div class="tabs"><a class="on">${I.gear}General</a><a>Diagnostics</a><a>Your content</a><a>Car classes</a><a>Content sources</a><a>Championships</a></div>
    <div class="body col" style="gap:14px;overflow:auto;max-width:1000px">
      <div class="seg" style="align-self:flex-start"><span class="on">This career</span><span>App</span></div>
      <div class="placeholder"><b>Driver, Opponents, Driving aids and Calendar</b>As today.</div>
      <div class="sect"><span class="well green">${I.speed}</span><h4>Progression</h4><div class="sh">How fast this career earns and how fast it climbs - two speeds, set apart</div>
        <div class="sb">${speeds(2, 4, true)}</div></div>
      <div class="placeholder"><b>Currency</b>As today.</div></div>`);
};

// ---------- Explanations ----------
const WHY = {
  concept: () => '<b>The concept, with your decisions in.</b> How one session moves a rating, how a level follows it, what was decided and every figure it runs on. Every number on every screen comes from these rules, computed live from one career: Sam Whitaker, from Tier 5 in 2026 to Tier 3 in Sportscar after R5 of GT4 European Series 2027.',
  home: () => `<b>Home gains a fourth door, Rating</b>, beside Results, History and Finances: the global rating, its change this season, and each discipline's open rung and rating. It opens <code>/home/rating</code>. ${S.home === 'up' ? 'A <b>promotion</b> is a banner in the discipline\'s own colour, carrying the new rung\'s medal - beside the toast the race already raised. It stays until the next event is raced.' : S.home === 'down' ? 'A <b>drop</b> is only ever announced as a season opens, in the warning amber, since that is the only moment it can happen.' : 'With nothing to announce, Home is as today plus the door.'} The <b>global rating sits in the header</b> beside the balance on every page of a career, and opens the Rating page.`,
  rating: () => '<b>Rating</b> at <code>/home/rating</code>, laid out like Finances: the figures up top, the log below, and only the log scrolls. The global rating and a card per discipline: the rating, the open rung\'s medal, and a bar from where it would drop to the next floor, the drop zone hatched. A discipline open through Sportscar says so and says what entering it would do. Every line of the log says what moved it - the place, the place expected, the field - and a qualifying line says it counts a quarter, a race held by the cap says from what.',
  ladder: () => `<b>The Championships ladder</b> marks what is above you. Each discipline's row heads with its open rung, rating and the distance to the next. <i>Open to you</i> joins Can afford next round under Yours. ${S.open === 'on' ? 'Switched on, every locked cell folds into one line saying what opens it.' : 'Switched off, a locked championship is its ordinary card held still and greyed, with a lock; what opens it is a tooltip on hover - held open here on FIA Formula 3.'}`,
  enter: () => (S.enter === 'locked'
    ? '<b>A locked class</b> says which rung it needs and every way there - its own discipline\'s rating, or a rung higher anywhere, which the allowance turns into this one. Today it is a bare amber Locked chip.'
    : '<b>A class open through another discipline</b> says so, and says what entering does to its rating. The lift is a line in the log.'),
  result: () => '<b>After a race</b>, the round page gains a Rating panel under Round money: a line per session - qualifying at a quarter - with the place against the place expected, the round\'s total for the discipline and the global rating, and a promotion where one happened. The <b>ⓘ</b> opens the full working of a line, the same figures the log keeps. A toast says it as the race lands.',
  historic: () => `<b>A historic event's seat</b> says why you are invited and what the race counts for. ${S.hist === 'guest' ? 'A guest seat three rungs up is still rated on your own rung, so it cannot shortcut the ladder.' : 'An event inside your reach reads the same way, and a seat in a discipline open only through another lifts nothing.'}`,
  settings: () => (S.set === 'new'
    ? '<b>New career</b> asks for both speeds where it asked for one, side by side, ×1 each by default. The summary names both.'
    : '<b>The career\'s own settings</b>: Progression becomes two sliders in one section - Prize money and Rating - each ×0.5 to ×4, each changed on its own. A change of prize speed is a line in Finances, as today; a change of rating speed is a line in the rating log. Both live in <code>career.json</code>, so loading a save does not change them.'),
};
const QUESTIONS = [
  'Nothing left - the mockup is agreed and the code is under way.',
];

// ---------- The picker ----------
const GROUPS = [
  { k: 'view', label: 'Screen', opts: [['concept', 'Concept'], ['home', 'Home'], ['rating', 'Rating page'], ['ladder', 'Championships'], ['enter', 'Enter panel'], ['result', 'After a race'], ['historic', 'Historic event'], ['settings', 'Settings']] },
  { k: 'home', label: 'Case', for: ['home'], opts: [['up', 'Just promoted'], ['down', 'Dropped at season close'], ['none', 'Nothing to say']] },
  { k: 'season', label: 'Season', for: ['rating'], opts: [['2027', '2027'], ['2026', '2026'], ['all', 'Every season']] },
  { k: 'open', label: 'Open to you', for: ['ladder'], opts: [['on', 'On'], ['off', 'Off']] },
  { k: 'enter', label: 'Case', for: ['enter'], opts: [['locked', 'Locked'], ['via', 'Open through Sportscar']] },
  { k: 'pop', label: 'Working', for: ['result'], opts: [['on', 'Open'], ['off', 'Closed']] },
  { k: 'hist', label: 'Case', for: ['historic'], opts: [['guest', 'A guest, three rungs up'], ['reach', 'Inside your reach']] },
  { k: 'set', label: 'Case', for: ['settings'], opts: [['career', 'This career'], ['new', 'New career']] },
  { k: 'theme', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
];
const S = { view: 'concept', home: 'up', season: '2027', open: 'off', enter: 'locked', pop: 'on', hist: 'guest', set: 'career', theme: 'light' };

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById('picker').innerHTML = GROUPS.filter((g) => !g.for || g.for.includes(S.view))
    .map((g) => `<div class="grp"><strong>${g.label}</strong>${g.opts.map(([v, l]) => `<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${S[g.k] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('why').innerHTML = `<div class="box">${WHY[S.view]()}<div class="q"><b>To decide</b><ul>${QUESTIONS.map((q) => `<li>${q}</li>`).join('')}</ul></div></div>`;
  document.getElementById('stage').innerHTML = {
    concept, home, rating: ratingPage, ladder, enter, result, historic, settings,
  }[S.view]();
};
document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  history.replaceState(null, '', `#${new URLSearchParams(S)}`);
  render();
});
// The hash holds the picker's state, so a view can be linked or reloaded.
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in S) S[k] = v; });
render();
</script>
</body>
</html>
