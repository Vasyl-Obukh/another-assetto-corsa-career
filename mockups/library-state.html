<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library state mockup</title>
<style>

/* Tokens copied from src/renderer/src/globals.css - nothing here invents a colour. */
:root {
  --background: oklch(0.965 0.007 250);
  --foreground: oklch(0.16 0.01 260);
  --card: oklch(1 0 0);
  --primary: oklch(0.48 0.2 262);
  --primary-foreground: oklch(0.985 0.005 260);
  --secondary: oklch(0.935 0.012 252);
  --secondary-foreground: oklch(0.28 0.03 258);
  --muted: oklch(0.94 0.01 252);
  --muted-foreground: oklch(0.53 0.012 258);
  --border: oklch(0.885 0.01 255);
  --success: oklch(0.55 0.13 155);
  --success-soft: oklch(0.95 0.035 155); --success-soft-fg: oklch(0.34 0.09 155);
  --warning: oklch(0.93 0.07 80); --warning-fg: oklch(0.4 0.1 70);
  --warning-soft: oklch(0.965 0.035 85);
  --provenance-mod: oklch(0.93 0.05 295); --provenance-mod-fg: oklch(0.38 0.13 295);
  --provenance-dist: oklch(0.93 0.05 235); --provenance-dist-fg: oklch(0.38 0.12 250);
  --origin-custom: oklch(0.93 0.05 340); --origin-custom-fg: oklch(0.38 0.12 340);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --secondary: oklch(0.27 0.014 265);
  --secondary-foreground: oklch(0.94 0.005 260);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --border: oklch(1 0 0 / 12%);
  --success: oklch(0.7 0.15 158);
  --success-soft: oklch(0.27 0.045 158); --success-soft-fg: oklch(0.86 0.11 155);
  --warning: oklch(0.34 0.07 75); --warning-fg: oklch(0.88 0.11 85);
  --warning-soft: oklch(0.27 0.045 78);
  --provenance-mod: oklch(0.33 0.07 295); --provenance-mod-fg: oklch(0.86 0.1 295);
  --provenance-dist: oklch(0.33 0.07 245); --provenance-dist-fg: oklch(0.86 0.09 240);
  --origin-custom: oklch(0.33 0.07 340); --origin-custom-fg: oklch(0.86 0.1 340);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--foreground); color: var(--background); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid color-mix(in oklch, var(--background) 30%, transparent); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
.why { max-width: 1280px; margin: 14px auto 0; padding: 0 24px; color: var(--muted-foreground); font-size: 13.5px; }
.why b { color: var(--foreground); }

/* ---------- App frame ---------- */
.frame { max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
.app-nav { display: flex; gap: 18px; align-items: center; height: 44px; font-size: 13px; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.app-nav .brand { color: var(--foreground); font-weight: 600; margin-right: 8px; }
.app-nav .on { color: var(--primary); font-weight: 600; background: color-mix(in oklch, var(--primary) 10%, transparent); padding: 4px 8px; border-radius: 6px; }
.hdr { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted-foreground); }

/* ---------- Shared ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.p-mod { background: var(--provenance-mod); color: var(--provenance-mod-fg); }
.p-dist { background: var(--provenance-dist); color: var(--provenance-dist-fg); }
.p-custom { background: var(--origin-custom); color: var(--origin-custom-fg); }
.chip.warn { background: var(--warning); color: var(--warning-fg); }
.muted { color: var(--muted-foreground); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
.panel > h3 { margin: 0; padding: 12px 14px 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel .pb { padding: 10px 14px 14px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 2px 0; }
.kv span:first-child { color: var(--muted-foreground); }
.kv span:last-child { font-weight: 500; text-align: right; }

/* Switch, coloured like SWITCH_TRACK: success when on, muted when off. */
.sw { position: relative; width: 34px; height: 19px; border-radius: 99px; border: 0; padding: 0; flex: none; background: color-mix(in oklch, var(--muted-foreground) 35%, transparent); transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .25); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--success); }
.sw[aria-checked="true"]::after { transform: translateX(15px); }

/* ---------- Hero ---------- */
.hero { position: relative; border-radius: 14px; overflow: hidden; background: var(--scrim); aspect-ratio: 21 / 8; }
.hero img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, oklch(0.14 0.012 265 / .85), transparent 55%); }
.hero .cap { position: absolute; left: 20px; bottom: 18px; z-index: 1; color: var(--on-scrim); display: flex; flex-direction: column; gap: 6px; }
.hero .over { font-size: 13px; opacity: .9; display: flex; gap: 8px; align-items: center; }
.hero h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
.hero .chips { display: flex; gap: 4px; }
.hero .plate { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 30%; border-radius: 10px; background: oklch(0.14 0.012 265 / .6); backdrop-filter: blur(6px); z-index: 1; display: grid; place-items: center; }
.hero .plate img { width: 75%; height: 75%; object-fit: contain; filter: brightness(0) invert(1); }
.hero.dim img.bg { filter: grayscale(.5) brightness(.8); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; margin-top: 14px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.figs { display: grid; grid-template-columns: repeat(4, 1fr); }
.figs > div { padding: 10px 14px; display: flex; flex-direction: column; }
.figs > div:not(:first-child) { border-left: 1px solid var(--border); }
.figs b { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.figs b small { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.figs span { font-size: 11.5px; color: var(--muted-foreground); }
.empty { padding: 4px 14px 14px; color: var(--muted-foreground); font-size: 13px; }

/* ---------- Variant A: switch in the header row ---------- */
.hdr-switch { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; padding: 5px 6px 5px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 500; }
.hdr-switch .state { font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
.hdr-switch.off { background: var(--warning-soft); border-color: color-mix(in oklch, var(--warning-fg) 30%, transparent); }
.hdr-switch.off .state { color: var(--warning-fg); }

/* ---------- Variant B: strip between header and hero ---------- */
.strip { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 12px; margin-bottom: 14px; border: 1px solid; }
.strip.off { background: var(--warning-soft); border-color: color-mix(in oklch, var(--warning-fg) 30%, transparent); }
.strip.on { background: var(--success-soft); border-color: color-mix(in oklch, var(--success-soft-fg) 25%, transparent); }
.strip .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.strip.off .ic { background: var(--warning); color: var(--warning-fg); }
.strip.on .ic { background: color-mix(in oklch, var(--success) 22%, transparent); color: var(--success-soft-fg); }
.strip .txt { display: flex; flex-direction: column; min-width: 0; }
.strip .txt b { font-size: 13.5px; font-weight: 600; }
.strip .txt span { font-size: 12.5px; color: var(--muted-foreground); }
.strip label { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; padding: 6px 8px 6px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; }

/* ---------- Variant C: tile inside "Where it comes from" ---------- */
.libtile { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); cursor: pointer; }
.libtile.off { background: var(--warning-soft); border-color: color-mix(in oklch, var(--warning-fg) 30%, transparent); }
.libtile.on { background: var(--success-soft); border-color: color-mix(in oklch, var(--success-soft-fg) 25%, transparent); }
.libtile .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.libtile .txt b { font-size: 13px; font-weight: 600; }
.libtile .txt span { font-size: 12px; color: var(--muted-foreground); }
</style>
</head>
<body>

<div class="picker">
  <div class="grp"><strong>Placement</strong>
    <button class="opt" data-k="v" data-v="a">A - Header switch</button>
    <button class="opt" data-k="v" data-v="b">B - Strip above the hero</button>
    <button class="opt" data-k="v" data-v="c">C - In "Where it comes from"</button>
  </div>
  <div class="grp"><strong>Page</strong>
    <button class="opt" data-k="p" data-v="car">Car</button>
    <button class="opt" data-k="p" data-v="track">Track</button>
  </div>
  <div class="grp"><strong>In library</strong>
    <button class="opt" data-k="on" data-v="0">Off</button>
    <button class="opt" data-k="on" data-v="1">On</button>
  </div>
  <div class="grp"><strong>Theme</strong>
    <button class="opt" data-k="th" data-v="light">Light</button>
    <button class="opt" data-k="th" data-v="dark">Dark</button>
  </div>
</div>

<p class="why" id="why"></p>
<div class="frame" id="root"></div>

<script>
const AC = 'file:///D:/SteamLibrary/steamapps/common/assettocorsa/content/';
const ICON = {
  back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  eyeOff: '<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  library: '<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
};
const icon = (name, size = 15) => `<svg class="i" viewBox="0 0 24 24" style="width:${size}px;height:${size}px">${ICON[name]}</svg>`;

// Both read off the real install: the two Your content opened in the last check.
const PAGES = {
  car: {
    kind: 'car', name: '[CLUB] Aventador SVJ', over: 'Lamborghini · 2019',
    img: `${AC}cars/aventador_svj_acpursuit/skins/arancio_atlas/preview.jpg`,
    dist: null,
    figs: [['751', 'bhp', 'Power'], ['1,450', 'kg', 'Weight'], ['518', 'bhp/t', 'Power to weight'], ['350', 'km/h', 'Top speed']],
    source: [['Author', 'discord.gg/5Wka8QF'],['Year', '2019'], ['Folder', 'aventador_svj_acpursuit']],
    racedEmpty: 'No championship races it yet.',
  },
  track: {
    kind: 'track', name: 'Algarve Portimao - LFM (NO DRS)', over: 'Portugal · Portimao',
    img: `${AC}tracks/algarve_portimao_2023/ui/bgr_00.jpg`,
    outline: `${AC}tracks/algarve_portimao_2023/ui/lfm_nodrs/outline.png`,
    dist: 'LFM',
    figs: [['4.6', 'km', 'Length'], ['14', 'm', 'Width'], ['40', '', 'Pit boxes'], ['1', '', 'Layouts']],
    source: [['Author', 'LuisB'], ['Year', '2023'], ['Folder', 'algarve_portimao_2023']],
    racedEmpty: null,
  },
};

const WHY = {
  a: '<b>A - Header switch.</b> The switch sits at the right of the Back row, which stays pinned while the page scrolls, so it is always in reach. Off, the pill turns amber and says what that costs; on, it is a plain pill and the hero chip reads Custom. The quietest of the three.',
  b: '<b>B - Strip above the hero.</b> A full-width strip says outright that the mod is installed but left out, and what that means, with the switch beside it. On, it turns green and says it was added by you. The loudest: hard to miss when off, and it stays as a record when on.',
  c: '<b>C - In "Where it comes from".</b> The switch lives with the rest of the provenance - which is where the question belongs - as a tile in that panel. Nothing above the fold changes except the hero chip. Easy to miss, since the panel sits in the right column below the figures.',
};

const state = { v: 'a', p: 'car', on: '0', th: 'light' };

const sw = (on) => `<button class="sw" role="switch" aria-checked="${on}" onclick="flip()"></button>`;
window.flip = () => { state.on = state.on === '1' ? '0' : '1'; render(); };

const render = () => {
  document.documentElement.dataset.theme = state.th;
  document.querySelectorAll('.opt').forEach((b) => b.setAttribute('aria-pressed', String(state[b.dataset.k] === b.dataset.v)));
  document.getElementById('why').innerHTML = WHY[state.v];

  const page = PAGES[state.p];
  const on = state.on === '1';
  const noun = page.kind === 'car' ? 'car' : 'circuit';
  const offLine = `Championships, the race screen's pickers and the ${page.kind === 'car' ? 'car' : 'track'} browser leave it out.`;
  const onLine = `Added by you in Settings · Your content. It races like any other ${noun}.`;

  // The hero's provenance chip already reads Custom once a mod is added; off it reads Mod.
  const chips = `${on ? '<span class="chip p-custom">Custom</span>' : '<span class="chip p-mod">Mod</span>'}${page.dist ? `<span class="chip p-dist">${page.dist}</span>` : ''}`;

  const header = `<div class="hdr">
    <span class="back">${icon('back', 14)} Settings · Your content</span>
    ${state.v === 'a' ? `<span class="hdr-switch ${on ? 'on' : 'off'}">
      ${on ? icon('library', 14) : icon('eyeOff', 14)}
      <span>In your library <span class="state">${on ? '' : '· left out of championships and pickers'}</span></span>
      ${sw(on)}
    </span>` : ''}
  </div>`;

  const strip = state.v === 'b' ? `<div class="strip ${on ? 'on' : 'off'}">
    <span class="ic">${on ? icon('check', 16) : icon('eyeOff', 16)}</span>
    <span class="txt"><b>${on ? 'In your library' : `This ${noun} is not in your library`}</b><span>${on ? onLine : offLine}</span></span>
    <label onclick="flip()">${on ? 'In library' : 'Add to library'} ${sw(on)}</label>
  </div>` : '';

  const hero = `<div class="hero">
    <img class="bg" src="${page.img}" alt="">
    ${page.outline ? `<div class="plate"><img src="${page.outline}" alt=""></div>` : ''}
    <div class="cap">
      <span class="over">${page.over}</span>
      <h1>${page.name}</h1>
      <span class="chips">${chips}</span>
    </div>
  </div>`;

  const tile = state.v === 'c' ? `<div class="libtile ${on ? 'on' : 'off'}" onclick="flip()">
    <span class="txt"><b>In your library</b><span>${on ? 'Added by you. It races like any other ' + noun + '.' : offLine}</span></span>
    ${sw(on)}
  </div>` : '';

  const raced = page.racedEmpty
    ? `<div class="panel"><h3>${icon('trophy', 14)} Raced in <span class="muted" style="font-weight:400">0</span></h3><div class="empty">${page.racedEmpty}</div></div>`
    : `<div class="panel"><h3>${icon('trophy', 14)} Raced here <span class="muted" style="font-weight:400">8</span></h3><div class="empty">Formula 1 2020, Formula 1 2021, World Endurance Championship 2023 and five more - unchanged from today.</div></div>`;

  document.getElementById('root').innerHTML = `
    <div class="app-nav"><span class="brand">Assetto Corsa Career</span><span>Home</span><span>Race</span><span>Calendar</span><span>Championships</span><span>Results</span><span>Cars</span><span>Tracks</span><span class="on">Settings</span></div>
    ${header}
    ${strip}
    ${hero}
    <div class="body">
      <div class="col">
        <div class="panel figs">${page.figs.map(([v, u, l]) => `<div><b>${v} <small>${u}</small></b><span>${l}</span></div>`).join('')}</div>
        ${page.kind === 'track' ? raced : '<div class="panel"><h3>About</h3><div class="empty">The author\'s description - unchanged from today.</div></div>'}
      </div>
      <div class="col">
        ${page.kind === 'car' ? raced : ''}
        <div class="panel"><h3>Where it comes from</h3><div class="pb">
          <div style="display:flex;gap:4px;margin-bottom:8px">${chips}</div>
          ${page.source.map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}
          ${tile}
        </div></div>
      </div>
    </div>`;
};

document.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => { state[b.dataset.k] = b.dataset.v; render(); }));
render();
</script>
</body>
</html>
