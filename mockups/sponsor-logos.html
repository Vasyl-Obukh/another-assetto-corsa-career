<style>

  --bronze: oklch(0.89 0.07 52); --bronze-fg: oklch(0.41 0.09 48);
  --d-single: oklch(0.925 0.06 212); --d-single-fg: oklch(0.36 0.11 215);
  --d-sports: oklch(0.925 0.06 112); --d-sports-fg: oklch(0.36 0.1 118);
  --d-touring: oklch(0.925 0.055 175); --d-touring-fg: oklch(0.35 0.09 178);

  /* Proposed: which mode a slot is. Career on the primary hue, championship on
     the trophy gold, quick race on the race session's green. Shown only on the
     start screen and the hub, where no session, podium or tier chip appears. */
  --m-career: oklch(0.93 0.045 262); --m-career-fg: oklch(0.42 0.17 262); --m-career-solid: oklch(0.48 0.2 262);
  --m-champ: oklch(0.9 0.085 88); --m-champ-fg: oklch(0.42 0.1 75); --m-champ-solid: oklch(0.72 0.14 85);
  --m-quick: oklch(0.89 0.085 150); --m-quick-fg: oklch(0.33 0.1 152); --m-quick-solid: oklch(0.58 0.14 152);
  /* Proposed: what kind of save. Named on 340 and quick on 18, the custom-origin
     and budget-independent hues, which no save list shows; autosave on a

  --k-named: oklch(0.92 0.06 340); --k-named-fg: oklch(0.4 0.13 340);
  --k-quick: oklch(0.92 0.06 18); --k-quick-fg: oklch(0.42 0.13 22);

  /* Section wells, as SECTION_ACCENT draws them. */

  --w-violet: oklch(0.93 0.05 300); --w-violet-fg: oklch(0.45 0.15 300);
  --w-green: oklch(0.93 0.05 155); --w-green-fg: oklch(0.42 0.11 155);
  --w-amber: oklch(0.94 0.06 80); --w-amber-fg: oklch(0.45 0.1 70);
  --scrim: oklch(0.14 0.012 265); --on-scrim: oklch(0.98 0.004 260);

  --cl-1: oklch(0.92 0.055 195); --cl-1-fg: oklch(0.38 0.09 200);

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.165 0.012 265);
  --foreground: oklch(0.94 0.005 260);
  --card: oklch(0.225 0.015 265);
  --primary: oklch(0.58 0.19 258);
  --muted: oklch(0.27 0.014 265);
  --muted-foreground: oklch(0.69 0.012 260);
  --accent: oklch(0.3 0.016 265);
  --border: oklch(1 0 0 / 12%);
  --input: oklch(1 0 0 / 16%);
  --success: oklch(0.7 0.15 158);
  --success-soft: oklch(0.32 0.06 155); --success-soft-fg: oklch(0.86 0.11 155);
  --warning-soft: oklch(0.34 0.06 80); --warning-soft-fg: oklch(0.88 0.1 85);
  --destructive: oklch(0.66 0.2 25);
  --destructive-soft: oklch(0.32 0.07 27); --destructive-soft-fg: oklch(0.86 0.09 27);
  --s-practice: oklch(0.32 0.06 250); --s-practice-fg: oklch(0.86 0.09 255);
  --s-qualify: oklch(0.33 0.07 310); --s-qualify-fg: oklch(0.87 0.1 310);
  --s-race: oklch(0.35 0.09 150); --s-race-fg: oklch(0.88 0.13 150);
  --gold: oklch(0.36 0.07 88); --gold-fg: oklch(0.89 0.12 92);
  --silver: oklch(0.33 0.006 260); --silver-fg: oklch(0.86 0.008 260);
  --bronze: oklch(0.33 0.06 50); --bronze-fg: oklch(0.85 0.09 55);
  --d-single: oklch(0.32 0.07 212); --d-single-fg: oklch(0.86 0.1 212);
  --d-sports: oklch(0.32 0.07 112); --d-sports-fg: oklch(0.86 0.1 112);
  --d-touring: oklch(0.32 0.065 175); --d-touring-fg: oklch(0.86 0.09 175);
  --d-road: oklch(0.32 0.07 270); --d-road-fg: oklch(0.86 0.1 270);
  --t1: oklch(0.34 0.025 210); --t1-fg: oklch(0.9 0.03 210);
  --t2: oklch(0.36 0.07 88); --t2-fg: oklch(0.89 0.12 92);
  --t3: oklch(0.33 0.006 260); --t3-fg: oklch(0.86 0.008 260);
  --t4: oklch(0.33 0.06 50); --t4-fg: oklch(0.85 0.09 55);
  --t5: oklch(0.48 0.12 142); --t5-fg: oklch(0.96 0.03 142);
  --m-career: oklch(0.33 0.07 262); --m-career-fg: oklch(0.87 0.09 262); --m-career-solid: oklch(0.58 0.19 262);
  --m-champ: oklch(0.36 0.07 88); --m-champ-fg: oklch(0.89 0.12 92); --m-champ-solid: oklch(0.72 0.13 85);
  --m-quick: oklch(0.35 0.09 150); --m-quick-fg: oklch(0.88 0.13 150); --m-quick-solid: oklch(0.62 0.14 152);
  --k-named: oklch(0.33 0.07 340); --k-named-fg: oklch(0.86 0.09 340);
  --k-quick: oklch(0.33 0.07 18); --k-quick-fg: oklch(0.86 0.09 22);
  --k-auto: oklch(0.32 0.03 232); --k-auto-fg: oklch(0.85 0.05 235);
  --w-blue: oklch(0.32 0.06 250); --w-blue-fg: oklch(0.86 0.09 255);
  --w-violet: oklch(0.33 0.07 300); --w-violet-fg: oklch(0.87 0.1 300);
  --w-green: oklch(0.32 0.06 155); --w-green-fg: oklch(0.86 0.11 155);
  --w-amber: oklch(0.34 0.06 80); --w-amber-fg: oklch(0.88 0.1 85);
  --cl-1: oklch(0.33 0.06 195); --cl-1-fg: oklch(0.86 0.09 195);
  --cl-2: oklch(0.33 0.07 18); --cl-2-fg: oklch(0.86 0.09 22);

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
/* The page behind the mock window, not an app colour. */
:root body { background: oklch(0.9 0.008 255); }
:root[data-theme="dark"] body { background: oklch(0.12 0.01 265); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.caps { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.end { margin-left: auto; }

/* ---------- Mockup chrome ---------- */
.picker { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: oklch(0.16 0.01 260); color: oklch(0.965 0.007 250); }
.picker .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker strong { font-weight: 600; margin-right: 4px; font-size: 13px; opacity: .8; }
.picker .opt { border: 1px solid oklch(1 0 0 / 25%); background: transparent; border-radius: 6px; padding: 4px 11px; font-size: 13px; }
.picker .opt[aria-pressed="true"] { background: oklch(0.965 0.007 250); color: oklch(0.16 0.01 260); }
.why { max-width: 1280px; margin: 16px auto 0; padding: 0 24px; font-size: 13.5px; }
.why .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
.why b { color: var(--foreground); }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 2px 0; }
.why .q { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
.why .q b { color: var(--primary); }
.stage { max-width: 1280px; margin: 14px auto 60px; padding: 0 24px; }

/* Sponsor and partner, as globals.css has them. */
:root {
  --sponsor: oklch(0.93 0.05 350); --sponsor-fg: oklch(0.43 0.15 352); --sponsor-solid: oklch(0.58 0.18 352);
  --partner: oklch(0.93 0.05 200); --partner-fg: oklch(0.38 0.09 205); --partner-solid: oklch(0.6 0.11 205);
  /* Proposed: the plate a sponsor's logo sits on. Light in both themes, since
     most logos are drawn for white paper and a black wordmark vanishes on a
     dark card. A touch dimmer in dark, so it does not glare. No hue: the
     slot's colour is the ring around it. */
  --plate: oklch(0.995 0.002 255);
}
:root[data-theme="dark"] {
  --sponsor: oklch(0.33 0.07 350); --sponsor-fg: oklch(0.87 0.09 352); --sponsor-solid: oklch(0.65 0.17 352);
  --partner: oklch(0.33 0.06 200); --partner-fg: oklch(0.86 0.08 200); --partner-solid: oklch(0.66 0.11 200);
  --plate: oklch(0.94 0.004 255);
}

/* ---------- Pieces drawn as the real components are ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; line-height: 1; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.chip .i { width: 12px; height: 12px; }
.c-sports { background: var(--d-sports); color: var(--d-sports-fg); }
.c-touring { background: var(--d-touring); color: var(--d-touring-fg); }
.c-plain { background: var(--muted); color: var(--foreground); }
.c-sponsor { background: var(--sponsor); color: var(--sponsor-fg); }
.c-partner { background: var(--partner); color: var(--partner-fg); }
.c-on { background: var(--success-soft); color: var(--success-soft-fg); }
.c-race { background: var(--s-race); color: var(--s-race-fg); }
.flag { width: 18px; height: 12px; border-radius: 2px; object-fit: cover; flex: none; box-shadow: 0 0 0 1px oklch(0 0 0 / .12); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* SponsorMark. Three shapes for a logo; a brand with none keeps its initials. */
.mark { position: relative; flex: none; display: grid; place-items: center; font-weight: 700; letter-spacing: .02em; }
.mark .tr { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: var(--card); box-shadow: 0 0 0 1px var(--border); color: var(--sponsor-fg); }
.mark .tr .i { width: 12px; height: 12px; }
.mark.sm .tr { width: 16px; height: 16px; right: -3px; bottom: -3px; border-radius: 5px; }
.mark.sm .tr .i { width: 10px; height: 10px; }
.mark.partner .tr { color: var(--partner-fg); }
.mark img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; display: block; }
.mark .ini { font-size: 14px; }
.mark.sm .ini { font-size: 10.5px; letter-spacing: 0; }
/* The initials tile: today's mark, on the slot's colour. */
.mark.initials { background: var(--sponsor); color: var(--sponsor-fg); }
.mark.initials.partner { background: var(--partner); color: var(--partner-fg); }
/* A plate: the logo on light, ringed in the slot's colour. */
.mark.plate { background: var(--plate); box-shadow: inset 0 0 0 2px var(--sponsor-solid); padding: 6px 7px; }
.mark.plate.partner { box-shadow: inset 0 0 0 2px var(--partner-solid); }
.mark.sm.plate { padding: 4px 5px; box-shadow: inset 0 0 0 1.5px var(--sponsor-solid); }
.mark.sm.plate.partner { box-shadow: inset 0 0 0 1.5px var(--partner-solid); }
/* Today's tile with a logo in it, shown for why it does not work. */
.mark.tint { background: var(--sponsor); padding: 6px; }
.mark.tint.partner { background: var(--partner); }
/* Sizes: today's square is 44 and 32; the wide plate keeps the height. */
.mark { width: 44px; height: 44px; border-radius: 11px; }
.mark.sm { width: 32px; height: 32px; border-radius: 8px; }
.shape-wide .mark { width: 76px; }
.shape-wide .mark.sm { width: 54px; }

/* SponsorCard */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); border-top: 4px solid var(--sponsor-solid); background: var(--card); box-shadow: 0 1px 2px oklch(0 0 0 / .06); }
.card.partner { border-top-color: var(--partner-solid); }
.card .h { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; }
.card .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.card .who b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.card .who small { font-size: 12px; color: var(--muted-foreground); }
.card .bd { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 14px; }
.perks { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: baseline; gap: 4px 10px; font-size: 13px; }
.perks .sig { grid-column: span 2; display: flex; gap: 6px; align-items: center; font-weight: 500; }
.perks .sig .i { width: 14px; height: 14px; color: var(--sponsor-fg); }
.perks b { font-weight: 600; font-variant-numeric: tabular-nums; }
.perks span { color: var(--muted-foreground); }
.goal { display: flex; align-items: center; gap: 8px; font-size: 13px; border-top: 1px dashed var(--border); padding-top: 10px; }
.goal .gk { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
.card .ft { margin-top: auto; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border); padding: 8px 16px; font-size: 12px; color: var(--muted-foreground); }
.card .ft b { color: var(--success); font-weight: 600; }
.dots { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; }

/* The offer: the mail's sender and SponsorCompare's column heads. */
.mail { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.mail h2 { margin: 0; font-size: 20px; font-weight: 600; }
.from { display: flex; align-items: center; gap: 12px; }
.from b { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.from small { font-size: 12px; color: var(--muted-foreground); }
.compare { display: grid; grid-template-columns: 10rem repeat(2, minmax(0, 15rem)); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; width: max-content; }
.compare > div { padding: 10px 12px; border-top: 1px solid var(--border); border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.compare > .k { border-left: 0; color: var(--muted-foreground); font-size: 12px; }
.compare > .hd0 { border-top: 0; }
.compare .head .tn { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.compare .head small { font-size: 12px; color: var(--muted-foreground); }
.compare .cur { background: color-mix(in oklch, var(--sponsor) 45%, transparent); }

/* RoundSponsors, and a row of SponsorHistory. */
.split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.panel h3 { margin: 0; padding: 12px 14px; font-size: 14px; font-weight: 600; }
.rs { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding: 10px 12px; box-shadow: inset 3px 0 0 var(--sponsor-solid); }
.rs.partner { box-shadow: inset 3px 0 0 var(--partner-solid); }
.rs .top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.rs .ln { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.rs .ln span { color: var(--muted-foreground); }
.pos { color: var(--success); font-weight: 600; font-variant-numeric: tabular-nums; }
table.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
.hist th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 8px 12px; border-bottom: 1px solid var(--border); }
.hist td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.hist td:first-child .row { gap: 10px; }

/* The contact sheet. */
.sheet h3 { margin: 22px 0 10px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sheet h3 small { font-weight: 400; color: var(--muted-foreground); font-size: 12.5px; }
.sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.sheet .tile { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.sheet .tile b { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
.sheet .tile small { font-size: 11.5px; color: var(--muted-foreground); }
.sheet .bare { font-size: 12.5px; color: var(--muted-foreground); line-height: 1.7; }
</style>
</head>
<body>
<div class="picker" id="picker"></div>
<div class="why" id="why"></div>
<div class="stage" id="stage"></div>
<script>

const by = (id) => BRANDS.find((b) => b.id === id);

const chip = (cls, t) => `<span class="chip ${cls}">${t}</span>`;
const initials = (name) => name.split(/\s+/).filter((w) => /^\p{L}/u.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join('');

// SponsorMark: the logo in the chosen shape, or the initials tile for a brand without one.
const mark = (b, slot, sm = false) => {
  const cls = `mark${sm ? ' sm' : ''}${slot === 'partner' ? ' partner' : ''}`;
  const inner = b.logo && S.mark !== 'none'
    ? `<img src="${LOGOS}${b.logo}" alt="">`
    : `<span class="ini">${initials(b.name)}</span>`;
  const kind = !b.logo || S.mark === 'none' ? 'initials' : S.mark === 'tint' ? 'tint' : 'plate';
  const badge = kind === 'initials' || S.badge === 'corner' ? `<span class="tr">${TRADE[b.trade]}</span>` : '';
  return `<span class="${cls} ${kind}" title="${TRADE_NAME[b.trade]}">${inner}${badge}</span>`;
};
const shape = () => (S.mark === 'wide' ? 'shape-wide' : '');

// The Sponsors page: SponsorCard for a main sponsor, a partner and a partner whose brand has no logo.
const card = (b, slot, covers, perks, goal, paid, until) => `<article class="card${slot === 'partner' ? ' partner' : ''}">
  <div class="h">${mark(b, slot)}<div class="who"><b><span class="trunc">${b.name}</span>${flag(b.nation)}</b><small class="trunc">${slot === 'main' ? 'Main sponsor' : 'Partner'} · ${TRADE_NAME[b.trade]}</small></div>${covers}</div>
  <div class="bd"><div class="perks">${perks}</div><div class="goal"><span class="gk">Goal</span><span class="grow">${goal}</span>${chip('c-on', 'On course')}</div></div>
  <div class="ft"><span>Paid <b>$${paid}</b></span><span>Until ${until}</span><span class="dots">${I.dots}</span></div></article>`;
const cards = () => `<div class="cards ${shape()}">

  ${card(by(S.bare), 'partner', chip('c-touring', 'Touring'), '<b>$380</b><span>a race in the top half of your class</span><b>$120</b><span>a point</span>', 'Top half of a championship', '2,140', '9 Jun 2030')}
</div>`;

// An offer: the mail's sender, and the column heads of SponsorCompare - the offer beside the deal it replaces.
const offer = () => {
  const o = by(S.main);
  const yours = by(S.replace);
  const head = (b, cur) => `<div class="head${cur ? ' cur' : ''}"><span class="row" style="gap:8px;flex-wrap:wrap">${mark(b, 'main')}${chip('c-sports', 'Sportscar')}${cur ? chip('c-sponsor', 'Your main sponsor') : ''}</span><span class="tn"><span class="trunc">${b.name}</span>${flag(b.nation)}</span><small class="trunc">${TRADE_NAME[b.trade]}</small></div>`;
  return `<div class="mail ${shape()}"><h2>${o.name} offers to be your main sponsor</h2>
  <div class="from">${mark(o, 'main')}<span class="col" style="gap:0"><b>${o.name}${flag(o.nation)}</b><small>to Sam Whitaker</small></span></div>
  <p style="margin:0;font-size:13.5px;max-width:60ch">${o.name} would like to back you for a year. It would take the place of ${yours.name}.</p>
  <div class="compare"><div class="k hd0"></div>${head(o, false).replace('class="head', 'class="hd0 head')}${head(yours, true).replace('class="head', 'class="hd0 head')}
    <div class="k">Signature</div><div><span class="row" style="gap:6px">${I.spark}Climbs with you</span></div><div><span class="row" style="gap:6px">${I.spark}Championship covered</span></div>

};

const round = () => {

    <div class="ln">${chip('c-race', 'Race 1')}<span class="trunc">${line}</span><span class="pos">$${amount}</span></div></div>`;
  const hr = (b, slot, end, paid) => `<tr><td><span class="row">${mark(b, slot, true)}<b>${b.name}</b>${flag(b.nation)}</span></td><td>${chip(slot === 'main' ? 'c-sponsor' : 'c-partner', slot === 'main' ? 'Main sponsor' : 'Partner')}</td><td>${end}</td><td class="pos">$${paid}</td></tr>`;
  return `<div class="split ${shape()}"><div class="panel"><h3>Sponsors</h3>${rs(by(S.main), 'main', '4th in class - on target', '1,400')}${rs(by(S.partner), 'partner', 'Started', '450')}${rs(by(S.bare), 'partner', '4th in class - on target', '380')}</div>

};

const MARKS = [['wide', 'Wide plate'], ['square', 'Square plate'], ['tint', 'Today\'s tile'], ['none', 'Initials only']];
const WHY = {
  wide: '<b>Wide plate (recommended)</b>: the logo on a light plate in both themes, ringed in the slot\'s colour. It keeps today\'s height and grows to 76px wide - 54px small - since most logos are wordmarks. A brand with no logo keeps today\'s initials tile, widened to the same size so a list of sponsors stays aligned.',
  square: '<b>Square plate</b>: the same plate at today\'s 44px and 32px. Nothing moves on any screen, but a wordmark such as Tommy Hilfiger, Kuehne+Nagel or Michelin shrinks to a sliver.',
  tint: '<b>Today\'s tile with the logo in it</b>, for comparison: the pink or cyan tile behind the logo. In dark mode a black wordmark - Bridgestone, Recaro, Goldman Sachs, Rolex - all but disappears, and every logo fights the tint.',
  none: '<b>Initials only</b>: the app as it is today, for comparison.',
};
const VIEW_NOTE = {
  cards: 'The Sponsors page: a main sponsor, a partner, and a partner whose brand has no logo.',
  offer: 'A sponsor\'s offer in the inbox: the sender, and the comparison beside the deal it would replace.',
  round: 'A round\'s page lists each sponsor with a small mark, and so does the Sponsors page\'s History tab.',
  sheet: 'Every logo the book now holds, in the chosen mark, alternating main and partner. Brands without a logo are listed under each trade - they show initials.',
};
const PAIRS = [
  ['castrol', 'brembo', 'millers-oils', 'petronas', 'k-and-n'],
  ['rolex', 'sixt', 'carwow', 'tag-heuer', 'oakley'],
  ['dhl', 'sonax', 'adrian-flux', 'emirates', 'puma'],
];
const GROUPS = [
  { k: 'view', label: 'Screen', opts: [['cards', 'Sponsors page'], ['offer', 'Offer'], ['round', 'Round and history'], ['sheet', 'Every logo']] },
  { k: 'mark', label: 'Mark', opts: MARKS },
  { k: 'pair', label: 'Brands', for: ['cards', 'offer', 'round'], opts: [['0', 'Castrol, Brembo'], ['1', 'Rolex, Sixt'], ['2', 'DHL, Sonax']] },
  { k: 'badge', label: 'Trade icon on a logo', opts: [['none', 'None'], ['corner', 'In the corner']] },
  { k: 'theme', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
];
const BADGE_NOTE = {
  none: '<div class="q"><b>Trade icon: none on a logo (recommended).</b> In the corner it covers the end of most wordmarks. A logo says who the sponsor is, and the trade is written beside the mark on a card, in the mail and in the comparison. The initials tile keeps its icon, since initials alone say nothing.</div>',
  corner: '<div class="q"><b>Trade icon in the corner</b>, as today: it marks the trade on a round\'s rows and in History, where nothing else does - but it covers the end of most wordmarks.</div>',
};
const S = {
  view: 'cards', mark: 'wide', pair: '0', badge: 'none', theme: 'light',
};

const render = () => {
  document.documentElement.dataset.theme = S.theme;
  [S.main, S.partner, S.bare, S.replace, S.oldPartner] = PAIRS[Number(S.pair)];
  document.getElementById('picker').innerHTML = GROUPS.filter((g) => !g.for || g.for.includes(S.view))
    .map((g) => `<div class="grp"><strong>${g.label}</strong>${g.opts.map(([v, l]) => `<button class="opt" data-k="${g.k}" data-v="${v}" aria-pressed="${S[g.k] === v}">${l}</button>`).join('')}</div>`).join('');
  document.getElementById('why').innerHTML = `<div class="box">${WHY[S.mark]}<div class="q">${VIEW_NOTE[S.view]}</div>${S.mark === 'none' ? '' : BADGE_NOTE[S.badge]}</div>`;
  document.getElementById('stage').innerHTML = { cards, offer, round, sheet }[S.view]();
};
document.getElementById('picker').addEventListener('click', (e) => {
  const b = e.target.closest('.opt');
  if (!b) return;
  S[b.dataset.k] = b.dataset.v;
  history.replaceState(null, '', `#${new URLSearchParams(S)}`);
  render();
});
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => { if (k in S) S[k] = v; });
render();
</script>
</body>
</html>
