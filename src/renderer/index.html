<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      style-src has to allow inline styles: Radix writes inline styles to
      position popovers and selects, and a stricter policy breaks every dropdown
      silently. Everything else is locked to the bundle.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Assetto Corsa Career</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
